调它只面向官方 OpenAI API specification，不抽取第三方 provider 的非标准字段。这说明 provider adapter 不是万能兼容层，偏离官方协议时最好使用 provider-specific package。\n\n## 设计取舍\n\n收益：\n\n- 上层 Agent 不需要知道 OpenAI payload 细节。\n- OpenAI API 的 stream、responses API、tool_choice 差异集中在 adapter 内。\n- 工具 schema 转换有统一位置。\n- `BaseChatModel` 的 Runnable/callback/tracing 能力可以复用。\n- provider-specific 参数通过字段和 `model_kwargs` 管理。\n\n成本：\n\n- provider adapter 会非常厚，承担大量兼容逻辑。\n- API 演进会不断推动 adapter 变化。\n- 通用抽象无法完全覆盖所有 provider 特性。\n- 第三方 OpenAI-compatible API 可能有非标准字段，不能假设 ChatOpenAI 都会保留。\n- tool calling 的行为不仅取决于 Tool schema，也取决于 provider 对 schema 的支持程度。\n\n## 和 Java 后端经验类比\n\n可以把 Provider Integration 类比成支付渠道 adapter：\n\n- `BaseChatModel` 像统一支付接口。\n- `ChatOpenAI` 像支付宝/Stripe 的具体实现。\n- `_generate` 像普通扣款 API。\n- `_stream` 像事件流或异步回调。\n- `bind_tools` 像把内部订单 schema 转成渠道要求的 request schema。\n- `tool_choice` 兼容逻辑像渠道枚举值映射。\n\n差异是模型 provider 的输出包含自然语言、结构化调用、token 统计、stream chunk，协议变化更频繁。\n\n## 容易误解的点\n\n- 误解 1：`ChatOpenAI` 是 Agent。实际它只是模型 provider adapter。\n- 误解 2：OpenAI-compatible API 都能完整用 `ChatOpenAI`。非标准字段可能不会被保留。\n- 误解 3：tool schema 一旦定义，所有 provider 行为一致。实际 provider 支持和限制不同。\n- 误解 4：`bind_tools` 只是把 tools 保存起来。实际它会转换成 OpenAI tool schema 并处理 `tool_choice`。\n- 误解 5：provider adapter 是薄封装。实际它承担认证、payload、streaming、错误、兼容和 schema 转换。\n\n## 自测题\n\n见 `../quizzes/08-provider-integration.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/08-provider-integration.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/08-mini-provider-adapter/README.md`。\n\n## 学完标准\n\n你应该能不看笔记解释：\n\n- Provider Integration 和 ChatModel Adapter 的关系。\n- `BaseChatOpenAI` 为什么继承 `BaseChatModel`。\n- `_generate` 和 `_stream` 各自处理什么。\n- `bind_tools` 如何把 LangChain tools 转成 OpenAI tools。\n- adapter 如何吸收 provider API 差异，保护上层 Agent。\n\n"},"quiz":{"label":"测试","path":"quizzes/08-provider-integration.quiz.md","markdown":"# 08 Provider Integration Quiz\n\n## 概念题\n\n1. Provider Integration 和 ChatModel Adapter 的关系是什么？\n2. 为什么 `ChatOpenAI` 不是 Agent？\n3. OpenAI-compatible API 为什么不一定能完全用 `ChatOpenAI`？\n4. `tool_choice=\"any\"` 转成 `\"required\"` 体现了 adapter 的什么职责？\n5. provider adapter 为什么会比普通 SDK wrapper 厚？\n\n## 源码题\n\n1. 找到 `BaseChatOpenAI(BaseChatModel)`，说明这个继承关系的意义。\n2. 找到 `openai_api_key` 字段，说明它如何从环境变量推断。\n3. 找到 `_stream`，说明它如何设置 stream payload 并处理 chunk。\n4. 找到 `_generate`，说明 response_format 和 responses API 分支。\n5. 找到 `bind_tools`，说明 `convert_to_openai_tool` 的作用。\n6. 找到 `tool_choice == \"any\"` 的兼容逻辑。\n\n## 设计题\n\n1. provider 原始字段应不应该全部保留？如果保留，放在哪里？\n2. OpenAI responses API 和 chat completions API 的差异应该暴露给上层吗？\n3. 如果某 provider 支持 LangChain 没抽象出的能力，你会如何扩展？\n\n## 故障诊断题\n\n1. OpenAI adapter streaming 没有 token usage，你会检查哪些参数？\n2. Tool schema 转换后 provider 报 schema 不支持，你会检查 Tool schema 还是 adapter conversion？\n3. 使用第三方 OpenAI-compatible base_url 时丢了非标准字段，原因可能是什么？\n\n## 迁移题\n\n1. 实现一个 mock provider adapter，要求兼容 `BaseChatModel.invoke` 的心智模型。\n2. 设计一个 provider adapter 测试矩阵，覆盖 generate、stream、tool binding、error handling。\n\n"},"mastery":{"label":"掌握度","path":"mastery/08-provider-integration.mastery.md","markdown":"# 08 Provider Integration Mastery\n\n## Level 1: 复述\n\n不用看 lesson，用 150-250 字解释 Provider Integration 如何把具体模型 API 差异藏在 adapter 内。\n\n完成标准：\n\n- 说到 `BaseChatModel`。\n- 说到 `_generate` / `_stream`。\n- 说到 tool schema 转换。\n\n## Level 2: 源码定位\n\n定位并记录文件和行号：\n\n- `BaseChatOpenAI`\n- `model_name`\n- `openai_api_key`\n- `_stream`\n- `_generate`\n- `bind_tools`\n- `convert_to_openai_tool`\n- `tool_choice == \"any\"`\n- `ChatOpenAI`\n\n## Level 3: Payload 追踪\n\n追踪一次：\n\n```text\nLangChain messages -> OpenAI payload -> OpenAI response -> ChatResult / AIMessage\n```\n\n要求说明哪些步骤发生在 adapter 内。\n\n## Level 4: Tool Binding 追踪\n\n追踪：\n\n```text\nBaseTool -> convert_to_openai_tool -> formatted_tools -> bind(...)\n```\n\n说明 `strict`、`parallel_tool_calls`、`tool_choice` 分别影响什么。\n\n## Level 5: 故障诊断\n\n给出排查步骤：\n\n- OpenAI-compatible provider 丢字段。\n- `tool_choice=\"any\"` 行为不符合预期。\n- stream chunk 没有触发 token callback。\n\n## Level 6: 微改造\n\n在 `labs/08-mini-provider-adapter` 中增加：\n\n- mock OpenAI payload conversion\n- mock streaming chunk conversion\n- tool schema conversion\n- provider-specific error mapping\n- tests for incompatible provider fields\n\n说明哪些 provider 差异应该向上暴露，哪些应该被 adapter 吸收。\n\n"},"lab":{"label":"实验","path":"labs/08-mini-provider-adapter/README.md","markdown":"# Lab 08: Mini Provider Adapter\n\n目标：实现一个 mock OpenAI provider adapter，验证 provider payload、stream chunk、tool schema conversion 和错误映射。\n\n## 必做功能\n\n- `MiniBaseChatModel`\n- `MiniOpenAIChatModel`\n- `_generate(messages)`\n- `_stream(messages)`\n- `_to_provider_payload(messages, tools=None)`\n- `_from_provider_response(response)`\n- `bind_tools(tools, tool_choice=None)`\n- `convert_to_openai_tool(tool)`\n\n## 验收用例\n\n```python\nmodel = MiniOpenAIChatModel(client=FakeOpenAIClient())\nmsg = model.invoke([HumanMessage(\"hi\")])\nassert msg.type == \"ai\"\n\nbound = model.bind_tools([search_tool], tool_choice=\"any\")\npayload = bound._to_provider_payload([HumanMessage(\"find Runnable\")])\nassert payload[\"tool_choice\"] == \"required\"\nassert payload[\"tools\"][0][\"function\"][\"name\"] == \"search\"\n```\n\n## 加分功能\n\n- 支持 streaming chunk 转 `AIMessageChunk`。\n- 支持 provider error 映射成统一异常。\n- 支持 `response_metadata` 保存 provider headers。\n- 支持 incompatible provider fields 测试。\n- 支持 strict schema。\n\n## 复盘问题\n\n1. 哪些 provider 差异应该被 adapter 吸收？\n2. 哪些 provider 特性应该作为扩展能力暴露给上层？\n3. OpenAI-compatible provider 丢字段时，adapter 应该怎么提示使用者？\n\n"}}}],"extras":{"readme":{"label":"入口说明","path":"README.md","markdown":"# LangChain Agent Engineering Learning Pack\n\n这是 AI Agent 代码学习知识库的第一课，研究对象是 `langchain-ai/langchain`。\n\n本学习包的目标不是学习 LangChain API 用法，而是通过源码理解 LangChain 如何把 LLM 应用组件抽象为可组合、可观测、可批处理、可流式执行的工程模块。\n\n## 当前状态\n\n- 源码仓库：`repos/langchain`\n- 当前 commit：`bc5f1517cf7ac27addd4286e388228b8172b93b9`\n- 已完成工具调用：\n  - Understand Anything 底层扫描：`libs/core`\n  - llm-wiki-skill 初始化：`knowledge/ai-agents/langchain/wiki`\n- 当前重点单元：`01-runnable`\n\n## 先读什么\n\n1. `learning-path.md`\n2. `lessons/01-runnable.md`\n3. `mastery/01-runnable.mastery.md`\n4. `review/weak-evidence.md`\n\n## 目录说明\n\n- `raw/`：工具产物和 research pack。\n- `graph/`：机器可读实体、关系、断言和证据。\n- `wiki/`：llm-wiki-skill 初始化的 Markdown-first 知识库。\n- `lessons/`：课程化学习材料。\n- `quizzes/`：自测题。\n- `mastery/`：掌握度验证任务。\n- `labs/`：最小复刻实验。\n- `review/`：AI 自检和弱证据报告。\n- `progress/`：学习进度记录。\n\n"},"path":{"label":"学习路线","path":"learning-path.md","markdown":"# LangChain 学习路径\n\n本路径面向有后端开发经验、但不默认熟悉 LLM / Agent 工程概念的学习者。每个单元都先补 AI 概念，再进入源码实现。\n\n## 八个单元\n\n1. Runnable：统一执行抽象、组合、`invoke` / `batch` / `stream`。\n2. Message Schema：system / human / ai / tool message 如何表示对话状态。\n3. Prompt Template：prompt 如何结构化、校验变量并进入 pipeline。\n4. ChatModel Adapter：不同 provider 如何被统一成 ChatModel。\n5. Tool Interface：tool calling 的 schema、执行和结果回填。\n6. Callback / Tracing：运行生命周期、事件和可观测性。\n7. Agent Loop：模型决策、工具执行、观察结果和停止条件。\n8. Provider Integration：OpenAI 等 provider 的接入、兼容和测试约束。\n\n## 当前建议节奏\n\n第一轮先以 `01-runnable` 为主，因为它是后续 prompt、model、parser、tool、retriever 组合的底层心智模型。\n\n完成标准：\n\n- 能用自己的话解释 Runnable 解决的问题。\n- 能在源码中定位 `Runnable`、`RunnableSequence`、`RunnableLambda`、`RunnableConfig`。\n- 能追踪 `a | b` 如何变成 `RunnableSequence`。\n- 能完成 `labs/01-mini-runnable` 的设计说明。\n\n"},"finalQuiz":{"label":"总复盘测试","path":"quizzes/99-final-review.quiz.md","markdown":"# 99 Final Review Quiz\n\n## 跨单元概念题\n\n1. 用一张流程图解释 `PromptTemplate -> ChatModel -> AIMessage.tool_calls -> BaseTool -> ToolMessage -> ChatModel`。\n2. Runnable、Message、Prompt、ChatModel、Tool、Callback、Agent Loop、Provider Adapter 分别解决哪一层问题？\n3. 哪些抽象属于“统一执行协议”，哪些属于“模型输入输出协议”，哪些属于“外部能力接入”？\n\n## 跨单元源码题\n\n1. 从 `prompt | model` 开始，列出你会阅读哪些源码文件来追踪一次调用。\n2. 从 `AIMessage.tool_calls` 开始，列出你会阅读哪些源码文件来追踪一次工具调用。\n3. 从 `ChatOpenAI.bind_tools` 开始，说明工具 schema 如何从 LangChain 对象进入 OpenAI payload。\n\n## 系统设计题\n\n1. 如果你自己做一个 Agent harness，哪些抽象必须先做，哪些可以后做？\n2. 你会如何设计最小 tracing，使它足以 debug tool calling？\n3. 如果要支持多个 provider，你会把差异放在 ChatModel adapter、Tool 层，还是 Agent loop？\n\n## Capstone 准备题\n\n1. 画出 `99-capstone-mini-langchain-agent` 的模块图。\n2. 为每个模块写 2 个必须通过的测试。\n3. 写出你认为最容易出 bug 的 5 个边界情况。\n\n"},"capstoneMastery":{"label":"Capstone 掌握度","path":"mastery/99-capstone.mastery.md","markdown":"# 99 Capstone Mastery\n\n## Level 1: 总体复述\n\n用 500-800 字解释 LangChain 如何把 LLM 应用组件标准化、组合化，并支撑 Agent 框架。\n\n必须覆盖：\n\n- Runnable\n- Message Schema\n- Prompt Template\n- ChatModel Adapter\n- Tool Interface\n- Callback / Tracing\n- Agent Loop\n- Provider Integration\n\n## Level 2: 全链路图\n\n画出一条完整链路：\n\n```text\nPromptTemplate\n  -> ChatModel.bind_tools\n  -> AIMessage.tool_calls\n  -> Tool.invoke/run\n  -> ToolMessage\n  -> Agent loop next turn\n  -> final AIMessage\n```\n\n每个节点标注对应源码入口。\n\n## Level 3: 源码索引\n\n为 8 个单元各列出 3 个最关键源码符号和行号。\n\n## Level 4: Mini LangChain Agent\n\n完成 `labs/99-capstone-mini-langchain-agent`：\n\n- runnable\n- messages\n- prompt template\n- chat model adapter\n- tools\n- callback tracer\n- agent loop\n- mock provider\n\n## Level 5: 故障演练\n\n设计并解释 5 个故障：\n\n- prompt 缺变量\n- provider streaming fallback\n- tool 参数错误\n- tool result 未回填\n- agent 无限循环\n\n每个故障都要说明如何通过 tracing 和源码知识定位。\n\n## Level 6: 迁移设计\n\n如果你要用 Java 实现一个最小 Agent framework，写出模块划分、接口草图、测试策略和你会暂时舍弃的复杂能力。\n\n"},"capstoneLab":{"label":"Capstone 实验","path":"labs/99-capstone-mini-langchain-agent/README.md","markdown":"# Lab 99: Capstone Mini LangChain Agent\n\n目标：把 8 个单元合成一个最小可运行 Agent framework。它不追求功能完整，而是验证你是否真正理解 LangChain 的核心工程抽象。\n\n## 必做模块\n\n- `runnables.py`\n  - `MiniRunnable`\n  - `MiniRunnableSequence`\n  - `MiniRunnableLambda`\n  - `MiniRunnableConfig`\n- `messages.py`\n  - `SystemMessage`\n  - `HumanMessage`\n  - `AIMessage`\n  - `ToolMessage`\n- `prompts.py`\n  - `MiniPromptTemplate`\n  - `MiniChatPromptTemplate`\n- `models.py`\n  - `MiniBaseChatModel`\n  - `ScriptedChatModel`\n  - `MiniOpenAIAdapter`\n- `tools.py`\n  - `MiniTool`\n  - `StructuredMiniTool`\n  - `ToolRegistry`\n- `callbacks.py`\n  - `CallbackHandler`\n  - `CallbackManager`\n  - `RunManager`\n- `agents.py`\n  - `MiniAgent`\n  - `AgentAction`\n  - `AgentStep`\n  - `AgentFinish`\n\n## 必须通过的场景\n\n1. `prompt | model` 可以调用。\n2. model 返回普通 `AIMessage` 时 agent 直接结束。\n3. model 返回 `tool_calls` 时 agent 执行工具并回填 `ToolMessage`。\n4. 工具参数错误时 agent 把 validation error 作为 observation。\n5. unknown tool 时 agent 给出可追踪错误。\n6. streaming model 可以触发 token callback。\n7. callback trace 可以展示 parent-child run tree。\n8. provider adapter 可以把 `tool_choice=\"any\"` 转成 `\"required\"`。\n\n## 最小验收测试\n\n```python\nagent = MiniAgent(\n    model=ScriptedChatModel([\n        AIMessage(\"\", tool_calls=[{\"id\": \"call_1\", \"name\": \"search\", \"args\": {\"query\": \"Runnable\"}}]),\n        AIMessage(\"Runnable unifies execution.\"),\n    ]),\n    tools=[search_tool],\n    callbacks=[RecordingHandler()],\n)\n\nassert agent.invoke(\"What is Runnable?\") == \"Runnable unifies execution.\"\nassert agent.messages[-2].type == \"tool\"\nassert agent.trace.root.children\n```\n\n## 推荐实现顺序\n\n1. messages\n2. runnables\n3. prompts\n4. callbacks\n5. tools\n6. models\n7. agents\n8. provider adapter\n\n## 复盘问题\n\n1. 哪些能力是 LangChain 核心抽象，哪些只是 provider 细节？\n2. 你的 MiniAgent 哪些地方仍然不能支撑真实生产环境？\n3. 如果下一步学习 LangGraph，你会把当前 while loop 的哪些部分迁移到 graph？\n\n"},"weakEvidence":{"label":"弱证据报告","path":"review/weak-evidence.md","markdown":"# Weak Evidence Report\n\n## 当前状态\n\n本轮已经把上一版弱证据中的三项主要缺口补齐到学习包中：\n\n- 生成 `raw/code-graph/libs-core.knowledge-graph.json`，并同步到 `repos/langchain/libs/core/.understand-anything/knowledge-graph.json`。\n- 将 Understand Anything deterministic scan/batch 的 388 个 `libs/core` 文件、19 个 batch，与课程实体/关系合并为 UA-compatible 学习图谱。\n- 为 `02-message-schema` 到 `08-provider-integration` 均匀补充测试证据。\n- 在每节 lesson 中新增 `相关测试证据`。\n- 新增 `review/test-evidence-matrix.md`，按课列出测试证据矩阵。\n- 新增 `raw/source-notes/agent-loop-compiled-graph-trace.md`，追踪一次 `create_agent` compiled graph 的真实测试执行路径。\n\n## 已解决的弱证据\n\n### Understand Anything 图谱\n\n之前状态：\n\n- 只有 `scan-result.json` 和 `batches.json`。\n- 缺少最终可消费的知识图谱文件。\n\n当前状态：\n\n- `raw/code-graph/libs-core.knowledge-graph.json` 已生成。\n- 图谱包含 453 个节点、755 条边。\n- 节点覆盖 388 个扫描文件、架构 layer、课程实体和关键源码符号。\n- 图谱保留 `status` 字段，说明 deterministic scan、semantic batching、LLM entity extraction、architecture assembly 和 graph review 的完成方式。\n\n残留说明：\n\n- 当前环境没有可直接调用的 `/understand` slash-command 子代理会话，所以没有伪称执行了独立 file-analyzer / graph-reviewer 子代理。\n- 语义层由当前 Codex 基于 scan/batch、源码证据、测试证据和课程实体编译完成。\n- 对学习用途而言，它已经能作为课程图谱和源码导航材料；若以后在支持 slash-command 的环境中运行，可再生成原生 UA session artifacts。\n\n### 测试证据分布\n\n之前状态：\n\n- `01-runnable` 测试证据较充分。\n- `02-message-schema` 到 `08-provider-integration` 主要依赖源码证据。\n\n当前状态：\n\n- `evidence.json` 从 35 条扩展到 58 条。\n- 每节课至少包含 2 条测试证据。\n- `claims.json` 中 02-08 的核心 claim 已追加对应 test evidence id。\n- 每节 lesson 已新增 `相关测试证据` 小节。\n\n详见：\n\n- `review/test-evidence-matrix.md`\n\n### Agent Loop compiled graph\n\n之前状态：\n\n- 课程能解释 action / observation / finish 和 `create_agent`，但没有完整追踪一次真实 compiled graph 执行。\n\n当前状态：\n\n- 已追踪 `test_tool_runtime_basic_injection` 中的真实执行路径：\n  `HumanMessage -> model node -> AIMessage.tool_calls -> tools node -> ToolMessage -> model node -> finish`\n- 已补充 middleware tools node 的测试证据，说明 tools node 可以被 middleware 改写。\n- `07-agent-loop.md` 已新增 `真实 compiled graph 执行追踪`。\n- `raw/research-packs/07-agent-loop.research.md` 已更新。\n\n详见：\n\n- `raw/source-notes/agent-loop-compiled-graph-trace.md`\n\n## 仍需后续增强\n\n### lab 还不是可运行训练营\n\n`labs/` 当前是完整任务设计和验收标准，但还没有 starter code、tests 和 reference implementation。\n\n如果要升级，应为每个 lab 增加：\n\n- starter code\n- tests\n- reference implementation\n- AI grading rubric\n\n这属于下一阶段“训练营化”，不影响当前课程知识包的完整性。\n\n### LangGraph 可作为第二阶段\n\n`07-agent-loop` 已覆盖 LangChain v1 `create_agent` 的 compiled graph 行为，但 LangGraph 本身的状态图、checkpoint、interrupt、streaming、subgraph 仍值得单独做一个学习包。\n\n## 阅读时的信任顺序\n\n优先信任：\n\n1. `evidence_level: code` 且有具体行号。\n2. `evidence_type: test` 且位于 `tests/unit_tests` 或 `standard-tests`。\n3. lesson 中引用具体 source path 的解释。\n4. `review/open-questions.md` 中仍待追踪的问题。\n"},"progress":{"label":"学习进度","path":"progress/learning-progress.md","markdown":"# LangChain Learning Progress\n\n## 当前状态\n\n- current_level: AI Agent 工程初学者，具备后端开发基础\n- current_unit: 01-runnable\n- current_status: 01-runnable_feedback_integrated\n- source_repo_commit: `bc5f1517cf7ac27addd4286e388228b8172b93b9`\n\n## 已生成学习包产物\n\n- README: done\n- learning path: done\n- graph json: done\n- 8 lessons: complete course\n- 8 quizzes: complete course\n- 8 mastery tasks: complete course\n- 8 mini lab specs: complete course\n- capstone lab spec: complete course\n- weak evidence report: done\n- test evidence matrix: done\n- Understand Anything UA-compatible learning graph: done\n- Agent Loop compiled graph trace: done\n- llm-wiki graph: done\n- learner annotations feedback loop: done for `01-runnable`\n\n## 建议学习顺序\n\n1. 阅读 `README.md` 和 `learning-path.md`。\n2. 按顺序学习 `lessons/01-runnable.md` 到 `lessons/08-provider-integration.md`。\n3. 每学完一课，完成对应 quiz。\n4. 每学完一课，完成 mastery 的 Level 1-5。\n5. 选择性完成对应 lab；如果时间充足，最后完成 capstone。\n6. 阅读 `review/test-evidence-matrix.md`，理解每节课的行为验证来自哪些测试。\n7. 阅读 `review/weak-evidence.md`，理解剩余增强方向主要是 lab 训练营化和 LangGraph 二阶段学习包。\n\n## 能解释\n\n- `Runnable` 是统一执行协议，不只是 LLM 输入接口标准化。\n- `invoke` 是单输入单输出，`batch` 是多个独立输入样本批处理，`stream` 是单输入迭代式输出。\n- `RunnableSequence` 是顺序 pipeline，A 的输出传给 B，不是拼接。\n- `RunnableLambda` 可以快速包装普通函数，但默认不适合真正 chunk 级 streaming。\n\n## 仍然困惑\n\n- 已从导出的 annotated HTML 中处理 5 条疑问：\n  - `RunnableConfig` 中 callbacks、tags、metadata、max_concurrency 的含义。\n  - `RunnableSequence` 是什么。\n  - `batch` 的多输入和多模态的区别。\n  - 默认 `stream` 与真正流式的区别。\n  - `RunnableSequence.invoke` 中 `step` 的定义。\n\n## 已沉淀笔记\n\n- `progress/learning-annotations.json`：页面标注、AI 回答、学习笔记校正。\n- `progress/personal-knowledge-notes.md`：适合在 Obsidian 阅读的个人知识笔记。\n\n## 已完成练习\n\n- 01-mini-runnable: pending\n- 02-message-types: pending\n- 03-mini-prompt-template: pending\n- 04-mini-chat-model-adapter: pending\n- 05-mini-tool-calling: pending\n- 06-mini-callback-tracer: pending\n- 07-mini-agent-loop: pending\n- 08-mini-provider-adapter: pending\n- 99-capstone-mini-langchain-agent: pending\n\n## 下一步\n\n重新阅读 `01-runnable` 已补充的小节，然后完成 `01-runnable.quiz.md` 和 `01-runnable.mastery.md` 的新增题目。\n"},"testEvidence":{"label":"测试证据矩阵","path":"review/test-evidence-matrix.md","markdown":"# Test Evidence Matrix\n\n## 目标\n\n把每一节课的核心 claim 绑定到测试证据，避免课程只停留在源码解释。\n\n## 覆盖情况\n\n| Lesson | 测试证据 | 覆盖行为 |\n| --- | --- | --- |\n| 01 Runnable | `ev-test-batch-concurrency` | batch 并发、Runnable 执行语义 |\n| 02 Message Schema | `ev-test-message-tool-call-serde`, `ev-test-message-chunk-tool-calls`, `ev-test-tool-message-serde-dict` | message 序列化、tool call chunk 合并、ToolMessage 字段保真 |\n| 03 Prompt Template | `ev-test-prompt-from-template`, `ev-test-prompt-partial-validation`, `ev-test-chat-prompt-formatting`, `ev-test-chat-prompt-invoke` | 变量推断、partial binding、输入校验、message 输出 |\n| 04 ChatModel Adapter | `ev-test-chat-model-batch-tracing`, `ev-test-chat-model-stream-fallback`, `ev-test-fake-chat-model-modes` | invoke/batch/stream/async 统一接口、tracing、fallback |\n| 05 Tool Interface | `ev-test-tool-structured-args`, `ev-test-structured-tool-schema`, `ev-test-tool-call-to-tool-message`, `ev-test-tool-schema-dict` | schema 推断、ToolCall 输入、ToolMessage 输出、dict schema |\n| 06 Callback / Tracing | `ev-test-callback-manager-merge`, `ev-test-async-callback-dispatch`, `ev-test-tracer-nested-run`, `ev-test-tracer-usage-metadata` | handler 合并、事件分发、parent_run_id、usage metadata |\n| 07 Agent Loop | `ev-test-agent-create-agent-tool-runtime`, `ev-test-agent-middleware-tools-node` | compiled graph 执行、tool runtime 注入、middleware tools node |\n| 08 Provider Integration | `ev-test-openai-responses-tool-call-conversion`, `ev-test-openai-bind-tools-responses`, `ev-test-openai-custom-tool` | OpenAI Responses API 转换、bind_tools、custom tool |\n\n## 结论\n\n当前 02-08 已不再是“主要源码证据、缺少测试证据”的状态。每节课至少有 2 条测试证据；Prompt、Tool、Callback 单元有 4 条测试证据。\n\n后续如果继续增强，可以为每节课增加 integration test 和最小 lab test，但这已经不属于弱证据修复，而是训练营化工程。\n"}}}</script>
  <script id="learning-annotations-data" type="application/json">[{"id":"note-1780385247228-3533b23c6ac288","type":"note","path":"lessons/01-runnable.md","title":"Runnable · 课程","kind":"unit","unit":"01-runnable","section":"lesson","extra":"readme","quote":"框架把“很多不同类型的步骤”包装成“同一种可调度对象”","note":"这里的意思应该就是要把接口抽象出来，所有的入口都变成一个统一的接口，只不过里面的时间是不一样的，也就是和我们设计模式当中的也就是责任链模式中的handle是类似的。","question":"","answer":"","review":"你的方向是对的：重点确实是把不同组件抽象成统一入口。但“里面的时间是不一样的”更准确应改成“内部实现、输入输出和执行方式不同”。它和责任链的 handle 有相似处：外部都通过统一方法调用内部步骤。不同处是 Runnable 不一定是一条责任链，它还要表达 batch、stream、async、config、tracing 等执行协议。","createdAt":"2026-06-02T07:27:27.228Z"},{"id":"note-1780385330994-0288b9c507b66","type":"question","path":"lessons/01-runnable.md","title":"Runnable · 课程","kind":"unit","unit":"01-runnable","section":"lesson","extra":"readme","quote":"包含 callbacks、tags、metadata、max_concurrency 等","note":"这些东西都表示什么呢，我不太理解","question":"这些东西都表示什么呢，我不太理解","answer":"这些都是 Runnable 执行时的运行配置，不是业务输入。callbacks 是运行生命周期钩子，用来记录开始、结束、错误、流式 token 等事件；tags 是标签，方便在 tracing 或日志里筛选某一类调用；metadata 是结构化上下文，例如 user_id、experiment、request_id；max_concurrency 是并发上限，主要影响 batch 这种多输入并发执行。可以把它理解成“这次运行怎么被观测、标记和调度”的配置。","createdAt":"2026-06-02T07:28:50.994Z"},{"id":"note-1780385731025-b9d2cfd90465d","type":"question","path":"lessons/01-runnable.md","title":"Runnable · 课程","kind":"unit","unit":"01-runnable","section":"lesson","extra":"readme","quote":"MiniSequence","note":"我没懂RunnableSequence 这个是什么东西","question":"我没懂RunnableSequence 这个是什么东西","answer":"RunnableSequence 是“多个 Runnable 顺序执行”的组合对象。假设 a 是 prompt，b 是 model，c 是 parser，那么 a | b | c 会变成一个 sequence。调用 sequence.invoke(input) 时，不是把 a 和 b 简单拼接，而是先执行 a 得到 output1，再把 output1 传给 b 得到 output2，再把 output2 传给 c。也就是 output of one is input of the next。","createdAt":"2026-06-02T07:35:31.025Z"},{"id":"note-1780386019743-5fb69b905a4038","type":"question","path":"lessons/01-runnable.md","title":"Runnable · 课程","kind":"unit","unit":"01-runnable","section":"lesson","extra":"readme","quote":"Runnable.batch","note":"这里什么时候定义为多输入呢，是多模态（包括文字、图片、文件等）还是多个文字？","question":"这里什么时候定义为多输入呢，是多模态（包括文字、图片、文件等）还是多个文字？","answer":"这里的“多输入”主要指多个独立请求组成的列表，不是多模态。比如 invoke('问题1') 是单输入，batch(['问题1', '问题2', '问题3']) 是多输入。每个元素本身可以是字符串，也可以是 dict、message list，甚至包含图片等多模态内容；但 batch 的多输入语义是“有 N 个输入样本要分别跑同一个 Runnable”，不是“一个输入里有多种模态”。","createdAt":"2026-06-02T07:40:19.744Z"},{"id":"note-1780386066340-64b5617ea0cdf","type":"question","path":"lessons/01-runnable.md","title":"Runnable · 课程","kind":"unit","unit":"01-runnable","section":"lesson","extra":"readme","quote":"所以默认 stream 不等于真正流式。真正 token/chunk 级流式需要子类实现 transform 或覆盖 stream。","note":"这里有点讲的太简单了，我也还是没太看懂","question":"这里有点讲的太简单了，我也还是没太看懂","answer":"默认 stream 只是把 invoke 的完整结果 yield 一次，所以它表现得像“伪流式”：调用方可以用 for 循环消费，但只会收到一个完整结果。真正流式是边生产边输出，例如模型每生成一段 token 就立刻 yield 一个 chunk。LangChain 里如果某个步骤实现 transform，RunnableSequence 才能把上一步的流式 chunk 继续传给下一步；如果中间有 RunnableLambda 这种默认会先吃完整输入再输出的步骤，流会在这里被阻塞，直到这个步骤处理完才继续。","createdAt":"2026-06-02T07:41:06.340Z"},{"id":"note-1780386121005-756310a1c869a","type":"question","path":"lessons/01-runnable.md","title":"Runnable · 课程","kind":"unit","unit":"01-runnable","section":"lesson","extra":"readme","quote":"RunnableSequence.invoke 会遍历 self.steps，每一步都执行 step.invoke","note":"这里的 step 是怎么定义的，我还是没太懂这里是怎么实现的","question":"这里的 step 是怎么定义的，我还是没太懂这里是怎么实现的","answer":"step 不是一个额外的新概念，它就是 sequence 里面保存的某一个 Runnable。RunnableSequence 初始化时会把 first、middle、last 这些组件组成 self.steps。执行 invoke 时，for i, step in enumerate(self.steps) 逐个取出来运行。比如 RunnableLambda(add_one) | RunnableLambda(mul_two) 里，steps[0] 是 add_one 对应的 RunnableLambda，steps[1] 是 mul_two 对应的 RunnableLambda。","createdAt":"2026-06-02T07:42:01.005Z"},{"id":"note-1780386350905-e9688bb185b218","type":"note","path":"lessons/01-runnable.md","title":"Runnable · 课程","kind":"unit","unit":"01-runnable","section":"lesson","extra":"readme","quote":"为什么 LangChain 需要 Runnable。","note":"这里主要就是为了打大模型LLM的输入接口标准化，不要因为有不同的输入，导致接口难以复用，也就是类似一个抽象的handle类","question":"","answer":"","review":"这里可以校正为：Runnable 不只是把 LLM 的输入接口标准化，而是把 prompt、model、parser、retriever、tool、普通函数等组件的执行方式标准化。标准化的重点包括输入输出、单次调用、批处理、流式输出、异步、运行配置、tracing 和组合。它像抽象 Handler，但比 Handler 更偏“执行协议”。","createdAt":"2026-06-02T07:45:50.905Z"},{"id":"note-1780386392138-699aebcb3bad88","type":"note","path":"lessons/01-runnable.md","title":"Runnable · 课程","kind":"unit","unit":"01-runnable","section":"lesson","extra":"readme","quote":"invoke、batch、stream 的默认语义分别是什么。","note":"这里第一个是in book, 它就是一个单输入，然后bench是多输入，stream是流式输入。不对，stream应该是单输入流式输出","question":"","answer":"","review":"你的自我修正是对的：应写作 invoke、batch、stream。invoke 是单输入单输出；batch 是多个独立输入分别执行，返回多个输出；stream 是单输入、迭代式输出。注意默认 stream 只是 yield 一次完整结果，真正流式需要组件额外支持。","createdAt":"2026-06-02T07:46:32.138Z"},{"id":"note-1780386450405-b8be1651782c68","type":"note","path":"lessons/01-runnable.md","title":"Runnable · 课程","kind":"unit","unit":"01-runnable","section":"lesson","extra":"readme","quote":"a | b 如何变成 RunnableSequence。","note":"这个也是我一直没有明白的疑问，我不知道这里的sequence是什么意思。我粗浅的理解应该是把A和B的输入或者是输出把它拼在一起，然后输出出来，或者说输入进去。我不知道我理解的对不对","question":"","answer":"","review":"这里需要改正：sequence 不是把 A 和 B 的输入输出拼接，而是把 A、B 放进一个顺序执行列表。执行时先把原始 input 交给 A，A 的 output 再作为 B 的 input。也就是 A(input) -> intermediate，B(intermediate) -> final。拼接更像字符串或数组合并，而 RunnableSequence 更像 pipeline。","createdAt":"2026-06-02T07:47:30.405Z"},{"id":"note-1780386520987-d9cd632da419a8","type":"note","path":"lessons/01-runnable.md","title":"Runnable · 课程","kind":"unit","unit":"01-runnable","section":"lesson","extra":"readme","quote":"RunnableLambda 的价值和局限。","note":"我并没有在课程里面看到关于这方面的太多的。学习内容，所以我对这方面并不是很熟悉，如果说这方面比较重要的话，应该在上面的学习内容里面加上，或者你帮我指导一下这上面哪部分内容是讲这方面的东西","question":"","answer":"","review":"这个反馈是准确的：原课程提到了 RunnableLambda，但解释不够。它重要，因为它是把普通 Python 函数快速接入 Runnable 体系的入口；局限是默认不适合真正流式处理，因为它通常要先消费完整输入再输出。课程已补充 RunnableLambda 与 RunnableGenerator 的区别。","createdAt":"2026-06-02T07:48:40.987Z"},{"id":"note-1780386604287-c4cba2d7898c98","type":"note","path":"lessons/01-runnable.md","title":"Runnable · 课程","kind":"unit","unit":"01-runnable","section":"lesson","extra":"readme","quote":"如果在自己的 Agent harness 里引入 Runnable 思路，接口会怎么设计。","note":"如果是在自己的自己设计的Agent里面去引入这个runable的这种思路，那我觉得应该最主要的是那种抽象的接口设计，比如说invoke、be、batch以及stream，还有管道设计这些的抽象。因为输入或者输出无非就是这几种，那具体里面是怎么处理的啊？可以有各种各样不同的实现，这个应该针对不同的大模型，或者说不同Agent的垂直领域的场景来作为它功能的输出，所以我但是啊，输入或者输出的接口，这个是一定的","question":"","answer":"","review":"你的理解主线是对的，但术语要校正：是 Runnable，不是 runable；是 batch，不是 be。更准确的表述是：自研 Agent harness 可以先定义 invoke、batch、stream、async 和 pipe 这套外部协议，再让不同实现承担模型调用、prompt 渲染、工具执行、解析、检索等内部逻辑。输入输出不是永远固定为几种具体类型，而是外部执行形态固定，具体数据类型由每个组件的 schema 决定。","createdAt":"2026-06-02T07:50:04.287Z"}]</script>
  <script>
    const DATA=JSON.parse(document.getElementById('learning-data').textContent);
    const labels={lesson:'课程',quiz:'测试',mastery:'掌握度',lab:'实验'};
    const state={kind:'unit',unit:DATA.units[0]?.id,section:'lesson',extra:'readme',noteView:'all'};
    const slug=(s,i)=>s.toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'')||'h-'+i;
    const noteStoreKey='agent-code-learning-pack-annotations:'+location.pathname;
    let annotations=loadAnnotations();
    let pendingQuote='';
    let pendingType='question';
    function md(x){return DOMPurify.sanitize(marked.parse(x||''));}
    function doc(){return state.kind==='extra'?DATA.extras[state.extra]:DATA.units.find(u=>u.id===state.unit).sections[state.section];}
    function loadAnnotations(){let embedded=[];let stored=[];try{embedded=JSON.parse(document.getElementById('learning-annotations-data')?.textContent||'[]');}catch{}try{stored=JSON.parse(localStorage.getItem(noteStoreKey)||'[]');}catch{}const merged=[...embedded,...stored];const seen=new Set();return merged.filter(n=>{if(!n||!n.id||seen.has(n.id))return false;seen.add(n.id);return true;});}
    function saveAnnotations(){try{localStorage.setItem(noteStoreKey,JSON.stringify(annotations));}catch{}const el=document.getElementById('learning-annotations-data');if(el)el.textContent=JSON.stringify(annotations);}
    function currentDocPath(){return doc().path;}
    function currentNotes(){const p=currentDocPath();return annotations.filter(n=>n.path===p).filter(n=>state.noteView==='all'||(n.type||'question')===state.noteView);}
    function selectionQuote(){const sel=window.getSelection();if(!sel||sel.rangeCount===0)return'';const text=sel.toString().replace(/\s+/g,' ').trim();if(!text)return'';const content=document.getElementById('content');const node=sel.getRangeAt(0).commonAncestorContainer;const owner=node.nodeType===1?node:node.parentElement;if(!content.contains(owner))return'';return text.slice(0,600);}
    function setPendingType(type){pendingType=type;document.getElementById('questionModeBtn').classList.toggle('active',type==='question');document.getElementById('studyNoteModeBtn').classList.toggle('active',type==='note');document.getElementById('noteInput').placeholder=type==='question'?'写下哪里没看懂、希望 AI 后续补充什么。':'写下你的理解、总结、类比或可沉淀进知识库的笔记。';}
    function openNoteModal(){pendingQuote=selectionQuote();if(!pendingQuote){alert('请先在正文里选中一段你看不懂或想记录的内容。');return;}setPendingType('question');document.getElementById('noteQuote').textContent=pendingQuote;document.getElementById('noteInput').value='';document.getElementById('noteModal').classList.add('open');document.getElementById('noteInput').focus();}
    function closeNoteModal(){document.getElementById('noteModal').classList.remove('open');pendingQuote='';}
    function saveNote(){const note=document.getElementById('noteInput').value.trim();if(!note){alert('请先写下注释内容。');return;}const d=doc();annotations.push({id:'note-'+Date.now()+'-'+Math.random().toString(16).slice(2),type:pendingType,path:d.path,title:document.getElementById('pageTitle').textContent,kind:state.kind,unit:state.unit,section:state.section,extra:state.extra,quote:pendingQuote,note,question:pendingType==='question'?note:'',answer:'',createdAt:new Date().toISOString()});saveAnnotations();closeNoteModal();state.noteView=pendingType;render();}
    function textNodes(root){const out=[];const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){if(!node.nodeValue.trim())return NodeFilter.FILTER_REJECT;const p=node.parentElement;if(!p||['SCRIPT','STYLE','TEXTAREA','MARK'].includes(p.tagName))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});let n;while((n=walker.nextNode()))out.push(n);return out;}
    function applyNoteHighlight(note){const root=document.getElementById('content');const q=note.quote.replace(/\s+/g,' ').trim();if(!q)return;for(const node of textNodes(root)){const compact=node.nodeValue.replace(/\s+/g,' ');const idx=compact.indexOf(q);if(idx<0)continue;const raw=node.nodeValue;const rawIdx=raw.indexOf(q);if(rawIdx<0)continue;const mark=document.createElement('mark');mark.className='study-note';mark.dataset.noteId=note.id;mark.dataset.noteType=note.type||'question';mark.title=note.note;mark.textContent=raw.slice(rawIdx,rawIdx+q.length);mark.onclick=()=>{const card=document.querySelector('[data-note-card="'+note.id+'"]');if(card)card.scrollIntoView({behavior:'smooth',block:'center'});};const frag=document.createDocumentFragment();frag.append(document.createTextNode(raw.slice(0,rawIdx)),mark,document.createTextNode(raw.slice(rawIdx+q.length)));node.parentNode.replaceChild(frag,node);break;}}
    function highlightNotes(){annotations.filter(n=>n.path===currentDocPath()).forEach(applyNoteHighlight);}
    function deleteNote(id){annotations=annotations.filter(n=>n.id!==id);saveAnnotations();render();}
    function noteViewTitle(){return state.noteView==='question'?'问答 QA':state.noteView==='note'?'学习笔记':'学习注释';}
    function setNoteView(view){state.noteView=view;render();}
    function renderNotes(){const list=document.getElementById('noteList');if(!list)return;document.getElementById('notePanelTitle').textContent=noteViewTitle();const notes=currentNotes();list.innerHTML='';if(!notes.length){list.innerHTML='<div class="note-empty">当前页面还没有'+noteViewTitle()+'。选中正文后点击左侧“给选中文字加注释”。</div>';return;}notes.forEach((n,i)=>{const type=n.type||'question';const isQuestion=type==='question';const label=isQuestion?'疑问':'学习笔记';const answer=n.answer?'<div class="qa-answer"><p class="note-text"><strong>A：</strong>'+escapeHtml(n.answer)+'</p></div>':'<div class="qa-answer"><p class="note-text"><strong>A：</strong>导出 HTML 给 AI 后，这里会回填解答。</p></div>';const review=n.review?'<div class="qa-answer"><p class="note-text"><strong>校正：</strong>'+escapeHtml(n.review)+'</p></div>':'';const card=document.createElement('div');card.className='note-card';card.dataset.noteCard=n.id;card.innerHTML='<span class="note-type '+type+'">'+label+'</span><p class="note-quote">#'+(i+1)+' 引用：'+escapeHtml(n.quote)+'</p><p class="note-text"><strong>'+(isQuestion?'Q：':'笔记：')+'</strong>'+escapeHtml(n.note)+'</p>'+(isQuestion?answer:review)+'<div class="note-meta">'+new Date(n.createdAt).toLocaleString()+'</div><div class="note-actions"><button type="button" data-delete="'+n.id+'">删除</button></div>';list.appendChild(card);});list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteNote(b.dataset.delete));}
    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function downloadText(filename,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();URL.revokeObjectURL(a.href);a.remove();}
    function exportAnnotatedHtml(){saveAnnotations();const html='<!doctype html>\n'+document.documentElement.outerHTML;const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');downloadText('learning-annotated-'+stamp+'.html',html,'text/html;charset=utf-8');}
    function exportStudyNotesMarkdown(){const notes=annotations.filter(n=>(n.type||'question')==='note');if(!notes.length){alert('还没有学习笔记可以导出。');return;}const body=['# 学习笔记导出',''].concat(notes.map((n,i)=>['## '+(i+1)+'. '+n.title,'','- source: '+n.path,'- created: '+n.createdAt,'','> '+n.quote.replace(/\n/g,'\n> '),'','### 原始笔记','',n.note,'',n.review?'### AI 校正\n\n'+n.review+'\n':''].join('\n'))).join('\n');const stamp=new Date().toISOString().slice(0,10);downloadText('learning-notes-'+stamp+'.md',body,'text/markdown;charset=utf-8');}
    function renderNav(){const ul=document.getElementById('unitList');ul.innerHTML='';DATA.units.forEach(u=>{const b=document.createElement('button');b.className='unit '+(state.kind==='unit'&&state.unit===u.id?'active':'');b.onclick=()=>{state.kind='unit';state.unit=u.id;state.section='lesson';render();};b.innerHTML='<span class="kicker">'+u.id+'</span><span class="name">'+u.title+'</span><span class="deps">'+(u.depends_on?.length?'依赖 '+u.depends_on.join(', '):'起点课程')+'</span>';ul.appendChild(b);});const q=document.getElementById('quick');q.innerHTML='';Object.entries(DATA.extras).forEach(([k,v])=>{const b=document.createElement('button');b.className=state.kind==='extra'&&state.extra===k?'active':'';b.textContent=v.label;b.onclick=()=>{state.kind='extra';state.extra=k;render();};q.appendChild(b);});const mu=document.getElementById('mobileUnit');mu.innerHTML='';DATA.units.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.id+' '+u.title;mu.appendChild(o);});mu.value=state.unit;mu.onchange=e=>{state.kind='unit';state.unit=e.target.value;render();};}
    function renderTabs(){const tabs=document.getElementById('tabs');const ms=document.getElementById('mobileSection');tabs.innerHTML='';ms.innerHTML='';if(state.kind==='extra'){tabs.style.display='none';ms.style.display='none';return;}tabs.style.display='flex';ms.style.display='block';Object.entries(labels).forEach(([k,label])=>{const b=document.createElement('button');b.className='tab '+(state.section===k?'active':'');b.textContent=label;b.onclick=()=>{state.section=k;render();};tabs.appendChild(b);const o=document.createElement('option');o.value=k;o.textContent=label;ms.appendChild(o);});ms.value=state.section;ms.onchange=e=>{state.section=e.target.value;render();};}
    function toc(){const c=document.getElementById('content');const heads=[...c.querySelectorAll('h2,h3')];const t=document.getElementById('toc');t.innerHTML='';heads.forEach((h,i)=>{h.id=slug(h.textContent,i);const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.className=h.tagName.toLowerCase();t.appendChild(a);});if(!heads.length)t.innerHTML='<span class="meta">当前页没有二级目录。</span>';}
    function render(){renderNav();renderTabs();const d=doc();const u=DATA.units.find(x=>x.id===state.unit);document.getElementById('pageTitle').textContent=state.kind==='extra'?d.label:u.title+' · '+labels[state.section];document.getElementById('pageMeta').textContent=state.kind==='extra'?'学习包辅助页面':'课程 '+u.id+' · 状态 '+u.status+(u.depends_on?.length?' · 依赖 '+u.depends_on.join(', '):' · 起点课程');document.getElementById('sourcePath').textContent=d.path;document.getElementById('content').innerHTML=md(d.markdown);highlightNotes();toc();renderNotes();document.title=document.getElementById('pageTitle').textContent+' | Learning Pack';}
    document.getElementById('addNoteBtn').onclick=openNoteModal;
    document.getElementById('viewQaBtn').onclick=()=>setNoteView('question');
    document.getElementById('viewStudyNotesBtn').onclick=()=>setNoteView('note');
    document.getElementById('exportNotesBtn').onclick=exportAnnotatedHtml;
    document.getElementById('exportStudyNotesBtn').onclick=exportStudyNotesMarkdown;
    document.getElementById('questionModeBtn').onclick=()=>setPendingType('question');
    document.getElementById('studyNoteModeBtn').onclick=()=>setPendingType('note');
    document.getElementById('cancelNoteBtn').onclick=closeNoteModal;
    document.getElementById('saveNoteBtn').onclick=saveNote;
    document.getElementById('noteModal').addEventListener('click',e=>{if(e.target.id==='noteModal')closeNoteModal();});
    render();
  </script>
</body>
</html>
