  <script id="learning-data" type="application/json">{"generatedAt":"2026-06-02T07:59:31.080Z","units":[{"id":"01-runnable","title":"Runnable","status":"complete-course","depends_on":[],"sections":{"lesson":{"label":"课程","path":"lessons/01-runnable.md","markdown":"# 01 Runnable\n\n## 你会学到什么\n\n- LLM 应用为什么需要统一的“可执行组件”抽象。\n- `Runnable`、`RunnableSequence`、`RunnableLambda`、`RunnableConfig` 分别承担什么职责。\n- `invoke`、`batch`、`stream` 的差异。\n- `a | b` 为什么会变成 `RunnableSequence`。\n- 这个抽象如何迁移到自己的 Agent harness。\n\n## AI 概念从零解释\n\n一个 LLM 应用通常不是“调用一次模型”这么简单。真实应用会把多个步骤串起来：\n\n```text\n用户输入 -> PromptTemplate -> ChatModel -> OutputParser -> 后续业务逻辑\n```\n\n如果每一步都是随意的函数，框架就很难统一支持：\n\n- 单次调用。\n- 批量调用。\n- 流式输出。\n- 异步调用。\n- 运行配置。\n- tracing 和 callback。\n- 错误恢复和重试。\n- 组合多个步骤。\n\n`Runnable` 就是 LangChain 给这些步骤设计的统一执行接口。你可以先把它理解成“LLM 应用里的统一 Handler 接口”，但它比普通 Java `Handler` 多了批处理、流式、异步、schema 和 tracing 的语义。\n\n这里的 “Handler 统一接口” 指的是：不同对象虽然内部实现完全不同，但外部都暴露同一种调用方式。比如在 Java 后端里，一个 HTTP controller、一个过滤器、一个消息消费者、一个任务处理器，内部逻辑可能差很多，但框架希望它们都能被某个统一入口调度。`Runnable` 在 LangChain 里做的就是类似事情：不管内部是 prompt 模板、模型调用、输出解析器、检索器还是普通函数，外部都尽量用 `invoke(input)`、`batch(inputs)`、`stream(input)` 这套统一协议来调用。\n\n所以这句话不是要你先理解某个具体的 Java `Handler` 类，而是要抓住这个工程直觉：框架把“很多不同类型的步骤”包装成“同一种可调度对象”，这样后面才能组合、批处理、流式输出和追踪。\n\n这和责任链模式有相似处，但不要完全等同。责任链通常强调“一个请求沿着一串 handler 传递，某个 handler 可以处理或继续传递”。`RunnableSequence` 更强调“每一步都执行，并且上一步输出变成下一步输入”。所以它更像 pipeline：\n\n```text\ninput -> step_1 -> intermediate -> step_2 -> output\n```\n\n如果放到 Java 后端经验里，可以先把它理解成“带执行协议的 Pipeline Step”，而不是某个固定的 `Handler` 类。\n\n## 为什么工程上需要这个抽象\n\n从后端工程角度看，LangChain 面临的问题类似“不同组件都能处理请求，但输入输出、并发、观测、生命周期都不统一”。`Runnable` 把这些差异收敛到同一套执行协议：\n\n- `invoke`：单输入单输出。\n- `batch`：多输入批处理。\n- `stream`：单输入流式输出。\n- `ainvoke` / `abatch` / `astream`：异步版本。\n- `config`：运行配置，包含 callbacks、tags、metadata、max_concurrency 等。\n- `|` / `pipe`：声明式组合。\n\n这里的 `config` 不是业务输入，而是“这次运行怎么被观测、标记和调度”的配置：\n\n- `callbacks`：生命周期回调。比如开始执行、结束执行、出错、流式输出 chunk 时通知 tracer 或 logger。\n- `tags`：标签。比如给某次调用打上 `[\"agent\", \"demo\"]`，后面在 tracing 或日志里筛选。\n- `metadata`：结构化元数据。比如 `user_id`、`request_id`、`experiment`，用于排查和分析。\n- `max_concurrency`：并发上限。主要影响 `batch` 这种多个输入并发执行的场景。\n\n一个容易混淆的点是 `batch` 的“多输入”。这里的多输入不是指多模态，而是指多个独立输入样本：\n\n```python\nr.invoke(\"问题1\")\nr.batch([\"问题1\", \"问题2\", \"问题3\"])\n```\n\n每个输入样本本身可以是字符串、dict、message list，也可以包含图片等多模态内容；但 `batch` 的核心语义是“同一个 Runnable 同时处理 N 个独立请求”。\n\n## 最小心智模型\n\n可以先用下面的伪代码建立直觉：\n\n```python\nclass MiniRunnable:\n    def invoke(self, input, config=None):\n        raise NotImplementedError\n\n    def batch(self, inputs, config=None):\n        return [self.invoke(x, config) for x in inputs]\n\n    def stream(self, input, config=None):\n        yield self.invoke(input, config)\n\n    def __or__(self, other):\n        return MiniSequence([self, other])\n\n\nclass MiniSequence(MiniRunnable):\n    def __init__(self, steps):\n        self.steps = steps\n\n    def invoke(self, input, config=None):\n        value = input\n        for step in self.steps:\n            value = step.invoke(value, config)\n        return value\n```\n\nLangChain 的真实实现复杂很多，但心智模型就是：把每个步骤变成统一可执行对象，再把对象组合成 pipeline。\n\n这里的 `steps` 就是 pipeline 里的步骤列表，不是额外的新概念。比如：\n\n```python\nchain = RunnableLambda(add_one) | RunnableLambda(mul_two)\n```\n\n可以先把它想成：\n\n```text\nsteps[0] = RunnableLambda(add_one)\nsteps[1] = RunnableLambda(mul_two)\n```\n\n执行 `chain.invoke(1)` 时：\n\n```text\nvalue = 1\nvalue = steps[0].invoke(value)  # add_one(1) -> 2\nvalue = steps[1].invoke(value)  # mul_two(2) -> 4\nreturn value\n```\n\n所以 `RunnableSequence` 不是把 A 和 B 的输入输出“拼接”起来，而是把 A 的输出传给 B。\n\n## LangChain 源码入口\n\n- repo: `langchain-ai/langchain`\n- commit: `bc5f1517cf7ac27addd4286e388228b8172b93b9`\n- path: `libs/core/langchain_core/runnables/base.py`\n- related config: `libs/core/langchain_core/runnables/config.py`\n- related tests:\n  - `libs/core/tests/unit_tests/runnables/test_concurrency.py`\n  - `libs/core/tests/unit_tests/runnables/test_runnable_events_v2.py`\n\n## 源码阅读路径\n\n1. 先看 `Runnable` 类的 docstring：`base.py:125`。\n2. 再看 `Runnable.__or__`：`base.py:619`，理解 `|` 如何创建 `RunnableSequence`。\n3. 看 `Runnable.invoke` / `batch` / `stream`：`base.py:823`、`base.py:868`、`base.py:1131`。\n4. 看 `RunnableSequence` 类：`base.py:2995`。\n5. 看 `RunnableSequence.invoke`：`base.py:3309`，理解步骤如何顺序执行。\n6. 看 `RunnableLambda`：`base.py:4577`，理解普通函数如何进入 Runnable 体系。\n7. 看 `RunnableConfig`：`config.py:49`，理解运行配置。\n\n## 核心实体和关系\n\n- `Runnable`：统一执行抽象。\n- `RunnableSequence`：顺序组合多个 Runnable。\n- `RunnableLambda`：把 Python callable 包装成 Runnable。\n- `RunnableConfig`：承载 tracing、metadata、并发限制等运行配置。\n- `Runnable.__or__ -> RunnableSequence`：`|` 操作符创建组合。\n- `Runnable.batch -> invoke`：默认批处理并发调用单次执行。\n- `Runnable.stream -> invoke`：默认 stream 只是包一层单次输出。\n\n## 关键 claims 与 evidence\n\n- `claim-runnable-unifies-execution`：Runnable 统一单次调用、批处理、流式、异步和组合。证据：`ev-runnable-class-doc`、`ev-runnable-invoke`、`ev-runnable-batch`、`ev-runnable-stream`。\n- `claim-or-creates-sequence`：`|` 创建 `RunnableSequence`。证据：`ev-runnable-or`。\n- `claim-batch-default-parallel-invoke`：默认 `batch` 并发调用 `invoke`。证据：`ev-runnable-batch`、`ev-test-batch-concurrency`。\n- `claim-stream-default-wraps-invoke`：默认 `stream` 只是 yield `invoke`。证据：`ev-runnable-stream`。\n- `claim-lambda-wraps-callable`：`RunnableLambda` 包装普通 callable。证据：`ev-runnable-lambda-class`、`ev-runnable-lambda-invoke`。\n\n## 真实源码解释\n\n`Runnable` 的 docstring 明确把它定义为可以 invoked、batched、streamed、transformed、composed 的工作单元。它不是普通函数接口，而是一个带运行协议的抽象。\n\n`Runnable.__or__` 返回：\n\n```python\nRunnableSequence(self, coerce_to_runnable(other))\n```\n\n这说明 `a | b` 的核心语义是构造顺序执行链。`coerce_to_runnable` 也暗示 LangChain 会把 Runnable-like 对象转成真正 Runnable。\n\n`Runnable.batch` 的默认实现先把 config 展开成 config list，然后定义内部 `invoke` 包装函数。多输入时，它通过 executor map 并发执行。这个默认实现适合 IO bound 的组件，例如模型 API 调用。\n\n`Runnable.stream` 的默认实现只有一行核心逻辑：\n\n```python\nyield self.invoke(input, config, **kwargs)\n```\n\n所以默认 stream 不等于真正流式。真正 token/chunk 级流式需要子类实现 `transform` 或覆盖 stream。\n\n可以用下面这个差异理解“伪流式”和“真流式”：\n\n```python\n# 默认 stream：只是在最后 yield 一次完整结果\nfor chunk in runnable.stream(input):\n    print(chunk)  # 通常只打印一次\n\n# 真正流式：一边生成一边 yield\nfor chunk in chat_model.stream(messages):\n    print(chunk)  # 可能打印很多次 token / message chunk\n```\n\n`RunnableSequence` 的流式能力取决于中间每个 step 是否能传递 chunk。源码 docstring 里明确说，如果所有组件都实现 `transform`，sequence 就能把 streaming input 映射到 streaming output；如果某个组件没有实现，流会在这个组件处被阻塞，直到它运行完成。\n\n这也是为什么 `RunnableLambda` 要单独理解。它能把普通 Python callable 包装成 Runnable：\n\n```python\nfrom langchain_core.runnables import RunnableLambda\n\nadd_one = RunnableLambda(lambda x: x + 1)\n```\n\n它的价值是接入成本很低：普通函数马上可以参与 `invoke`、`batch`、`|` 组合和 tracing。它的局限是，普通函数通常要拿到完整输入后才返回完整输出，所以默认不适合真正 token/chunk 级 streaming。需要流式处理任意 chunk 时，更应该看 `RunnableGenerator` 或自定义 `transform`。\n\n`RunnableSequence.invoke` 会遍历 `self.steps`，每一步都执行 `step.invoke`，并把上一步结果作为下一步输入。它还会为每个 step patch callbacks，使 tracing 能看到 `seq:step:1`、`seq:step:2` 这种层级。\n\n源码里的 `step` 就是 `self.steps` 列表里的一个 Runnable。`RunnableSequence` 内部有 `first`、`middle`、`last`，`steps` 会把这些组合起来形成顺序列表。执行时大致是：\n\n```python\ninput_ = input\nfor i, step in enumerate(self.steps):\n    input_ = step.invoke(input_, config)\nreturn input_\n```\n\n第一步会接收外部输入；从第二步开始，每一步都接收上一步的输出。\n\n## 设计取舍\n\n收益：\n\n- 统一组件调用协议。\n- 组合链可以自动拥有 sync / async / batch / streaming 能力。\n- config 在链路中传递，便于 tracing、metadata 和并发控制。\n- 普通函数可以通过 `RunnableLambda` 快速接入。\n\n成本：\n\n- 抽象层较厚，初学者不容易判断真正执行点在哪里。\n- streaming 语义容易误解，默认 `stream` 不代表真正流式。\n- `RunnableConfig` 贯穿链路，阅读源码时要同时追 config 和 callbacks。\n\n## 和 Java 后端经验类比\n\n可以把 `Runnable` 类比成更强的 `Handler\u003cI, O>`，但它同时内置：\n\n- 类似 `CompletableFuture` / executor 的异步和批处理。\n- 类似 FilterChain 的链式组合。\n- 类似 Spring `HandlerAdapter` 的统一适配。\n- 类似 AOP / interceptor 的 callbacks 和 tracing。\n\n但不要过度类比。LangChain 的核心差异是：它必须同时处理 LLM 输出、流式 token、tool call、prompt schema、provider adapter 等 LLM 应用特有问题。\n\n如果要在自己的 Agent harness 里迁移这个思路，建议先固定“执行形态”，再让具体组件自由实现内部逻辑：\n\n```python\nclass AgentStep:\n    def invoke(self, input, config=None): ...\n    def batch(self, inputs, config=None): ...\n    def stream(self, input, config=None): ...\n    def pipe(self, next_step): ...\n```\n\n哪些东西适合做成这种 step？\n\n- prompt 渲染。\n- 模型调用。\n- tool 执行。\n- output parser。\n- retriever 查询。\n- guardrail / middleware。\n\n重点不是规定所有组件必须使用同一种具体数据结构，而是规定它们都遵守同一套执行协议。具体输入输出类型应由 schema、类型参数或文档约束。\n\n## 容易误解的点\n\n- 误解 1：`Runnable` 只是普通函数。实际它是执行协议。\n- 误解 2：`stream` 默认就是 token 流。实际默认只是 yield 一次 `invoke` 结果。\n- 误解 3：`|` 只是 Python 语法糖。实际它创建了 `RunnableSequence`，后续 batch/tracing/stream 都围绕这个对象展开。\n- 误解 4：`RunnableLambda` 适合所有自定义逻辑。实际需要真正 streaming 时，更应该看 `RunnableGenerator` 或自定义 `transform`。\n- 误解 5：`batch` 的多输入就是多模态。实际它主要指多个独立输入样本；多模态是单个样本内部的数据形态。\n- 误解 6：`RunnableSequence` 会把 A 和 B 的输入输出拼接。实际是 A 的输出传给 B，像 pipeline，不像字符串拼接。\n\n## 学习者笔记校正\n\n本节根据学习标注补充以下校正点：\n\n- “统一 Handler 接口”可以理解为统一外部调用协议，但 `Runnable` 比普通 handler 多了 batch、stream、async、config 和 tracing。\n- `invoke`、`batch`、`stream` 三个词容易被语音输入识别错。准确含义分别是单输入单输出、多输入批处理、单输入迭代式输出。\n- `RunnableSequence` 的 `sequence` 是顺序链路，不是拼接。执行规则是 `B(A(input))`。\n- `RunnableLambda` 很重要，因为它让普通函数进入 Runnable 体系；但它默认会消费完整输入再输出，不适合需要边收边发的真正流式场景。\n- 自研 Agent harness 时，可以先设计统一执行协议，再让 prompt、model、tool、parser、retriever 等不同组件各自实现。\n\n## 自测题\n\n见 `../quizzes/01-runnable.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/01-runnable.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/01-mini-runnable/README.md`。\n\n## 学完标准\n\n你应该能不看笔记解释：\n\n- 为什么 LangChain 需要 Runnable。\n- `invoke`、`batch`、`stream` 的默认语义分别是什么。\n- `a | b` 如何变成 `RunnableSequence`。\n- `RunnableLambda` 的价值和局限。\n- 如果在自己的 Agent harness 里引入 Runnable 思路，接口会怎么设计。\n"},"quiz":{"label":"测试","path":"quizzes/01-runnable.quiz.md","markdown":"# 01 Runnable Quiz\n\n## 概念题\n\n1. 为什么 LLM 应用需要 `Runnable` 这种统一执行抽象，而不是直接使用普通函数？\n2. `invoke`、`batch`、`stream` 分别表达什么执行语义？\n3. 为什么默认 `stream` 不等于真正的 token/chunk 流式输出？\n4. `RunnableConfig` 为什么要包含 tags、metadata、callbacks、max_concurrency？\n5. `batch` 的“多输入”和“多模态输入”有什么区别？\n\n## 源码题\n\n1. 找到 `Runnable.__or__` 的实现，说明它返回了什么对象。\n2. 找到 `RunnableSequence.invoke`，写出它执行 steps 的顺序。\n3. 找到 `Runnable.batch`，说明单输入和多输入时行为有什么不同。\n4. 找到 `RunnableSequence` 的 docstring，说明它如何描述 streaming 与 `transform` 的关系。\n\n## 设计题\n\n1. 如果你要在 Java 中设计一个类似 Runnable 的接口，你会把 `batch` 和 `stream` 放在同一个接口里，还是拆成多个接口？为什么？\n2. `RunnableLambda` 让普通函数快速进入框架，但它可能带来哪些可维护性问题？\n3. 如果一个 pipeline 中间放了一个默认 `RunnableLambda`，它可能如何影响真正流式输出？\n\n## 迁移题\n\n1. 如果你要做一个自己的 Agent harness，哪些组件适合做成 Runnable？哪些不适合？\n2. 用自己的话写出 `A | B | C` 的执行顺序，不允许使用“拼接”这个词。\n"},"mastery":{"label":"掌握度","path":"mastery/01-runnable.mastery.md","markdown":"# 01 Runnable Mastery\n\n## Level 1: 复述\n\n不用看 lesson，用 150-250 字解释 Runnable 解决了什么问题。\n\n完成标准：\n\n- 说到统一执行协议。\n- 说到组合。\n- 说到 batch / stream / async 至少两个能力。\n\n## Level 2: 源码定位\n\n在源码中定位以下符号，并记录文件和行号：\n\n- `Runnable`\n- `Runnable.__or__`\n- `Runnable.batch`\n- `Runnable.stream`\n- `RunnableSequence`\n- `RunnableSequence.invoke`\n- `RunnableLambda`\n- `RunnableConfig`\n\n## Level 3: 调用链追踪\n\n追踪下面这段代码的执行链：\n\n```python\nchain = RunnableLambda(lambda x: x + 1) | RunnableLambda(lambda x: x * 2)\nchain.invoke(1)\n```\n\n要求写出：\n\n1. `|` 如何创建 `RunnableSequence`。\n2. `chain.invoke(1)` 如何遍历 steps。\n3. 每一步的输入输出是什么。\n4. 为什么这里不是把两个函数的输入输出“拼接”在一起。\n\n## Level 4: 图谱重建\n\n不看 `graph/relations.json`，手写以下实体关系：\n\n- `Runnable`\n- `RunnableSequence`\n- `RunnableLambda`\n- `RunnableConfig`\n- `invoke`\n- `batch`\n- `stream`\n- `callbacks`\n\n## Level 5: 故障诊断\n\n假设你写了一个自定义 Runnable，`stream()` 没有逐 token 输出，而是最后一次性输出完整结果。根据本课内容，判断可能原因。\n\n要求至少覆盖：\n\n- 默认 `stream` 的行为。\n- `transform` 是否实现。\n- pipeline 中是否存在默认 `RunnableLambda` 这类会阻塞 streaming 的步骤。\n\n## Level 6: 微改造\n\n在 `labs/01-mini-runnable` 中增加：\n\n- `with_config(config)` 方法。\n- `max_concurrency` 控制。\n- 一个简单 callback hook：`on_start` / `on_end`。\n\n说明你的实现和 LangChain `RunnableConfig` 的差异。\n\n## Level 7: 术语校正\n\n用准确术语改写下面几句话：\n\n1. “Runnable 主要是为了把大模型输入接口标准化。”\n2. “batch 是多模态输入。”\n3. “RunnableSequence 是把 A 和 B 的输入输出拼起来。”\n4. “RunnableLambda 适合所有自定义函数，包括真正流式处理。”\n\n完成标准：\n\n- 能区分执行协议、数据 schema、输入样本数量和数据模态。\n- 能解释 `RunnableLambda` 与 `RunnableGenerator` 的差异。\n"},"lab":{"label":"实验","path":"labs/01-mini-runnable/README.md","markdown":"# Lab 01: Mini Runnable\n\n目标：实现一个最小版 LangChain Runnable 心智模型。\n\n## 必做功能\n\n- `MiniRunnable.invoke(input, config=None)`\n- `MiniRunnable.batch(inputs, config=None)`\n- `MiniRunnable.stream(input, config=None)`\n- `MiniRunnable.__or__(other)`\n- `MiniSequence.invoke(input, config=None)`\n- `MiniLambda(func)`\n\n## 验收用例\n\n```python\nadd_one = MiniLambda(lambda x: x + 1)\nmul_two = MiniLambda(lambda x: x * 2)\nchain = add_one | mul_two\n\nassert chain.invoke(1) == 4\nassert chain.batch([1, 2, 3]) == [4, 6, 8]\nassert list(chain.stream(1)) == [4]\n```\n\n## 加分功能\n\n- 支持 `config={\"max_concurrency\": 3}`。\n- 支持 `on_start` / `on_end` callback。\n- 支持 `name`，方便打印执行链。\n\n## 复盘问题\n\n1. 你的 `stream` 是真正流式，还是只是包装 `invoke`？\n2. 如果某一步失败，错误应该在哪里捕获？\n3. 如果要支持 async，你会怎么改接口？\n\n"}}},{"id":"02-message-schema","title":"Message Schema","status":"complete-course","depends_on":["01-runnable"],"sections":{"lesson":{"label":"课程","path":"lessons/02-message-schema.md","markdown":"# 02 Message Schema\n\n## 你会学到什么\n\n- LLM 应用为什么使用 message list，而不是只传一个字符串。\n- system / human / ai / tool message 在 Agent 中分别承担什么职责。\n- `AIMessage.tool_calls`、`ToolMessage.tool_call_id` 和工具调用闭环是什么关系。\n- message schema 如何成为 Agent loop 的状态日志。\n- 如何把这套消息模型迁移到自己的 Agent harness。\n\n## AI 概念从零解释\n\n聊天模型的输入通常不是一段无结构文本，而是一组带角色的消息：\n\n```text\nSystemMessage: 你是一个谨慎的代码助手\nHumanMessage: 请帮我查一下这个函数的作用\nAIMessage: 我需要调用 search_code 工具\nToolMessage: search_code 返回了 3 个匹配文件\nAIMessage: 根据工具结果给出最终解释\n```\n\n这些角色不是 UI 上的装饰，而是模型上下文里的结构信号。`system` 更像运行规则，`human` 是用户意图，`ai` 是模型上一轮输出，`tool` 是外部世界返回的观察结果。\n\nAgent 场景里，message schema 尤其关键。模型不会真的执行函数，它只会输出“我要调用某个工具以及参数是什么”。框架执行工具后，必须把结果作为 `ToolMessage` 放回消息历史，让模型下一轮继续推理。\n\n## 为什么工程上需要这个抽象\n\n如果只用普通字符串，框架很难稳定表达这些信息：\n\n- 哪些内容是系统约束，哪些是用户输入。\n- 哪些内容是模型自己生成的中间步骤。\n- 哪些内容是工具执行结果。\n- 一个工具结果对应哪一次 tool call。\n- token usage、provider 原始字段、response metadata 放在哪里。\n\nMessage schema 把这些都变成显式字段。它的工程价值类似“事件日志的标准事件类型”：每一轮对话都可以被序列化、反序列化、追踪、回放和传给不同 provider adapter。\n\n## 最小心智模型\n\n可以先用下面的简化结构理解：\n\n```python\nclass Message:\n    def __init__(self, role, content, **metadata):\n        self.role = role\n        self.content = content\n        self.metadata = metadata\n\n\nmessages = [\n    Message(\"system\", \"You are a coding assistant.\"),\n    Message(\"human\", \"Read RunnableSequence.\"),\n    Message(\"ai\", \"\", tool_calls=[{\"id\": \"call_1\", \"name\": \"read_file\"}]),\n    Message(\"tool\", \"class RunnableSequence ...\", tool_call_id=\"call_1\"),\n    Message(\"ai\", \"RunnableSequence chains multiple Runnable steps.\"),\n]\n```\n\nLangChain 的真实实现比这个更细：不同 message 是不同类，`AIMessage` 有标准化 tool call 字段，`ToolMessage` 有 `artifact`，`BaseMessage` 有 `additional_kwargs` 和 `response_metadata`。\n\n## LangChain 源码入口\n\n- repo: `langchain-ai/langchain`\n- commit: `bc5f1517cf7ac27addd4286e388228b8172b93b9`\n- base message: `libs/core/langchain_core/messages/base.py:93`\n- human message: `libs/core/langchain_core/messages/human.py:9`\n- system message: `libs/core/langchain_core/messages/system.py:9`\n- ai message: `libs/core/langchain_core/messages/ai.py:160`\n- tool message: `libs/core/langchain_core/messages/tool.py:26`\n\n## 源码阅读路径\n\n1. 先看 `BaseMessage`：`base.py:93`，确认 message 是 chat model 的输入和输出。\n2. 看 `BaseMessage.content`、`additional_kwargs`、`response_metadata`、`type`：`base.py:103` 到 `base.py:123`。\n3. 看 `HumanMessage.type = \"human\"` 和 `SystemMessage.type = \"system\"`。\n4. 看 `AIMessage`：`ai.py:160`，重点看 `tool_calls`、`invalid_tool_calls`、`usage_metadata`。\n5. 看 `ToolMessage`：`tool.py:26`，重点看 `tool_call_id` 和 `artifact`。\n6. 回到 Agent loop 时再看 `langchain_core/agents.py` 如何把 action / observation 转成 message。\n\n## 核心实体和关系\n\n- `BaseMessage`：所有消息类型的抽象基类。\n- `HumanMessage`：用户消息。\n- `SystemMessage`：系统约束消息。\n- `AIMessage`：模型输出消息，包含文本、tool calls、usage metadata。\n- `ToolMessage`：工具执行结果消息。\n- `AIMessage.tool_calls -> BaseTool.invoke`：模型提出结构化工具调用意图。\n- `BaseTool.run -> ToolMessage.tool_call_id`：工具结果通过 id 对齐原始调用。\n\n## 关键 claims 与 evidence\n\n- `claim-message-schema-carries-agent-state`：message schema 承载 agent loop 状态。证据：`ev-base-message`、`ev-ai-message-tool-calls`、`ev-tool-message-tool-call-id`。\n- `BaseMessage.content` 支持字符串或结构化 content list。证据：`messages/base.py:103`。\n- `additional_kwargs` 用于承载 provider 额外 payload，例如模型原始 tool calls。证据：`messages/base.py:106`。\n- `AIMessage` 提供标准化 `tool_calls` 和 `usage_metadata`。证据：`messages/ai.py:170`、`messages/ai.py:176`。\n- `ToolMessage.tool_call_id` 用来关联 tool call request 和 response。证据：`messages/tool.py:32`、`messages/tool.py:67`。\n\n## 相关测试证据\n\n- `ev-test-message-tool-call-serde`：`tests/unit_tests/test_messages.py:412-433` 验证普通 message 和含 `tool_calls` 的 `AIMessage` 可以往返序列化。\n- `ev-test-message-chunk-tool-calls`：`tests/unit_tests/test_messages.py:465-487` 验证流式 chunk 中的 tool call 片段会合并成 `tool_calls`，解析失败的片段进入 `invalid_tool_calls`。\n- `ev-test-tool-message-serde-dict`：`tests/unit_tests/test_messages.py:989-1054` 验证 `ToolMessage` 的 `artifact`、`status`、`tool_call_id` 可以序列化和转 dict。\n\n这些测试说明 message schema 不是“文本包装类”，而是 agent loop 能恢复状态、对齐工具调用、回放 provider payload 的协议层。\n\n## 真实源码解释\n\n`BaseMessage` 的 docstring 直接说 messages 是 chat model 的输入和输出。这一点很重要：在 LangChain 里，message 不是前端聊天气泡，而是模型调用协议的核心数据结构。\n\n`content` 的类型是 `str | list[str | dict]`，说明 LangChain 不只支持纯文本，也为更结构化的多模态或 provider payload 留了空间。\n\n`additional_kwargs` 的注释说它保留 message 相关的额外 payload，比如 AI message 中 provider 编码的 tool calls。这意味着 LangChain 同时保留两层信息：一层是标准化字段，另一层是 provider 原始扩展。\n\n`AIMessage` 的定义说明它代表模型输出，并包含 LangChain 标准化字段。`tool_calls` 是解析成功的工具调用，`invalid_tool_calls` 是解析失败的工具调用，`usage_metadata` 是跨模型一致的 token usage 表达。\n\n`ToolMessage` 的 docstring 把 tool call 对齐讲得很清楚：`tool_call_id` 用于把工具请求和工具响应关联起来，尤其是模型可以并行请求多个工具时。如果没有这个 id，框架很难知道某个工具结果应该回到哪次调用。\n\n## 设计取舍\n\n收益：\n\n- 对话状态可以序列化和回放。\n- provider adapter 可以把不同 API 格式归一到同一套 message 类型。\n- Agent loop 可以通过 message history 表达多轮工具调用。\n- tool call 和 tool result 能用 id 精确配对。\n- token usage、response headers、logprobs 等 metadata 有稳定位置。\n\n成本：\n\n- 初学者容易觉得 message 类型太多。\n- provider 原始字段和 LangChain 标准化字段并存，阅读时要分清层级。\n- tool call 的完整闭环需要同时理解 `AIMessage`、`BaseTool`、`ToolMessage` 和 agent loop。\n\n## 和 Java 后端经验类比\n\n可以把 message history 类比成领域事件流：\n\n- `HumanMessage` 像用户请求事件。\n- `AIMessage(tool_calls=...)` 像系统生成的 command。\n- `ToolMessage` 像 command handler 执行后的 event。\n- `SystemMessage` 像策略配置或 request context。\n\n但不要把它简单理解成 DTO。Message 同时是模型上下文、框架状态、tracing 输入和 provider adapter 的边界对象。\n\n## 容易误解的点\n\n- 误解 1：message 只是聊天 UI 的一条气泡。实际它是 chat model 的输入输出协议。\n- 误解 2：`AIMessage` 只保存模型文本。实际它还保存 tool calls、invalid tool calls、usage metadata。\n- 误解 3：`ToolMessage` 是工具定义。实际它是工具执行后的结果消息。\n- 误解 4：`tool_call_id` 可有可无。并行工具调用时，没有它就无法可靠对齐结果。\n- 误解 5：system message 总是用户可见。很多应用里它是运行策略，不是普通对话内容。\n\n## 自测题\n\n见 `../quizzes/02-message-schema.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/02-message-schema.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/02-message-types/README.md`。\n\n## 学完标准\n\n你应该能不看笔记解释：\n\n- 为什么 LLM 应用需要 message list。\n- system / human / ai / tool message 的职责差异。\n- `AIMessage.tool_calls` 和 `ToolMessage.tool_call_id` 如何构成工具调用闭环。\n- message schema 为什么是 Agent loop 的状态载体。\n- 如果自己实现一个 Agent harness，最小消息模型应该有哪些字段。\n\n"},"quiz":{"label":"测试","path":"quizzes/02-message-schema.quiz.md","markdown":"# 02 Message Schema Quiz\n\n## 概念题\n\n1. 为什么聊天模型输入要用 message list，而不是只传普通字符串？\n2. `SystemMessage`、`HumanMessage`、`AIMessage`、`ToolMessage` 分别表达什么语义？\n3. `AIMessage.tool_calls` 和 `ToolMessage.tool_call_id` 为什么需要配合？\n4. `additional_kwargs` 和标准化字段有什么区别？为什么 LangChain 两者都保留？\n5. 为什么 tool result 必须回填到 message history，而不是只在程序内存里保存？\n\n## 源码题\n\n1. 找到 `BaseMessage.content`、`additional_kwargs`、`response_metadata`、`type`，分别说明它们解决什么问题。\n2. 找到 `AIMessage.tool_calls`、`invalid_tool_calls`、`usage_metadata`，解释这三个字段分别适合记录什么。\n3. 找到 `ToolMessage.tool_call_id`，说明它如何支持模型并行请求多个工具。\n4. 对比 `HumanMessage.type`、`SystemMessage.type`、`AIMessage.type`、`ToolMessage.type`，解释 `type` 对反序列化的价值。\n\n## 设计题\n\n1. 如果你设计自己的 Agent message schema，`role` 用 enum 还是用子类？为什么？\n2. `ToolMessage.artifact` 不直接发给模型，而是留给程序使用。这个设计解决了什么问题？\n3. 如果 provider 返回一个 LangChain 标准字段里没有的信息，你会放在标准字段、metadata，还是 additional kwargs？\n\n## 故障诊断题\n\n1. 模型请求了两个工具，但第二个工具结果被模型误认为第一个工具结果。你会先检查哪些字段？\n2. Agent 下一轮看不到工具结果，你会检查 message history 中是否缺了什么？\n3. token usage 在不同 provider 下字段不一致，为什么 `usage_metadata` 有价值？\n\n## 迁移题\n\n1. 用 Java 设计一个最小 message hierarchy，至少包含哪些字段和类型？\n2. 在你自己的 Agent harness 中，如何保存一轮 `Human -> AI(tool call) -> Tool -> AI(final)`？\n\n"},"mastery":{"label":"掌握度","path":"mastery/02-message-schema.mastery.md","markdown":"# 02 Message Schema Mastery\n\n## Level 1: 复述\n\n不用看 lesson，用 150-250 字解释为什么 messages 是 Agent 状态的基础。\n\n完成标准：\n\n- 说到 role / type。\n- 说到 tool call 和 tool result。\n- 说到 message history 会回到下一轮模型输入。\n\n## Level 2: 源码定位\n\n定位并记录文件和行号：\n\n- `BaseMessage`\n- `BaseMessage.content`\n- `BaseMessage.additional_kwargs`\n- `AIMessage.tool_calls`\n- `AIMessage.usage_metadata`\n- `ToolMessage.tool_call_id`\n- `ToolMessage.artifact`\n\n## Level 3: 状态流重建\n\n手写一次消息流：\n\n```text\nHumanMessage -> AIMessage(tool_calls=[...]) -> ToolMessage -> AIMessage(final)\n```\n\n要求标出每条消息的 `type`、关键字段和它在 Agent loop 中的作用。\n\n## Level 4: 图谱重建\n\n不看 `graph/relations.json`，画出以下实体关系：\n\n- `BaseMessage`\n- `AIMessage`\n- `ToolMessage`\n- `BaseTool`\n- `Agent Loop`\n- `tool_call_id`\n\n## Level 5: 故障诊断\n\n给出排查步骤：\n\n- 工具结果没有被模型理解。\n- 多工具并行调用时结果对不上。\n- provider 返回的原始 tool call 无法被标准化。\n\n## Level 6: 微改造\n\n在 `labs/02-message-types` 中增加：\n\n- `usage_metadata`\n- `response_metadata`\n- `artifact`\n- `from_dict()` 反序列化\n\n说明哪些字段应该发给模型，哪些字段只给程序使用。\n\n"},"lab":{"label":"实验","path":"labs/02-message-types/README.md","markdown":"# Lab 02: Message Types\n\n目标：实现一个最小 message schema，验证你理解 `BaseMessage`、`AIMessage.tool_calls` 和 `ToolMessage.tool_call_id` 的作用。\n\n## 必做功能\n\n- `BaseMessage(type, content, additional_kwargs=None, response_metadata=None, name=None, id=None)`\n- `SystemMessage(content)`\n- `HumanMessage(content)`\n- `AIMessage(content, tool_calls=None, invalid_tool_calls=None, usage_metadata=None)`\n- `ToolMessage(content, tool_call_id, artifact=None)`\n- `to_dict()` / `from_dict()`\n- `message.type` 必须可用于反序列化。\n\n## 验收用例\n\n```python\nmessages = [\n    SystemMessage(\"You are a code assistant.\"),\n    HumanMessage(\"Find RunnableSequence.\"),\n    AIMessage(\"\", tool_calls=[{\"id\": \"call_1\", \"name\": \"search_code\", \"args\": {\"q\": \"RunnableSequence\"}}]),\n    ToolMessage(\"base.py:2995 class RunnableSequence\", tool_call_id=\"call_1\"),\n]\n\nassert messages[2].tool_calls[0][\"id\"] == messages[3].tool_call_id\nassert messages[0].to_dict()[\"type\"] == \"system\"\nassert BaseMessage.from_dict(messages[3].to_dict()).tool_call_id == \"call_1\"\n```\n\n## 加分功能\n\n- 校验 `ToolMessage.tool_call_id` 不能为空。\n- 支持 `artifact`，但默认不放入发送给模型的 content。\n- 支持 `usage_metadata={\"input_tokens\": 10, \"output_tokens\": 5}`。\n- 实现 `filter_model_visible_fields()`。\n\n## 复盘问题\n\n1. 哪些字段应该进入模型上下文，哪些只给程序使用？\n2. 如果一个 `AIMessage` 有多个 tool calls，如何保证结果不串？\n3. `additional_kwargs` 和标准化字段同时存在时，读取优先级怎么定？\n\n"}}},{"id":"03-prompt-template","title":"Prompt Template","status":"complete-course","depends_on":["01-runnable","02-message-schema"],"sections":{"lesson":{"label":"课程","path":"lessons/03-prompt-template.md","markdown":"# 03 Prompt Template\n\n## 你会学到什么\n\n- Prompt 为什么不能长期依赖字符串拼接。\n- `BasePromptTemplate` 如何声明输入变量、partial 变量、metadata 和 tags。\n- `PromptTemplate.from_template` 如何从模板字符串推断变量。\n- `ChatPromptTemplate` 如何把多条 message template 变成 chat model 输入。\n- Prompt template 为什么也是 Runnable pipeline 的一步。\n\n## AI 概念从零解释\n\nPrompt 是你给模型的任务说明和上下文组织方式。最开始你可能会写：\n\n```python\nprompt = \"请总结：\" + article\n```\n\n但真实应用很快会变复杂：\n\n- 有系统规则。\n- 有用户输入。\n- 有历史消息。\n- 有少样本示例。\n- 有工具说明。\n- 有输出格式约束。\n- 有需要复用的固定变量。\n\n这时 prompt 不再适合手写字符串拼接。它需要像 API request 一样有 schema、有变量校验、有可组合的对象模型。\n\n## 为什么工程上需要这个抽象\n\nPrompt template 解决的是“模型输入构造”的工程化问题：\n\n- 哪些变量必须传入。\n- 哪些变量可以提前绑定。\n- 缺变量时在哪里报错。\n- prompt 生成的是普通文本还是 message list。\n- prompt formatting 如何接入 tracing。\n- prompt 如何和 model、parser 串成 pipeline。\n\n在 LangChain 里，prompt template 继承 `RunnableSerializable[dict, PromptValue]`。这意味着 prompt 不是“辅助函数”，而是一个从输入 dict 到 `PromptValue` 的标准 Runnable。\n\n## 最小心智模型\n\n```python\nclass MiniPromptTemplate:\n    def __init__(self, template, input_variables, partial=None):\n        self.template = template\n        self.input_variables = input_variables\n        self.partial = partial or {}\n\n    def invoke(self, values):\n        merged = {**self.partial, **values}\n        missing = set(self.input_variables) - set(merged)\n        if missing:\n            raise KeyError(missing)\n        return self.template.format(**merged)\n\n\nprompt = MiniPromptTemplate(\"Tell me about {topic}\", [\"topic\"])\nprompt.invoke({\"topic\": \"Runnable\"})\n```\n\n真实 LangChain 还支持 chat messages、optional variables、input types、output parser、metadata、tags 和多种模板格式。\n\n## LangChain 源码入口\n\n- repo: `langchain-ai/langchain`\n- commit: `bc5f1517cf7ac27addd4286e388228b8172b93b9`\n- base prompt: `libs/core/langchain_core/prompts/base.py:40`\n- input validation: `libs/core/langchain_core/prompts/base.py:160`\n- prompt invoke: `libs/core/langchain_core/prompts/base.py:207`\n- string prompt: `libs/core/langchain_core/prompts/prompt.py:24`\n- `from_template`: `libs/core/langchain_core/prompts/prompt.py:298`\n- chat prompt: `libs/core/langchain_core/prompts/chat.py:790`\n- chat input variable validation: `libs/core/langchain_core/prompts/chat.py:1049`\n\n## 源码阅读路径\n\n1. 先看 `BasePromptTemplate` 继承关系：`base.py:40`。\n2. 看 `input_variables`、`optional_variables`、`partial_variables`：`base.py:45`、`base.py:50`、`base.py:66`。\n3. 看变量名校验，尤其是不能使用内部保留的 `stop`：`base.py:79`。\n4. 看 `_validate_input`：`base.py:160`，理解非 dict 输入和缺变量报错。\n5. 看 `invoke`：`base.py:207`，理解 prompt 如何接入 config、metadata、tags 和 tracing。\n6. 看 `PromptTemplate.from_template`：`prompt.py:298`，理解变量推断。\n7. 看 `ChatPromptTemplate` 示例和 `validate_input_variables`：`chat.py:790`、`chat.py:1049`。\n\n## 核心实体和关系\n\n- `BasePromptTemplate`：所有 prompt 模板的基类。\n- `PromptTemplate`：字符串 prompt 模板。\n- `ChatPromptTemplate`：chat message prompt 模板。\n- `PromptValue`：prompt format 后的值，可进一步转为 string 或 messages。\n- `BasePromptTemplate -> Runnable`：prompt 可作为 pipeline 的一步。\n- `PromptTemplate.from_template -> get_template_variables`：从模板中推断输入变量。\n\n## 关键 claims 与 evidence\n\n- `claim-prompt-template-is-runnable-step`：Prompt template 是可校验、可 partial binding、可作为 Runnable pipeline 步骤调用的对象。证据：`ev-base-prompt-template`、`ev-prompt-template-invoke`、`ev-chat-prompt-template`。\n- `BasePromptTemplate` 继承 `RunnableSerializable[dict, PromptValue]`。证据：`prompts/base.py:40`。\n- `_validate_input` 会检查缺失变量并提供转义提示。证据：`prompts/base.py:160` 到 `base.py:193`。\n- `PromptTemplate.from_template` 会调用 `get_template_variables` 推断变量。证据：`prompts/prompt.py:298`。\n- `ChatPromptTemplate` 可以把 system/human/ai message 模板格式化成 `ChatPromptValue`。证据：`prompts/chat.py:790`。\n\n## 相关测试证据\n\n- `ev-test-prompt-from-template`：`tests/unit_tests/prompts/test_prompt.py:21-69` 验证 `PromptTemplate` 可构造，并能从模板推断输入变量。\n- `ev-test-prompt-partial-validation`：`tests/unit_tests/prompts/test_prompt.py:250-305` 验证 partial binding 会减少待输入变量，模板校验能发现缺失或错误变量。\n- `ev-test-chat-prompt-formatting`：`tests/unit_tests/prompts/test_chat.py:86-107` 验证 `ChatPromptTemplate.from_template` 会产生 message prompt template，并支持 partial variables。\n- `ev-test-chat-prompt-invoke`：`tests/unit_tests/prompts/test_chat.py:350-357` 验证 chat prompt invoke 后输出具体 `SystemMessage` / `HumanMessage`。\n\n这些测试把 prompt template 的三个工程价值落实到行为：变量发现、输入校验、message 化输出。\n\n## 真实源码解释\n\n`BasePromptTemplate` 的字段非常工程化。`input_variables` 是调用者必须提供的变量，`optional_variables` 用于可选 placeholder，`input_types` 保存变量类型，`partial_variables` 让模板自带一部分变量。\n\n`validate_variable_names` 禁止变量名叫 `stop`，因为 `stop` 是模型调用内部使用的参数。这个细节说明 prompt template 不只是文本替换，它和模型调用协议有边界约束。\n\n`_validate_input` 做了两个有意思的处理：如果输入不是 dict 且模板只有一个变量，它会自动把这个值包装成 `{var_name: value}`；如果变量缺失，它会明确告诉你缺了什么，并提示如果你想让 `{foo}` 作为字面量出现，需要写成 `{{foo}}`。\n\n`invoke` 不是直接 `format`，而是先 `ensure_config`，合并 metadata 和 tags，再通过 `_call_with_config` 调用 `_format_prompt_with_error_handling`，并把 run type 标记为 `prompt`。这就是 prompt 能进入 Runnable tracing 体系的原因。\n\n`PromptTemplate.from_template` 通过 `get_template_variables` 从模板字符串中推断变量。如果传了 `partial_variables`，它会从 input variables 中去掉已 partial 的变量。\n\n`ChatPromptTemplate` 的示例展示了一个关键差异：它最终输出的是 `ChatPromptValue(messages=[...])`，不是普通字符串。这让 prompt 能自然对接 chat model 的 message schema。\n\n## 设计取舍\n\n收益：\n\n- prompt 输入变量可检查，缺变量早失败。\n- prompt 可以作为 Runnable pipeline 的一环参与组合。\n- metadata 和 tags 能进入 tracing。\n- partial variables 支持复用和分层绑定。\n- chat prompt 能保持 message role，而不是把角色压扁成字符串。\n\n成本：\n\n- prompt template 抽象层比字符串拼接厚。\n- 模板格式有安全边界，尤其是 jinja2。\n- 输入变量推断、partial、optional placeholder 叠加后，初学者可能不容易判断最终需要哪些变量。\n\n## 和 Java 后端经验类比\n\n可以把 prompt template 类比成 `PreparedStatement` 或 typed request builder：\n\n- 模板字符串像 SQL 模板。\n- `input_variables` 像必填参数。\n- `_validate_input` 像参数校验。\n- `partial_variables` 像提前绑定部分参数。\n- `invoke` 像生成一个可追踪的 request object。\n\n但 prompt 比 SQL 更软：变量不只是数据，也会影响模型行为；message role 和输出格式约束也属于 prompt 的一部分。\n\n## 容易误解的点\n\n- 误解 1：PromptTemplate 只是 `str.format` 包装。实际它是 Runnable。\n- 误解 2：prompt 缺变量会到模型调用时才失败。实际在 format 阶段就会失败。\n- 误解 3：ChatPromptTemplate 输出字符串。实际它输出 message prompt value。\n- 误解 4：partial variable 只是语法糖。实际它改变了调用者需要提供的输入集合。\n- 误解 5：prompt 工程只是写文案。实际它是模型输入协议设计。\n\n## 自测题\n\n见 `../quizzes/03-prompt-template.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/03-prompt-template.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/03-mini-prompt-template/README.md`。\n\n## 学完标准\n\n你应该能不看笔记解释：\n\n- 为什么 prompt template 比字符串拼接更可靠。\n- `input_variables`、`optional_variables`、`partial_variables` 的区别。\n- `PromptTemplate.from_template` 如何推断变量。\n- prompt 为什么能放到 `prompt | model` 的左边。\n- ChatPromptTemplate 为什么必须保留 message role。\n\n"},"quiz":{"label":"测试","path":"quizzes/03-prompt-template.quiz.md","markdown":"# 03 Prompt Template Quiz\n\n## 概念题\n\n1. Prompt template 解决了字符串拼接的哪些工程问题？\n2. `input_variables`、`optional_variables`、`partial_variables` 有什么区别？\n3. 为什么 PromptTemplate 可以作为 Runnable pipeline 的一步？\n4. ChatPromptTemplate 和 PromptTemplate 的输出有什么根本差异？\n5. 为什么 prompt 变量名不能随便使用内部保留词，例如 `stop`？\n\n## 源码题\n\n1. 找到 `BasePromptTemplate` 的继承关系，说明它为什么能 `invoke`。\n2. 找到 `_validate_input`，说明单变量 prompt 传入非 dict 时会发生什么。\n3. 找到缺变量时的错误提示，解释为什么它会提醒你用双大括号转义。\n4. 找到 `PromptTemplate.from_template`，说明 `get_template_variables` 的作用。\n5. 找到 `ChatPromptTemplate.validate_input_variables`，说明它如何从 messages 中推断变量。\n\n## 设计题\n\n1. 如果你实现一个 Java PromptTemplate，会在构造时解析变量，还是在 invoke 时解析变量？\n2. partial variables 应该允许覆盖吗？如果允许，会带来什么风险？\n3. PromptTemplate 应该只输出 string，还是应该抽象出 PromptValue？为什么？\n\n## 故障诊断题\n\n1. 模板里想出现字面量 `{name}`，却被当成变量。你如何修复？\n2. `prompt | model` 运行时报缺变量，应该优先检查哪些地方？\n3. ChatPromptTemplate 输出和模型期望不匹配，你会检查 message roles 还是字符串内容？为什么？\n\n## 迁移题\n\n1. 把一个后端接口参数校验经验迁移到 prompt template 设计上，你会保留哪些机制？\n2. 设计一个可以复用 system prompt、动态用户输入、历史消息的最小 ChatPromptTemplate。\n\n"},"mastery":{"label":"掌握度","path":"mastery/03-prompt-template.mastery.md","markdown":"# 03 Prompt Template Mastery\n\n## Level 1: 复述\n\n不用看 lesson，用 150-250 字解释 PromptTemplate 为什么是工程对象，而不是字符串工具函数。\n\n完成标准：\n\n- 说到变量校验。\n- 说到 Runnable。\n- 说到 ChatPromptTemplate 保留 message role。\n\n## Level 2: 源码定位\n\n定位并记录文件和行号：\n\n- `BasePromptTemplate`\n- `input_variables`\n- `partial_variables`\n- `_validate_input`\n- `invoke`\n- `PromptTemplate.from_template`\n- `ChatPromptTemplate`\n- `validate_input_variables`\n\n## Level 3: 调用链追踪\n\n追踪：\n\n```python\nprompt = PromptTemplate.from_template(\"Tell me about {topic}\")\nprompt.invoke({\"topic\": \"Runnable\"})\n```\n\n要求说明：\n\n1. 变量如何被推断。\n2. 输入如何被校验。\n3. `invoke` 如何进入 `_call_with_config`。\n\n## Level 4: 图谱重建\n\n画出：\n\n```text\nPromptTemplate -> PromptValue -> ChatModel\nChatPromptTemplate -> ChatPromptValue(messages) -> ChatModel\n```\n\n## Level 5: 故障诊断\n\n给出排查步骤：\n\n- prompt 缺变量。\n- 想输出 `{foo}` 字面量却被当成变量。\n- ChatPromptTemplate message role 顺序错误。\n\n## Level 6: 微改造\n\n在 `labs/03-mini-prompt-template` 中增加：\n\n- `partial(**kwargs)`\n- 单变量非 dict 输入支持\n- 缺变量错误提示\n- chat message template\n\n说明你的实现与 LangChain 的差距。\n\n"},"lab":{"label":"实验","path":"labs/03-mini-prompt-template/README.md","markdown":"# Lab 03: Mini Prompt Template\n\n目标：实现一个最小 prompt template，验证变量推断、输入校验、partial binding 和 Runnable 化调用。\n\n## 必做功能\n\n- `MiniPromptTemplate.from_template(template, partial_variables=None)`\n- 自动从 `{name}` 推断 `input_variables`。\n- `invoke(input)` 返回 formatted string。\n- 单变量模板允许直接传非 dict 输入。\n- 缺变量时报清晰错误。\n- 支持 `partial(**kwargs)` 返回新模板。\n\n## 验收用例\n\n```python\nprompt = MiniPromptTemplate.from_template(\"Tell me about {topic}\")\nassert prompt.input_variables == [\"topic\"]\nassert prompt.invoke({\"topic\": \"Runnable\"}) == \"Tell me about Runnable\"\nassert prompt.invoke(\"Agent\") == \"Tell me about Agent\"\n\nprompt2 = MiniPromptTemplate.from_template(\n    \"You are {role}. Answer {question}\",\n).partial(role=\"teacher\")\nassert prompt2.input_variables == [\"question\"]\nassert prompt2.invoke({\"question\": \"What is tool calling?\"})\n```\n\n## 加分功能\n\n- 支持 `{{literal}}` 转义。\n- 支持 `ChatPromptTemplate([(\"system\", \"...\"), (\"human\", \"...\")])`。\n- 输出 `PromptValue`，提供 `to_string()` 和 `to_messages()`。\n- 支持 `metadata` 和 `tags`。\n\n## 复盘问题\n\n1. 变量推断应该发生在构造期还是调用期？\n2. partial variable 是否允许被调用入参覆盖？\n3. ChatPromptTemplate 为什么不能简单拼成一个字符串？\n\n"}}},{"id":"04-chat-model-adapter","title":"ChatModel Adapter","status":"complete-course","depends_on":["01-runnable","02-message-schema"],"sections":{"lesson":{"label":"课程","path":"lessons/04-chat-model-adapter.md","markdown":"# 04 ChatModel Adapter\n\n## 你会学到什么\n\n- ChatModel adapter 为什么是 LLM 应用框架最重要的边界之一。\n- `BaseChatModel` 如何统一 `invoke`、`stream`、`batch`、`bind_tools` 等接口。\n- `invoke` 如何把输入转换为 message，再调用底层生成逻辑。\n- `stream` 为什么可能 fallback 到 `invoke`。\n- provider 子类为什么要实现 `_generate`，并可选实现 `_stream` 和 `bind_tools`。\n\n## AI 概念从零解释\n\n不同模型服务的 API 并不统一。即使都叫 chat model，它们也可能在这些方面不同：\n\n- 输入消息格式不同。\n- 输出消息结构不同。\n- streaming chunk 格式不同。\n- tool call 字段不同。\n- token usage 字段不同。\n- 错误码和重试语义不同。\n- 是否支持 structured output 不同。\n\n上层 Agent 不应该直接依赖某一家 provider 的 API。ChatModel adapter 的作用就是把“具体模型服务”包装成统一的模型接口。\n\n## 为什么工程上需要这个抽象\n\n如果没有 ChatModel adapter，Agent loop 会被 provider 细节污染：\n\n```text\nif provider == \"openai\":\n  parse choices[0].message.tool_calls\nelif provider == \"anthropic\":\n  parse content blocks\nelif provider == \"xxx\":\n  parse another shape\n```\n\n这会让工具调用、streaming、tracing、重试、结构化输出都变成分散的条件分支。`BaseChatModel` 把这些差异收敛到统一协议，上层只面向 `AIMessage` 和 Runnable。\n\n## 最小心智模型\n\n```python\nclass MiniChatModel:\n    def invoke(self, input, config=None):\n        messages = self.convert_input(input)\n        result = self._generate(messages)\n        return result.message\n\n    def stream(self, input, config=None):\n        if not self.supports_stream:\n            yield self.invoke(input, config)\n            return\n        for chunk in self._stream(self.convert_input(input)):\n            yield chunk\n\n    def _generate(self, messages):\n        raise NotImplementedError\n```\n\n核心思想是：base class 负责统一协议和公共流程，provider subclass 负责真正调用厂商 API。\n\n## LangChain 源码入口\n\n- repo: `langchain-ai/langchain`\n- commit: `bc5f1517cf7ac27addd4286e388228b8172b93b9`\n- base model: `libs/core/langchain_core/language_models/chat_models.py:270`\n- imperative methods table: `chat_models.py:273`\n- declarative methods table: `chat_models.py:290`\n- invoke: `chat_models.py:461`\n- stream: `chat_models.py:713`\n- `_generate`: `chat_models.py:2181`\n- `_stream`: `chat_models.py:2227`\n- `bind_tools`: `chat_models.py:2325`\n\n## 源码阅读路径\n\n1. 先看 `BaseChatModel` docstring 中的 imperative methods 表：`chat_models.py:273`。\n2. 再看 declarative methods 表：`chat_models.py:290`，尤其是 `bind_tools`、`with_structured_output`、`with_retry`。\n3. 看 `_convert_input` 附近逻辑，理解 str、messages、PromptValue 如何变成统一输入。\n4. 看 `invoke`：`chat_models.py:461`，理解它如何调用 `generate_prompt` 并取第一条 message。\n5. 看 `stream`：`chat_models.py:713`，理解不支持 streaming 时如何 fallback。\n6. 看 `_generate`：`chat_models.py:2181`，这是 provider 必须实现的核心方法。\n7. 看 `_stream` 和 `bind_tools`：理解 provider 能力如何挂到统一抽象上。\n\n## 核心实体和关系\n\n- `BaseChatModel`：chat model 统一抽象。\n- `AIMessage`：`invoke` 的标准输出。\n- `ChatGeneration` / `ChatResult`：provider 生成结果的中间结构。\n- `_generate`：provider 子类必须实现的同步生成方法。\n- `_stream`：provider 子类可实现的流式生成方法。\n- `bind_tools`：把工具 schema 绑定到模型调用上的能力。\n- `BaseChatModel -> Runnable`：ChatModel 也参与 Runnable pipeline。\n\n## 关键 claims 与 evidence\n\n- `claim-chat-model-adapter-normalizes-providers`：BaseChatModel 把不同 provider 调用统一到 `invoke`、`stream`、`batch`、`bind_tools` 等接口上。证据：`ev-base-chat-model`、`ev-base-chat-model-invoke`、`ev-base-chat-model-stream`。\n- `BaseChatModel` 文档列出 `invoke`、`stream`、`batch` 等 imperative methods。证据：`chat_models.py:273` 到 `chat_models.py:288`。\n- `invoke` 通过 `_convert_input` 和 `generate_prompt` 返回 `AIMessage`。证据：`chat_models.py:461` 到 `chat_models.py:485`。\n- `stream` 在模型不支持流式时会 yield `invoke` 的结果。证据：`chat_models.py:721` 到 `chat_models.py:726`。\n- `_generate` 是抽象方法，provider 实现真正请求。证据：`chat_models.py:2181`。\n- `bind_tools` 在 base 层声明把工具绑定到模型。证据：`chat_models.py:2325`。\n\n## 相关测试证据\n\n- `ev-test-chat-model-batch-tracing`：`tests/unit_tests/language_models/chat_models/test_base.py:111-132` 验证 chat model 的 batch、invoke、stream 都能进入统一 tracing，并记录 batch_size。\n- `ev-test-chat-model-stream-fallback`：`tests/unit_tests/language_models/chat_models/test_base.py:197-220` 验证只实现 `_generate` 的模型也能通过 `stream` fallback 工作。\n- `ev-test-fake-chat-model-modes`：`tests/unit_tests/fake/test_fake_chat_model.py:26-72` 验证 fake chat model 在 invoke、ainvoke、stream、astream 下保持一致接口。\n\n这些测试说明 adapter 层的核心不是“调用某个 API”，而是把不同执行形态压进一个稳定契约。\n\n## 真实源码解释\n\n`BaseChatModel` 的 docstring 很像一份接口契约表。它把方法分成两类：imperative methods 是实际调用模型的方法，declarative methods 是创建新 Runnable wrapper 的方法。\n\n`invoke` 的流程可以压缩成：\n\n```text\ninput -> _convert_input -> generate_prompt -> generations[0][0].message\n```\n\n这说明 `invoke` 对上层隐藏了 batch prompt generation、generation wrapper 和 provider 返回结构，最终只给调用者一个标准 `AIMessage`。\n\n`stream` 的第一段判断非常重要：如果 `_should_stream` 返回 false，它不会报错，而是 yield 一次 `invoke` 结果。这和 Runnable 的默认 `stream` 类似，提醒你“调用 stream API”不等于“底层真的 token 流式输出”。\n\n真正的 provider 工作在 `_generate` 里发生。`BaseChatModel._generate` 是抽象方法，签名接收 `list[BaseMessage]`、`stop`、`run_manager` 和 provider kwargs，返回 `ChatResult`。这就是 OpenAI、Anthropic、Google 等 adapter 需要实现的地方。\n\n`bind_tools` 的存在说明 tool calling 是模型 adapter 的一部分。工具 schema 由 Tool 定义，但如何把 schema 变成 provider 支持的格式，是模型 provider adapter 的职责。\n\n## 设计取舍\n\n收益：\n\n- 上层 Agent 只依赖统一 ChatModel。\n- provider 差异集中在 adapter 子类。\n- Runnable 能力让模型自然参与 `prompt | model | parser`。\n- callbacks、tags、metadata、run_id 能在模型调用中传递。\n- streaming 和 tool binding 有统一入口。\n\n成本：\n\n- base class 很厚，阅读时要区分公共流程和 provider 实现。\n- streaming fallback 容易让人误以为所有模型都支持真正流式。\n- tool calling 能力横跨 Tool、Message、Provider 三层，调试时需要跨文件追踪。\n- `generate_prompt`、`ChatGeneration`、`ChatResult` 这些中间层会增加理解门槛。\n\n## 和 Java 后端经验类比\n\n可以把 `BaseChatModel` 类比成支付网关或短信网关接口：\n\n- `invoke` 类似 `send(request)`。\n- `_generate` 类似具体厂商 SDK 调用。\n- `stream` 类似可选的 SSE/Reactive 能力。\n- `bind_tools` 类似把业务 command schema 转成厂商 API schema。\n- callbacks 类似 tracing interceptor。\n\n但 LLM provider adapter 更复杂，因为输出不是简单响应体，还可能包含 tool calls、token usage、stream chunks 和结构化输出。\n\n## 容易误解的点\n\n- 误解 1：ChatModel 就是 OpenAI client。实际它是跨 provider 抽象。\n- 误解 2：`invoke` 直接返回 provider 原始 JSON。实际返回标准化 `AIMessage`。\n- 误解 3：调用 `stream` 就一定是真 streaming。实际可能 fallback 到 `invoke`。\n- 误解 4：Tool 绑定只属于 Tool 层。实际 provider adapter 必须把工具转成模型 API 支持的格式。\n- 误解 5：`_generate` 是给业务代码调用的。实际它是子类实现点，上层通常调 `invoke`。\n\n## 自测题\n\n见 `../quizzes/04-chat-model-adapter.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/04-chat-model-adapter.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/04-mini-chat-model-adapter/README.md`。\n\n## 学完标准\n\n你应该能不看笔记解释：\n\n- 为什么 Agent 不应该直接依赖 provider SDK。\n- `invoke` 如何把输入转换为 `AIMessage`。\n- `stream` fallback 的语义是什么。\n- provider 子类为什么必须实现 `_generate`。\n- `bind_tools` 为什么属于 ChatModel adapter 的边界。\n\n"},"quiz":{"label":"测试","path":"quizzes/04-chat-model-adapter.quiz.md","markdown":"# 04 ChatModel Adapter Quiz\n\n## 概念题\n\n1. 为什么 Agent 不应该直接依赖某个 provider SDK？\n2. `BaseChatModel` 的 imperative methods 和 declarative methods 有什么区别？\n3. `invoke`、`stream`、`batch` 在 ChatModel 层分别表达什么？\n4. 为什么 `stream` 可能 fallback 到 `invoke`？\n5. `bind_tools` 为什么属于 ChatModel adapter，而不只是 Tool 层？\n\n## 源码题\n\n1. 找到 `BaseChatModel` 文档表，列出 4 个 imperative methods。\n2. 找到 `BaseChatModel.invoke`，写出从 input 到 `AIMessage` 的关键调用链。\n3. 找到 `BaseChatModel.stream` 的 fallback 分支，解释这个分支的意义。\n4. 找到 `_generate` 抽象方法，说明 provider 子类必须实现什么。\n5. 找到 `bind_tools` 的 base 签名，解释它的输入和输出。\n\n## 设计题\n\n1. 如果你设计 ChatModel adapter，会把 streaming 放在同一个接口还是拆成 StreamableChatModel？\n2. provider 原始响应是否应该暴露给上层 Agent？为什么？\n3. 你会如何设计 model adapter 的错误和重试边界？\n\n## 故障诊断题\n\n1. 上层调用 `stream` 但没有逐 chunk 输出，可能原因是什么？\n2. 工具绑定后模型仍不调用工具，你会从 ChatModel adapter 哪些位置排查？\n3. 某 provider 返回 token usage 字段不同，你会在哪里做归一化？\n\n## 迁移题\n\n1. 用 Java 设计一个 `ChatModel` 接口和一个 `OpenAIChatModelAdapter`。\n2. 设计一个 mock chat model，用于测试 Agent loop，而不调用真实模型。\n\n"},"mastery":{"label":"掌握度","path":"mastery/04-chat-model-adapter.mastery.md","markdown":"# 04 ChatModel Adapter Mastery\n\n## Level 1: 复述\n\n不用看 lesson，用 150-250 字解释 ChatModel Adapter 为什么能保护上层 Agent 不被 provider API 污染。\n\n完成标准：\n\n- 说到 provider 差异。\n- 说到标准 `AIMessage`。\n- 说到 `_generate` / `_stream`。\n\n## Level 2: 源码定位\n\n定位并记录文件和行号：\n\n- `BaseChatModel`\n- imperative methods 表\n- `invoke`\n- `stream`\n- `_generate`\n- `_stream`\n- `bind_tools`\n\n## Level 3: 调用链追踪\n\n追踪：\n\n```python\nmodel.invoke([HumanMessage(content=\"hi\")])\n```\n\n要求说明：\n\n1. input 如何转换。\n2. `generate_prompt` 处在什么层。\n3. 为什么最终返回 `AIMessage`。\n\n## Level 4: Streaming 判断\n\n解释两种情况：\n\n- provider 没有实现 streaming，`stream` 怎么办。\n- provider 实现了 `_stream`，callbacks 如何看到 chunk。\n\n## Level 5: 故障诊断\n\n给出排查步骤：\n\n- `stream` 没有逐 chunk 输出。\n- model 绑定 tools 后 provider 报 schema 错误。\n- token usage 没有进入标准字段。\n\n## Level 6: 微改造\n\n在 `labs/04-mini-chat-model-adapter` 中增加：\n\n- mock provider\n- `_generate`\n- `_stream`\n- `bind_tools`\n- callback hook\n\n要求测试不调用真实 provider。\n\n"},"lab":{"label":"实验","path":"labs/04-mini-chat-model-adapter/README.md","markdown":"# Lab 04: Mini Chat Model Adapter\n\n目标：实现一个 mock chat model adapter，验证 `invoke`、`stream`、`_generate`、`_stream`、`bind_tools` 的边界。\n\n## 必做功能\n\n- `BaseMiniChatModel.invoke(input, config=None)`\n- `BaseMiniChatModel.stream(input, config=None)`\n- `_generate(messages)` 抽象方法。\n- `_stream(messages)` 可选方法。\n- 输入支持 string、message list。\n- 输出统一为 `AIMessage`。\n- `bind_tools(tools)` 返回绑定 tools 的新模型或 wrapper。\n\n## 验收用例\n\n```python\nmodel = EchoChatModel()\nassert model.invoke(\"hi\").type == \"ai\"\nassert model.invoke([HumanMessage(\"hi\")]).content == \"hi\"\n\nstream_model = StreamingEchoChatModel()\nassert [c.content for c in stream_model.stream(\"abc\")] == [\"a\", \"b\", \"c\"]\n\nfallback_model = EchoChatModel()\nassert [m.content for m in fallback_model.stream(\"abc\")] == [\"abc\"]\n```\n\n## 加分功能\n\n- 支持 callback：`on_chat_model_start`、`on_llm_new_token`、`on_chat_model_end`。\n- 支持 `usage_metadata`。\n- `bind_tools` 后 mock model 可以返回 `AIMessage(tool_calls=[...])`。\n- 支持 provider 原始响应保存在 `response_metadata`。\n\n## 复盘问题\n\n1. 为什么 `_generate` 是子类实现点，而不是上层调用点？\n2. fallback stream 对调用者有什么风险？\n3. tool binding 应该改变模型本身，还是返回 wrapper？\n\n"}}},{"id":"05-tool-interface","title":"Tool Interface","status":"complete-course","depends_on":["01-runnable","02-message-schema"],"sections":{"lesson":{"label":"课程","path":"lessons/05-tool-interface.md","markdown":"# 05 Tool Interface\n\n## 你会学到什么\n\n- tool calling / function calling 的真实工程含义。\n- `BaseTool` 如何定义 `name`、`description`、`args_schema`、`response_format`。\n- 为什么 Tool 也是 Runnable。\n- `tool_call_schema` 如何把程序函数暴露为模型可理解的 schema。\n- `AIMessage.tool_calls -> BaseTool.invoke -> BaseTool.run -> ToolMessage` 的闭环。\n\n## AI 概念从零解释\n\n模型并不会真的直接执行你的 Python 函数。所谓 tool calling，本质是模型输出一个结构化意图：\n\n```json\n{\n  \"name\": \"search_code\",\n  \"arguments\": {\n    \"query\": \"RunnableSequence\"\n  }\n}\n```\n\n框架读取这个意图，找到对应工具，校验参数，执行真实函数，再把结果作为消息回填给模型。模型下一轮看到工具结果后，才能继续推理或给出最终回答。\n\n所以 Tool Interface 不是“给人点的按钮”，而是“给模型选择动作的能力描述 + 给程序执行的 handler”。\n\n## 为什么工程上需要这个抽象\n\n一个可靠工具系统至少要解决：\n\n- 模型如何知道有什么工具。\n- 模型如何知道每个工具何时使用。\n- 模型如何知道参数 schema。\n- 框架如何校验模型给的参数。\n- 工具如何执行。\n- 工具出错如何处理。\n- 工具结果如何回填给模型。\n- tracing 如何记录工具生命周期。\n\nLangChain 的 `BaseTool` 把这些问题收敛到一个统一抽象里。\n\n## 最小心智模型\n\n```python\nclass MiniTool:\n    name = \"search_code\"\n    description = \"Search source code by keyword.\"\n    args_schema = {\"query\": \"string\"}\n\n    @property\n    def tool_call_schema(self):\n        return {\n            \"name\": self.name,\n            \"description\": self.description,\n            \"parameters\": self.args_schema,\n        }\n\n    def invoke(self, tool_call):\n        args = validate(tool_call[\"arguments\"], self.args_schema)\n        return self.run(**args)\n\n    def run(self, query):\n        return search(query)\n```\n\n真实 LangChain 还要处理 Pydantic schema、JSON schema、injected args、callback manager、tool errors、validation errors、artifact 等。\n\n## LangChain 源码入口\n\n- repo: `langchain-ai/langchain`\n- commit: `bc5f1517cf7ac27addd4286e388228b8172b93b9`\n- base tool: `libs/core/langchain_core/tools/base.py:405`\n- `name` / `description`: `base.py:446`、`base.py:449`\n- `args_schema`: `base.py:455`\n- `response_format`: `base.py:507`\n- `tool_call_schema`: `base.py:587`\n- `invoke`: `base.py:635`\n- `run`: `base.py:878`\n- structured tool: `libs/core/langchain_core/tools/structured.py:40`\n- `StructuredTool.from_function`: `structured.py:203`\n\n## 源码阅读路径\n\n1. 先看 `BaseTool` 继承关系：`base.py:405`，确认 Tool 是 `RunnableSerializable`。\n2. 看 `name` 和 `description`：`base.py:446`、`base.py:449`。\n3. 看 `args_schema` 支持 Pydantic model 或 JSON schema：`base.py:455`。\n4. 看 `response_format`：`base.py:507`，理解 content 和 artifact 的差异。\n5. 看 `tool_call_schema`：`base.py:587`，理解为什么要排除 injected args。\n6. 看 `invoke`：`base.py:635`，理解 Runnable 输入如何进入 tool run。\n7. 看 `run`：`base.py:878`，理解 callback manager 如何包住工具执行。\n8. 看 `StructuredTool.from_function`：`structured.py:203`，理解函数如何变成带 schema 的工具。\n\n## 核心实体和关系\n\n- `BaseTool`：所有工具的抽象基类。\n- `StructuredTool`：可以从函数推断 schema 的工具实现。\n- `ToolCall`：模型输出的工具调用意图。\n- `ToolMessage`：工具执行后的结果消息。\n- `args_schema`：参数校验和工具 schema 的来源。\n- `tool_call_schema`：暴露给模型的工具调用 schema。\n- `BaseTool.invoke -> BaseTool.run`：Runnable 调用进入真实工具执行。\n\n## 关键 claims 与 evidence\n\n- `claim-tool-interface-separates-intent-and-execution`：LangChain 的工具接口把模型生成的调用意图、参数 schema、函数执行和结果回填分开处理。证据：`ev-base-tool`、`ev-base-tool-invoke`、`ev-base-tool-run`、`ev-tool-message-tool-call-id`。\n- `BaseTool` 继承 `RunnableSerializable[str | dict | ToolCall, Any]`。证据：`tools/base.py:405`。\n- `description` 明确用于告诉模型 how/when/why 使用工具。证据：`tools/base.py:449`。\n- `args_schema` 支持 Pydantic model 或 JSON schema。证据：`tools/base.py:455` 到 `base.py:465`。\n- `tool_call_schema` 会排除 injected arguments，只暴露模型应该生成的字段。证据：`tools/base.py:587` 到 `base.py:609`。\n- `run` 会配置 callback manager 并触发 `on_tool_start`。证据：`tools/base.py:916` 到 `base.py:949`。\n\n## 相关测试证据\n\n- `ev-test-tool-structured-args`：`tests/unit_tests/test_tools.py:148-158` 验证结构化工具可以接收 dict 参数并执行。\n- `ev-test-structured-tool-schema`：`tests/unit_tests/test_tools.py:478-485` 验证 `StructuredTool.from_function` 能从函数签名推断参数 schema。\n- `ev-test-tool-call-to-tool-message`：`tests/unit_tests/test_tools.py:1480-1507` 验证模型样式的 `ToolCall` 输入会返回 `ToolMessage`，并保留 `tool_call_id`。\n- `ev-test-tool-schema-dict`：`tests/unit_tests/test_tools.py:2653-2673` 验证 dict 形式 `args_schema` 也可以作为 tool call schema 暴露。\n\n这些测试覆盖了 tool calling 闭环的四段：schema 暴露、参数校验、函数执行、结果消息化。\n\n## 真实源码解释\n\n`BaseTool` 的 docstring 说 tools 是 agents 可以调用以执行特定动作的组件。它不是一个简单 function wrapper，而是同时包含模型可读说明、参数 schema、运行配置和 callback 生命周期的对象。\n\n`name` 是工具唯一名称，模型会在 tool call 里引用它。`description` 的注释明确说它用于告诉模型如何、何时、为什么使用工具，甚至可以放 few-shot 示例。这意味着 description 的质量会直接影响模型是否正确选工具。\n\n`args_schema` 可以是 Pydantic model，也可以是 JSON schema dict。这一层很关键：模型输出的参数不是可信输入，框架必须先校验再执行。\n\n`tool_call_schema` 会根据 `args_schema` 生成给语言模型使用的 schema，并排除 injected 参数。所谓 injected 参数，是框架运行时注入的上下文，不应该让模型自己生成。\n\n`invoke` 是 Runnable 入口，它通过 `_prep_run_args` 解析 `str | dict | ToolCall` 输入，然后调用 `run`。`run` 会配置 `CallbackManager`，构造过滤后的 input，再触发 `on_tool_start`。这说明工具执行天然接入 tracing。\n\n`StructuredTool.from_function` 展示了常见用法：从普通函数生成工具，必要时从函数签名和 docstring 推断 schema 和 description。\n\n## 设计取舍\n\n收益：\n\n- 工具定义同时服务模型选择和程序执行。\n- 参数 schema 让模型输出可校验。\n- Tool 继承 Runnable，能进入统一执行、callback 和 tracing 体系。\n- `tool_call_schema` 隐藏 injected args，避免模型生成不该生成的字段。\n- `response_format` 支持只给模型 content，同时保留 artifact 给程序使用。\n\n成本：\n\n- description 质量影响模型行为，这不是传统后端接口常见问题。\n- Tool schema、provider tool schema、AIMessage tool_calls 三者容易混淆。\n- tool error 和 validation error 处理会影响 Agent loop 是否继续。\n- Tool 是 Runnable，但它的输入类型比普通 Runnable 更复杂。\n\n## 和 Java 后端经验类比\n\n可以把 Tool 类比成：\n\n- `Command`：模型产生调用意图。\n- `DTO schema`：`args_schema` 校验参数。\n- `Handler`：`run` 执行业务逻辑。\n- `OpenAPI schema`：`tool_call_schema` 告诉外部调用者怎么传参。\n- `Interceptor`：callback manager 观测执行过程。\n\n差异在于，这个“外部调用者”不是人或另一个服务，而是一个会根据自然语言 description 做选择的模型。\n\n## 容易误解的点\n\n- 误解 1：Tool 就是函数。实际它是函数 + schema + description + tracing + error policy。\n- 误解 2：模型直接执行工具。实际模型只输出调用意图。\n- 误解 3：description 是给开发者看的注释。实际它是模型选择工具的重要输入。\n- 误解 4：args_schema 只是文档。实际它参与参数校验和 provider schema 转换。\n- 误解 5：工具结果直接返回给用户。Agent 场景下通常要先回填给模型，再由模型决定下一步。\n\n## 自测题\n\n见 `../quizzes/05-tool-interface.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/05-tool-interface.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/05-mini-tool-calling/README.md`。\n\n## 学完标准\n\n你应该能不看笔记解释：\n\n- tool calling 为什么是“模型意图 + 框架执行”。\n- `name`、`description`、`args_schema` 分别影响什么。\n- `tool_call_schema` 为什么要排除 injected args。\n- `BaseTool.invoke` 和 `BaseTool.run` 如何衔接。\n- 工具结果如何通过 `ToolMessage` 回到 Agent loop。\n\n"},"quiz":{"label":"测试","path":"quizzes/05-tool-interface.quiz.md","markdown":"# 05 Tool Interface Quiz\n\n## 概念题\n\n1. 为什么说模型不会直接执行工具，只会生成工具调用意图？\n2. `name`、`description`、`args_schema` 对模型和框架分别有什么作用？\n3. `tool_call_schema` 和 `args_schema` 有什么关系？\n4. Tool 为什么也继承 Runnable？\n5. `response_format=\"content_and_artifact\"` 解决什么问题？\n\n## 源码题\n\n1. 找到 `BaseTool` 继承关系，说明它的输入类型为什么包含 `ToolCall`。\n2. 找到 `description` 的注释，解释它为什么会影响模型选择工具。\n3. 找到 `args_schema` 支持的类型。\n4. 找到 `tool_call_schema` 排除 injected args 的逻辑。\n5. 找到 `invoke` 和 `run`，写出从 Runnable 输入到真实工具执行的调用链。\n6. 找到 `StructuredTool.from_function` 的 schema 推断逻辑。\n\n## 设计题\n\n1. Tool description 应该写得像 API 文档，还是像模型决策说明？为什么？\n2. 参数校验失败时，应该让 Agent 停止、让模型重试，还是返回错误观察？\n3. 哪些参数不应该暴露给模型，而应该作为 injected args？\n\n## 故障诊断题\n\n1. 模型总是选错工具，你会先看 name、description 还是 args_schema？\n2. 模型参数格式不对，你会检查 provider tool schema 还是 BaseTool args schema？\n3. 工具执行成功但模型不知道结果，你会检查 ToolMessage 哪些字段？\n\n## 迁移题\n\n1. 用 Java 设计 `Tool\u003cTInput, TOutput>`、schema 和 handler 的关系。\n2. 设计一个 `search_code` 工具，写出 name、description、args_schema 和返回格式。\n\n"},"mastery":{"label":"掌握度","path":"mastery/05-tool-interface.mastery.md","markdown":"# 05 Tool Interface Mastery\n\n## Level 1: 复述\n\n不用看 lesson，用 150-250 字解释 tool calling 为什么不是模型直接执行函数。\n\n完成标准：\n\n- 说到模型生成调用意图。\n- 说到 schema 校验。\n- 说到工具结果回填。\n\n## Level 2: 源码定位\n\n定位并记录文件和行号：\n\n- `BaseTool`\n- `name`\n- `description`\n- `args_schema`\n- `response_format`\n- `tool_call_schema`\n- `invoke`\n- `run`\n- `StructuredTool.from_function`\n\n## Level 3: 闭环重建\n\n手写：\n\n```text\nAIMessage.tool_calls -> BaseTool.invoke -> BaseTool.run -> ToolMessage\n```\n\n要求说明每一步的输入输出。\n\n## Level 4: Schema 判断\n\n给一个工具函数，写出：\n\n- 模型看到的 tool schema。\n- 程序执行时需要的真实参数。\n- 哪些字段不该让模型生成。\n\n## Level 5: 故障诊断\n\n给出排查步骤：\n\n- 模型选错工具。\n- 模型传错参数。\n- 工具执行成功但模型没用上结果。\n\n## Level 6: 微改造\n\n在 `labs/05-mini-tool-calling` 中增加：\n\n- Pydantic-like 参数校验\n- tool registry\n- unknown tool error\n- validation error observation\n- artifact 字段\n\n说明哪些错误应该返回给模型，哪些应该终止执行。\n\n"},"lab":{"label":"实验","path":"labs/05-mini-tool-calling/README.md","markdown":"# Lab 05: Mini Tool Calling\n\n目标：实现最小工具系统，验证模型调用意图、工具 schema、参数校验、执行和结果回填的完整闭环。\n\n## 必做功能\n\n- `MiniTool(name, description, args_schema, func)`\n- `tool_call_schema`。\n- `invoke(tool_call)`。\n- 参数校验。\n- `ToolRegistry`。\n- `ToolMessage(content, tool_call_id)` 回填。\n\n## 验收用例\n\n```python\nsearch = MiniTool(\n    name=\"search_code\",\n    description=\"Search source code by keyword.\",\n    args_schema={\"query\": str},\n    func=lambda query: f\"found {query}\",\n)\n\ncall = {\"id\": \"call_1\", \"name\": \"search_code\", \"args\": {\"query\": \"Runnable\"}}\nresult = search.invoke(call)\nmessage = ToolMessage(content=result, tool_call_id=call[\"id\"])\n\nassert \"Runnable\" in message.content\nassert message.tool_call_id == \"call_1\"\n```\n\n## 加分功能\n\n- 支持 unknown tool observation。\n- 支持 validation error observation。\n- 支持 `response_format=\"content_and_artifact\"`。\n- 支持 injected args，不暴露给模型。\n- 支持 callback：`on_tool_start`、`on_tool_end`、`on_tool_error`。\n\n## 复盘问题\n\n1. Tool description 应该如何写，模型才更容易正确选择？\n2. 参数校验失败时，应该让模型修正还是直接失败？\n3. tool schema 和 provider tool schema 有什么区别？\n\n"}}},{"id":"06-callback-tracing","title":"Callback / Tracing","status":"complete-course","depends_on":["01-runnable"],"sections":{"lesson":{"label":"课程","path":"lessons/06-callback-tracing.md","markdown":"# 06 Callback / Tracing\n\n## 你会学到什么\n\n- 为什么复杂 LLM 应用必须有 tracing。\n- `BaseCallbackHandler` 和 `CallbackManager` 如何分工。\n- `RunnableConfig.callbacks` 如何把 callback 系统挂进运行链路。\n- `get_child(tag)` 如何形成父子 run 层级。\n- 为什么 `RunnableSequence`、ChatModel、Tool 都要发运行生命周期事件。\n\n## AI 概念从零解释\n\nAgent 出错时，最终答案往往不是最有用的信息。你真正想知道的是：\n\n```text\n这次用了哪个 prompt？\n模型返回了什么 tool call？\n工具输入是什么？\n工具返回了什么？\n哪一步耗时最长？\n哪一步抛错？\n模型用了多少 token？\n```\n\nCallback / tracing 就是记录这些运行过程。它类似后端分布式 tracing，但对象从 HTTP service/span 变成了 prompt、model、tool、chain、retriever、agent step。\n\n## 为什么工程上需要这个抽象\n\n没有 tracing 的 Agent 很难调试：\n\n- 模型最终回答错了，但不知道 prompt 有没有错。\n- 工具没被调用，但不知道是 schema 不好还是模型没选择。\n- 调用了错误工具，但不知道模型看到了什么 description。\n- streaming 中途失败，但不知道哪一个 chunk 前后出错。\n- 多步 chain 失败，但不知道是哪一步。\n\nLangChain 用 callback handler 定义事件，用 callback manager 分发事件，用 run manager 表达一次 run 的生命周期和父子关系。\n\n## 最小心智模型\n\n```python\nclass Handler:\n    def on_chain_start(self, name, inputs): ...\n    def on_chain_end(self, outputs): ...\n    def on_tool_start(self, tool, input): ...\n    def on_llm_new_token(self, token): ...\n\n\nclass CallbackManager:\n    def __init__(self, handlers, parent_run_id=None):\n        self.handlers = handlers\n        self.parent_run_id = parent_run_id\n\n    def on_chain_start(self, serialized, inputs):\n        run_id = new_id()\n        for h in self.handlers:\n            h.on_chain_start(serialized, inputs, run_id=run_id)\n        return RunManager(run_id, self.handlers)\n```\n\n真实 LangChain 还要处理 sync/async、ignore flags、tags、metadata、inheritable handlers、LangSmith metadata 等。\n\n## LangChain 源码入口\n\n- repo: `langchain-ai/langchain`\n- commit: `bc5f1517cf7ac27addd4286e388228b8172b93b9`\n- chain callback event: `libs/core/langchain_core/callbacks/base.py:386`\n- tool callback event: `libs/core/langchain_core/callbacks/base.py:409`\n- `BaseCallbackHandler`: `libs/core/langchain_core/callbacks/base.py:496`\n- `ParentRunManager.get_child`: `libs/core/langchain_core/callbacks/manager.py:568`\n- `CallbackManagerForChainRun.on_chain_end`: `manager.py:897`\n- `CallbackManager`: `manager.py:1343`\n- `on_llm_start`: `manager.py:1346`\n- `on_chat_model_start`: `manager.py:1397`\n- `on_chain_start`: `manager.py:1451`\n- `configure`: `manager.py:1649`\n\n## 源码阅读路径\n\n1. 先看 `BaseCallbackHandler`：`base.py:496`，理解 handler 是事件接收者。\n2. 看 `on_chain_start` 和 `on_tool_start` 的签名：`base.py:386`、`base.py:409`。\n3. 看 `CallbackManager.on_llm_start`：`manager.py:1346`，理解事件如何分发给 handlers。\n4. 看 `CallbackManager.on_chat_model_start`：`manager.py:1397`，理解 chat model tracing 的输入是 message list。\n5. 看 `CallbackManager.on_chain_start`：`manager.py:1451`，理解它返回 run manager。\n6. 看 `ParentRunManager.get_child`：`manager.py:568`，理解 child manager 如何继承 handlers、tags、metadata。\n7. 回到 RunnableSequence.invoke，看每一步如何用 child callback manager 形成 `seq:step:n` 层级。\n\n## 核心实体和关系\n\n- `BaseCallbackHandler`：事件处理器基类。\n- `CallbackManager`：事件分发器。\n- `RunManager` / `ParentRunManager`：表示一次运行中的上下文。\n- `CallbackManagerForChainRun`：chain run 的运行管理器。\n- `RunnableConfig.callbacks`：把 callbacks 传入运行链路。\n- `get_child(tag)`：创建子 run manager，保留父子关系。\n\n## 关键 claims 与 evidence\n\n- `claim-callback-manager-observes-run-lifecycle`：CallbackManager 和 callback handler 用生命周期事件观测 chain、model、tool 等运行过程。证据：`ev-callback-handler`、`ev-callback-manager`、`ev-runnable-config`。\n- `BaseCallbackHandler` 聚合 LLM、Chain、Tool、Retriever、Run 等 mixin。证据：`callbacks/base.py:496`。\n- `on_tool_start` 的签名包含 serialized、input_str、run_id、parent_run_id、tags、metadata。证据：`callbacks/base.py:409`。\n- `get_child` 会创建带 `parent_run_id` 的 child callback manager。证据：`callbacks/manager.py:568` 到 `manager.py:584`。\n- `CallbackManager.configure` 接收 inheritable/local callbacks、tags、metadata。证据：`callbacks/manager.py:1649`。\n\n## 相关测试证据\n\n- `ev-test-callback-manager-merge`：`tests/unit_tests/callbacks/test_sync_callback_manager.py:18-38` 验证 callback manager 合并时保留普通 handler 和 inheritable handler 的区别。\n- `ev-test-async-callback-dispatch`：`tests/unit_tests/callbacks/test_async_callback_manager.py:31-75` 验证 async callback manager 作为 dispatcher 调用 handler，并区分 inline / 非 inline 执行。\n- `ev-test-tracer-nested-run`：`tests/unit_tests/tracers/test_base_tracer.py:254-286` 验证 tracer 通过 `parent_run_id` 表达 chain -> tool -> llm 的嵌套运行。\n- `ev-test-tracer-usage-metadata`：`tests/unit_tests/tracers/test_langchain.py:308-352` 验证 LLM 输出中的 usage metadata 会被写入 run metadata。\n\n这些测试说明 tracing 不是日志打印，而是有 parent/child、metadata、handler 继承规则的运行时事件系统。\n\n## 真实源码解释\n\n`BaseCallbackHandler` 本身没有业务逻辑，它组合了多个 mixin：LLM、Chain、Tool、Retriever、CallbackManager、RunManager。这说明 LangChain 把不同运行对象的生命周期事件统一放在 callback handler 协议里。\n\n`on_chain_start` 和 `on_tool_start` 的签名都包含 `run_id`、`parent_run_id`、`tags`、`metadata`。这几个字段是 tracing 的核心：run id 表示当前 span，parent run id 表示父子关系，tags 和 metadata 用于过滤、聚合和展示。\n\n`CallbackManager.on_llm_start` 会为每个 prompt 生成 run id，调用 `handle_event` 分发事件，然后返回 `CallbackManagerForLLMRun`。这意味着 start 事件不仅是通知，它还产生后续 run 生命周期的管理对象。\n\n`on_chat_model_start` 类似，但输入是 `list[list[BaseMessage]]`，说明 chat model tracing 记录的是 message list，而不是简单 prompt string。\n\n`ParentRunManager.get_child` 是理解链式调用 tracing 的关键。它创建一个 `CallbackManager(handlers=[], parent_run_id=self.run_id)`，继承 handlers、tags、metadata，并可加一个本地 tag。RunnableSequence 可以用它为每一步创建 child manager，于是 tracing 里能看到层级结构。\n\n## 设计取舍\n\n收益：\n\n- 调试 Agent 时可以看到每一步发生了什么。\n- 父子 run 让 pipeline、model、tool 的层级清晰。\n- tags 和 metadata 方便按业务、环境、实验分组。\n- callback handler 可扩展，可以接控制台日志、LangSmith、自定义审计。\n- sync/async callback 体系可以覆盖不同执行模式。\n\n成本：\n\n- callback 系统横跨 Runnable、ChatModel、Tool，阅读路径长。\n- handler、manager、run manager 名字相似，初学者容易混淆。\n- 事件多且分层，简单应用可能觉得抽象过重。\n- tracing 本身也可能引入性能和隐私成本，需要控制记录内容。\n\n## 和 Java 后端经验类比\n\n可以类比成：\n\n- OpenTelemetry span：run / child run。\n- Servlet filter 或 Spring interceptor：运行前后事件。\n- MDC / log context：tags、metadata、run_id。\n- Event listener：callback handler。\n\n差异是 LLM 应用的事件对象更丰富：prompt、message、token chunk、tool call、tool result 都是需要追踪的业务对象。\n\n## 容易误解的点\n\n- 误解 1：callback 是业务回调。这里主要是运行生命周期观测。\n- 误解 2：tracing 就是打印日志。实际它有 run id、parent run id、tags、metadata 和层级。\n- 误解 3：callbacks 只能全局配置。实际可以通过 `RunnableConfig` 在调用时传入。\n- 误解 4：工具和模型 tracing 是两套东西。实际它们共享 callback handler / manager 协议。\n- 误解 5：没有 tracing 也能稳定开发 Agent。简单 demo 可以，复杂 Agent 很快会不可调试。\n\n## 自测题\n\n见 `../quizzes/06-callback-tracing.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/06-callback-tracing.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/06-mini-callback-tracer/README.md`。\n\n## 学完标准\n\n你应该能不看笔记解释：\n\n- callback handler 和 callback manager 的分工。\n- `run_id` 和 `parent_run_id` 为什么重要。\n- `get_child(tag)` 如何形成链路层级。\n- `RunnableConfig.callbacks` 如何进入运行链路。\n- tracing 对 Agent 调试的价值和成本。\n\n"},"quiz":{"label":"测试","path":"quizzes/06-callback-tracing.quiz.md","markdown":"# 06 Callback / Tracing Quiz\n\n## 概念题\n\n1. 为什么 Agent 调试不能只看最终回答？\n2. Callback handler 和 CallbackManager 的职责区别是什么？\n3. `run_id` 和 `parent_run_id` 分别表达什么？\n4. tags 和 metadata 在 tracing 中有什么价值？\n5. 为什么 model、tool、chain 都要走同一套 callback 协议？\n\n## 源码题\n\n1. 找到 `BaseCallbackHandler` 的 mixin 组成，说明它覆盖哪些事件类型。\n2. 找到 `on_chain_start` 和 `on_tool_start` 的签名，对比它们的参数。\n3. 找到 `CallbackManager.on_chat_model_start`，说明它记录的输入为什么是 message list。\n4. 找到 `ParentRunManager.get_child`，解释 child manager 如何继承 handlers、tags、metadata。\n5. 找到 `CallbackManager.configure`，说明 inheritable/local callbacks 的意义。\n\n## 设计题\n\n1. 如果你设计 Agent tracing，会把 token streaming 作为日志、事件，还是 span？\n2. callback handler 抛异常时，默认应该影响业务执行吗？\n3. 哪些 prompt 或 tool result 不应该完整记录到 tracing 系统？\n\n## 故障诊断题\n\n1. 你只看到了 root run，看不到 chain 中每一步，可能漏了什么？\n2. tool run 没有出现在 trace 里，你会检查 Tool.run 还是 RunnableConfig？\n3. metadata 没有传到子步骤，应该检查 inheritable metadata 还是 local metadata？\n\n## 迁移题\n\n1. 用 Java / Spring 经验设计一个最小 callback handler。\n2. 设计一个 tracing 输出格式，能展示 `prompt -> model -> tool -> model`。\n\n"},"mastery":{"label":"掌握度","path":"mastery/06-callback-tracing.mastery.md","markdown":"# 06 Callback / Tracing Mastery\n\n## Level 1: 复述\n\n不用看 lesson，用 150-250 字解释为什么 Agent 需要 tracing，而不是只需要日志。\n\n完成标准：\n\n- 说到 run lifecycle。\n- 说到父子层级。\n- 说到模型和工具事件。\n\n## Level 2: 源码定位\n\n定位并记录文件和行号：\n\n- `BaseCallbackHandler`\n- `on_chain_start`\n- `on_tool_start`\n- `CallbackManager`\n- `on_chat_model_start`\n- `on_chain_start`\n- `get_child`\n- `configure`\n\n## Level 3: Run 树重建\n\n画出一次：\n\n```text\nchain\n  prompt\n  model\n  tool\n  model\n```\n\n要求为每个节点标注 run id、parent run id、tags、metadata。\n\n## Level 4: 事件流追踪\n\n手写一次 tool run 的事件序列：\n\n```text\non_tool_start -> run tool -> on_tool_end / on_tool_error\n```\n\n并说明 inputs、tool_call_id、metadata 应该在哪里出现。\n\n## Level 5: 故障诊断\n\n给出排查步骤：\n\n- trace 没有子步骤。\n- trace 里没有 tool run。\n- metadata 没有传到子 run。\n\n## Level 6: 微改造\n\n在 `labs/06-mini-callback-tracer` 中增加：\n\n- parent-child run tree\n- tags\n- metadata\n- error event\n- token stream event\n\n输出一份可读 trace report。\n\n"},"lab":{"label":"实验","path":"labs/06-mini-callback-tracer/README.md","markdown":"# Lab 06: Mini Callback Tracer\n\n目标：实现一个最小 callback/tracing 系统，验证 run id、parent run id、tags、metadata 和事件分发。\n\n## 必做功能\n\n- `CallbackHandler`\n- `CallbackManager`\n- `RunManager`\n- `get_child(tag)`\n- `on_chain_start` / `on_chain_end`\n- `on_chat_model_start` / `on_llm_new_token` / `on_chat_model_end`\n- `on_tool_start` / `on_tool_end` / `on_tool_error`\n- 输出 run tree。\n\n## 验收用例\n\n```python\nhandler = RecordingHandler()\nmanager = CallbackManager([handler], tags=[\"lesson:06\"])\nchain_run = manager.on_chain_start({\"name\": \"agent\"}, {\"input\": \"hi\"})\ntool_manager = chain_run.get_child(\"tool:search\")\ntool_run = tool_manager.on_tool_start({\"name\": \"search\"}, \"Runnable\")\ntool_run.on_tool_end(\"found\")\nchain_run.on_chain_end({\"output\": \"done\"})\n\nassert handler.tree().root.name == \"agent\"\nassert handler.tree().root.children[0].tags == [\"tool:search\"]\n```\n\n## 加分功能\n\n- 支持 metadata 继承。\n- 支持 ignore flags。\n- 支持异常事件。\n- 支持导出 markdown trace report。\n- 支持 token stream event。\n\n## 复盘问题\n\n1. run id 和 parent run id 与普通日志行有什么不同？\n2. tags 应该继承还是只在本地生效？\n3. tracing 里哪些内容可能有隐私风险？\n\n"}}},{"id":"07-agent-loop","title":"Agent Loop","status":"complete-course","depends_on":["01-runnable","02-message-schema","05-tool-interface"],"sections":{"lesson":{"label":"课程","path":"lessons/07-agent-loop.md","markdown":"# 07 Agent Loop\n\n## 你会学到什么\n\n- Agent loop 为什么是“模型决策、工具执行、观察回填、继续决策”的循环。\n- `AgentAction`、`AgentStep`、`AgentFinish` 分别表达什么状态。\n- `AgentActionMessageLog` 为什么对 chat model 很重要。\n- `create_agent` 为什么返回 compiled graph，而不是一个普通函数。\n- 如何把 Runnable、Message、Tool、ChatModel 串成最小 Agent。\n\n## AI 概念从零解释\n\n普通 LLM 调用通常是：\n\n```text\n用户输入 -> 模型 -> 最终回答\n```\n\nAgent 调用更像：\n\n```text\n用户输入\n  -> 模型判断要不要调用工具\n  -> 如果需要，框架执行工具\n  -> 工具结果作为观察回到模型\n  -> 模型继续判断\n  -> 直到最终回答或达到停止条件\n```\n\n这个循环让模型可以借助外部工具完成自己不能直接完成的事情，比如查代码、读文件、调用 API、执行计算。\n\n## 为什么工程上需要这个抽象\n\nAgent loop 至少需要解决：\n\n- 如何表示“模型要执行的动作”。\n- 如何执行动作并保存观察结果。\n- 如何把动作和观察重新变成消息历史。\n- 如何判断停止条件。\n- 如何限制最大轮数，避免无限循环。\n- 如何处理工具错误、模型解析错误和中间状态。\n- 如何接入 tracing、checkpoint、human-in-the-loop。\n\nLangChain Core 保留了经典 agent schema，LangChain v1 的 `create_agent` 则更偏 graph/workflow 方式，把 agent 编译成可运行的状态图。\n\n## 最小心智模型\n\n```python\nmessages = [HumanMessage(\"What's the weather?\")]\n\nfor _ in range(max_steps):\n    ai = model.invoke(messages, tools=tool_schemas)\n    messages.append(ai)\n\n    if not ai.tool_calls:\n        return ai.content\n\n    for call in ai.tool_calls:\n        tool = tools[call[\"name\"]]\n        observation = tool.invoke(call)\n        messages.append(ToolMessage(\n            content=str(observation),\n            tool_call_id=call[\"id\"],\n        ))\n```\n\n这个伪代码就是最小 Agent loop。真实 LangChain 会把这件事拆成 message schema、tool schema、callback/tracing、state graph、middleware、checkpoint 等层。\n\n## LangChain 源码入口\n\n- repo: `langchain-ai/langchain`\n- commit: `bc5f1517cf7ac27addd4286e388228b8172b93b9`\n- agent flow docstring: `libs/core/langchain_core/agents.py:15`\n- `AgentAction`: `libs/core/langchain_core/agents.py:44`\n- `AgentActionMessageLog`: `agents.py:105`\n- `AgentStep`: `agents.py:131`\n- `AgentFinish`: `agents.py:146`\n- action to messages: `agents.py:191`\n- observation to messages: `agents.py:209`\n- `create_agent`: `libs/langchain_v1/langchain/agents/factory.py:696`\n- compiled graph return: `factory.py:1670`\n\n## 源码阅读路径\n\n1. 先看 `agents.py` 顶部 docstring：`agents.py:15` 到 `agents.py:24`，它直接描述 agent 基本循环。\n2. 看 `AgentAction`：`agents.py:44`，理解 tool、tool_input、log。\n3. 看 `AgentActionMessageLog`：`agents.py:105`，理解 chat model 下为什么需要保留 message log。\n4. 看 `AgentStep`：`agents.py:131`，理解 action 和 observation 如何配对。\n5. 看 `AgentFinish`：`agents.py:146`，理解停止后的返回值。\n6. 看 `_convert_agent_action_to_messages` 和 `_convert_agent_observation_to_messages`。\n7. 看 v1 `create_agent`：`factory.py:696`，理解它创建的是 agent graph。\n8. 看返回处 `graph.compile(...).with_config(config)`：`factory.py:1670`。\n\n## 核心实体和关系\n\n- `AgentAction`：模型提出的工具调用请求。\n- `AgentActionMessageLog`：带原始 chat messages 的 action。\n- `AgentStep`：一次 action 执行后的 observation。\n- `AgentFinish`：达到停止条件后的最终返回。\n- `AIMessage.tool_calls`：现代 tool calling 中模型表达动作的常见载体。\n- `ToolMessage`：工具结果回填消息。\n- `create_agent`：生成可循环调用模型和工具的 compiled graph。\n\n## 关键 claims 与 evidence\n\n- `claim-agent-loop-uses-action-observation-finish`：LangChain 的 agent loop 数据结构围绕 action、observation 和 finish 建模，v1 的 create_agent 将模型、工具和中间件编译成 graph。证据：`ev-agent-action`、`ev-agent-step`、`ev-create-agent`、`ev-create-agent-compiled-graph`。\n- `agents.py` docstring 明确描述 agent 基本循环：LLM 请求 action、执行工具、返回 observation、达到停止条件后返回最终值。证据：`agents.py:15` 到 `agents.py:24`。\n- `AgentAction` 包含 `tool`、`tool_input`、`log`。证据：`agents.py:51` 到 `agents.py:58`。\n- `AgentStep` 把 `action` 和 `observation` 配对。证据：`agents.py:131` 到 `agents.py:143`。\n- `create_agent` 创建循环调用工具直到停止条件的 agent graph。证据：`factory.py:716`。\n- `create_agent` 最终返回 compiled graph，并挂上 config。证据：`factory.py:1670` 到 `factory.py:1683`。\n\n## 相关测试证据\n\n- `ev-test-agent-create-agent-tool-runtime`：`libs/langchain_v1/tests/unit_tests/agents/test_injected_runtime_create_agent.py:36-81` 验证 `create_agent` 生成的 agent 可以接收 `HumanMessage`，让模型产出 tool call，执行工具，回填 `ToolMessage`，并向工具注入 runtime/state/config。\n- `ev-test-agent-middleware-tools-node`：`libs/langchain_v1/tests/unit_tests/agents/middleware/core/test_tools.py:101-123` 验证 middleware 可以改写 tools node 的可用工具集合，agent invoke 后实际产生对应 `ToolMessage`。\n\n这些测试把抽象的 action / observation / finish 落到现代 v1 compiled graph 行为：模型节点给出工具调用，工具节点执行，消息状态继续驱动下一轮。\n\n## 真实 compiled graph 执行追踪\n\n本课额外追踪了一次真实测试用例中的 compiled graph 行为，记录在 `raw/source-notes/agent-loop-compiled-graph-trace.md`。核心路径如下：\n\n1. `create_agent(...)` 接收 `FakeToolCallingModel`、`runtime_tool` 和 `system_prompt`，返回可 `invoke` 的 compiled graph。\n2. 输入 `{\"messages\": [HumanMessage(\"Test\")]}` 进入 graph state。\n3. model node 产出 `AIMessage(tool_calls=[{\"name\": \"runtime_tool\", \"args\": {\"x\": 42}, \"id\": \"call_123\"}])`。\n4. tools node 根据 `tool_call_id` 分发到 `runtime_tool`，同时注入 runtime/state/config。\n5. 工具返回 `Processed 42`，graph 生成 `ToolMessage(content=\"Processed 42\", tool_call_id=\"call_123\")`。\n6. 消息历史继续进入下一轮模型调用；第二次模型没有 tool calls，循环停止并返回最终 `messages`。\n\n这条路径说明：v1 Agent Loop 的“循环”不是写在一个显眼的 while 里，而是被编译进 graph 的节点和边中；停止条件来自 model 输出是否继续包含 tool calls，以及 graph 的递归限制。\n\n## 真实源码解释\n\n`langchain_core/agents.py` 顶部 docstring 是这课最好的概念入口。它把 agent 描述为：语言模型选择一系列动作；给定 prompt，agent 用 LLM 请求一个动作；框架执行动作并得到观察；观察返回 LLM；达到停止条件后返回最终值。\n\n`AgentAction` 是“动作请求”，不是动作结果。它有 `tool`、`tool_input` 和 `log`。`log` 的注释很有价值：它可以审计模型为什么预测这个 tool/input，也可以在后续迭代中展示模型之前的想法。\n\n`AgentActionMessageLog` 继承 `AgentAction`，额外保存 `message_log`。这是为了 chat model 场景：如果模型原始输出是 messages，那么只保留 `(tool, tool_input)` 可能无法完整重建模型当时说了什么。\n\n`AgentStep` 是执行后的结果，它把 `AgentAction` 和 `observation` 配在一起。它的 `messages` property 会把 observation 转成 message，让后续模型继续看到工具结果。\n\n`AgentFinish` 表示停止条件后的最终返回。它不是“某次工具执行结束”，而是整个 agent loop 结束。\n\nLangChain v1 的 `create_agent` 已经不是简单 while loop 函数。它的签名接收 model、tools、system_prompt、middleware、response_format、state_schema、checkpointer、store、interrupt_before/after 等参数，最终返回 `graph.compile(...).with_config(config)`。这说明复杂 Agent 正在走向 workflow graph，而不是单个循环函数。\n\n## 设计取舍\n\n收益：\n\n- action、observation、finish 把 agent 中间状态显式化。\n- message log 让 chat model 的原始推理上下文可重建。\n- graph 形式更适合 middleware、checkpoint、human-in-the-loop 和中断恢复。\n- Tool、Message、ChatModel、Callback 能在同一个 loop 中协作。\n\n成本：\n\n- 初学者需要同时理解老式 agent schema 和 v1 graph agent。\n- 简单 while loop 的直觉很清楚，但真实工程会被 middleware、state、checkpoint 拉复杂。\n- action/observation 与现代 `AIMessage.tool_calls` / `ToolMessage` 之间存在概念映射，需要跨版本理解。\n- Agent loop 很容易无限循环，必须有停止条件和递归/步数限制。\n\n## 和 Java 后端经验类比\n\n可以把 Agent loop 类比成一个状态机或工作流引擎：\n\n- `AgentAction` 像 command。\n- `BaseTool` 像 command handler。\n- `AgentStep` 像 command 执行后的 event。\n- `messages` 像 append-only event log。\n- `AgentFinish` 像 terminal state。\n- `create_agent` 返回的 compiled graph 像 workflow definition 编译后的 runtime。\n\n但 Agent loop 的特殊性在于：下一步由模型根据上下文生成，不是由你完全写死的业务规则决定。\n\n## 容易误解的点\n\n- 误解 1：Agent 就是一次模型调用。实际 Agent 是循环。\n- 误解 2：AgentAction 是工具结果。实际它是模型提出的动作请求。\n- 误解 3：ToolMessage 和 AgentStep 完全等价。它们在不同层表达“观察结果”，但一个是 message，一个是 agent schema。\n- 误解 4：新版 LangChain agent 只是旧 AgentExecutor 改名。v1 `create_agent` 已经明显走向 graph 编排。\n- 误解 5：模型会自动可靠停止。实际必须有停止条件、递归限制和错误处理。\n\n## 自测题\n\n见 `../quizzes/07-agent-loop.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/07-agent-loop.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/07-mini-agent-loop/README.md`。\n\n## 学完标准\n\n你应该能不看笔记解释：\n\n- Agent loop 的四步：决策、行动、观察、继续或结束。\n- `AgentAction`、`AgentStep`、`AgentFinish` 的区别。\n- message schema 和 tool interface 在 Agent loop 中如何协作。\n- `create_agent` 为什么返回 compiled graph。\n- 如何实现一个最小可运行的 tool calling loop。\n\n"},"quiz":{"label":"测试","path":"quizzes/07-agent-loop.quiz.md","markdown":"# 07 Agent Loop Quiz\n\n## 概念题\n\n1. Agent loop 和一次普通模型调用的差异是什么？\n2. `AgentAction`、`AgentStep`、`AgentFinish` 分别表达什么？\n3. `AgentActionMessageLog` 为什么对 chat model 有用？\n4. ToolMessage 和 AgentStep 都和 observation 有关，它们有什么层级差异？\n5. 为什么新版本 agent 更适合用 graph/workflow 表达？\n\n## 源码题\n\n1. 找到 `agents.py` 顶部 docstring，复述 basic agent 的 4 个步骤。\n2. 找到 `AgentAction.tool`、`tool_input`、`log`，解释每个字段。\n3. 找到 `AgentStep.messages`，说明 observation 如何转回 message。\n4. 找到 `AgentFinish`，解释它和中间 step 的区别。\n5. 找到 `create_agent` 的 docstring，说明它创建什么。\n6. 找到 `graph.compile(...).with_config(config)`，解释为什么这不是简单 while loop。\n\n## 设计题\n\n1. 你会把 Agent loop 写成 while loop，还是状态机/graph？取决于什么？\n2. 最大轮数、递归限制和停止条件分别解决什么风险？\n3. 工具执行失败时，应该把错误作为 observation 回给模型，还是直接抛给用户？\n\n## 故障诊断题\n\n1. Agent 一直循环不结束，你会检查哪些停止条件？\n2. 模型调用了不存在的工具，你会检查 tool registry 还是 model prompt？\n3. 工具结果没有影响下一轮模型输出，你会检查 message history 中哪一步？\n\n## 迁移题\n\n1. 用伪代码实现一个最小 tool calling loop。\n2. 把 Runnable、Message、Tool、ChatModel 组合成一个自己的 MiniAgent 设计。\n\n"},"mastery":{"label":"掌握度","path":"mastery/07-agent-loop.mastery.md","markdown":"# 07 Agent Loop Mastery\n\n## Level 1: 复述\n\n不用看 lesson，用 150-250 字解释 Agent loop 的“决策、行动、观察、继续或结束”。\n\n完成标准：\n\n- 说到模型生成动作。\n- 说到工具执行。\n- 说到观察回填。\n- 说到停止条件。\n\n## Level 2: 源码定位\n\n定位并记录文件和行号：\n\n- agent flow docstring\n- `AgentAction`\n- `AgentActionMessageLog`\n- `AgentStep`\n- `AgentFinish`\n- `_convert_agent_action_to_messages`\n- `_convert_agent_observation_to_messages`\n- `create_agent`\n- `graph.compile`\n\n## Level 3: Loop 重建\n\n手写一个最小 loop：\n\n```text\nmessages -> model -> tool_calls? -> tools -> tool messages -> model -> final\n```\n\n要求说明每个数据结构来自前面哪一课。\n\n## Level 4: 状态机设计\n\n画出两个状态：\n\n- model node\n- tool node\n\n以及两条边：\n\n- 有 tool call\n- 无 tool call / final\n\n## Level 5: 故障诊断\n\n给出排查步骤：\n\n- Agent 无限循环。\n- 调用了不存在的工具。\n- 工具结果没有进入下一轮 prompt。\n- 模型返回无法解析的 tool call。\n\n## Level 6: 微改造\n\n在 `labs/07-mini-agent-loop` 中增加：\n\n- max steps\n- unknown tool handling\n- validation error observation\n- callback tracing\n- final answer detection\n\n说明你实现的是 while loop 还是 graph。\n\n"},"lab":{"label":"实验","path":"labs/07-mini-agent-loop/README.md","markdown":"# Lab 07: Mini Agent Loop\n\n目标：把 Message、ChatModel、Tool、Callback 串起来，实现一个最小 tool calling agent loop。\n\n## 必做功能\n\n- `MiniAgent(model, tools, max_steps=5, callbacks=None)`\n- message history。\n- 调用 model。\n- 如果 `AIMessage.tool_calls` 为空，返回最终回答。\n- 如果有 tool calls，执行工具并追加 `ToolMessage`。\n- 支持 unknown tool。\n- 支持 max steps 停止。\n\n## 验收用例\n\n```python\nmodel = ScriptedModel([\n    AIMessage(\"\", tool_calls=[{\"id\": \"call_1\", \"name\": \"search\", \"args\": {\"query\": \"Runnable\"}}]),\n    AIMessage(\"Runnable is a unified execution abstraction.\"),\n])\nagent = MiniAgent(model=model, tools=[search_tool], max_steps=3)\n\nanswer = agent.invoke(\"What is Runnable?\")\nassert \"unified execution\" in answer\nassert agent.messages[-2].type == \"tool\"\n```\n\n## 加分功能\n\n- 支持 validation error observation。\n- 支持 callback tracing。\n- 支持 `AgentStep(action, observation)` 记录。\n- 支持 graph 风格 model node / tool node，而不是纯 while loop。\n- 支持 human interrupt hook。\n\n## 复盘问题\n\n1. 你的停止条件有哪些？\n2. ToolMessage 和 AgentStep 在你的实现中是否都需要？\n3. 如果模型连续返回同一个 tool call，如何避免无限循环？\n\n"}}},{"id":"08-provider-integration","title":"Provider Integration","status":"complete-course","depends_on":["04-chat-model-adapter","05-tool-interface"],"sections":{"lesson":{"label":"课程","path":"lessons/08-provider-integration.md","markdown":"# 08 Provider Integration\n\n## 你会学到什么\n\n- Provider integration 为什么是 ChatModel adapter 的具体落地。\n- `BaseChatOpenAI` 如何继承 `BaseChatModel` 并包装 OpenAI API。\n- OpenAI adapter 如何处理 API key、model 参数、streaming、generate。\n- `bind_tools` 如何把 LangChain tool-like 对象转换为 OpenAI tool schema。\n- provider adapter 如何吸收 API 差异，避免污染上层 Agent。\n\n## AI 概念从零解释\n\nProvider 是模型服务提供方，例如 OpenAI、Anthropic、Google、DeepSeek、OpenRouter。它们都可能提供“聊天模型”，但 API 细节通常不同：\n\n- 认证方式不同。\n- model 参数不同。\n- messages payload 格式不同。\n- streaming chunk 格式不同。\n- tool calling schema 不同。\n- structured output 语义不同。\n- token usage 和 response metadata 字段不同。\n\nProvider integration 的职责是把这些具体差异封装起来，对上层暴露统一的 ChatModel 能力。\n\n## 为什么工程上需要这个抽象\n\n如果上层 Agent 直接依赖 OpenAI payload，一旦换 provider，就会改动 prompt、tool、agent loop、tracing 等大量代码。Provider adapter 把变化限制在边界层：\n\n```text\nAgent / Chain / Tool\n  -> BaseChatModel\n  -> ChatOpenAI / ChatAnthropic / ...\n  -> Provider SDK / HTTP API\n```\n\n这样上层主要依赖 `AIMessage`、`BaseMessage`、`BaseTool`、`Runnable`，而 provider adapter 负责协议转换。\n\n## 最小心智模型\n\n```python\nclass MiniOpenAIChatModel(BaseChatModel):\n    def _generate(self, messages, **kwargs):\n        payload = self.to_openai_payload(messages, **kwargs)\n        response = openai_client.chat.completions.create(**payload)\n        return self.to_chat_result(response)\n\n    def _stream(self, messages, **kwargs):\n        payload = self.to_openai_payload(messages, stream=True, **kwargs)\n        for chunk in openai_client.chat.completions.create(**payload):\n            yield self.to_generation_chunk(chunk)\n\n    def bind_tools(self, tools, tool_choice=None):\n        openai_tools = [convert_to_openai_tool(t) for t in tools]\n        return self.bind(tools=openai_tools, tool_choice=tool_choice)\n```\n\n真实 LangChain 的 OpenAI adapter 还要处理 responses API、response_format、include_response_headers、stream usage、parallel_tool_calls、strict schema、OpenAI 错误等。\n\n## LangChain 源码入口\n\n- repo: `langchain-ai/langchain`\n- commit: `bc5f1517cf7ac27addd4286e388228b8172b93b9`\n- `BaseChatOpenAI`: `libs/partners/openai/langchain_openai/chat_models/base.py:581`\n- model name: `base.py:599`\n- API key: `base.py:608`\n- `_stream`: `base.py:1549`\n- `_generate`: `base.py:1624`\n- `bind_tools`: `base.py:2131`\n- tool conversion: `base.py:2171`\n- `tool_choice=\"any\"` compatibility: `base.py:2200`\n- `ChatOpenAI`: `base.py:2534`\n\n## 源码阅读路径\n\n1. 先看 `BaseChatOpenAI(BaseChatModel)`：`base.py:581`，确认 provider adapter 继承 core 抽象。\n2. 看 `model_name`、`temperature`、`model_kwargs`、`openai_api_key`：`base.py:599` 到 `base.py:612`。\n3. 看 `_stream`：`base.py:1549`，理解 stream payload 和 chunk 转换。\n4. 看 `_generate`：`base.py:1624`，理解普通生成、responses API、response_format 分支。\n5. 看 `bind_tools`：`base.py:2131`，理解工具 schema 如何转换。\n6. 看 `convert_to_openai_tool`：`base.py:2171`。\n7. 看 `tool_choice == \"any\"` 转 `\"required\"`：`base.py:2200`。\n8. 看 `ChatOpenAI`：`base.py:2534`，理解面向用户的 OpenAI chat model 类。\n\n## 核心实体和关系\n\n- `BaseChatOpenAI`：OpenAI chat model adapter 基类。\n- `ChatOpenAI`：面向用户的 OpenAI chat model 类。\n- `BaseChatModel`：provider adapter 继承的 core 抽象。\n- `_generate`：同步非流式请求实现。\n- `_stream`：流式请求实现。\n- `bind_tools`：工具绑定与 provider schema 转换。\n- `convert_to_openai_tool`：LangChain tool-like 对象到 OpenAI tool schema 的转换函数。\n\n## 关键 claims 与 evidence\n\n- `claim-openai-provider-adapter-handles-api-drift`：OpenAI provider adapter 处理模型参数、stream/generate、tool schema 转换和 tool_choice 兼容差异。证据：`ev-base-chat-openai`、`ev-openai-stream-generate`、`ev-openai-bind-tools`、`ev-openai-tool-conversion`、`ev-chat-openai`。\n- `BaseChatOpenAI` 继承 `BaseChatModel`。证据：`base.py:581`。\n- `openai_api_key` 可从 `OPENAI_API_KEY` 环境变量推断。证据：`base.py:608` 到 `base.py:616`。\n- `_stream` 设置 `kwargs[\"stream\"] = True` 并逐 chunk 转成 `ChatGenerationChunk`。证据：`base.py:1549` 到 `base.py:1608`。\n- `_generate` 构造 payload，并根据 `response_format` / responses API 走不同分支。证据：`base.py:1624` 到 `base.py:1660`。\n- `bind_tools` 使用 `convert_to_openai_tool` 转换工具。证据：`base.py:2131` 到 `base.py:2173`。\n- OpenAI 不原生支持 `\"any\"`，adapter 将其转成 `\"required\"`。证据：`base.py:2200` 到 `base.py:2203`。\n\n## 相关测试证据\n\n- `ev-test-openai-responses-tool-call-conversion`：`libs/partners/openai/tests/unit_tests/chat_models/test_base.py:2323-2458` 验证 OpenAI adapter 把 `AIMessage.tool_calls` 转成 Responses API `function_call`，并把 `ToolMessage` 转成 `function_call_output`。\n- `ev-test-openai-bind-tools-responses`：`libs/partners/openai/tests/unit_tests/chat_models/test_base.py:2627-2673` 验证 Responses API 模式下 `ChatOpenAI.bind_tools` 后仍能通过 mock client 调用并进入 tracing。\n- `ev-test-openai-custom-tool`：`libs/partners/openai/tests/unit_tests/test_tools.py:39-82` 验证 OpenAI custom tool 的定义和 message history 回放。\n\n这些测试说明 provider adapter 的复杂度来自双向转换：LangChain 标准 message/tool schema 要变成 provider payload，provider 返回也要能回到 LangChain 标准对象。\n\n## 真实源码解释\n\n`BaseChatOpenAI(BaseChatModel)` 是 provider adapter 的核心信号：OpenAI 集成不是独立体系，而是 core chat model 抽象的一个实现。\n\n字段层面，`model_name` 默认是 `\"gpt-3.5-turbo\"`，`model_kwargs` 用于保存没有显式字段但仍要传给 create call 的模型参数，`openai_api_key` 可以通过 `OPENAI_API_KEY` 环境变量推断。这些字段把 provider 初始化和认证收敛到 adapter 内。\n\n`_stream` 先确保同步 client 可用，然后设置 `kwargs[\"stream\"] = True`，必要时加入 stream usage 选项，再通过 `_get_request_payload` 生成请求。它会遍历 provider 返回的 chunk，把 chunk 转成 LangChain 的 `ChatGenerationChunk`，并在有 run manager 时触发 `on_llm_new_token`。\n\n`_generate` 是非流式生成入口。它同样先构造 payload，然后根据 `response_format`、responses API 等情况选择不同 OpenAI API 分支，最后转回 LangChain 的 `ChatResult`。\n\n`bind_tools` 展示了 provider adapter 对 tool calling 的吸收能力。它接收 LangChain tool-like 对象，使用 `convert_to_openai_tool` 变成 OpenAI 兼容 schema，再处理 `tool_choice`、`strict`、`parallel_tool_calls`、`response_format` 等 provider 参数。\n\n`tool_choice == \"any\"` 被转换成 `\"required\"` 是一个很好的 adapter 例子：上层可以使用更通用的表达，OpenAI adapter 负责转成 OpenAI 实际支持的值。\n\n`ChatOpenAI` 的 docstring 还强
