  <script id="learning-data" type="application/json">{"generatedAt":"2026-06-02T13:19:15.716Z","units":[{"id":"01-platform-map","title":"OpenClaw 全局架构：本地优先个人 AI 助手","status":"complete","depends_on":[],"estimated_hours":2,"source_scope":["README.md","docs/agent-runtime-architecture.md","README.md","docs/agent-runtime-architecture.md","package.json"],"claim_ids":["claim-01-platform-map"],"evidence_ids":["ev-readme-product","ev-doc-runtime-layout","ev-test-agent-loop-basic","ev-test-acp-manager"],"sections":{"lesson":{"label":"课程","path":"lessons/01-platform-map.md","markdown":"# OpenClaw 全局架构：本地优先个人 AI 助手\n\n## 你会学到什么\n\n把 OpenClaw 先看成一个由 Gateway 调度的本地优先 agent 操作系统：消息入口、agent runtime、工具、插件、设备节点和 UI 都围绕同一个控制面工作。\n\n学完本课，你要能回答三个问题：这个抽象为什么存在；它在 OpenClaw 哪些文件里落地；它被哪些测试保护。\n\n## AI 概念从零解释\n\nAgent 系统可以拆成四件事：上下文、模型、动作、反馈。上下文告诉模型“到目前为止发生了什么”；模型产生文本或工具调用；工具调用把模型意图变成外部动作；工具结果再进入上下文，成为下一轮决策依据。\n\n本课关注的抽象是：把 OpenClaw 先看成一个由 Gateway 调度的本地优先 agent 操作系统：消息入口、agent runtime、工具、插件、设备节点和 UI 都围绕同一个控制面工作。\n\n## 为什么工程上需要这个抽象\n\n本地优先换来更强控制权和隐私边界，但工程上必须处理权限、凭据、会话持久化、多渠道差异和长任务可靠性。\n\n## 最小心智模型\n\n```ts\nasync function openclawStyleTurn(input) {\n  const session = await resolveSession(input);\n  const runtime = await selectRuntime(session);\n  const events = runtime.runTurn(input);\n  for await (const event of events) {\n    await persistAndPublish(event);\n  }\n}\n```\n\n针对本课，可压缩成：\n\n```text\nchannel inbound -> gateway/session routing -> agent runtime -> model stream -> tool calls -> tool results -> reply delivery\n```\n\n## 源码入口\n\n仓库：openclaw/openclaw\n\n提交：`4bb86877e2cf4ae8edc4294de68a693b1119b7c3`\n\n- README.md: OpenClaw 的产品定位、支持渠道、Gateway、工具、节点、沙箱安全模型。\n- docs/agent-runtime-architecture.md: runtime、session、tool、provider、plugin SDK 的分层说明。\n- package.json: monorepo 脚本暴露了 gateway、agent、tui、插件、移动端与测试入口。\n\n## 源码阅读路径\n\n1. 先读文档或类型定义，确认边界。\n2. 再读入口函数，找出输入、输出和副作用。\n3. 最后读测试，验证哪些行为是稳定契约。\n\n推荐顺序：\n\n1. `README.md`\n2. `docs/agent-runtime-architecture.md`\n3. `package.json`\n\n## 核心 entities 与 relations\n\n- entity：`concept:01-platform-map`\n- lesson：`lesson:01-platform-map`\n- claim：`claim-01-platform-map`\n- relations：见 `graph/relations.json`\n\n## 关键 claims 与 evidence\n\n- `claim-01-platform-map`：把 OpenClaw 先看成一个由 Gateway 调度的本地优先 agent 操作系统：消息入口、agent runtime、工具、插件、设备节点和 UI 都围绕同一个控制面工作。\n- evidence：ev-readme-product, ev-doc-runtime-layout, ev-test-agent-loop-basic, ev-test-acp-manager\n\n## 相关测试证据\n\n- ev-test-agent-loop-basic: agent-core 的 agent-loop 测试覆盖基础事件流和消息返回。\n- ev-test-acp-manager: ACP manager 测试覆盖 session manager 的基础行为。\n\n## 真实源码解释\n\n这一层的源码不是单一函数，而是一组边界协作。阅读时不要急着追所有 import；先抓住入口、状态对象、外部副作用和测试覆盖，再向下展开细节。\n\n## 设计取舍\n\n本地优先换来更强控制权和隐私边界，但工程上必须处理权限、凭据、会话持久化、多渠道差异和长任务可靠性。\n\n## Java/backend 类比\n\n像一个后端平台把 HTTP、队列、定时任务和内部服务统一进一个工作流引擎；区别是工作流的决策节点由 LLM 动态产生。\n\n## 常见误解\n\n- 误解 1：以为 agent 只是 prompt。实际源码显示，生产 agent 是 runtime、session、tool、provider、policy、stream 和 persistence 的组合。\n- 误解 2：以为工具越多越好。OpenClaw 的工具策略和沙箱说明，能力必须被权限边界包住。\n- 误解 3：以为测试只测模型输出。仓库大量测试关注 schema、事件、权限、重试、缓存、协议和状态机。\n\n## 自测题\n\n见 `quizzes/01-platform-map.quiz.md`。\n\n## 掌握度验证\n\n见 `mastery/01-platform-map.mastery.md`。\n\n## 最小复刻任务\n\n见 `labs/mini-platform-map/README.md`。\n\n## 学完标准\n\n- 能口头解释本课心智模型。\n- 能指出至少 3 个源码入口。\n- 能用至少 2 个 test evidence 支撑自己的理解。\n- 能完成对应 lab 的最小实现或伪实现。\n\n"},"quiz":{"label":"测试","path":"quizzes/01-platform-map.quiz.md","markdown":"# OpenClaw 全局架构：本地优先个人 AI 助手 自测题\n\n1. 本课抽象解决了什么工程问题？\n2. 请写出本课最重要的 3 个源码入口。\n3. 用自己的话解释这个路径：`channel inbound -> gateway/session routing -> agent runtime -> model stream -> tool calls -> tool results -> reply delivery`。\n4. 本课至少两个测试证据是什么？它们分别证明什么？\n5. 如果你要修改这一层，最容易破坏的契约是什么？\n\n## 参考答案方向\n\n- 必须引用 `claim-01-platform-map`。\n- 必须至少引用两个 evidence id：ev-doc-runtime-layout, ev-test-agent-loop-basic, ev-test-acp-manager。\n- 答案要区分“代码证据”“测试证据”和“推断”。\n\n"},"mastery":{"label":"掌握度","path":"mastery/01-platform-map.mastery.md","markdown":"# OpenClaw 全局架构：本地优先个人 AI 助手 掌握度验证\n\n## 口头讲解\n\n请在 5 分钟内讲清：\n\n- 这个抽象在 OpenClaw 中为什么存在。\n- 它和上一层/下一层的边界是什么。\n- 它的失败模式是什么。\n\n## 源码定位\n\n不看课程正文，直接在仓库中定位：\n\n- `README.md`\n- `docs/agent-runtime-architecture.md`\n- `package.json`\n\n## 通过标准\n\n- 能解释 `channel inbound -> gateway/session routing -> agent runtime -> model stream -> tool calls -> tool results -> reply delivery`。\n- 能把至少两个 test evidence 讲成行为契约，而不是只念文件名。\n- 能指出一个可能的重构风险。\n\n"},"lab":{"label":"实验","path":"labs/mini-platform-map/README.md","markdown":"# 实验：OpenClaw 全局架构：本地优先个人 AI 助手\n\n## 目标\n\n复刻本课的最小版本，不追求完整 OpenClaw，只追求抓住工程边界。\n\n## 任务\n\n1. 写出本课心智模型的伪代码。\n2. 标出输入、输出、副作用和错误路径。\n3. 写 2 个测试用例描述。\n4. 对照源码 evidence 修正你的模型。\n\n## 起始伪代码\n\n```ts\ntype Event = { type: string; payload?: unknown };\n\nasync function exercise(input: unknown): Promise\u003cEvent[]> {\n  const events: Event[] = [];\n  events.push({ type: \"start\", payload: input });\n  events.push({ type: \"end\" });\n  return events;\n}\n```\n\n## 对照 evidence\n\n- ev-readme-product\n- ev-doc-runtime-layout\n- ev-test-agent-loop-basic\n- ev-test-acp-manager\n\n## 完成标准\n\n你能解释自己的伪实现和 OpenClaw 源码之间少了哪些生产级能力。\n\n"}}},{"id":"02-agent-core-loop","title":"Agent Core：从消息到工具调用的最小循环","status":"complete","depends_on":["01-platform-map"],"estimated_hours":3,"source_scope":["README.md","docs/agent-runtime-architecture.md","packages/agent-core/src/agent-loop.ts","packages/agent-core/src/types.ts","packages/agent-core/src/agent-loop.test.ts"],"claim_ids":["claim-02-agent-core-loop"],"evidence_ids":["ev-code-agent-loop-entry","ev-code-run-agent-loop","ev-code-run-loop-tools","ev-test-agent-loop-basic","ev-test-agent-loop-tool"],"sections":{"lesson":{"label":"课程","path":"lessons/02-agent-core-loop.md","markdown":"# Agent Core：从消息到工具调用的最小循环\n\n## 你会学到什么\n\nagent loop 的本质是一个事件驱动的状态机：追加用户消息，调用模型流，提取工具调用，执行工具，把工具结果写回上下文，再决定是否继续。\n\n学完本课，你要能回答三个问题：这个抽象为什么存在；它在 OpenClaw 哪些文件里落地；它被哪些测试保护。\n\n## AI 概念从零解释\n\nAgent 系统可以拆成四件事：上下文、模型、动作、反馈。上下文告诉模型“到目前为止发生了什么”；模型产生文本或工具调用；工具调用把模型意图变成外部动作；工具结果再进入上下文，成为下一轮决策依据。\n\n本课关注的抽象是：agent loop 的本质是一个事件驱动的状态机：追加用户消息，调用模型流，提取工具调用，执行工具，把工具结果写回上下文，再决定是否继续。\n\n## 为什么工程上需要这个抽象\n\n核心包保持可复用和低层，不直接理解 OpenClaw 的 channel、插件、会话存储；这些由上层 runtime 注入。\n\n## 最小心智模型\n\n```ts\nasync function openclawStyleTurn(input) {\n  const session = await resolveSession(input);\n  const runtime = await selectRuntime(session);\n  const events = runtime.runTurn(input);\n  for await (const event of events) {\n    await persistAndPublish(event);\n  }\n}\n```\n\n针对本课，可压缩成：\n\n```text\nmessages[] + tools[] -> stream(model, llmContext) -> assistant message -> toolCall[] -> toolResult[] -> next turn\n```\n\n## 源码入口\n\n仓库：openclaw/openclaw\n\n提交：`4bb86877e2cf4ae8edc4294de68a693b1119b7c3`\n\n- packages/agent-core/src/agent-loop.ts: agentLoop/runAgentLoop/runLoop/streamAssistantResponse/executeToolCalls。\n- packages/agent-core/src/types.ts: AgentLoopConfig、hook、toolExecution、steering/follow-up 的契约。\n- packages/agent-core/src/agent-loop.test.ts: 基础循环、工具、事件顺序的测试。\n\n## 源码阅读路径\n\n1. 先读文档或类型定义，确认边界。\n2. 再读入口函数，找出输入、输出和副作用。\n3. 最后读测试，验证哪些行为是稳定契约。\n\n推荐顺序：\n\n1. `packages/agent-core/src/agent-loop.ts`\n2. `packages/agent-core/src/types.ts`\n3. `packages/agent-core/src/agent-loop.test.ts`\n\n## 核心 entities 与 relations\n\n- entity：`concept:02-agent-core-loop`\n- lesson：`lesson:02-agent-core-loop`\n- claim：`claim-02-agent-core-loop`\n- relations：见 `graph/relations.json`\n\n## 关键 claims 与 evidence\n\n- `claim-02-agent-core-loop`：agent loop 的本质是一个事件驱动的状态机：追加用户消息，调用模型流，提取工具调用，执行工具，把工具结果写回上下文，再决定是否继续。\n- evidence：ev-code-agent-loop-entry, ev-code-run-agent-loop, ev-code-run-loop-tools, ev-test-agent-loop-basic, ev-test-agent-loop-tool\n\n## 相关测试证据\n\n- ev-test-agent-loop-basic: agent-core 的 agent-loop 测试覆盖基础事件流和消息返回。\n- ev-test-agent-loop-tool: agent-loop 测试覆盖工具调用、工具结果和下一轮循环。\n\n## 真实源码解释\n\n`agentLoop` 负责创建事件流，`runAgentLoop` 负责把 prompt 写入上下文并发出开始事件，`runLoop` 是核心状态机。`runLoop` 每轮调用 `streamAssistantResponse`，拿到 assistant message 后查找 `toolCall` 内容块；如果存在工具调用，就执行工具、生成 `ToolResultMessage`、写回上下文，再决定继续还是结束。\n\n## 设计取舍\n\n核心包保持可复用和低层，不直接理解 OpenClaw 的 channel、插件、会话存储；这些由上层 runtime 注入。\n\n## Java/backend 类比\n\n类似 Spring Batch/Workflow 的 step runner，但 step 的下一个动作由模型输出决定，而不是静态 DAG。\n\n## 常见误解\n\n- 误解 1：以为 agent 只是 prompt。实际源码显示，生产 agent 是 runtime、session、tool、provider、policy、stream 和 persistence 的组合。\n- 误解 2：以为工具越多越好。OpenClaw 的工具策略和沙箱说明，能力必须被权限边界包住。\n- 误解 3：以为测试只测模型输出。仓库大量测试关注 schema、事件、权限、重试、缓存、协议和状态机。\n\n## 自测题\n\n见 `quizzes/02-agent-core-loop.quiz.md`。\n\n## 掌握度验证\n\n见 `mastery/02-agent-core-loop.mastery.md`。\n\n## 最小复刻任务\n\n见 `labs/mini-agent-core-loop/README.md`。\n\n## 学完标准\n\n- 能口头解释本课心智模型。\n- 能指出至少 3 个源码入口。\n- 能用至少 2 个 test evidence 支撑自己的理解。\n- 能完成对应 lab 的最小实现或伪实现。\n\n"},"quiz":{"label":"测试","path":"quizzes/02-agent-core-loop.quiz.md","markdown":"# Agent Core：从消息到工具调用的最小循环 自测题\n\n1. 本课抽象解决了什么工程问题？\n2. 请写出本课最重要的 3 个源码入口。\n3. 用自己的话解释这个路径：`messages[] + tools[] -> stream(model, llmContext) -> assistant message -> toolCall[] -> toolResult[] -> next turn`。\n4. 本课至少两个测试证据是什么？它们分别证明什么？\n5. 如果你要修改这一层，最容易破坏的契约是什么？\n\n## 参考答案方向\n\n- 必须引用 `claim-02-agent-core-loop`。\n- 必须至少引用两个 evidence id：ev-code-run-loop-tools, ev-test-agent-loop-basic, ev-test-agent-loop-tool。\n- 答案要区分“代码证据”“测试证据”和“推断”。\n\n"},"mastery":{"label":"掌握度","path":"mastery/02-agent-core-loop.mastery.md","markdown":"# Agent Core：从消息到工具调用的最小循环 掌握度验证\n\n## 口头讲解\n\n请在 5 分钟内讲清：\n\n- 这个抽象在 OpenClaw 中为什么存在。\n- 它和上一层/下一层的边界是什么。\n- 它的失败模式是什么。\n\n## 源码定位\n\n不看课程正文，直接在仓库中定位：\n\n- `packages/agent-core/src/agent-loop.ts`\n- `packages/agent-core/src/types.ts`\n- `packages/agent-core/src/agent-loop.test.ts`\n\n## 通过标准\n\n- 能解释 `messages[] + tools[] -> stream(model, llmContext) -> assistant message -> toolCall[] -> toolResult[] -> next turn`。\n- 能把至少两个 test evidence 讲成行为契约，而不是只念文件名。\n- 能指出一个可能的重构风险。\n\n"},"lab":{"label":"实验","path":"labs/mini-agent-core-loop/README.md","markdown":"# 实验：Agent Core：从消息到工具调用的最小循环\n\n## 目标\n\n复刻本课的最小版本，不追求完整 OpenClaw，只追求抓住工程边界。\n\n## 任务\n\n1. 写出本课心智模型的伪代码。\n2. 标出输入、输出、副作用和错误路径。\n3. 写 2 个测试用例描述。\n4. 对照源码 evidence 修正你的模型。\n\n## 起始伪代码\n\n```ts\ntype Event = { type: string; payload?: unknown };\n\nasync function exercise(input: unknown): Promise\u003cEvent[]> {\n  const events: Event[] = [];\n  events.push({ type: \"start\", payload: input });\n  events.push({ type: \"end\" });\n  return events;\n}\n```\n\n## 对照 evidence\n\n- ev-code-agent-loop-entry\n- ev-code-run-agent-loop\n- ev-code-run-loop-tools\n- ev-test-agent-loop-basic\n- ev-test-agent-loop-tool\n\n## 完成标准\n\n你能解释自己的伪实现和 OpenClaw 源码之间少了哪些生产级能力。\n\n"}}},{"id":"03-message-context-stream","title":"消息、上下文与流式事件","status":"complete","depends_on":["02-agent-core-loop"],"estimated_hours":3,"source_scope":["README.md","docs/agent-runtime-architecture.md","packages/agent-core/src/agent-loop.ts","packages/agent-core/src/types.ts","packages/llm-core/src/index.ts 与 packages/llm-core/src/types.ts"],"claim_ids":["claim-03-message-context-stream"],"evidence_ids":["ev-code-stream-response","ev-code-agent-types","ev-test-agent-loop-basic","ev-test-llm-validation","ev-test-acp-turn-stream"],"sections":{"lesson":{"label":"课程","path":"lessons/03-message-context-stream.md","markdown":"# 消息、上下文与流式事件\n\n## 你会学到什么\n\nLLM 应用不是一次请求一次字符串，而是一组消息、系统提示、工具定义和流式事件的组合。OpenClaw 把 partial assistant message 放入上下文并随事件更新。\n\n学完本课，你要能回答三个问题：这个抽象为什么存在；它在 OpenClaw 哪些文件里落地；它被哪些测试保护。\n\n## AI 概念从零解释\n\nAgent 系统可以拆成四件事：上下文、模型、动作、反馈。上下文告诉模型“到目前为止发生了什么”；模型产生文本或工具调用；工具调用把模型意图变成外部动作；工具结果再进入上下文，成为下一轮决策依据。\n\n本课关注的抽象是：LLM 应用不是一次请求一次字符串，而是一组消息、系统提示、工具定义和流式事件的组合。OpenClaw 把 partial assistant message 放入上下文并随事件更新。\n\n## 为什么工程上需要这个抽象\n\n把 partial message 写入上下文能支持实时 UI 和工具 call delta，但也要求 done/error 时正确替换最终 message，避免脏状态。\n\n## 最小心智模型\n\n```ts\nasync function openclawStyleTurn(input) {\n  const session = await resolveSession(input);\n  const runtime = await selectRuntime(session);\n  const events = runtime.runTurn(input);\n  for await (const event of events) {\n    await persistAndPublish(event);\n  }\n}\n```\n\n针对本课，可压缩成：\n\n```text\nAgentMessage[] --transformContext--> AgentMessage[] --convertToLlm--> LLM Message[] --stream--> AssistantMessage events\n```\n\n## 源码入口\n\n仓库：openclaw/openclaw\n\n提交：`4bb86877e2cf4ae8edc4294de68a693b1119b7c3`\n\n- packages/agent-core/src/agent-loop.ts: streamAssistantResponse 对 start/delta/done/error 的处理。\n- packages/agent-core/src/types.ts: convertToLlm、transformContext、getApiKey 等可插拔契约。\n- packages/llm-core/src/index.ts 与 packages/llm-core/src/types.ts: LLM 消息和 EventStream 基础类型。\n\n## 源码阅读路径\n\n1. 先读文档或类型定义，确认边界。\n2. 再读入口函数，找出输入、输出和副作用。\n3. 最后读测试，验证哪些行为是稳定契约。\n\n推荐顺序：\n\n1. `packages/agent-core/src/agent-loop.ts`\n2. `packages/agent-core/src/types.ts`\n3. `packages/llm-core/src/index.ts 与 packages/llm-core/src/types.ts`\n\n## 核心 entities 与 relations\n\n- entity：`concept:03-message-context-stream`\n- lesson：`lesson:03-message-context-stream`\n- claim：`claim-03-message-context-stream`\n- relations：见 `graph/relations.json`\n\n## 关键 claims 与 evidence\n\n- `claim-03-message-context-stream`：LLM 应用不是一次请求一次字符串，而是一组消息、系统提示、工具定义和流式事件的组合。OpenClaw 把 partial assistant message 放入上下文并随事件更新。\n- evidence：ev-code-stream-response, ev-code-agent-types, ev-test-agent-loop-basic, ev-test-llm-validation, ev-test-acp-turn-stream\n\n## 相关测试证据\n\n- ev-test-agent-loop-basic: agent-core 的 agent-loop 测试覆盖基础事件流和消息返回。\n- ev-test-llm-validation: llm-core validation 测试为消息/模型数据契约提供证据。\n- ev-test-acp-turn-stream: ACP translator 工具流测试覆盖工具事件映射/流式输出。\n\n## 真实源码解释\n\n这一层的源码不是单一函数，而是一组边界协作。阅读时不要急着追所有 import；先抓住入口、状态对象、外部副作用和测试覆盖，再向下展开细节。\n\n## 设计取舍\n\n把 partial message 写入上下文能支持实时 UI 和工具 call delta，但也要求 done/error 时正确替换最终 message，避免脏状态。\n\n## Java/backend 类比\n\n像 WebSocket 响应流：先创建占位 response，再不断 patch，最后 commit。\n\n## 常见误解\n\n- 误解 1：以为 agent 只是 prompt。实际源码显示，生产 agent 是 runtime、session、tool、provider、policy、stream 和 persistence 的组合。\n- 误解 2：以为工具越多越好。OpenClaw 的工具策略和沙箱说明，能力必须被权限边界包住。\n- 误解 3：以为测试只测模型输出。仓库大量测试关注 schema、事件、权限、重试、缓存、协议和状态机。\n\n## 自测题\n\n见 `quizzes/03-message-context-stream.quiz.md`。\n\n## 掌握度验证\n\n见 `mastery/03-message-context-stream.mastery.md`。\n\n## 最小复刻任务\n\n见 `labs/mini-message-context-stream/README.md`。\n\n## 学完标准\n\n- 能口头解释本课心智模型。\n- 能指出至少 3 个源码入口。\n- 能用至少 2 个 test evidence 支撑自己的理解。\n- 能完成对应 lab 的最小实现或伪实现。\n\n"},"quiz":{"label":"测试","path":"quizzes/03-message-context-stream.quiz.md","markdown":"# 消息、上下文与流式事件 自测题\n\n1. 本课抽象解决了什么工程问题？\n2. 请写出本课最重要的 3 个源码入口。\n3. 用自己的话解释这个路径：`AgentMessage[] --transformContext--> AgentMessage[] --convertToLlm--> LLM Message[] --stream--> AssistantMessage events`。\n4. 本课至少两个测试证据是什么？它们分别证明什么？\n5. 如果你要修改这一层，最容易破坏的契约是什么？\n\n## 参考答案方向\n\n- 必须引用 `claim-03-message-context-stream`。\n- 必须至少引用两个 evidence id：ev-test-agent-loop-basic, ev-test-llm-validation, ev-test-acp-turn-stream。\n- 答案要区分“代码证据”“测试证据”和“推断”。\n\n"},"mastery":{"label":"掌握度","path":"mastery/03-message-context-stream.mastery.md","markdown":"# 消息、上下文与流式事件 掌握度验证\n\n## 口头讲解\n\n请在 5 分钟内讲清：\n\n- 这个抽象在 OpenClaw 中为什么存在。\n- 它和上一层/下一层的边界是什么。\n- 它的失败模式是什么。\n\n## 源码定位\n\n不看课程正文，直接在仓库中定位：\n\n- `packages/agent-core/src/agent-loop.ts`\n- `packages/agent-core/src/types.ts`\n- `packages/llm-core/src/index.ts 与 packages/llm-core/src/types.ts`\n\n## 通过标准\n\n- 能解释 `AgentMessage[] --transformContext--> AgentMessage[] --convertToLlm--> LLM Message[] --stream--> AssistantMessage events`。\n- 能把至少两个 test evidence 讲成行为契约，而不是只念文件名。\n- 能指出一个可能的重构风险。\n\n"},"lab":{"label":"实验","path":"labs/mini-message-context-stream/README.md","markdown":"# 实验：消息、上下文与流式事件\n\n## 目标\n\n复刻本课的最小版本，不追求完整 OpenClaw，只追求抓住工程边界。\n\n## 任务\n\n1. 写出本课心智模型的伪代码。\n2. 标出输入、输出、副作用和错误路径。\n3. 写 2 个测试用例描述。\n4. 对照源码 evidence 修正你的模型。\n\n## 起始伪代码\n\n```ts\ntype Event = { type: string; payload?: unknown };\n\nasync function exercise(input: unknown): Promise\u003cEvent[]> {\n  const events: Event[] = [];\n  events.push({ type: \"start\", payload: input });\n  events.push({ type: \"end\" });\n  return events;\n}\n```\n\n## 对照 evidence\n\n- ev-code-stream-response\n- ev-code-agent-types\n- ev-test-agent-loop-basic\n- ev-test-llm-validation\n- ev-test-acp-turn-stream\n\n## 完成标准\n\n你能解释自己的伪实现和 OpenClaw 源码之间少了哪些生产级能力。\n\n"}}},{"id":"04-tools-policy-sandbox","title":"工具系统：定义、策略、沙箱与执行前后钩子","status":"complete","depends_on":["03-message-context-stream"],"estimated_hours":3,"source_scope":["README.md","docs/agent-runtime-architecture.md","src/agents/agent-tools.ts","src/agents/agent-tool-definition-adapter.ts","src/agents/embedded-agent-runner/run/attempt-tool-construction-plan.ts"],"claim_ids":["claim-04-tools-policy-sandbox"],"evidence_ids":["ev-code-tool-factory","ev-code-tool-adapter","ev-code-tool-construction","ev-test-tool-adapter","ev-test-tool-policy","ev-test-tool-construction"],"sections":{"lesson":{"label":"课程","path":"lessons/04-tools-policy-sandbox.md","markdown":"# 工具系统：定义、策略、沙箱与执行前后钩子\n\n## 你会学到什么\n\n工具调用是 agent 产生外部影响的边界。OpenClaw 同时处理 schema 规范化、allow/deny 策略、沙箱路径、before/after hook、执行顺序和错误归一化。\n\n学完本课，你要能回答三个问题：这个抽象为什么存在；它在 OpenClaw 哪些文件里落地；它被哪些测试保护。\n\n## AI 概念从零解释\n\nAgent 系统可以拆成四件事：上下文、模型、动作、反馈。上下文告诉模型“到目前为止发生了什么”；模型产生文本或工具调用；工具调用把模型意图变成外部动作；工具结果再进入上下文，成为下一轮决策依据。\n\n本课关注的抽象是：工具调用是 agent 产生外部影响的边界。OpenClaw 同时处理 schema 规范化、allow/deny 策略、沙箱路径、before/after hook、执行顺序和错误归一化。\n\n## 为什么工程上需要这个抽象\n\n工具越丰富，agent 越有能力；但每一种能力都必须有可审计的权限、输入校验和日志脱敏。\n\n## 最小心智模型\n\n```ts\nasync function openclawStyleTurn(input) {\n  const session = await resolveSession(input);\n  const runtime = await selectRuntime(session);\n  const events = runtime.runTurn(input);\n  for await (const event of events) {\n    await persistAndPublish(event);\n  }\n}\n```\n\n针对本课，可压缩成：\n\n```text\ntool catalog -> policy pipeline -> model-compatible schema -> beforeToolCall -> execute -> afterToolCall -> ToolResultMessage\n```\n\n## 源码入口\n\n仓库：openclaw/openclaw\n\n提交：`4bb86877e2cf4ae8edc4294de68a693b1119b7c3`\n\n- src/agents/agent-tools.ts: 工具工厂、策略流水线、沙箱/host 工具、插件工具集合。\n- src/agents/agent-tool-definition-adapter.ts: 工具执行参数拆分、错误归一化、敏感日志处理。\n- src/agents/embedded-agent-runner/run/attempt-tool-construction-plan.ts: allowlist 如何决定要构造哪些工具集合。\n\n## 源码阅读路径\n\n1. 先读文档或类型定义，确认边界。\n2. 再读入口函数，找出输入、输出和副作用。\n3. 最后读测试，验证哪些行为是稳定契约。\n\n推荐顺序：\n\n1. `src/agents/agent-tools.ts`\n2. `src/agents/agent-tool-definition-adapter.ts`\n3. `src/agents/embedded-agent-runner/run/attempt-tool-construction-plan.ts`\n\n## 核心 entities 与 relations\n\n- entity：`concept:04-tools-policy-sandbox`\n- lesson：`lesson:04-tools-policy-sandbox`\n- claim：`claim-04-tools-policy-sandbox`\n- relations：见 `graph/relations.json`\n\n## 关键 claims 与 evidence\n\n- `claim-04-tools-policy-sandbox`：工具调用是 agent 产生外部影响的边界。OpenClaw 同时处理 schema 规范化、allow/deny 策略、沙箱路径、before/after hook、执行顺序和错误归一化。\n- evidence：ev-code-tool-factory, ev-code-tool-adapter, ev-code-tool-construction, ev-test-tool-adapter, ev-test-tool-policy, ev-test-tool-construction\n\n## 相关测试证据\n\n- ev-test-tool-adapter: 工具 adapter 测试覆盖工具定义适配、执行和错误处理。\n- ev-test-tool-policy: 工具 policy 测试覆盖 allow/deny、继承与工具策略行为。\n- ev-test-tool-construction: 工具构造计划测试覆盖 allowlist、禁用工具和 plugin/channel/core 工具构造开关。\n\n## 真实源码解释\n\n`agent-tools.ts` 是工具集合的组装入口；`attempt-tool-construction-plan.ts` 先根据 allowlist 判断哪些工具族需要构造；`agent-tool-definition-adapter.ts` 把不同工具返回值、参数签名和错误统一成 agent-core 能理解的结果。这个分层让模型工具、OpenClaw 本机工具、channel 工具和插件工具可以共存。\n\n## 设计取舍\n\n工具越丰富，agent 越有能力；但每一种能力都必须有可审计的权限、输入校验和日志脱敏。\n\n## Java/backend 类比\n\n像后端的 API gateway + RBAC + request/response filter，只是调用方是模型。\n\n## 常见误解\n\n- 误解 1：以为 agent 只是 prompt。实际源码显示，生产 agent 是 runtime、session、tool、provider、policy、stream 和 persistence 的组合。\n- 误解 2：以为工具越多越好。OpenClaw 的工具策略和沙箱说明，能力必须被权限边界包住。\n- 误解 3：以为测试只测模型输出。仓库大量测试关注 schema、事件、权限、重试、缓存、协议和状态机。\n\n## 自测题\n\n见 `quizzes/04-tools-policy-sandbox.quiz.md`。\n\n## 掌握度验证\n\n见 `mastery/04-tools-policy-sandbox.mastery.md`。\n\n## 最小复刻任务\n\n见 `labs/mini-tools-policy-sandbox/README.md`。\n\n## 学完标准\n\n- 能口头解释本课心智模型。\n- 能指出至少 3 个源码入口。\n- 能用至少 2 个 test evidence 支撑自己的理解。\n- 能完成对应 lab 的最小实现或伪实现。\n\n"},"quiz":{"label":"测试","path":"quizzes/04-tools-policy-sandbox.quiz.md","markdown":"# 工具系统：定义、策略、沙箱与执行前后钩子 自测题\n\n1. 本课抽象解决了什么工程问题？\n2. 请写出本课最重要的 3 个源码入口。\n3. 用自己的话解释这个路径：`tool catalog -> policy pipeline -> model-compatible schema -> beforeToolCall -> execute -> afterToolCall -> ToolResultMessage`。\n4. 本课至少两个测试证据是什么？它们分别证明什么？\n5. 如果你要修改这一层，最容易破坏的契约是什么？\n\n## 参考答案方向\n\n- 必须引用 `claim-04-tools-policy-sandbox`。\n- 必须至少引用两个 evidence id：ev-test-tool-adapter, ev-test-tool-policy, ev-test-tool-construction。\n- 答案要区分“代码证据”“测试证据”和“推断”。\n\n"},"mastery":{"label":"掌握度","path":"mastery/04-tools-policy-sandbox.mastery.md","markdown":"# 工具系统：定义、策略、沙箱与执行前后钩子 掌握度验证\n\n## 口头讲解\n\n请在 5 分钟内讲清：\n\n- 这个抽象在 OpenClaw 中为什么存在。\n- 它和上一层/下一层的边界是什么。\n- 它的失败模式是什么。\n\n## 源码定位\n\n不看课程正文，直接在仓库中定位：\n\n- `src/agents/agent-tools.ts`\n- `src/agents/agent-tool-definition-adapter.ts`\n- `src/agents/embedded-agent-runner/run/attempt-tool-construction-plan.ts`\n\n## 通过标准\n\n- 能解释 `tool catalog -> policy pipeline -> model-compatible schema -> beforeToolCall -> execute -> afterToolCall -> ToolResultMessage`。\n- 能把至少两个 test evidence 讲成行为契约，而不是只念文件名。\n- 能指出一个可能的重构风险。\n\n"},"lab":{"label":"实验","path":"labs/mini-tools-policy-sandbox/README.md","markdown":"# 实验：工具系统：定义、策略、沙箱与执行前后钩子\n\n## 目标\n\n复刻本课的最小版本，不追求完整 OpenClaw，只追求抓住工程边界。\n\n## 任务\n\n1. 写出本课心智模型的伪代码。\n2. 标出输入、输出、副作用和错误路径。\n3. 写 2 个测试用例描述。\n4. 对照源码 evidence 修正你的模型。\n\n## 起始伪代码\n\n```ts\ntype Event = { type: string; payload?: unknown };\n\nasync function exercise(input: unknown): Promise\u003cEvent[]> {\n  const events: Event[] = [];\n  events.push({ type: \"start\", payload: input });\n  events.push({ type: \"end\" });\n  return events;\n}\n```\n\n## 对照 evidence\n\n- ev-code-tool-factory\n- ev-code-tool-adapter\n- ev-code-tool-construction\n- ev-test-tool-adapter\n- ev-test-tool-policy\n- ev-test-tool-construction\n\n## 完成标准\n\n你能解释自己的伪实现和 OpenClaw 源码之间少了哪些生产级能力。\n\n"}}},{"id":"05-embedded-runtime-provider","title":"内置 Runtime：模型选择、Provider、重试与故障转移","status":"complete","depends_on":["04-tools-policy-sandbox"],"estimated_hours":3,"source_scope":["README.md","docs/agent-runtime-architecture.md","src/agents/embedded-agent-runner/run.ts","src/agents/embedded-agent-runner/run/failover-policy.ts 与 assistant-failover.ts","src/agents/embedded-agent-runner/model.ts"],"claim_ids":["claim-05-embedded-runtime-provider"],"evidence_ids":["ev-code-embedded-run","ev-test-run-failover","ev-test-run-overflow","ev-test-model-forward"],"sections":{"lesson":{"label":"课程","path":"lessons/05-embedded-runtime-provider.md","markdown":"# 内置 Runtime：模型选择、Provider、重试与故障转移\n\n## 你会学到什么\n\nOpenClaw 的内置 runner 把低层 loop 包装成可运营的运行时：选择模型、准备认证、构建 prompt 和工具、处理空回复/溢出/限流/计费错误、记录 usage，并在必要时故障转移。\n\n学完本课，你要能回答三个问题：这个抽象为什么存在；它在 OpenClaw 哪些文件里落地；它被哪些测试保护。\n\n## AI 概念从零解释\n\nAgent 系统可以拆成四件事：上下文、模型、动作、反馈。上下文告诉模型“到目前为止发生了什么”；模型产生文本或工具调用；工具调用把模型意图变成外部动作；工具结果再进入上下文，成为下一轮决策依据。\n\n本课关注的抽象是：OpenClaw 的内置 runner 把低层 loop 包装成可运营的运行时：选择模型、准备认证、构建 prompt 和工具、处理空回复/溢出/限流/计费错误、记录 usage，并在必要时故障转移。\n\n## 为什么工程上需要这个抽象\n\n可靠运行需要大量边界逻辑；代码复杂度上升，但用户看到的是一个更稳定的个人助手。\n\n## 最小心智模型\n\n```ts\nasync function openclawStyleTurn(input) {\n  const session = await resolveSession(input);\n  const runtime = await selectRuntime(session);\n  const events = runtime.runTurn(input);\n  for await (const event of events) {\n    await persistAndPublish(event);\n  }\n}\n```\n\n针对本课，可压缩成：\n\n```text\nrequest -> runtime plan -> auth plan -> attempt backend -> provider stream -> classify failure -> retry/failover/compact/finalize\n```\n\n## 源码入口\n\n仓库：openclaw/openclaw\n\n提交：`4bb86877e2cf4ae8edc4294de68a693b1119b7c3`\n\n- src/agents/embedded-agent-runner/run.ts: run 入口的依赖、常量和运行时控制逻辑。\n- src/agents/embedded-agent-runner/run/failover-policy.ts 与 assistant-failover.ts: 故障转移决策。\n- src/agents/embedded-agent-runner/model.ts: 模型解析与 provider 规范化。\n\n## 源码阅读路径\n\n1. 先读文档或类型定义，确认边界。\n2. 再读入口函数，找出输入、输出和副作用。\n3. 最后读测试，验证哪些行为是稳定契约。\n\n推荐顺序：\n\n1. `src/agents/embedded-agent-runner/run.ts`\n2. `src/agents/embedded-agent-runner/run/failover-policy.ts 与 assistant-failover.ts`\n3. `src/agents/embedded-agent-runner/model.ts`\n\n## 核心 entities 与 relations\n\n- entity：`concept:05-embedded-runtime-provider`\n- lesson：`lesson:05-embedded-runtime-provider`\n- claim：`claim-05-embedded-runtime-provider`\n- relations：见 `graph/relations.json`\n\n## 关键 claims 与 evidence\n\n- `claim-05-embedded-runtime-provider`：OpenClaw 的内置 runner 把低层 loop 包装成可运营的运行时：选择模型、准备认证、构建 prompt 和工具、处理空回复/溢出/限流/计费错误、记录 usage，并在必要时故障转移。\n- evidence：ev-code-embedded-run, ev-test-run-failover, ev-test-run-overflow, ev-test-model-forward\n\n## 相关测试证据\n\n- ev-test-run-failover: runner 故障转移测试覆盖 provider fallback 错误上下文。\n- ev-test-run-overflow: runner 溢出压缩测试覆盖 context overflow 下的 compaction/retry。\n- ev-test-model-forward: 模型 forward compatibility 测试覆盖新 provider/model 配置兼容。\n\n## 真实源码解释\n\n这一层的源码不是单一函数，而是一组边界协作。阅读时不要急着追所有 import；先抓住入口、状态对象、外部副作用和测试覆盖，再向下展开细节。\n\n## 设计取舍\n\n可靠运行需要大量边界逻辑；代码复杂度上升，但用户看到的是一个更稳定的个人助手。\n\n## Java/backend 类比\n\n像生产级 RPC client：有认证刷新、超时、重试、熔断、降级和指标。\n\n## 常见误解\n\n- 误解 1：以为 agent 只是 prompt。实际源码显示，生产 agent 是 runtime、session、tool、provider、policy、stream 和 persistence 的组合。\n- 误解 2：以为工具越多越好。OpenClaw 的工具策略和沙箱说明，能力必须被权限边界包住。\n- 误解 3：以为测试只测模型输出。仓库大量测试关注 schema、事件、权限、重试、缓存、协议和状态机。\n\n## 自测题\n\n见 `quizzes/05-embedded-runtime-provider.quiz.md`。\n\n## 掌握度验证\n\n见 `mastery/05-embedded-runtime-provider.mastery.md`。\n\n## 最小复刻任务\n\n见 `labs/mini-embedded-runtime-provider/README.md`。\n\n## 学完标准\n\n- 能口头解释本课心智模型。\n- 能指出至少 3 个源码入口。\n- 能用至少 2 个 test evidence 支撑自己的理解。\n- 能完成对应 lab 的最小实现或伪实现。\n\n"},"quiz":{"label":"测试","path":"quizzes/05-embedded-runtime-provider.quiz.md","markdown":"# 内置 Runtime：模型选择、Provider、重试与故障转移 自测题\n\n1. 本课抽象解决了什么工程问题？\n2. 请写出本课最重要的 3 个源码入口。\n3. 用自己的话解释这个路径：`request -> runtime plan -> auth plan -> attempt backend -> provider stream -> classify failure -> retry/failover/compact/finalize`。\n4. 本课至少两个测试证据是什么？它们分别证明什么？\n5. 如果你要修改这一层，最容易破坏的契约是什么？\n\n## 参考答案方向\n\n- 必须引用 `claim-05-embedded-runtime-provider`。\n- 必须至少引用两个 evidence id：ev-test-run-failover, ev-test-run-overflow, ev-test-model-forward。\n- 答案要区分“代码证据”“测试证据”和“推断”。\n\n"},"mastery":{"label":"掌握度","path":"mastery/05-embedded-runtime-provider.mastery.md","markdown":"# 内置 Runtime：模型选择、Provider、重试与故障转移 掌握度验证\n\n## 口头讲解\n\n请在 5 分钟内讲清：\n\n- 这个抽象在 OpenClaw 中为什么存在。\n- 它和上一层/下一层的边界是什么。\n- 它的失败模式是什么。\n\n## 源码定位\n\n不看课程正文，直接在仓库中定位：\n\n- `src/agents/embedded-agent-runner/run.ts`\n- `src/agents/embedded-agent-runner/run/failover-policy.ts 与 assistant-failover.ts`\n- `src/agents/embedded-agent-runner/model.ts`\n\n## 通过标准\n\n- 能解释 `request -> runtime plan -> auth plan -> attempt backend -> provider stream -> classify failure -> retry/failover/compact/finalize`。\n- 能把至少两个 test evidence 讲成行为契约，而不是只念文件名。\n- 能指出一个可能的重构风险。\n\n"},"lab":{"label":"实验","path":"labs/mini-embedded-runtime-provider/README.md","markdown":"# 实验：内置 Runtime：模型选择、Provider、重试与故障转移\n\n## 目标\n\n复刻本课的最小版本，不追求完整 OpenClaw，只追求抓住工程边界。\n\n## 任务\n\n1. 写出本课心智模型的伪代码。\n2. 标出输入、输出、副作用和错误路径。\n3. 写 2 个测试用例描述。\n4. 对照源码 evidence 修正你的模型。\n\n## 起始伪代码\n\n```ts\ntype Event = { type: string; payload?: unknown };\n\nasync function exercise(input: unknown): Promise\u003cEvent[]> {\n  const events: Event[] = [];\n  events.push({ type: \"start\", payload: input });\n  events.push({ type: \"end\" });\n  return events;\n}\n```\n\n## 对照 evidence\n\n- ev-code-embedded-run\n- ev-test-run-failover\n- ev-test-run-overflow\n- ev-test-model-forward\n\n## 完成标准\n\n你能解释自己的伪实现和 OpenClaw 源码之间少了哪些生产级能力。\n\n"}}},{"id":"06-sessions-acp-control-plane","title":"会话与 ACP 控制面：把一次 turn 变成可管理任务","status":"complete","depends_on":["05-embedded-runtime-provider"],"estimated_hours":3,"source_scope":["README.md","docs/agent-runtime-architecture.md","src/acp/control-plane/manager.core.ts","src/acp/control-plane/manager.turn-runner.ts","src/acp/control-plane/session-actor-queue.ts"],"claim_ids":["claim-06-sessions-acp-control-plane"],"evidence_ids":["ev-code-acp-manager","ev-code-acp-turn","ev-code-acp-stream","ev-test-acp-manager","ev-test-acp-turn-runner","ev-test-acp-runtime-cache"],"sections":{"lesson":{"label":"课程","path":"lessons/06-sessions-acp-control-plane.md","markdown":"# 会话与 ACP 控制面：把一次 turn 变成可管理任务\n\n## 你会学到什么\n\nagent 不是孤立函数调用，而是有 session key、runtime handle、active turn、取消、超时、后台任务进度和 backend failover 的长生命周期对象。\n\n学完本课，你要能回答三个问题：这个抽象为什么存在；它在 OpenClaw 哪些文件里落地；它被哪些测试保护。\n\n## AI 概念从零解释\n\nAgent 系统可以拆成四件事：上下文、模型、动作、反馈。上下文告诉模型“到目前为止发生了什么”；模型产生文本或工具调用；工具调用把模型意图变成外部动作；工具结果再进入上下文，成为下一轮决策依据。\n\n本课关注的抽象是：agent 不是孤立函数调用，而是有 session key、runtime handle、active turn、取消、超时、后台任务进度和 backend failover 的长生命周期对象。\n\n## 为什么工程上需要这个抽象\n\n单 session 串行化降低并发冲突，但系统必须明确后台任务、取消和超时的语义。\n\n## 最小心智模型\n\n```ts\nasync function openclawStyleTurn(input) {\n  const session = await resolveSession(input);\n  const runtime = await selectRuntime(session);\n  const events = runtime.runTurn(input);\n  for await (const event of events) {\n    await persistAndPublish(event);\n  }\n}\n```\n\n针对本课，可压缩成：\n\n```text\nsessionKey -> actor queue -> runtime handle -> runTurn stream -> background progress -> terminal state\n```\n\n## 源码入口\n\n仓库：openclaw/openclaw\n\n提交：`4bb86877e2cf4ae8edc4294de68a693b1119b7c3`\n\n- src/acp/control-plane/manager.core.ts: AcpSessionManager 的 session resolution、handle cache、actor queue。\n- src/acp/control-plane/manager.turn-runner.ts: runManagerTurn 的 backend attempt、active turn、event stream、timeout。\n- src/acp/control-plane/session-actor-queue.ts: 同一 session 的串行化执行。\n\n## 源码阅读路径\n\n1. 先读文档或类型定义，确认边界。\n2. 再读入口函数，找出输入、输出和副作用。\n3. 最后读测试，验证哪些行为是稳定契约。\n\n推荐顺序：\n\n1. `src/acp/control-plane/manager.core.ts`\n2. `src/acp/control-plane/manager.turn-runner.ts`\n3. `src/acp/control-plane/session-actor-queue.ts`\n\n## 核心 entities 与 relations\n\n- entity：`concept:06-sessions-acp-control-plane`\n- lesson：`lesson:06-sessions-acp-control-plane`\n- claim：`claim-06-sessions-acp-control-plane`\n- relations：见 `graph/relations.json`\n\n## 关键 claims 与 evidence\n\n- `claim-06-sessions-acp-control-plane`：agent 不是孤立函数调用，而是有 session key、runtime handle、active turn、取消、超时、后台任务进度和 backend failover 的长生命周期对象。\n- evidence：ev-code-acp-manager, ev-code-acp-turn, ev-code-acp-stream, ev-test-acp-manager, ev-test-acp-turn-runner, ev-test-acp-runtime-cache\n\n## 相关测试证据\n\n- ev-test-acp-manager: ACP manager 测试覆盖 session manager 的基础行为。\n- ev-test-acp-turn-runner: ACP turn 结果测试覆盖 turn 输出与终止结果。\n- ev-test-acp-runtime-cache: runtime cache 测试覆盖 handle cache 生命周期。\n\n## 真实源码解释\n\n`AcpSessionManager` 保存 actor queue、runtime handle cache 和 active turn map。`runManagerTurn` 为一次 turn 解析 backend candidate，确保 runtime handle，设置 running 状态，组合 abort signal，消费 runtime 事件流，并在超时/失败时记录 terminal 状态或进入 failover。\n\n## 设计取舍\n\n单 session 串行化降低并发冲突，但系统必须明确后台任务、取消和超时的语义。\n\n## Java/backend 类比\n\n像 Akka actor 或 Orleans grain：每个 session 是一个 actor，消息按序处理。\n\n## 常见误解\n\n- 误解 1：以为 agent 只是 prompt。实际源码显示，生产 agent 是 runtime、session、tool、provider、policy、stream 和 persistence 的组合。\n- 误解 2：以为工具越多越好。OpenClaw 的工具策略和沙箱说明，能力必须被权限边界包住。\n- 误解 3：以为测试只测模型输出。仓库大量测试关注 schema、事件、权限、重试、缓存、协议和状态机。\n\n## 自测题\n\n见 `quizzes/06-sessions-acp-control-plane.quiz.md`。\n\n## 掌握度验证\n\n见 `mastery/06-sessions-acp-control-plane.mastery.md`。\n\n## 最小复刻任务\n\n见 `labs/mini-sessions-acp-control-plane/README.md`。\n\n## 学完标准\n\n- 能口头解释本课心智模型。\n- 能指出至少 3 个源码入口。\n- 能用至少 2 个 test evidence 支撑自己的理解。\n- 能完成对应 lab 的最小实现或伪实现。\n\n"},"quiz":{"label":"测试","path":"quizzes/06-sessions-acp-control-plane.quiz.md","markdown":"# 会话与 ACP 控制面：把一次 turn 变成可管理任务 自测题\n\n1. 本课抽象解决了什么工程问题？\n2. 请写出本课最重要的 3 个源码入口。\n3. 用自己的话解释这个路径：`sessionKey -> actor queue -> runtime handle -> runTurn stream -> background progress -> terminal state`。\n4. 本课至少两个测试证据是什么？它们分别证明什么？\n5. 如果你要修改这一层，最容易破坏的契约是什么？\n\n## 参考答案方向\n\n- 必须引用 `claim-06-sessions-acp-control-plane`。\n- 必须至少引用两个 evidence id：ev-test-acp-manager, ev-test-acp-turn-runner, ev-test-acp-runtime-cache。\n- 答案要区分“代码证据”“测试证据”和“推断”。\n\n"},"mastery":{"label":"掌握度","path":"mastery/06-sessions-acp-control-plane.mastery.md","markdown":"# 会话与 ACP 控制面：把一次 turn 变成可管理任务 掌握度验证\n\n## 口头讲解\n\n请在 5 分钟内讲清：\n\n- 这个抽象在 OpenClaw 中为什么存在。\n- 它和上一层/下一层的边界是什么。\n- 它的失败模式是什么。\n\n## 源码定位\n\n不看课程正文，直接在仓库中定位：\n\n- `src/acp/control-plane/manager.core.ts`\n- `src/acp/control-plane/manager.turn-runner.ts`\n- `src/acp/control-plane/session-actor-queue.ts`\n\n## 通过标准\n\n- 能解释 `sessionKey -> actor queue -> runtime handle -> runTurn stream -> background progress -> terminal state`。\n- 能把至少两个 test evidence 讲成行为契约，而不是只念文件名。\n- 能指出一个可能的重构风险。\n\n"},"lab":{"label":"实验","path":"labs/mini-sessions-acp-control-plane/README.md","markdown":"# 实验：会话与 ACP 控制面：把一次 turn 变成可管理任务\n\n## 目标\n\n复刻本课的最小版本，不追求完整 OpenClaw，只追求抓住工程边界。\n\n## 任务\n\n1. 写出本课心智模型的伪代码。\n2. 标出输入、输出、副作用和错误路径。\n3. 写 2 个测试用例描述。\n4. 对照源码 evidence 修正你的模型。\n\n## 起始伪代码\n\n```ts\ntype Event = { type: string; payload?: unknown };\n\nasync function exercise(input: unknown): Promise\u003cEvent[]> {\n  const events: Event[] = [];\n  events.push({ type: \"start\", payload: input });\n  events.push({ type: \"end\" });\n  return events;\n}\n```\n\n## 对照 evidence\n\n- ev-code-acp-manager\n- ev-code-acp-turn\n- ev-code-acp-stream\n- ev-test-acp-manager\n- ev-test-acp-turn-runner\n- ev-test-acp-runtime-cache\n\n## 完成标准\n\n你能解释自己的伪实现和 OpenClaw 源码之间少了哪些生产级能力。\n\n"}}},{"id":"07-plugin-sdk-providers","title":"插件 SDK 与 Provider 扩展：把生态接入运行时","status":"complete","depends_on":["06-sessions-acp-control-plane"],"estimated_hours":3,"source_scope":["README.md","docs/agent-runtime-architecture.md","src/plugin-sdk/plugin-entry.ts","src/plugin-sdk/provider-entry.ts","src/plugin-sdk/provider-tools.ts"],"claim_ids":["claim-07-plugin-sdk-providers"],"evidence_ids":["ev-code-plugin-entry","ev-code-provider-entry","ev-code-provider-tools","ev-test-plugin-entry","ev-test-provider-entry","ev-test-provider-tools"],"sections":{"lesson":{"label":"课程","path":"lessons/07-plugin-sdk-providers.md","markdown":"# 插件 SDK 与 Provider 扩展：把生态接入运行时\n\n## 你会学到什么\n\n插件 SDK 是 OpenClaw 的扩展边界：插件可以注册 provider、工具、命令、会话 action、hook、UI、模型目录和安全审计能力。\n\n学完本课，你要能回答三个问题：这个抽象为什么存在；它在 OpenClaw 哪些文件里落地；它被哪些测试保护。\n\n## AI 概念从零解释\n\nAgent 系统可以拆成四件事：上下文、模型、动作、反馈。上下文告诉模型“到目前为止发生了什么”；模型产生文本或工具调用；工具调用把模型意图变成外部动作；工具结果再进入上下文，成为下一轮决策依据。\n\n本课关注的抽象是：插件 SDK 是 OpenClaw 的扩展边界：插件可以注册 provider、工具、命令、会话 action、hook、UI、模型目录和安全审计能力。\n\n## 为什么工程上需要这个抽象\n\n扩展性要求稳定 SDK barrel；插件不能直接依赖 src 内部，否则升级成本和安全边界都会失控。\n\n## 最小心智模型\n\n```ts\nasync function openclawStyleTurn(input) {\n  const session = await resolveSession(input);\n  const runtime = await selectRuntime(session);\n  const events = runtime.runTurn(input);\n  for await (const event of events) {\n    await persistAndPublish(event);\n  }\n}\n```\n\n针对本课，可压缩成：\n\n```text\nplugin manifest -> definePluginEntry -> register(api) -> provider/tool/session/action hooks -> runtime consumes SDK barrels\n```\n\n## 源码入口\n\n仓库：openclaw/openclaw\n\n提交：`4bb86877e2cf4ae8edc4294de68a693b1119b7c3`\n\n- src/plugin-sdk/plugin-entry.ts: 对外导出的插件 API 类型与 definePluginEntry。\n- src/plugin-sdk/provider-entry.ts: defineSingleProviderPluginEntry 注册 provider、auth、catalog。\n- src/plugin-sdk/provider-tools.ts: provider 侧工具 schema 兼容处理。\n\n## 源码阅读路径\n\n1. 先读文档或类型定义，确认边界。\n2. 再读入口函数，找出输入、输出和副作用。\n3. 最后读测试，验证哪些行为是稳定契约。\n\n推荐顺序：\n\n1. `src/plugin-sdk/plugin-entry.ts`\n2. `src/plugin-sdk/provider-entry.ts`\n3. `src/plugin-sdk/provider-tools.ts`\n\n## 核心 entities 与 relations\n\n- entity：`concept:07-plugin-sdk-providers`\n- lesson：`lesson:07-plugin-sdk-providers`\n- claim：`claim-07-plugin-sdk-providers`\n- relations：见 `graph/relations.json`\n\n## 关键 claims 与 evidence\n\n- `claim-07-plugin-sdk-providers`：插件 SDK 是 OpenClaw 的扩展边界：插件可以注册 provider、工具、命令、会话 action、hook、UI、模型目录和安全审计能力。\n- evidence：ev-code-plugin-entry, ev-code-provider-entry, ev-code-provider-tools, ev-test-plugin-entry, ev-test-provider-entry, ev-test-provider-tools\n\n## 相关测试证据\n\n- ev-test-plugin-entry: 插件 package contract 测试支持插件 manifest/entry 的约束。\n- ev-test-provider-entry: provider runtime 测试支持 provider 注册/运行时解析。\n- ev-test-provider-tools: provider tools 测试支持 schema 兼容工具函数。\n\n## 真实源码解释\n\n这一层的源码不是单一函数，而是一组边界协作。阅读时不要急着追所有 import；先抓住入口、状态对象、外部副作用和测试覆盖，再向下展开细节。\n\n## 设计取舍\n\n扩展性要求稳定 SDK barrel；插件不能直接依赖 src 内部，否则升级成本和安全边界都会失控。\n\n## Java/backend 类比\n\n像 Spring Boot starter 或 VS Code extension API：通过稳定扩展点接入核心系统。\n\n## 常见误解\n\n- 误解 1：以为 agent 只是 prompt。实际源码显示，生产 agent 是 runtime、session、tool、provider、policy、stream 和 persistence 的组合。\n- 误解 2：以为工具越多越好。OpenClaw 的工具策略和沙箱说明，能力必须被权限边界包住。\n- 误解 3：以为测试只测模型输出。仓库大量测试关注 schema、事件、权限、重试、缓存、协议和状态机。\n\n## 自测题\n\n见 `quizzes/07-plugin-sdk-providers.quiz.md`。\n\n## 掌握度验证\n\n见 `mastery/07-plugin-sdk-providers.mastery.md`。\n\n## 最小复刻任务\n\n见 `labs/mini-plugin-sdk-providers/README.md`。\n\n## 学完标准\n\n- 能口头解释本课心智模型。\n- 能指出至少 3 个源码入口。\n- 能用至少 2 个 test evidence 支撑自己的理解。\n- 能完成对应 lab 的最小实现或伪实现。\n\n"},"quiz":{"label":"测试","path":"quizzes/07-plugin-sdk-providers.quiz.md","markdown":"# 插件 SDK 与 Provider 扩展：把生态接入运行时 自测题\n\n1. 本课抽象解决了什么工程问题？\n2. 请写出本课最重要的 3 个源码入口。\n3. 用自己的话解释这个路径：`plugin manifest -> definePluginEntry -> register(api) -> provider/tool/session/action hooks -> runtime consumes SDK barrels`。\n4. 本课至少两个测试证据是什么？它们分别证明什么？\n5. 如果你要修改这一层，最容易破坏的契约是什么？\n\n## 参考答案方向\n\n- 必须引用 `claim-07-plugin-sdk-providers`。\n- 必须至少引用两个 evidence id：ev-test-plugin-entry, ev-test-provider-entry, ev-test-provider-tools。\n- 答案要区分“代码证据”“测试证据”和“推断”。\n\n"},"mastery":{"label":"掌握度","path":"mastery/07-plugin-sdk-providers.mastery.md","markdown":"# 插件 SDK 与 Provider 扩展：把生态接入运行时 掌握度验证\n\n## 口头讲解\n\n请在 5 分钟内讲清：\n\n- 这个抽象在 OpenClaw 中为什么存在。\n- 它和上一层/下一层的边界是什么。\n- 它的失败模式是什么。\n\n## 源码定位\n\n不看课程正文，直接在仓库中定位：\n\n- `src/plugin-sdk/plugin-entry.ts`\n- `src/plugin-sdk/provider-entry.ts`\n- `src/plugin-sdk/provider-tools.ts`\n\n## 通过标准\n\n- 能解释 `plugin manifest -> definePluginEntry -> register(api) -> provider/tool/session/action hooks -> runtime consumes SDK barrels`。\n- 能把至少两个 test evidence 讲成行为契约，而不是只念文件名。\n- 能指出一个可能的重构风险。\n\n"},"lab":{"label":"实验","path":"labs/mini-plugin-sdk-providers/README.md","markdown":"# 实验：插件 SDK 与 Provider 扩展：把生态接入运行时\n\n## 目标\n\n复刻本课的最小版本，不追求完整 OpenClaw，只追求抓住工程边界。\n\n## 任务\n\n1. 写出本课心智模型的伪代码。\n2. 标出输入、输出、副作用和错误路径。\n3. 写 2 个测试用例描述。\n4. 对照源码 evidence 修正你的模型。\n\n## 起始伪代码\n\n```ts\ntype Event = { type: string; payload?: unknown };\n\nasync function exercise(input: unknown): Promise\u003cEvent[]> {\n  const events: Event[] = [];\n  events.push({ type: \"start\", payload: input });\n  events.push({ type: \"end\" });\n  return events;\n}\n```\n\n## 对照 evidence\n\n- ev-code-plugin-entry\n- ev-code-provider-entry\n- ev-code-provider-tools\n- ev-test-plugin-entry\n- ev-test-provider-entry\n- ev-test-provider-tools\n\n## 完成标准\n\n你能解释自己的伪实现和 OpenClaw 源码之间少了哪些生产级能力。\n\n"}}},{"id":"08-devices-channels-security","title":"渠道、设备节点与安全默认值","status":"complete","depends_on":["07-plugin-sdk-providers"],"estimated_hours":3,"source_scope":["README.md","docs/agent-runtime-architecture.md","README.md","packages/gateway-protocol/src/schema.ts","apps/android/app/src/test/java/.../node 与 gateway 测试"],"claim_ids":["claim-08-devices-channels-security"],"evidence_ids":["ev-readme-security","ev-test-android-device-auth","ev-test-gateway-protocol","ev-test-android-node-handlers"],"sections":{"lesson":{"label":"课程","path":"lessons/08-devices-channels-security.md","markdown":"# 渠道、设备节点与安全默认值\n\n## 你会学到什么\n\nOpenClaw 面对真实外部渠道和本机设备能力，所以安全模型必须默认把 inbound DM 当成不可信输入，并用 pairing、allowlist、sandbox、工具策略和节点权限收口。\n\n学完本课，你要能回答三个问题：这个抽象为什么存在；它在 OpenClaw 哪些文件里落地；它被哪些测试保护。\n\n## AI 概念从零解释\n\nAgent 系统可以拆成四件事：上下文、模型、动作、反馈。上下文告诉模型“到目前为止发生了什么”；模型产生文本或工具调用；工具调用把模型意图变成外部动作；工具结果再进入上下文，成为下一轮决策依据。\n\n本课关注的抽象是：OpenClaw 面对真实外部渠道和本机设备能力，所以安全模型必须默认把 inbound DM 当成不可信输入，并用 pairing、allowlist、sandbox、工具策略和节点权限收口。\n\n## 为什么工程上需要这个抽象\n\n默认安全会让初次接入多一步 pairing，但避免把私人助手变成开放远程执行入口。\n\n## 最小心智模型\n\n```ts\nasync function openclawStyleTurn(input) {\n  const session = await resolveSession(input);\n  const runtime = await selectRuntime(session);\n  const events = runtime.runTurn(input);\n  for await (const event of events) {\n    await persistAndPublish(event);\n  }\n}\n```\n\n针对本课，可压缩成：\n\n```text\nexternal channel/node -> gateway protocol -> identity/pairing -> allowed agent/session -> constrained tool/node action\n```\n\n## 源码入口\n\n仓库：openclaw/openclaw\n\n提交：`4bb86877e2cf4ae8edc4294de68a693b1119b7c3`\n\n- README.md: DM pairing、allowlist、sandbox 默认安全说明。\n- packages/gateway-protocol/src/schema.ts: Gateway 协议 schema。\n- apps/android/app/src/test/java/.../node 与 gateway 测试: Android 节点能力、设备认证、通知/相机/联系人等 handler。\n\n## 源码阅读路径\n\n1. 先读文档或类型定义，确认边界。\n2. 再读入口函数，找出输入、输出和副作用。\n3. 最后读测试，验证哪些行为是稳定契约。\n\n推荐顺序：\n\n1. `README.md`\n2. `packages/gateway-protocol/src/schema.ts`\n3. `apps/android/app/src/test/java/.../node 与 gateway 测试`\n\n## 核心 entities 与 relations\n\n- entity：`concept:08-devices-channels-security`\n- lesson：`lesson:08-devices-channels-security`\n- claim：`claim-08-devices-channels-security`\n- relations：见 `graph/relations.json`\n\n## 关键 claims 与 evidence\n\n- `claim-08-devices-channels-security`：OpenClaw 面对真实外部渠道和本机设备能力，所以安全模型必须默认把 inbound DM 当成不可信输入，并用 pairing、allowlist、sandbox、工具策略和节点权限收口。\n- evidence：ev-readme-security, ev-test-android-device-auth, ev-test-gateway-protocol, ev-test-android-node-handlers\n\n## 相关测试证据\n\n- ev-test-android-device-auth: Android device auth 测试支持设备认证 payload 语义。\n- ev-test-gateway-protocol: gateway-protocol 测试支持 Gateway 协议导出与 schema 契约。\n- ev-test-android-node-handlers: Android node invoke dispatcher 测试支持节点能力调用分发。\n\n## 真实源码解释\n\n这一层的源码不是单一函数，而是一组边界协作。阅读时不要急着追所有 import；先抓住入口、状态对象、外部副作用和测试覆盖，再向下展开细节。\n\n## 设计取舍\n\n默认安全会让初次接入多一步 pairing，但避免把私人助手变成开放远程执行入口。\n\n## Java/backend 类比\n\n像企业后端的 zero-trust ingress：先鉴权、授权、限权，再进入业务处理。\n\n## 常见误解\n\n- 误解 1：以为 agent 只是 prompt。实际源码显示，生产 agent 是 runtime、session、tool、provider、policy、stream 和 persistence 的组合。\n- 误解 2：以为工具越多越好。OpenClaw 的工具策略和沙箱说明，能力必须被权限边界包住。\n- 误解 3：以为测试只测模型输出。仓库大量测试关注 schema、事件、权限、重试、缓存、协议和状态机。\n\n## 自测题\n\n见 `quizzes/08-devices-channels-security.quiz.md`。\n\n## 掌握度验证\n\n见 `mastery/08-devices-channels-security.mastery.md`。\n\n## 最小复刻任务\n\n见 `labs/mini-devices-channels-security/README.md`。\n\n## 学完标准\n\n- 能口头解释本课心智模型。\n- 能指出至少 3 个源码入口。\n- 能用至少 2 个 test evidence 支撑自己的理解。\n- 能完成对应 lab 的最小实现或伪实现。\n\n"},"quiz":{"label":"测试","path":"quizzes/08-devices-channels-security.quiz.md","markdown":"# 渠道、设备节点与安全默认值 自测题\n\n1. 本课抽象解决了什么工程问题？\n2. 请写出本课最重要的 3 个源码入口。\n3. 用自己的话解释这个路径：`external channel/node -> gateway protocol -> identity/pairing -> allowed agent/session -> constrained tool/node action`。\n4. 本课至少两个测试证据是什么？它们分别证明什么？\n5. 如果你要修改这一层，最容易破坏的契约是什么？\n\n## 参考答案方向\n\n- 必须引用 `claim-08-devices-channels-security`。\n- 必须至少引用两个 evidence id：ev-test-android-device-auth, ev-test-gateway-protocol, ev-test-android-node-handlers。\n- 答案要区分“代码证据”“测试证据”和“推断”。\n\n"},"mastery":{"label":"掌握度","path":"mastery/08-devices-channels-security.mastery.md","markdown":"# 渠道、设备节点与安全默认值 掌握度验证\n\n## 口头讲解\n\n请在 5 分钟内讲清：\n\n- 这个抽象在 OpenClaw 中为什么存在。\n- 它和上一层/下一层的边界是什么。\n- 它的失败模式是什么。\n\n## 源码定位\n\n不看课程正文，直接在仓库中定位：\n\n- `README.md`\n- `packages/gateway-protocol/src/schema.ts`\n- `apps/android/app/src/test/java/.../node 与 gateway 测试`\n\n## 通过标准\n\n- 能解释 `external channel/node -> gateway protocol -> identity/pairing -> allowed agent/session -> constrained tool/node action`。\n- 能把至少两个 test evidence 讲成行为契约，而不是只念文件名。\n- 能指出一个可能的重构风险。\n\n"},"lab":{"label":"实验","path":"labs/mini-devices-channels-security/README.md","markdown":"# 实验：渠道、设备节点与安全默认值\n\n## 目标\n\n复刻本课的最小版本，不追求完整 OpenClaw，只追求抓住工程边界。\n\n## 任务\n\n1. 写出本课心智模型的伪代码。\n2. 标出输入、输出、副作用和错误路径。\n3. 写 2 个测试用例描述。\n4. 对照源码 evidence 修正你的模型。\n\n## 起始伪代码\n\n```ts\ntype Event = { type: string; payload?: unknown };\n\nasync function exercise(input: unknown): Promise\u003cEvent[]> {\n  const events: Event[] = [];\n  events.push({ type: \"start\", payload: input });\n  events.push({ type: \"end\" });\n  return events;\n}\n```\n\n## 对照 evidence\n\n- ev-readme-security\n- ev-test-android-device-auth\n- ev-test-gateway-protocol\n- ev-test-android-node-handlers\n\n## 完成标准\n\n你能解释自己的伪实现和 OpenClaw 源码之间少了哪些生产级能力。\n\n"}}}],"extras":{"readme":{"label":"入口说明","path":"README.md","markdown":"# OpenClaw 源码学习课程包\n\n目标仓库：openclaw/openclaw\n\n课程基准提交：`4bb86877e2cf4ae8edc4294de68a693b1119b7c3`\n\n生成日期：2026-06-02\n\n这是一份面向后端工程师的 OpenClaw 源码课程。它不会把 OpenClaw 当成普通 CLI 项目讲，而是按“个人 AI 助手平台”的真实工程边界来学习：Gateway、agent core、内置 runtime、工具策略、ACP 会话控制面、插件 SDK、Provider、渠道和设备节点。\n\n## 怎么学习\n\n1. 先读 [learning-path.md](learning-path.md)，按 8 个单元推进。\n2. 每个单元读 `lessons/`，再做 `quizzes/`、`mastery/` 和 `labs/`。\n3. 用 [learning.html](learning.html) 做主学习页，可对不懂的段落做疑问/笔记标注。\n4. 遇到“证据不足”或“推断性说明”，看 [review/weak-evidence.md](review/weak-evidence.md)。\n\n## 范围\n\n重点源码范围：\n\n- `packages/agent-core/`\n- `src/agents/`\n- `src/acp/`\n- `src/plugin-sdk/`\n- `packages/plugin-sdk/`\n- `packages/gateway-protocol/`\n- Android 节点测试中的设备/节点能力证据\n\n## 产物\n\n- 完整课程：`lessons/*.md`\n- 自测题：`quizzes/*.quiz.md`\n- 掌握度检查：`mastery/*.mastery.md`\n- 实验：`labs/*/README.md`\n- 证据图谱：`graph/*.json`\n- UA 扫描结果：`raw/code-graph/*.scan-result.json` 与 `*.batches.json`\n- 静态页面：`learning.html`\n\n"},"path":{"label":"学习路线","path":"learning-path.md","markdown":"# OpenClaw 学习路线\n\n## 课程目标\n\n学完后，你应该能从源码解释一个 OpenClaw turn 如何从外部消息进入 Gateway，经由 session/runtime/tool/provider，最后产出回复或工具结果；也能设计一个小型 provider/plugin/tool，并说清楚它该放在哪个边界里。\n\n## 路线\n\n1. **OpenClaw 全局架构：本地优先个人 AI 助手**：把 OpenClaw 先看成一个由 Gateway 调度的本地优先 agent 操作系统：消息入口、agent runtime、工具、插件、设备节点和 UI 都围绕同一个控制面工作。\n2. **Agent Core：从消息到工具调用的最小循环**：agent loop 的本质是一个事件驱动的状态机：追加用户消息，调用模型流，提取工具调用，执行工具，把工具结果写回上下文，再决定是否继续。\n3. **消息、上下文与流式事件**：LLM 应用不是一次请求一次字符串，而是一组消息、系统提示、工具定义和流式事件的组合。OpenClaw 把 partial assistant message 放入上下文并随事件更新。\n4. **工具系统：定义、策略、沙箱与执行前后钩子**：工具调用是 agent 产生外部影响的边界。OpenClaw 同时处理 schema 规范化、allow/deny 策略、沙箱路径、before/after hook、执行顺序和错误归一化。\n5. **内置 Runtime：模型选择、Provider、重试与故障转移**：OpenClaw 的内置 runner 把低层 loop 包装成可运营的运行时：选择模型、准备认证、构建 prompt 和工具、处理空回复/溢出/限流/计费错误、记录 usage，并在必要时故障转移。\n6. **会话与 ACP 控制面：把一次 turn 变成可管理任务**：agent 不是孤立函数调用，而是有 session key、runtime handle、active turn、取消、超时、后台任务进度和 backend failover 的长生命周期对象。\n7. **插件 SDK 与 Provider 扩展：把生态接入运行时**：插件 SDK 是 OpenClaw 的扩展边界：插件可以注册 provider、工具、命令、会话 action、hook、UI、模型目录和安全审计能力。\n8. **渠道、设备节点与安全默认值**：OpenClaw 面对真实外部渠道和本机设备能力，所以安全模型必须默认把 inbound DM 当成不可信输入，并用 pairing、allowlist、sandbox、工具策略和节点权限收口。\n\n## 学习节奏\n\n- 第 1 天：单元 1-2，建立全局架构和低层 agent loop 模型。\n- 第 2 天：单元 3-4，掌握消息流、工具调用、策略和沙箱。\n- 第 3 天：单元 5-6，学习生产级 runtime、会话控制面和 ACP。\n- 第 4 天：单元 7-8，学习插件生态、Provider、渠道/节点安全。\n- 第 5 天：做 capstone，把一个最小 OpenClaw 风格 agent runtime 画出来并写伪实现。\n\n"},"finalQuiz":{"label":"总复盘测试","path":"quizzes/99-final-review.quiz.md","markdown":"# OpenClaw 总复盘测试\n\n1. 用 10 行以内描述 OpenClaw 的 Gateway、agent runtime、tool、provider、plugin、node 之间的关系。\n2. 为什么 `agent-core` 不直接处理渠道和 OpenClaw 配置？\n3. `runLoop` 在什么条件下继续下一轮？在什么条件下结束？\n4. 工具系统为什么要同时有 schema normalization、policy、before/after hook、日志脱敏？\n5. ACP session manager 为什么需要 actor queue 和 runtime handle cache？\n6. 插件 SDK 的稳定 barrel 对生态有什么价值？\n7. inbound DM 为什么默认不应直接进入 agent？\n\n评分标准：能用源码文件名和至少 6 个 evidence id 支撑答案，视为通过。\n\n"},"capstoneMastery":{"label":"Capstone 掌握度","path":"mastery/99-capstone.mastery.md","markdown":"# Capstone 掌握度检查\n\n## 任务\n\n画出并讲解一个 OpenClaw turn 的端到端路径：\n\n```text\nchannel/node input -> Gateway/session routing -> runtime selection -> model stream -> tool calls -> tool results -> reply delivery\n```\n\n## 通过标准\n\n- 能指出 `packages/agent-core/src/agent-loop.ts` 是低层循环，不是完整产品 runtime。\n- 能解释 `src/agents/embedded-agent-runner/run.ts` 为什么复杂。\n- 能解释 `src/acp/control-plane/manager.turn-runner.ts` 如何管理长期 turn。\n- 能解释 plugin/provider 通过 SDK barrel 接入，而不是直接 import `src/**`。\n- 能说清楚 DM pairing、allowlist、sandbox、tool policy 分别防什么风险。\n\n"},"capstoneLab":{"label":"Capstone 实验","path":"labs/99-capstone-mini-langchain-agent/README.md","markdown":"# Capstone 实验：复刻一个 OpenClaw 风格最小运行时\n\n> 目录名沿用学习页构建脚本的默认 capstone 路径；本实验内容是 OpenClaw，不是 LangChain。\n\n## 目标\n\n写一个最小伪实现，包含：\n\n- `AgentMessage[]`\n- `streamFn(model, context)`\n- `ToolDefinition`\n- `runLoop`\n- `SessionManager`\n- `PluginApi.registerTool/registerProvider`\n\n## 要求\n\n1. 工具调用必须生成 `ToolResultMessage` 并写回上下文。\n2. session manager 必须同一 session 串行执行。\n3. provider 必须通过注册表接入。\n4. inbound message 必须经过 allowlist 检查。\n\n## 对照源码\n\n- `packages/agent-core/src/agent-loop.ts`\n- `src/acp/control-plane/manager.core.ts`\n- `src/plugin-sdk/provider-entry.ts`\n\n"},"weakEvidence":{"label":"弱证据报告","path":"review/weak-evidence.md","markdown":"# 弱证据报告\n\n## 已确认\n\n- UA 确定性扫描已覆盖 `packages/agent-core`、`src/agents`、`src/acp`、`packages/plugin-sdk`。\n- 课程中的核心 claims 都绑定了 code/docs/test evidence。\n- 每个非导论单元至少绑定 2 个 test evidence。\n\n## 限制\n\n- 没有运行 live provider 测试，因为这通常需要外部模型凭据和真实渠道/设备环境。\n- 没有使用 native slash-command subagents；本包使用 UA scan/batch + 源码人工证据编译生成 UA-compatible learning graph。\n- Android/iOS/macOS 节点部分以测试和协议文件作为证据，没有构建移动端应用。\n\n## 建议后续补强\n\n- 在有凭据时运行 `OPENCLAW_LIVE_TEST=1 pnpm test src/agents/embedded-agent-runner-*.live.test.ts`。\n- 为实际 channel 做一次 docker e2e 或真实测试箱验证。\n\n"},"progress":{"label":"学习进度","path":"progress/learning-progress.md","markdown":"# 学习进度\n\n| 单元 | 状态 | 笔记 |\n| --- | --- | --- |\n| 01-platform-map OpenClaw 全局架构：本地优先个人 AI 助手 | 未开始 | |\n| 02-agent-core-loop Agent Core：从消息到工具调用的最小循环 | 未开始 | |\n| 03-message-context-stream 消息、上下文与流式事件 | 未开始 | |\n| 04-tools-policy-sandbox 工具系统：定义、策略、沙箱与执行前后钩子 | 未开始 | |\n| 05-embedded-runtime-provider 内置 Runtime：模型选择、Provider、重试与故障转移 | 未开始 | |\n| 06-sessions-acp-control-plane 会话与 ACP 控制面：把一次 turn 变成可管理任务 | 未开始 | |\n| 07-plugin-sdk-providers 插件 SDK 与 Provider 扩展：把生态接入运行时 | 未开始 | |\n| 08-devices-channels-security 渠道、设备节点与安全默认值 | 未开始 | |\n\n## 学习者标注\n\n请在 `learning.html` 中选中文字添加“疑问”或“学习笔记”。导出的 annotated HTML 可以再交给 AI 回填答案并改进课程。\n\n"},"testEvidence":{"label":"测试证据矩阵","path":"review/test-evidence-matrix.md","markdown":"# 测试证据矩阵\n\n| 课程 | 核心测试证据 |\n| --- | --- |\n| 01-platform-map | ev-test-agent-loop-basic, ev-test-acp-manager |\n| 02-agent-core-loop | ev-test-agent-loop-basic, ev-test-agent-loop-tool |\n| 03-message-context-stream | ev-test-agent-loop-basic, ev-test-llm-validation, ev-test-acp-turn-stream |\n| 04-tools-policy-sandbox | ev-test-tool-adapter, ev-test-tool-policy, ev-test-tool-construction |\n| 05-embedded-runtime-provider | ev-test-run-failover, ev-test-run-overflow, ev-test-model-forward |\n| 06-sessions-acp-control-plane | ev-test-acp-manager, ev-test-acp-turn-runner, ev-test-acp-runtime-cache |\n| 07-plugin-sdk-providers | ev-test-plugin-entry, ev-test-provider-entry, ev-test-provider-tools |\n| 08-devices-channels-security | ev-test-android-device-auth, ev-test-gateway-protocol, ev-test-android-node-handlers |\n\n"}}}</script>
  <script id="learning-annotations-data" type="application/json">[]</script>
  <script>
    const DATA=JSON.parse(document.getElementById('learning-data').textContent);
    const labels={lesson:'课程',quiz:'测试',mastery:'掌握度',lab:'实验'};
    const state={kind:'unit',unit:DATA.units[0]?.id,section:'lesson',extra:'readme',noteView:'all'};
    const slug=(s,i)=>s.toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'')||'h-'+i;
    const noteStoreKey='agent-code-learning-pack-annotations:'+location.pathname;
    let annotations=loadAnnotations();
    let pendingQuote='';
    let pendingType='question';
    function md(x){return DOMPurify.sanitize(marked.parse(x||''));}
    function doc(){return state.kind==='extra'?DATA.extras[state.extra]:DATA.units.find(u=>u.id===state.unit).sections[state.section];}
    function loadAnnotations(){let embedded=[];let stored=[];try{embedded=JSON.parse(document.getElementById('learning-annotations-data')?.textContent||'[]');}catch{}try{stored=JSON.parse(localStorage.getItem(noteStoreKey)||'[]');}catch{}const merged=[...embedded,...stored];const seen=new Set();return merged.filter(n=>{if(!n||!n.id||seen.has(n.id))return false;seen.add(n.id);return true;});}
    function saveAnnotations(){try{localStorage.setItem(noteStoreKey,JSON.stringify(annotations));}catch{}const el=document.getElementById('learning-annotations-data');if(el)el.textContent=JSON.stringify(annotations);}
    function currentDocPath(){return doc().path;}
    function currentNotes(){const p=currentDocPath();return annotations.filter(n=>n.path===p).filter(n=>state.noteView==='all'||(n.type||'question')===state.noteView);}
    function selectionQuote(){const sel=window.getSelection();if(!sel||sel.rangeCount===0)return'';const text=sel.toString().replace(/\s+/g,' ').trim();if(!text)return'';const content=document.getElementById('content');const node=sel.getRangeAt(0).commonAncestorContainer;const owner=node.nodeType===1?node:node.parentElement;if(!content.contains(owner))return'';return text.slice(0,600);}
    function setPendingType(type){pendingType=type;document.getElementById('questionModeBtn').classList.toggle('active',type==='question');document.getElementById('studyNoteModeBtn').classList.toggle('active',type==='note');document.getElementById('noteInput').placeholder=type==='question'?'写下哪里没看懂、希望 AI 后续补充什么。':'写下你的理解、总结、类比或可沉淀进知识库的笔记。';}
    function openNoteModal(){pendingQuote=selectionQuote();if(!pendingQuote){alert('请先在正文里选中一段你看不懂或想记录的内容。');return;}setPendingType('question');document.getElementById('noteQuote').textContent=pendingQuote;document.getElementById('noteInput').value='';document.getElementById('noteModal').classList.add('open');document.getElementById('noteInput').focus();}
    function closeNoteModal(){document.getElementById('noteModal').classList.remove('open');pendingQuote='';}
    function saveNote(){const note=document.getElementById('noteInput').value.trim();if(!note){alert('请先写下注释内容。');return;}const d=doc();annotations.push({id:'note-'+Date.now()+'-'+Math.random().toString(16).slice(2),type:pendingType,path:d.path,title:document.getElementById('pageTitle').textContent,kind:state.kind,unit:state.unit,section:state.section,extra:state.extra,quote:pendingQuote,note,question:pendingType==='question'?note:'',answer:'',createdAt:new Date().toISOString()});saveAnnotations();closeNoteModal();state.noteView=pendingType;render();}
    function textNodes(root){const out=[];const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){if(!node.nodeValue.trim())return NodeFilter.FILTER_REJECT;const p=node.parentElement;if(!p||['SCRIPT','STYLE','TEXTAREA','MARK'].includes(p.tagName))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});let n;while((n=walker.nextNode()))out.push(n);return out;}
    function applyNoteHighlight(note){const root=document.getElementById('content');const q=note.quote.replace(/\s+/g,' ').trim();if(!q)return;for(const node of textNodes(root)){const compact=node.nodeValue.replace(/\s+/g,' ');const idx=compact.indexOf(q);if(idx<0)continue;const raw=node.nodeValue;const rawIdx=raw.indexOf(q);if(rawIdx<0)continue;const mark=document.createElement('mark');mark.className='study-note';mark.dataset.noteId=note.id;mark.dataset.noteType=note.type||'question';mark.title=note.note;mark.textContent=raw.slice(rawIdx,rawIdx+q.length);mark.onclick=()=>{const card=document.querySelector('[data-note-card="'+note.id+'"]');if(card)card.scrollIntoView({behavior:'smooth',block:'center'});};const frag=document.createDocumentFragment();frag.append(document.createTextNode(raw.slice(0,rawIdx)),mark,document.createTextNode(raw.slice(rawIdx+q.length)));node.parentNode.replaceChild(frag,node);break;}}
    function highlightNotes(){annotations.filter(n=>n.path===currentDocPath()).forEach(applyNoteHighlight);}
    function deleteNote(id){annotations=annotations.filter(n=>n.id!==id);saveAnnotations();render();}
    function noteViewTitle(){return state.noteView==='question'?'问答 QA':state.noteView==='note'?'学习笔记':'学习注释';}
    function setNoteView(view){state.noteView=view;render();}
    function renderNotes(){const list=document.getElementById('noteList');if(!list)return;document.getElementById('notePanelTitle').textContent=noteViewTitle();const notes=currentNotes();list.innerHTML='';if(!notes.length){list.innerHTML='<div class="note-empty">当前页面还没有'+noteViewTitle()+'。选中正文后点击左侧“给选中文字加注释”。</div>';return;}notes.forEach((n,i)=>{const type=n.type||'question';const isQuestion=type==='question';const label=isQuestion?'疑问':'学习笔记';const answer=n.answer?'<div class="qa-answer"><p class="note-text"><strong>A：</strong>'+escapeHtml(n.answer)+'</p></div>':'<div class="qa-answer"><p class="note-text"><strong>A：</strong>导出 HTML 给 AI 后，这里会回填解答。</p></div>';const review=n.review?'<div class="qa-answer"><p class="note-text"><strong>校正：</strong>'+escapeHtml(n.review)+'</p></div>':'';const card=document.createElement('div');card.className='note-card';card.dataset.noteCard=n.id;card.innerHTML='<span class="note-type '+type+'">'+label+'</span><p class="note-quote">#'+(i+1)+' 引用：'+escapeHtml(n.quote)+'</p><p class="note-text"><strong>'+(isQuestion?'Q：':'笔记：')+'</strong>'+escapeHtml(n.note)+'</p>'+(isQuestion?answer:review)+'<div class="note-meta">'+new Date(n.createdAt).toLocaleString()+'</div><div class="note-actions"><button type="button" data-delete="'+n.id+'">删除</button></div>';list.appendChild(card);});list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteNote(b.dataset.delete));}
    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function downloadText(filename,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();URL.revokeObjectURL(a.href);a.remove();}
    function exportAnnotatedHtml(){saveAnnotations();const html='<!doctype html>\n'+document.documentElement.outerHTML;const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');downloadText('learning-annotated-'+stamp+'.html',html,'text/html;charset=utf-8');}
    function exportStudyNotesMarkdown(){const notes=annotations.filter(n=>(n.type||'question')==='note');if(!notes.length){alert('还没有学习笔记可以导出。');return;}const body=['# 学习笔记导出',''].concat(notes.map((n,i)=>['## '+(i+1)+'. '+n.title,'','- source: '+n.path,'- created: '+n.createdAt,'','> '+n.quote.replace(/\n/g,'\n> '),'','### 原始笔记','',n.note,'',n.review?'### AI 校正\n\n'+n.review+'\n':''].join('\n'))).join('\n');const stamp=new Date().toISOString().slice(0,10);downloadText('learning-notes-'+stamp+'.md',body,'text/markdown;charset=utf-8');}
    function renderNav(){const ul=document.getElementById('unitList');ul.innerHTML='';DATA.units.forEach(u=>{const b=document.createElement('button');b.className='unit '+(state.kind==='unit'&&state.unit===u.id?'active':'');b.onclick=()=>{state.kind='unit';state.unit=u.id;state.section='lesson';render();};b.innerHTML='<span class="kicker">'+u.id+'</span><span class="name">'+u.title+'</span><span class="deps">'+(u.depends_on?.length?'依赖 '+u.depends_on.join(', '):'起点课程')+'</span>';ul.appendChild(b);});const q=document.getElementById('quick');q.innerHTML='';Object.entries(DATA.extras).forEach(([k,v])=>{const b=document.createElement('button');b.className=state.kind==='extra'&&state.extra===k?'active':'';b.textContent=v.label;b.onclick=()=>{state.kind='extra';state.extra=k;render();};q.appendChild(b);});const mu=document.getElementById('mobileUnit');mu.innerHTML='';DATA.units.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.id+' '+u.title;mu.appendChild(o);});mu.value=state.unit;mu.onchange=e=>{state.kind='unit';state.unit=e.target.value;render();};}
    function renderTabs(){const tabs=document.getElementById('tabs');const ms=document.getElementById('mobileSection');tabs.innerHTML='';ms.innerHTML='';if(state.kind==='extra'){tabs.style.display='none';ms.style.display='none';return;}tabs.style.display='flex';ms.style.display='block';Object.entries(labels).forEach(([k,label])=>{const b=document.createElement('button');b.className='tab '+(state.section===k?'active':'');b.textContent=label;b.onclick=()=>{state.section=k;render();};tabs.appendChild(b);const o=document.createElement('option');o.value=k;o.textContent=label;ms.appendChild(o);});ms.value=state.section;ms.onchange=e=>{state.section=e.target.value;render();};}
    function toc(){const c=document.getElementById('content');const heads=[...c.querySelectorAll('h2,h3')];const t=document.getElementById('toc');t.innerHTML='';heads.forEach((h,i)=>{h.id=slug(h.textContent,i);const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.className=h.tagName.toLowerCase();t.appendChild(a);});if(!heads.length)t.innerHTML='<span class="meta">当前页没有二级目录。</span>';}
    function render(){renderNav();renderTabs();const d=doc();const u=DATA.units.find(x=>x.id===state.unit);document.getElementById('pageTitle').textContent=state.kind==='extra'?d.label:u.title+' · '+labels[state.section];document.getElementById('pageMeta').textContent=state.kind==='extra'?'学习包辅助页面':'课程 '+u.id+' · 状态 '+u.status+(u.depends_on?.length?' · 依赖 '+u.depends_on.join(', '):' · 起点课程');document.getElementById('sourcePath').textContent=d.path;document.getElementById('content').innerHTML=md(d.markdown);highlightNotes();toc();renderNotes();document.title=document.getElementById('pageTitle').textContent+' | Learning Pack';}
    document.getElementById('addNoteBtn').onclick=openNoteModal;
    document.getElementById('viewQaBtn').onclick=()=>setNoteView('question');
    document.getElementById('viewStudyNotesBtn').onclick=()=>setNoteView('note');
    document.getElementById('exportNotesBtn').onclick=exportAnnotatedHtml;
    document.getElementById('exportStudyNotesBtn').onclick=exportStudyNotesMarkdown;
    document.getElementById('questionModeBtn').onclick=()=>setPendingType('question');
    document.getElementById('studyNoteModeBtn').onclick=()=>setPendingType('note');
    document.getElementById('cancelNoteBtn').onclick=closeNoteModal;
    document.getElementById('saveNoteBtn').onclick=saveNote;
    document.getElementById('noteModal').addEventListener('click',e=>{if(e.target.id==='noteModal')closeNoteModal();});
    render();
  </script>
</body>
</html>
