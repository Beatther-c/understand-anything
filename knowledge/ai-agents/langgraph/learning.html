ration.mastery.md","markdown":"# 持久化与远程集成：Checkpoint、Store、SDK 与部署边界 — 掌握度检查\n\n## 口头讲解\n\n不看课程，向同事清晰讲出以下要点：\n\n1. BaseCheckpointSaver 定义了 `get_tuple/put/put_writes/list` 四个核心方法，分别对应：读取快照、写入快照、写入中间结果、列举历史。\n2. InMemorySaver 使用三级 defaultdict（`storage[thread_id][checkpoint_ns][checkpoint_id]`）实现所有接口，支持多租户和子图命名空间隔离。\n3. RemoteGraph 实现 PregelProtocol 接口，通过 LangGraphClient SDK 发起 HTTP 调用，让远程部署的图可以像本地子节点一样使用。\n4. Checkpoint 是 event sourcing 的 snapshot（非增量日志），配合 `channel_versions` 做乐观并发控制。Store 是跨 thread 的共享状态存储。\n\n## 代码阅读检查\n\n- [ ] 能在 `base/__init__.py` L176-348 中找到 BaseCheckpointSaver 的方法签名，解释 `put` 和 `put_writes` 的调用时机差异\n- [ ] 能在 `memory/__init__.py` L33-100 中找到 InMemorySaver 的 defaultdict 存储结构\n- [ ] 能在 `pregel/remote.py` L118-200 中找到 RemoteGraph，说明它如何实现 `invoke/stream` 的远程委托\n- [ ] 能解释 `checkpoint_ns` 如何支持子图的状态隔离——父图和子图的 checkpoint 如何共存\n\n## 通过标准\n\n你已掌握本课程，如果你能：\n- 解释核心 claim（BaseCheckpointSaver 四方法 + InMemorySaver 内存实现 + RemoteGraph 远程代理）并引用 `ev-base-saver-code` 和 `ev-remote-graph-code`\n- 引用 `ev-test-checkpoint-roundtrip` 和 `ev-test-react-agent-with-checkpoint` 说明持久化读写一致性的验证方式\n- 完成 `labs/08-mini-provider-adapter/` 中的最小复刻实验（实现简化版 CheckpointSaver 接口和内存实现）\n"},"lab":{"label":"实验","path":"labs/08-mini-provider-adapter/README.md","markdown":"# Mini Checkpoint — 最小复刻实验\n\n## 目标\n\n不依赖 LangGraph 源码，用 60-100 行 Python 复刻 Checkpoint 序列化 + 存取 + 恢复机制。\n通过这个实验，你将深入理解 LangGraph 如何通过 Checkpoint 将图执行状态持久化，实现中断恢复、对话记忆和时间旅行调试。\n\n## 背景\n\n持久化是让 Agent 从\"一次性函数调用\"升级为\"有状态长期服务\"的关键。`BaseCheckpointSaver` 定义了四个核心方法：`get_tuple`（读取快照）、`put`（写入快照）、`put_writes`（写入中间结果）、`list`（列举历史）。\n\n`InMemorySaver` 用三级索引 `storage[thread_id][checkpoint_ns][checkpoint_id]` 存储快照。`thread_id` 隔离不同对话，`checkpoint_ns` 支持子图命名空间隔离，`checkpoint_id` 是每次快照的唯一标识。每个 Checkpoint 包含所有 Channel 的完整值 + 版本号，配合乐观并发控制。\n\n## 任务\n\n用纯 Python（仅依赖标准库 `json`/`uuid`）实现：\n\n1. `MiniCheckpoint`：状态快照数据结构，包含 state + metadata + version\n2. `MiniCheckpointSaver`：内存实现，支持 put/get/list 三个核心操作\n3. 与图执行器集成：每步执行后自动保存 checkpoint，支持从任意 checkpoint 恢复\n\n## 建议接口\n\n```python\nimport json\nimport uuid\nfrom typing import Any\nfrom dataclasses import dataclass, field\n\n@dataclass\nclass MiniCheckpoint:\n    checkpoint_id: str\n    thread_id: str\n    state: dict\n    metadata: dict = field(default_factory=dict)\n    parent_id: str | None = None  # 前一个 checkpoint，形成链表\n\n    def serialize(self) -> str:\n        \"\"\"序列化为 JSON 字符串\"\"\"\n        ...\n\n    @classmethod\n    def deserialize(cls, data: str) -> \"MiniCheckpoint\":\n        \"\"\"从 JSON 字符串反序列化\"\"\"\n        ...\n\n\nclass MiniCheckpointSaver:\n    def __init__(self):\n        # storage[thread_id] = [checkpoint1, checkpoint2, ...]\n        self.storage: dict[str, list[MiniCheckpoint]] = {}\n\n    def put(self, thread_id: str, state: dict, metadata: dict = None) -> MiniCheckpoint:\n        \"\"\"\n        保存新 checkpoint：\n        - 生成唯一 checkpoint_id\n        - 记录 parent_id（前一个 checkpoint 的 ID）\n        - 存入 storage\n        \"\"\"\n        ...\n\n    def get(self, thread_id: str, checkpoint_id: str = None) -> MiniCheckpoint | None:\n        \"\"\"\n        读取 checkpoint：\n        - 不指定 ID 则返回最新的\n        - 指定 ID 则精确查找\n        \"\"\"\n        ...\n\n    def list(self, thread_id: str, limit: int = 10) -> list[MiniCheckpoint]:\n        \"\"\"列举该 thread 的历史 checkpoint（最新在前）\"\"\"\n        ...\n```\n\n## 测试要求\n\n编写至少 2 个测试：\n1. **正常路径**：连续 put 3 个 checkpoint，验证 get 返回最新一个；验证 list 按时间倒序返回；验证 parent_id 形成正确链表\n2. **边界情况**：验证序列化/反序列化的往返一致性（put → serialize → deserialize → 与原数据相等）；空 thread_id 的 get 返回 None\n\n## 验收标准\n\n- [ ] `put` 自动生成唯一 ID 和 parent_id 链接\n- [ ] `get` 支持按 ID 精确查找和\"取最新\"两种模式\n- [ ] `list` 支持 limit 参数和时间倒序\n- [ ] 序列化/反序列化往返一致\n- [ ] thread_id 隔离不同对话的 checkpoint\n- [ ] 代码不超过 100 行（不含测试）\n- [ ] 测试全部通过\n\n## 提示\n\n- checkpoint_id 用 `str(uuid.uuid4())` 生成即可\n- parent_id 取 storage 中最后一个 checkpoint 的 ID\n- 序列化用标准 `json.dumps/loads`，注意 state 中可能有非基本类型需要处理\n- 实际 LangGraph 中 Checkpoint 还包含 channel_versions，这里简化为单一 state dict\n"}}},{"id":"99-capstone","title":"综合项目：构建完整的可持久化 ReAct Agent","depends_on":["04-chat-model-adapter","05-tool-interface","07-agent-loop","08-provider-integration"],"primary_path":"libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py","primary_symbol":"create_react_agent","claim_ids":["claim-99-capstone"],"evidence_ids":["ev-create-react-agent-full-code","ev-react-agent-graph-structure","ev-test-react-agent-with-checkpoint","ev-test-react-agent-interrupt"],"sections":{"lesson":{"label":"课程","path":"lessons/99-capstone.md","markdown":"# 99 综合项目：构建完整的可持久化 ReAct Agent\n\n## 你会学到什么\n\n- 如何将前 8 课的所有核心组件整合为一个完整的 ReAct Agent\n- create_react_agent 的内部实现如何串联 StateGraph、MessagesState、ToolNode、条件边和 Checkpoint\n- Agent 图的完整拓扑结构：START → agent → tools_condition → tools/END\n- 持久化如何将 Agent 从\"一次性函数调用\"升级为\"有状态服务\"\n- 从开发到生产的路径：InMemorySaver → PostgresSaver，本地 → RemoteGraph + SDK\n\n## AI 概念从零解释\n\n综合项目是学习的最终验证——你需要将零散的知识组装成一个可运行的整体。类比软件工程：\n\n- **create_react_agent** = 一个\"工厂函数\"，它把所有组件按照固定的模式组装为一个完整的图。类似 Spring Boot 的 auto-configuration——你提供 model 和 tools，它替你完成所有连线。\n\n- **ReAct 循环** = \"思考→行动→观察\"的迭代模式。Agent 节点推理（Reasoning），产生 tool_calls（Action），ToolNode 执行并返回结果（Observation），再次推理直到无需调用工具。这个循环由 tools_condition 条件边控制。\n\n- **完整图结构** = START → agent 节点（组装 prompt + 调用 LLM）→ tools_condition（检查 tool_calls）→ 两条分支：有 tool_calls → tools 节点（ToolNode 并行执行）→ 循环回 agent；无 tool_calls → END。\n\n- **组件协作矩阵**：\n  - StateGraph + compile（01）：声明→编译→执行的框架\n  - MessagesState + add_messages（02）：状态不丢消息\n  - 节点函数（03）：agent 节点的 prompt 装配\n  - LanguageModelLike + bind_tools（04）：模型适配层\n  - ToolNode（05）：并行工具执行\n  - StreamMode（06）：流式输出\n  - 条件边 + interrupt（07）：循环控制 + human-in-the-loop\n  - Checkpoint（08）：持久化状态\n\n- **持久化的价值** = 没有 Checkpoint 的 Agent 是\"无状态的 HTTP handler\"——每次调用从零开始。加上 Checkpoint 后变为\"有状态的 session\"——支持中断恢复、多轮对话、时间旅行调试。\n\n## 源码阅读路径\n\n- **repo**: langchain-ai/langgraph\n- **commit**: 83dd61feaca993d2ee428706ad04c869895ce400\n- **scope**: libs/prebuilt/langgraph/prebuilt/\n- **primary path**: `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py`\n- **primary symbol**: `create_react_agent`\n\n**3 步阅读方法**：\n\n1. **看 create_react_agent 函数签名**（`chat_agent_executor.py:278-350`）：理解参数——model（LanguageModelLike）、tools（工具列表）、prompt（可选提示）、checkpointer（持久化后端）、interrupt_before/interrupt_after（中断点）\n2. **看图组装逻辑**（`chat_agent_executor.py:900-1016`）：理解如何 add_node(\"agent\", ...)、add_node(\"tools\", ToolNode(...))、add_conditional_edges(\"agent\", tools_condition)、设置 START → agent\n3. **看 tools_condition 函数**（同文件）：理解路由逻辑——最后一条 AIMessage 有 tool_calls 则路由到 \"tools\"，否则路由到 END\n\n补充阅读：对照测试文件 `libs/prebuilt/tests/test_react_agent.py` 理解各种配置组合的行为；查看 `interrupt_before=[\"tools\"]` 如何在工具执行前插入人工审批点。\n\n## 关键 claims 与 evidence\n\n**claim-99-capstone**：create_react_agent 综合运用 StateGraph、MessagesState、ToolNode、条件边和 Checkpoint 构建完整的可持久化 ReAct Agent。\n\n**含义解读**：这个 claim 是整个课程的总结论——它验证了所有组件能否协同工作。`create_react_agent` 不是一个简单的封装，而是对 LangGraph 框架能力的完整展示：图声明（StateGraph）、状态管理（MessagesState + reducer）、模型适配（bind_tools）、工具执行（ToolNode）、循环控制（条件边）、中断恢复（interrupt）和持久化（Checkpoint）。理解这个函数的实现，等于理解了 LangGraph 的整体架构。\n\n**证据支持**：\n- `ev-create-react-agent-full-code`：create_react_agent 的完整实现，L278-1016\n- `ev-react-agent-graph-structure`：测试验证生成的图结构包含正确的节点和边\n- `ev-test-react-agent-with-checkpoint`：验证配合 checkpointer 的持久化执行\n- `ev-test-react-agent-interrupt`：验证 update_state 和中断恢复能力\n\n## 相关测试证据\n\n- **ev-test-react-agent-with-checkpoint**（`libs/prebuilt/tests/test_react_agent.py:91-121`）：验证 create_react_agent 配合 checkpointer 执行时，状态正确持久化。阅读时关注测试如何传入 `thread_id` 配置，以及如何验证跨调用的状态连续性。\n\n- **ev-test-react-agent-interrupt**（`libs/prebuilt/tests/test_react_agent.py:535-598`）：验证 react agent 的 update_state 和中断恢复能力。关注 `interrupt_before=[\"tools\"]` 如何暂停执行，以及 `update_state` 如何修改图状态后继续执行。\n\n- **ev-react-agent-graph-structure**（`libs/prebuilt/tests/test_react_agent_graph.py:1-40`）：验证 create_react_agent 生成的图拓扑是否正确——包含 agent 和 tools 节点、正确的条件边、START 连接到 agent。\n\n## 真实源码解释\n\n**create_react_agent 的组装流程**：函数内部首先处理 model 适配（确保 bind_tools 可用），然后创建 StateGraph(MessagesState)，注册 agent 节点（负责 prompt 组装 + LLM 调用）和 tools 节点（ToolNode 包裹工具列表），添加 START → agent 边，再添加 agent → tools_condition 条件边（路由到 \"tools\" 或 END），最后 tools → agent 边形成循环。compile 时传入 checkpointer 和 interrupt 配置。\n\n**agent 节点的内部逻辑**：从 state[\"messages\"] 取出完整消息历史，拼接 system prompt（如有），调用 model.invoke(messages)，返回 {\"messages\": [ai_message]}。由于 MessagesState 使用 add_messages reducer，新消息自动追加而非覆盖。\n\n**tools_condition 的路由决策**：检查 messages[-1]（最后一条 AIMessage）是否有 tool_calls 属性。有 → 返回 \"tools\"（继续循环），无 → 返回 END（终止）。这是整个 ReAct 循环的\"开关\"。\n\n**ToolNode 的批量执行**：从最后一条 AIMessage 提取所有 tool_calls，并行调用对应工具函数，每个工具的结果封装为 ToolMessage（包含 tool_call_id 关联）。所有 ToolMessage 一次性写入 state[\"messages\"]。\n\n**interrupt 的插入点**：`interrupt_before=[\"tools\"]` 意味着每次 tools_condition 路由到 \"tools\" 时，执行暂停——等待外部（用户或系统）确认后才执行工具。这实现了\"tool call 审批\"场景。恢复时节点从头执行，interrupt() 直接返回 resume 值。\n\n**Checkpoint 在循环中的作用**：图的每个超步（superstep）结束时自动保存 checkpoint。对于 ReAct 循环，每次 agent → tools → agent 循环都会产生新 checkpoint。这意味着你可以回到任何一轮的状态——查看那一轮的 messages、tool_calls、工具结果。\n\n## 自测题\n\n见 `../quizzes/99-capstone.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/99-capstone.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/99-capstone/README.md`。\n\n## 学完标准\n\n- 能完整描述 create_react_agent 如何将 8 课的核心组件组装为一个图\n- 能画出 ReAct Agent 的完整图拓扑，标注每条边的路由条件\n- 能解释持久化如何将 Agent 从一次性执行升级为有状态服务\n- 能说明 interrupt_before/after 如何在 ReAct 循环中插入控制点\n- 能追踪一次完整的用户输入→多轮工具调用→最终回复的数据流\n- 完成综合复刻实验，用 80-120 行代码实现完整的 mini ReAct Agent\n"},"quiz":{"label":"测试","path":"quizzes/99-capstone.quiz.md","markdown":"# 综合项目：构建完整的可持久化 ReAct Agent — 自测题\n\n## 选择题\n\n### 1. create_react_agent 生成的图包含哪些核心组件？\n\n- A. 仅包含 agent 节点和 END\n- B. agent 节点、tools 节点、tools_condition 条件边和 START/END\n- C. 仅包含 StateGraph 和 Checkpoint\n- D. agent 节点和一条固定边\n\n**答案**: B\n\n> create_react_agent 创建包含 agent 节点（prompt + LLM）、tools 节点（ToolNode）、tools_condition 条件边的完整图。START → agent → condition → tools/END，tools → agent 形成循环。参见 `ev-create-react-agent-full-code`。\n\n### 2. ReAct 循环的终止条件是什么？\n\n- A. 执行固定次数后自动终止\n- B. 最后一条 AIMessage 没有 tool_calls 字段\n- C. 所有注册工具都被调用过\n- D. 用户发送 stop 信号\n\n**答案**: B\n\n> tools_condition 检查最后一条 AIMessage 是否有 tool_calls。有 → 继续循环（路由到 tools），无 → 路由到 END 终止。参见 `ev-react-agent-graph-structure`。\n\n### 3. 在 ReAct Agent 中，Checkpoint 的核心价值是什么？\n\n- A. 提高 LLM 的推理速度\n- B. 支持中断恢复、对话记忆和时间旅行调试\n- C. 减少 API 调用次数\n- D. 优化工具执行顺序\n\n**答案**: B\n\n> Checkpoint 在每个超步保存完整状态快照，使 Agent 从\"一次性函数\"升级为\"有状态服务\"。支持中断后恢复、跨轮对话记忆、以及回溯到任意历史状态。参见 `ev-test-react-agent-with-checkpoint`。\n\n### 4. interrupt_before=[\"tools\"] 的执行效果是什么？\n\n- A. 工具执行前暂停，等待外部确认后继续\n- B. 跳过所有工具调用\n- C. 工具执行后暂停\n- D. 永久终止图的执行\n\n**答案**: A\n\n> `interrupt_before=[\"tools\"]` 在 ToolNode 执行前插入中断点，暂停执行等待外部输入。恢复时节点从头重新执行。这实现了 human-in-the-loop 的工具调用审批。参见 `ev-test-react-agent-interrupt`。\n\n### 5. create_react_agent 综合运用了课程中的哪些核心组件？\n\n- A. 仅 StateGraph 和 ToolNode\n- B. StateGraph、MessagesState、节点函数、bind_tools、ToolNode、StreamMode、条件边、Checkpoint\n- C. 仅 LLM 调用和工具执行\n- D. 仅 Checkpoint 和 RemoteGraph\n\n**答案**: B\n\n> create_react_agent 是全部 8 课核心概念的综合运用：StateGraph（01）、MessagesState + reducer（02）、节点函数（03）、bind_tools（04）、ToolNode（05）、StreamMode（06）、条件边 + interrupt（07）、Checkpoint（08）。参见 `ev-create-react-agent-full-code`。\n\n## 简答题\n\n### 1. 请追踪一次完整的 ReAct Agent 执行流程：从用户输入 \"北京今天天气如何？\" 到最终回复，标注每个组件的参与。\n\n> 提示：用户消息 → messages Channel（add_messages 追加）→ agent 节点（拼接 system prompt + 调用 LLM）→ AIMessage 含 tool_calls=[{name: \"get_weather\", args: {city: \"北京\"}}] → tools_condition 检测有 tool_calls → ToolNode 执行 get_weather → ToolMessage 写回 → agent 再次推理 → AIMessage 无 tool_calls → tools_condition 路由到 END。每步产生 checkpoint。\n\n### 2. 请解释从 \"开发原型\" 到 \"生产部署\" 的完整路径，涉及哪些组件的替换？\n\n> 提示：开发阶段用 InMemorySaver + 本地 invoke；测试阶段加入 stream_mode 观察执行；生产部署切换 PostgresSaver + LangGraph Server + RemoteGraph/SDK。图代码不变，只改注入配置。参考 `ev-base-saver-code` 和 `ev-remote-graph-code`。\n\n### 3. 请对比\"无 checkpointer\"和\"有 checkpointer\"两种模式下 ReAct Agent 的行为差异，至少列出 3 个具体区别。\n\n> 提示：无 checkpointer → 无状态、不支持中断恢复、无对话记忆、不支持 get_state/update_state；有 checkpointer → 有状态、支持跨调用恢复、支持多轮对话、支持时间旅行。参考 `ev-test-react-agent-with-checkpoint` 和 `ev-test-react-agent-interrupt`。\n"},"mastery":{"label":"掌握度","path":"mastery/99-capstone.mastery.md","markdown":"# 综合项目：构建完整的可持久化 ReAct Agent — 掌握度检查\n\n## 口头讲解\n\n不看课程，向同事清晰讲出以下要点：\n\n1. `create_react_agent` 综合运用了全部 8 课的核心概念：StateGraph（01）、MessagesState + add_messages reducer（02）、节点函数（03）、LanguageModelLike + bind_tools（04）、ToolNode（05）、StreamMode（06）、条件边 + interrupt（07）、Checkpoint 持久化（08）。\n2. 完整的 ReAct Agent 图结构：START → agent（prompt|model）→ tools_condition → tools（ToolNode）/END，循环直到无 tool_calls。\n3. 持久化使得 Agent 从\"一次性函数\"升级为\"有状态服务\"——支持中断恢复、对话记忆、时间旅行调试。\n4. 从开发到生产的路径：InMemorySaver → PostgresSaver，本地执行 → RemoteGraph + SDK，`stream_mode` 选择适配不同场景。\n\n## 代码阅读检查\n\n- [ ] 能在 `chat_agent_executor.py` L278-1016 中追踪 `create_react_agent` 的完整实现，理解它如何组装所有组件\n- [ ] 能说明 agent 节点、tools 节点、tools_condition 条件边三者如何协作形成 ReAct 循环\n- [ ] 能解释 `interrupt_before`/`interrupt_after` 参数如何在 ReAct 循环中插入 human-in-the-loop 控制点\n- [ ] 能追踪一次完整的 Agent 执行流：用户输入 → messages Channel → agent 推理 → tool_calls → ToolNode 执行 → ToolMessage → agent 再推理 → 最终回复\n- [ ] 能说明 Checkpoint 如何在 ReAct 循环的每一步保存状态，使得中断后可以从任意步骤恢复\n\n## 通过标准\n\n你已掌握本课程，如果你能：\n- 解释 claim-99-capstone（create_react_agent 综合运用 StateGraph/MessagesState/ToolNode/条件边/Checkpoint）并引用 `ev-create-react-agent-full-code` 和 `ev-react-agent-graph-structure`\n- 引用 `ev-test-react-agent-with-checkpoint` 和 `ev-test-react-agent-interrupt` 说明持久化和中断恢复的验证方式\n- 完成 `labs/99-capstone-mini-langchain-agent/` 中的综合复刻实验（整合所有组件构建完整 Agent）\n"},"lab":{"label":"实验","path":"labs/99-capstone/README.md","markdown":"# Capstone: Mini LangGraph Agent — 综合复刻实验\n\n## 目标\n\n不依赖 LangGraph 源码，用 80-120 行 Python 整合前 8 课的所有核心组件，构建一个完整的 mini ReAct Agent。\n通过这个实验，你将验证对 LangGraph 整体架构的理解——从图构建、状态管理、模型适配、工具调用到循环控制和持久化。\n\n## 背景\n\n一个完整的 LangGraph Agent 包含以下组件协作：\n- **StateGraph + compile**（Lab 01）：声明→编译→执行的三阶段模式\n- **Channel + Reducer**（Lab 02）：messages 字段用 reducer 聚合，避免覆盖\n- **节点函数**（Lab 03）：从 state 取消息、组装 prompt、调用模型、写回结果\n- **模型适配**（Lab 04）：统一的 invoke 接口 + 工具绑定\n- **ToolNode**（Lab 05）：并行执行工具调用、结果回填\n- **事件流**（Lab 06）：stream 模式输出执行过程\n- **Agent Loop**（Lab 07）：条件边 + ReAct 循环 + 中断恢复\n- **Checkpoint**（Lab 08）：状态持久化，支持跨轮对话\n\n本实验将这些组件组合为一个可运行的 mini agent，实现 ReAct 循环的完整闭环。\n\n## 任务\n\n用纯 Python（仅依赖标准库）实现一个完整的 mini agent，包含：\n\n1. 图定义：2 个节点（agent + tools）+ 条件边路由\n2. 状态管理：messages 字段使用 list append 作为 reducer\n3. 模型节点：调用 mock LLM，根据 messages 决定是否调用工具\n4. 工具节点：并行执行工具，结果回填 messages\n5. 循环控制：tools_condition 检查 tool_calls 决定路由\n6. 持久化：每步 checkpoint，支持从中断恢复\n\n## 建议接口\n\n```python\nfrom dataclasses import dataclass, field\nfrom typing import Callable, Any\n\n# === 消息类型 ===\n@dataclass\nclass Message:\n    role: str\n    content: str\n    tool_calls: list[dict] = field(default_factory=list)\n    tool_call_id: str | None = None\n\n# === 状态 ===\nclass AgentState:\n    \"\"\"messages 字段使用 append reducer\"\"\"\n    messages: list[Message]\n\n# === Mini Agent ===\nclass MiniAgent:\n    def __init__(self, model_fn: Callable, tools: list[Callable],\n                 checkpointer=None):\n        \"\"\"\n        model_fn: (messages, tools) -> Message  模拟 LLM\n        tools: 工具函数列表\n        checkpointer: 可选的 MiniCheckpointSaver\n        \"\"\"\n        ...\n\n    def invoke(self, input_messages: list[Message],\n               thread_id: str = \"default\") -> list[Message]:\n        \"\"\"\n        执行完整的 ReAct 循环：\n        1. 初始化 state = {messages: input_messages}\n        2. agent 节点：调用 model_fn 生成 AIMessage\n        3. tools_condition：检查是否有 tool_calls\n        4. tools 节点：并行执行工具，结果追加到 messages\n        5. 循环直到无 tool_calls\n        6. 每步保存 checkpoint\n        7. 返回最终 messages\n        \"\"\"\n        ...\n\n    def stream(self, input_messages: list[Message],\n               thread_id: str = \"default\"):\n        \"\"\"\n        流式版本：yield 每步的 (node_name, state_update)\n        \"\"\"\n        ...\n\n    def resume(self, thread_id: str, resume_value: Any) -> list[Message]:\n        \"\"\"从 checkpoint 恢复执行\"\"\"\n        ...\n```\n\n## 测试要求\n\n编写至少 3 个测试：\n1. **完整循环**：mock LLM 第一轮返回 tool_calls，第二轮返回纯文本。验证 agent 正确执行 2 轮循环并返回最终回复\n2. **多工具并行**：mock LLM 返回 2 个 tool_calls，验证两个工具被并行执行且结果都出现在 messages 中\n3. **checkpoint 恢复**：执行中途中断，验证从 checkpoint 恢复后继续执行并得到正确结果\n\n## 验收标准\n\n- [ ] 完整实现 ReAct 循环：agent → condition → tools → agent\n- [ ] messages 使用 append 语义（不覆盖历史消息）\n- [ ] 工具并行执行，结果正确关联 tool_call_id\n- [ ] stream 模式逐步输出执行过程\n- [ ] checkpoint 支持跨调用的状态恢复\n- [ ] recursion_limit 防止无限循环（默认 25）\n- [ ] 代码不超过 120 行（不含测试）\n- [ ] 测试全部通过\n\n## 提示\n\n- 可以复用前 8 个 lab 的核心实现，组合到一个文件中\n- mock LLM 的行为：检查最后一条 ToolMessage，如果有则生成最终回复；否则根据用户问题决定是否调用工具\n- 最简 stream 实现：在 invoke 循环中 yield 每步结果即可\n- checkpoint 恢复：get 最新 checkpoint → 从其 state 继续执行\n- 这是综合实验，允许更高的行数上限（120 行），但鼓励精简\n"}}}],"extras":{"readme":{"label":"入口说明","path":"README.md","markdown":"# LangGraph 源码学习课程\n\n> 从源码出发，系统学习 LangGraph 的工程设计与 Agent 编排模式。\n\n## 项目信息\n\n| 项目 | 值 |\n|------|-----|\n| 仓库 | langchain-ai/langgraph |\n| Commit | 83dd61feaca993d2ee428706ad04c869895ce400 |\n| 源码范围 | libs/langgraph, libs/prebuilt, libs/checkpoint, libs/sdk-py |\n| 读者画像 | 有经验的后端工程师，正在系统学习 LLM/Agent 工程 |\n| 课程单元 | 8 个核心课程 + 1 个综合项目 |\n\n## 如何开始\n\n1. 打开 `learning.html` 或在 GitHub Pages 上访问交互式学习页面\n2. 按照 `learning-path.md` 的顺序学习\n3. 每完成一课，做 quiz 自测，通过 mastery 检查\n4. 完成 labs/ 中的最小复刻实验巩固理解\n\n## 目录结构\n\n- `graph/`：机器可读的知识图谱数据（entities、relations、claims、evidence、learning-map）。\n- `lessons/`：8 节课程化学习材料，每课聚焦一个核心机制。\n- `quizzes/`：每课自测题 + 综合终审 quiz。\n- `mastery/`：掌握度验证任务，包含复述、源码定位、调用链重建等。\n- `labs/`：8 个 mini lab + 1 个综合 capstone 复刻实验。\n- `raw/`：工具产物和 research pack 原始数据。\n- `review/`：AI 自检报告、弱证据报告、测试矩阵和开放问题。\n- `progress/`：学习进度记录和注释。\n- `wiki/`：知识库页面。\n- `learning.html`：交互式学习入口页面。\n\n## 学习方法\n\n**从图到代码**：每课先建立心智模型（学习目标、概念地图），再进入源码定位关键符号和执行路径。LangGraph 的核心设计围绕\"状态图编排\"展开——理解 StateGraph → Channel → Node → Edge → Pregel 执行引擎 这条主线，后续 ToolNode、条件路由、interrupt、checkpoint 都是在此基础上的扩展。\n\n**证据驱动**：每个核心论断（claim）都绑定了源码证据和测试证据。学习时务必对照 `graph/evidence.json` 中的文件路径和行号，在 `repos/langgraph` 中阅读真实代码。如果你发现某个论断缺少测试证据，请参考 `review/weak-evidence.md` 了解已知局限。\n\n**做中学**：阅读源码之后，完成 `labs/` 中对应的最小复刻实验。实验不要求完整实现 LangGraph 功能，而是要求你用最少代码复现核心机制（如状态聚合、条件路由、中断恢复），从而验证你对源码的理解是否到位。\n"},"path":{"label":"学习路线","path":"learning-path.md","markdown":"# LangGraph 学习路线\n\n本路径面向有后端开发经验、正在系统学习 LLM/Agent 工程的学习者。课程从 LangGraph 状态图的核心抽象出发，逐步展开节点、边、工具、流式输出、Agent 循环和持久化的完整机制。\n\n## 课程总览\n\n1. **LangGraph 的可执行图**：从 StateGraph 到 CompiledStateGraph，理解 compile/invoke/stream 的统一执行模型。\n2. **TypedDict、Reducer 与 MessagesState**：状态管理核心——Channel 如何聚合多节点写入。\n3. **节点函数作为提示装配层**：add_node 与函数签名约定，理解节点如何读写状态。\n4. **ChatModel 作为图节点**：create_react_agent 中的模型适配与 bind_tools 自动绑定。\n5. **ToolNode 与工具接口**：tool_calls 解析、并行执行与 ToolMessage 回填。\n6. **流式输出与回调追踪**：StreamMode 多模式流式、StreamMessagesHandler 与 token 级输出。\n7. **条件边、Command、interrupt 与 ReAct 循环**：动态路由、人机交互中断与 Agent 循环编排。\n8. **Checkpoint 持久化与远程部署**：BaseCheckpointSaver、InMemorySaver、RemoteGraph 与 SDK 集成。\n9. **综合项目**：构建完整的可持久化 ReAct Agent（capstone）。\n\n## 依赖关系\n\n```\n01-runnable (基础)\n├── 02-message-schema\n│   ├── 03-prompt-template\n│   │   ├── 04-chat-model-adapter\n│   │   │   ├── 05-tool-interface (也依赖 02)\n│   │   │   │   └── 07-agent-loop (也依赖 03)\n│   │   │   │       └── 08-provider-integration (也依赖 01)\n│   │   │   │           └── 99-capstone (依赖 04, 05, 07, 08)\n│   │   │   └── 99-capstone\n│   │   └── 07-agent-loop\n│   └── 05-tool-interface\n└── 06-callback-tracing (独立分支，仅依赖 01)\n```\n\n**核心前置**：第 1 课是所有课程的前置。第 2-3-4-5-7-8 形成主线。第 6 课相对独立，可穿插学习。\n\n## 推荐节奏\n\n### Day 1：基础层（3-4 小时）\n\n- 第 1 课：StateGraph 与 CompiledStateGraph\n- 第 2 课：TypedDict、Channel 与 Reducer\n- 完成 quiz 01、02 和 lab 01、02\n\n### Day 2：节点与工具（3-4 小时）\n\n- 第 3 课：add_node 与节点函数签名\n- 第 4 课：create_react_agent 与模型适配\n- 第 5 课：ToolNode 与工具接口\n- 完成 quiz 03、04、05 和 lab 03、04、05\n\n### Day 3：流式与循环（3-4 小时）\n\n- 第 6 课：StreamMode 与回调追踪\n- 第 7 课：条件边、Command 与 interrupt\n- 完成 quiz 06、07 和 lab 06、07\n\n### Day 4：持久化与综合（3-4 小时）\n\n- 第 8 课：Checkpoint、Store 与远程部署\n- 综合项目 99-capstone：构建完整 ReAct Agent\n- 完成 quiz 08、99 和 lab 08、99\n- 完成 mastery 全部验证\n\n## 各单元学习目标\n\n### 第 1 课：LangGraph 的可执行图\n\n- 能解释 StateGraph.compile() 做了什么，返回的 CompiledStateGraph 与 Pregel 的关系\n- 能在源码中定位 compile 方法和 CompiledStateGraph 类定义\n- 能区分 invoke（同步完整执行）和 stream（逐步输出）的语义差异\n\n### 第 2 课：TypedDict、Reducer 与 MessagesState\n\n- 能解释 Annotated[type, reducer] 如何被解析为 BinaryOperatorAggregate Channel\n- 能说明 LastValue Channel 与 BinaryOperatorAggregate Channel 的区别\n- 能追踪 MessagesState 中 add_messages reducer 的工作方式\n\n### 第 3 课：节点函数作为提示装配层\n\n- 能解释 add_node 如何将普通函数包装为 RunnableCallable\n- 能说明节点函数 (State) -> dict 签名中返回 dict 如何写入对应 Channel\n- 能追踪函数名自动推断为节点名的逻辑\n\n### 第 4 课：ChatModel 作为图节点\n\n- 能解释 create_react_agent 如何自动 bind_tools\n- 能追踪 _should_bind_tools 的判断逻辑\n- 能说明 prompt|model 如何组成 agent 节点的执行链\n\n### 第 5 课：ToolNode 与工具接口\n\n- 能解释 ToolNode 如何从 AIMessage.tool_calls 提取调用请求\n- 能说明并行工具执行的实现方式\n- 能追踪 ToolMessage 如何写回 messages Channel\n\n### 第 6 课：流式输出与回调追踪\n\n- 能列举 StreamMode 支持的七种模式及各自用途\n- 能解释 StreamMessagesHandler 如何拦截 LLM token 并转发到流\n- 能区分 stream_mode=\"values\" 和 stream_mode=\"messages\" 的输出差异\n\n### 第 7 课：条件边、Command 与 interrupt\n\n- 能解释 add_conditional_edges 的路由函数如何决定下一个节点\n- 能说明 Command(goto=...) 与 add_conditional_edges 的关系和取舍\n- 能追踪 interrupt() → GraphInterrupt → Command(resume=value) 的完整中断恢复流程\n\n### 第 8 课：Checkpoint 持久化与远程部署\n\n- 能列举 BaseCheckpointSaver 的四个核心接口方法\n- 能解释 InMemorySaver 的存储结构和读写流程\n- 能说明 RemoteGraph 如何通过 SDK 连接远程 LangGraph 部署\n\n### 综合项目：构建完整 ReAct Agent\n\n- 能从零使用 StateGraph + MessagesState + ToolNode + 条件边 + Checkpoint 构建可持久化 Agent\n- 能解释 create_react_agent 的完整图结构（节点、边、中断点）\n- 能对构建的 Agent 进行中断、恢复和状态更新操作\n"},"finalQuiz":{"label":"总复盘测试","path":"quizzes/99-final-review.quiz.md","markdown":"# LangGraph 综合复盘 — 自测题\n\n## 选择题\n\n### 1. LangGraph 中 StateGraph → CompiledStateGraph 的转换遵循什么设计模式？\n\n- A. 单例模式\n- B. 观察者模式\n- C. Builder 模式（声明→编译→执行）\n- D. 策略模式\n\n**答案**: C\n\n> StateGraph 采用经典 Builder 模式：add_node/add_edge 声明图拓扑，compile() 冻结为不可变的 CompiledStateGraph，然后通过 invoke/stream 执行。参见 `ev-stategraph-compile-code`。\n\n### 2. 以下关于 Channel 类型的说法，哪一项是正确的？\n\n- A. LastValue Channel 对多个写入值执行 reducer 聚合\n- B. BinaryOperatorAggregate Channel 只保留最后写入的值\n- C. Annotated[list, add_messages] 被解析为 BinaryOperatorAggregate Channel\n- D. 所有字段默认使用 BinaryOperatorAggregate Channel\n\n**答案**: C\n\n> `Annotated[type, reducer]` 标注的字段解析为 BinaryOperatorAggregate，未标注字段使用 LastValue（最后写入者胜）。参见 `ev-get-channels-code`。\n\n### 3. create_react_agent 生成的图中，循环终止的条件是什么？\n\n- A. 达到固定的 5 次迭代上限\n- B. tools_condition 检测到最后一条 AIMessage 没有 tool_calls\n- C. 用户手动发送终止信号\n- D. 所有工具都已被调用过一次\n\n**答案**: B\n\n> tools_condition 检查最后一条 AIMessage 是否有 tool_calls。有→路由到 \"tools\" 继续循环，无→路由到 END 终止。参见 `ev-test-react-agent-basic`。\n\n### 4. interrupt() 恢复后，节点代码的执行方式是什么？\n\n- A. 从 interrupt() 调用的下一行继续执行\n- B. 节点从头重新执行（replay），interrupt() 直接返回 resume 值\n- C. 跳过当前节点，执行下一个节点\n- D. 从最近的 checkpoint 恢复整个图的状态\n\n**答案**: B\n\n> 恢复时节点从头重新执行，interrupt() 找到对应的 resume 值后直接返回。因此节点代码必须是幂等的。参见 `ev-interrupt-func-code` 和 `ev-test-interrupt-resume`。\n\n### 5. ToolNode 与普通节点函数的本质区别是什么？\n\n- A. ToolNode 是同步的，普通节点是异步的\n- B. ToolNode 是批量 RPC dispatcher（并行执行多个工具），普通节点是单一业务逻辑\n- C. ToolNode 不能访问 State\n- D. ToolNode 必须返回完整 State\n\n**答案**: B\n\n> ToolNode 本质是\"批量 RPC dispatcher\"：从 AIMessage 提取 tool_calls，并行路由到对应工具，收集 ToolMessage 结果。参见 `ev-toolnode-invoke-code`。\n\n### 6. 以下哪个组合最适合生产环境的 Agent 部署？\n\n- A. InMemorySaver + 直接 invoke\n- B. PostgresSaver + RemoteGraph + SDK\n- C. 不使用 checkpointer + 本地执行\n- D. InMemorySaver + RemoteGraph\n\n**答案**: B\n\n> 生产环境需要持久化（PostgresSaver）、远程部署（RemoteGraph 透明代理）和类型安全的 API 调用（SDK）。InMemorySaver 进程重启即丢失，不适合生产。参见 `ev-base-saver-code` 和 `ev-remote-graph-code`。\n\n## 简答题\n\n### 1. 请描述从用户输入到 Agent 完成回复的完整数据流，覆盖以下组件：StateGraph、MessagesState、add_messages reducer、agent 节点（prompt|model）、ToolNode、tools_condition、Channel。\n\n> 提示：输入通过 START Channel 进入 → agent 节点组装 prompt 调用 LLM → AIMessage 写入 messages Channel（add_messages 追加）→ tools_condition 检查 → ToolNode 执行 → ToolMessage 写回 → agent 再次推理 → 无 tool_calls → END。\n\n### 2. 请对比 `add_conditional_edges` 和 `Command(goto=...)` 两种路由方式的优缺点，并说明各自的适用场景。\n\n> 提示：前者路由逻辑与业务逻辑分离，适合通用条件（如 tools_condition）；后者路由决策在节点内部，适合依赖计算结果的动态路由。参考 `ev-conditional-edges-code` 和 `ev-command-class-code`。\n\n### 3. 请解释 LangGraph 的持久化分层架构：BaseCheckpointSaver（接口）→ InMemorySaver（测试实现）→ PostgresSaver（生产实现）。这种设计如何实现\"开发/测试/生产环境的无缝切换\"？\n\n> 提示：面向接口编程，图代码不依赖具体 saver 实现。通过依赖注入切换。参考 `ev-base-saver-code`、`ev-inmemory-saver-code`、`ev-test-checkpoint-roundtrip`。\n\n### 4. 请综合 StreamMode 的 7 种模式，设计一个完整的可观测性方案：哪些模式用于前端展示？哪些用于后端监控？哪些用于开发调试？为什么可以组合使用？\n\n> 提示：messages→前端打字效果；updates+tasks→后端监控；debug→开发调试；custom→自定义进度。框架为每种模式独立输出。参考 `ev-stream-mode-def-code` 和 `ev-test-stream-messages`。\n\n## 参考答案说明\n\n简答题没有唯一答案。回答时需要：\n- 引用具体的源码路径\n- 引用相关的 evidence id\n- 区分\"源码证明\"和\"课程推断\"\n"},"capstoneMastery":{"label":"Capstone 掌握度","path":"mastery/99-capstone.mastery.md","markdown":"# 综合项目：构建完整的可持久化 ReAct Agent — 掌握度检查\n\n## 口头讲解\n\n不看课程，向同事清晰讲出以下要点：\n\n1. `create_react_agent` 综合运用了全部 8 课的核心概念：StateGraph（01）、MessagesState + add_messages reducer（02）、节点函数（03）、LanguageModelLike + bind_tools（04）、ToolNode（05）、StreamMode（06）、条件边 + interrupt（07）、Checkpoint 持久化（08）。\n2. 完整的 ReAct Agent 图结构：START → agent（prompt|model）→ tools_condition → tools（ToolNode）/END，循环直到无 tool_calls。\n3. 持久化使得 Agent 从\"一次性函数\"升级为\"有状态服务\"——支持中断恢复、对话记忆、时间旅行调试。\n4. 从开发到生产的路径：InMemorySaver → PostgresSaver，本地执行 → RemoteGraph + SDK，`stream_mode` 选择适配不同场景。\n\n## 代码阅读检查\n\n- [ ] 能在 `chat_agent_executor.py` L278-1016 中追踪 `create_react_agent` 的完整实现，理解它如何组装所有组件\n- [ ] 能说明 agent 节点、tools 节点、tools_condition 条件边三者如何协作形成 ReAct 循环\n- [ ] 能解释 `interrupt_before`/`interrupt_after` 参数如何在 ReAct 循环中插入 human-in-the-loop 控制点\n- [ ] 能追踪一次完整的 Agent 执行流：用户输入 → messages Channel → agent 推理 → tool_calls → ToolNode 执行 → ToolMessage → agent 再推理 → 最终回复\n- [ ] 能说明 Checkpoint 如何在 ReAct 循环的每一步保存状态，使得中断后可以从任意步骤恢复\n\n## 通过标准\n\n你已掌握本课程，如果你能：\n- 解释 claim-99-capstone（create_react_agent 综合运用 StateGraph/MessagesState/ToolNode/条件边/Checkpoint）并引用 `ev-create-react-agent-full-code` 和 `ev-react-agent-graph-structure`\n- 引用 `ev-test-react-agent-with-checkpoint` 和 `ev-test-react-agent-interrupt` 说明持久化和中断恢复的验证方式\n- 完成 `labs/99-capstone-mini-langchain-agent/` 中的综合复刻实验（整合所有组件构建完整 Agent）\n"},"capstoneLab":{"label":"Capstone 实验","path":"labs/99-capstone-mini-langchain-agent/README.md","markdown":"# Capstone: Mini LangGraph Agent — 综合复刻实验\n\n## 目标\n\n不依赖 LangGraph 源码，用 80-120 行 Python 整合前 8 课的所有核心组件，构建一个完整的 mini ReAct Agent。\n通过这个实验，你将验证对 LangGraph 整体架构的理解——从图构建、状态管理、模型适配、工具调用到循环控制和持久化。\n\n## 背景\n\n一个完整的 LangGraph Agent 包含以下组件协作：\n- **StateGraph + compile**（Lab 01）：声明→编译→执行的三阶段模式\n- **Channel + Reducer**（Lab 02）：messages 字段用 reducer 聚合，避免覆盖\n- **节点函数**（Lab 03）：从 state 取消息、组装 prompt、调用模型、写回结果\n- **模型适配**（Lab 04）：统一的 invoke 接口 + 工具绑定\n- **ToolNode**（Lab 05）：并行执行工具调用、结果回填\n- **事件流**（Lab 06）：stream 模式输出执行过程\n- **Agent Loop**（Lab 07）：条件边 + ReAct 循环 + 中断恢复\n- **Checkpoint**（Lab 08）：状态持久化，支持跨轮对话\n\n本实验将这些组件组合为一个可运行的 mini agent，实现 ReAct 循环的完整闭环。\n\n## 任务\n\n用纯 Python（仅依赖标准库）实现一个完整的 mini agent，包含：\n\n1. 图定义：2 个节点（agent + tools）+ 条件边路由\n2. 状态管理：messages 字段使用 list append 作为 reducer\n3. 模型节点：调用 mock LLM，根据 messages 决定是否调用工具\n4. 工具节点：并行执行工具，结果回填 messages\n5. 循环控制：tools_condition 检查 tool_calls 决定路由\n6. 持久化：每步 checkpoint，支持从中断恢复\n\n## 建议接口\n\n```python\nfrom dataclasses import dataclass, field\nfrom typing import Callable, Any\n\n# === 消息类型 ===\n@dataclass\nclass Message:\n    role: str\n    content: str\n    tool_calls: list[dict] = field(default_factory=list)\n    tool_call_id: str | None = None\n\n# === 状态 ===\nclass AgentState:\n    \"\"\"messages 字段使用 append reducer\"\"\"\n    messages: list[Message]\n\n# === Mini Agent ===\nclass MiniAgent:\n    def __init__(self, model_fn: Callable, tools: list[Callable],\n                 checkpointer=None):\n        \"\"\"\n        model_fn: (messages, tools) -> Message  模拟 LLM\n        tools: 工具函数列表\n        checkpointer: 可选的 MiniCheckpointSaver\n        \"\"\"\n        ...\n\n    def invoke(self, input_messages: list[Message],\n               thread_id: str = \"default\") -> list[Message]:\n        \"\"\"\n        执行完整的 ReAct 循环：\n        1. 初始化 state = {messages: input_messages}\n        2. agent 节点：调用 model_fn 生成 AIMessage\n        3. tools_condition：检查是否有 tool_calls\n        4. tools 节点：并行执行工具，结果追加到 messages\n        5. 循环直到无 tool_calls\n        6. 每步保存 checkpoint\n        7. 返回最终 messages\n        \"\"\"\n        ...\n\n    def stream(self, input_messages: list[Message],\n               thread_id: str = \"default\"):\n        \"\"\"\n        流式版本：yield 每步的 (node_name, state_update)\n        \"\"\"\n        ...\n\n    def resume(self, thread_id: str, resume_value: Any) -> list[Message]:\n        \"\"\"从 checkpoint 恢复执行\"\"\"\n        ...\n```\n\n## 测试要求\n\n编写至少 3 个测试：\n1. **完整循环**：mock LLM 第一轮返回 tool_calls，第二轮返回纯文本。验证 agent 正确执行 2 轮循环并返回最终回复\n2. **多工具并行**：mock LLM 返回 2 个 tool_calls，验证两个工具被并行执行且结果都出现在 messages 中\n3. **checkpoint 恢复**：执行中途中断，验证从 checkpoint 恢复后继续执行并得到正确结果\n\n## 验收标准\n\n- [ ] 完整实现 ReAct 循环：agent → condition → tools → agent\n- [ ] messages 使用 append 语义（不覆盖历史消息）\n- [ ] 工具并行执行，结果正确关联 tool_call_id\n- [ ] stream 模式逐步输出执行过程\n- [ ] checkpoint 支持跨调用的状态恢复\n- [ ] recursion_limit 防止无限循环（默认 25）\n- [ ] 代码不超过 120 行（不含测试）\n- [ ] 测试全部通过\n\n## 提示\n\n- 可以复用前 8 个 lab 的核心实现，组合到一个文件中\n- mock LLM 的行为：检查最后一条 ToolMessage，如果有则生成最终回复；否则根据用户问题决定是否调用工具\n- 最简 stream 实现：在 invoke 循环中 yield 每步结果即可\n- checkpoint 恢复：get 最新 checkpoint → 从其 state 继续执行\n- 这是综合实验，允许更高的行数上限（120 行），但鼓励精简\n"},"weakEvidence":{"label":"弱证据报告","path":"review/weak-evidence.md","markdown":"# Weak Evidence Report\n\n## 当前状态\n\n本报告记录 LangGraph 学习课程中证据不够充分或需要注意的地方。\n\n## 证据等级说明\n\n所有 claim 当前标注为 `evidence_level: code+tests`，置信度 `high`。这意味着每个核心论断都有源码证据和测试证据支撑。但仍需注意以下局限性。\n\n## 已知局限\n\n### 1. 未运行完整测试套件\n\n- 课程中引用的测试证据基于源码阅读（静态分析），未在真实环境中执行完整测试套件。\n- 测试路径和行号基于 commit `83dd61feaca993d2ee428706ad04c869895ce400`，后续版本可能已发生变化。\n- 部分测试（如 `test_multiple_interrupt_state_persistence`）涉及复杂的多步交互，仅通过源码阅读确认行为。\n\n### 2. JS/TS SDK 未覆盖\n\n- 本课程仅覆盖 Python 实现（`libs/langgraph`、`libs/prebuilt`、`libs/checkpoint`）。\n- LangGraph 的 JS/TS SDK（`@langchain/langgraph`）未纳入分析范围。\n- 两端 API 表面相似但实现细节可能存在差异。\n\n### 3. LangGraph Platform / Cloud 未覆盖\n\n- 课程覆盖了 `RemoteGraph` 和 SDK 连接，但未深入 LangGraph Platform 的部署架构。\n- LangGraph Cloud 的 assistant API、cron jobs、background runs 等高级功能未纳入。\n- 这些属于平台层而非库层，适合作为进阶课程。\n\n### 4. 推断性论述\n\n以下内容基于源码结构推断，而非直接的文档或测试确认：\n\n| 课程 | 推断内容 | 风险 |\n|------|----------|------|\n| 01 | Pregel 执行引擎的命名来源于 Google Pregel 论文 | 低（代码注释可佐证） |\n| 06 | StreamMessagesHandler 与 LangChain callback 系统的兼容性细节 | 中（依赖 langchain-core 版本） |\n| 08 | RemoteGraph 的错误重试和连接管理策略 | 中（实现可能依赖 httpx 配置） |\n\n### 5. 测试证据分布\n\n所有 8 个单元 + capstone 均具备至少 2 条测试证据：\n\n| 课程 | 代码证据数 | 测试证据数 | 评估 |\n|------|-----------|-----------|------|\n| 01-runnable | 2 | 2 | 充分 |\n| 02-message-schema | 2 | 2 | 充分 |\n| 03-prompt-template | 2 | 2 | 充分 |\n| 04-chat-model-adapter | 2 | 2 | 充分 |\n| 05-tool-interface | 2 | 2 | 充分 |\n| 06-callback-tracing | 2 | 2 | 充分 |\n| 07-agent-loop | 4 | 4 | 丰富 |\n| 08-provider-integration | 3 | 1 | 测试证据偏少 |\n| 99-capstone | 2 | 2 | 充分 |\n\n**注意**：08 课的测试证据仅有 `test_memory_saver` 一条（验证 InMemorySaver 读写），RemoteGraph 的集成测试需要网络环境，未纳入。\n\n## 仍需后续增强\n\n### lab 尚未包含可运行代码\n\n`labs/` 当前是任务设计说明和验收标准，但没有 starter code、tests 和 reference implementation。如要升级为可执行训练营，应为每个 lab 增加：\n\n- starter code（Python 骨架）\n- pytest 测试用例\n- reference implementation\n- AI grading rubric\n\n### Subgraph 和 Map-Reduce 模式未深入覆盖\n\nLangGraph 支持 subgraph（子图嵌套）和 map-reduce 并行模式，当前课程仅在第 7 课提及，未单独成课。这些是进阶主题，适合后续扩展。\n\n## 阅读时的信任顺序\n\n优先信任：\n\n1. `evidence_type: code` 且有具体 path 和 line_range 的证据。\n2. `evidence_type: test` 且位于 `tests/` 目录的证据。\n3. lesson 中引用具体源码路径的解释。\n4. `review/open-questions.md` 中标记的待追踪问题。\n"},"progress":{"label":"学习进度","path":"progress/learning-progress.md","markdown":"# 学习进度\n\n## 当前状态\n\n尚未开始学习。\n\n## 课程清单\n\n- [ ] 01-runnable\n- [ ] 02-message-schema\n- [ ] 03-prompt-template\n- [ ] 04-chat-model-adapter\n- [ ] 05-tool-interface\n- [ ] 06-callback-tracing\n- [ ] 07-agent-loop\n- [ ] 08-provider-integration\n- [ ] 99-capstone\n\n## 下一步建议\n\n从第 1 课 01-runnable 开始，打开 learning.html 交互式页面学习。\n"},"testEvidence":{"label":"测试证据矩阵","path":"review/test-evidence-matrix.md","markdown":"# 测试证据矩阵\n\n## 目标\n\n把每一节课的核心 claim 绑定到源码证据和测试证据，确保课程内容有据可查。\n\n## 证据矩阵\n\n| Lesson | Claim | Code Evidence | Test Evidence |\n|--------|-------|---------------|---------------|\n| 01-runnable | claim-01-runnable | ev-stategraph-compile-code, ev-compiled-extends-pregel | ev-test-compile-invoke, ev-test-stream-basic |\n| 02-message-schema | claim-02-message-schema | ev-get-channels-code, ev-binop-channel-code | ev-test-channels-binop, ev-test-messages-state |\n| 03-prompt-template | claim-03-prompt-template | ev-add-node-impl-code, ev-state-node-spec-code | ev-test-add-node-function, ev-test-node-name-infer |\n| 04-chat-model-adapter | claim-04-chat-model-adapter | ev-create-react-agent-code, ev-should-bind-tools-code | ev-test-react-agent-basic, ev-test-react-agent-prompt |\n| 05-tool-interface | claim-05-tool-interface | ev-toolnode-class-code, ev-toolnode-invoke-code | ev-test-tool-node-basic, ev-test-tool-node-parallel |\n| 06-callback-tracing | claim-06-callback-tracing | ev-stream-mode-def-code, ev-stream-messages-handler-code | ev-test-stream-values, ev-test-stream-messages |\n| 07-agent-loop | claim-07-agent-loop-conditional | ev-conditional-edges-code, ev-command-class-code | ev-test-conditional-edges, ev-test-command-goto |\n| 07-agent-loop | claim-07-agent-loop-interrupt | ev-interrupt-func-code, ev-command-resume-code | ev-test-interrupt-resume, ev-test-interrupt-multiple |\n| 08-provider-integration | claim-08-provider-integration | ev-base-saver-code, ev-inmemory-saver-code, ev-remote-graph-code | ev-test-checkpoint-roundtrip |\n| 99-capstone | claim-99-capstone | ev-create-react-agent-full-code, ev-react-agent-graph-structure | ev-test-react-agent-with-checkpoint, ev-test-react-agent-interrupt |\n\n## 证据详情\n\n### 01-runnable\n\n| Evidence ID | Type | Path | Symbol | Summary |\n|-------------|------|------|--------|---------|\n| ev-stategraph-compile-code | code | libs/langgraph/langgraph/graph/state.py:1164-1388 | StateGraph.compile | 验证图结构、创建 channels、实例化 CompiledStateGraph |\n| ev-compiled-extends-pregel | code | libs/langgraph/langgraph/graph/state.py:1391-1410 | CompiledStateGraph | 继承 Pregel 类定义 |\n| ev-test-compile-invoke | test | libs/langgraph/tests/test_pregel.py:433-462 | test_invoke_single_process_in_out | compile 后 invoke 执行单节点 |\n| ev-test-stream-basic | test | libs/langgraph/tests/test_pregel.py:1382-1418 | test_imp_stream_order | stream 方法按序输出 |\n\n### 02-message-schema\n\n| Evidence ID | Type | Path | Symbol | Summary |\n|-------------|------|------|--------|---------|\n| ev-get-channels-code | code | libs/langgraph/langgraph/graph/state.py:1801-1859 | _get_channels | 解析 TypedDict 的 Annotated 字段映射为 Channel |\n| ev-binop-channel-code | code | libs/langgraph/langgraph/channels/binop.py:51-142 | BinaryOperatorAggregate | 实现 update 聚合方法 |\n| ev-test-channels-binop | test | libs/langgraph/tests/test_channels.py:92-107 | test_binop | 验证 operator.add 聚合行为 |\n| ev-test-messages-state | test | libs/langgraph/tests/test_messages_state.py:188-210 | test_messages_state | 验证 add_messages reducer |\n\n### 03-prompt-template\n\n| Evidence ID | Type | Path | Symbol | Summary |\n|-------------|------|------|--------|---------|\n| ev-add-node-impl-code | code | libs/langgraph/langgraph/graph/state.py:662-913 | StateGraph.add_node | 推断节点名、包装为 RunnableCallable |\n| ev-state-node-spec-code | code | libs/langgraph/langgraph/graph/_node.py:1-80 | StateNodeSpec | 节点数据类定义 |\n| ev-test-add-node-function | test | libs/langgraph/tests/test_pregel.py:433-462 | test_invoke_single_process_in_out | 普通函数作为节点 |\n| ev-test-node-name-infer | test | libs/langgraph/tests/test_pregel.py:505-528 | test_invoke_single_process_in_out_dict | 函数名推断为节点名 mode='messages' 输出 token |\n\n### 07-agent-loop\n\n| Evidence ID | Type | Path | Symbol | Summary |\n|-------------|------|------|--------|---------|\n| ev-conditional-edges-code | code | libs/langgraph/langgraph/graph/state.py:969-1017 | StateGraph.add_conditional_edges | 路由函数包装为 BranchSpec |\n| ev-command-class-code | code | libs/langgraph/langgraph/types.py:759-808 | Command | graph/update/resume/goto 字段 |\n| ev-interrupt-func-code | code | libs/langgraph/langgraph/types.py:811-934 | interrupt | 追踪中断索引、抛出 GraphInterrupt |\n| ev-command-resume-code | code | libs/langgraph/langgraph/types.py:759-808 | Command.resume | resume 字段提供恢复值 |\n| ev-test-conditional-edges | test | libs/langgraph/tests/test_pregel.py:2925-2976 | test_callable_in_conditional_edges_with_no_path_map | callable 路由函数行为 |\n| ev-test-command-goto | test | libs/langgraph/tests/test_pregel.py:5236-5303 | test_command_goto_with_static_breakpoints | Command(goto=...) 动态路由 |\n| ev-test-interrupt-resume | test | libs/langgraph/tests/test_pregel.py:4852-4920 | test_interrupt_multiple | 多个 interrupt 的暂停和恢复 |\n| ev-test-interrupt-multiple | test | libs/langgraph/tests/test_pregel.py:5305-5722 | test_multiple_interrupt_state_persistence | 多次中断状态持久化 |\n\n### 08-provider-integration\n\n| Evidence ID | Type | Path | Symbol | Summary |\n|-------------|------|------|--------|---------|\n| ev-base-saver-code | code | libs/checkpoint/langgraph/checkpoint/base/__init__.py:176-348 | BaseCheckpointSaver | 定义核心接口方法 |\n| ev-inmemory-saver-code | code | libs/checkpoint/langgraph/checkpoint/memory/__init__.py:33-100 | InMemorySaver | defaultdict 存储实现 |\n| ev-remote-graph-code | code | libs/langgraph/langgraph/pregel/remote.py:118-300 | RemoteGraph | 通过 SDK 发起远程调用 |\n| ev-test-checkpoint-roundtrip | test | libs/checkpoint/tests/test_memory.py:210-220 | test_memory_saver | InMemorySaver 读写一致性 |\n\n### 99-capstone\n\n| Evidence ID | Type | Path | Symbol | Summary |\n|-------------|------|------|--------|---------|\n| ev-create-react-agent-full-code | code | libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py:278-1016 | create_react_agent | 完整实现：StateGraph + 节点 + 条件边 + 中断点 |\n| ev-react-agent-graph-structure | test | libs/prebuilt/tests/test_react_agent_graph.py:1-40 | test_react_agent_graph | 图结构正确性验证 |\n| ev-test-react-agent-with-checkpoint | test | libs/prebuilt/tests/test_react_agent.py:91-121 | test_no_prompt | 配合 checkpointer 的持久化执行 |\n| ev-test-react-agent-interrupt | test | libs/prebuilt/tests/test_react_agent.py:535-598 | test_react_agent_update_state | update_state 和中断恢复能力 |\n\n## 结论\n\n当前所有 10 条核心 claim 均有源码证据和测试证据支撑。第 7 课（Agent Loop）证据最丰富（8 条），因为它包含两个子主题（条件边 + 中断恢复）。第 8 课测试证据相对薄弱（仅 1 条），因为 RemoteGraph 的集成测试需要网络环境。\n\n总计：40 条证据（22 条 code + 18 条 test）。\n"}}}</script>

  <script>
    const DATA=JSON.parse(document.getElementById('learning-data').textContent);
    const labels={lesson:'课程',quiz:'测试',mastery:'掌握度',lab:'实验'};
    const state={kind:'unit',unit:DATA.units[0]?.id,section:'lesson',extra:'readme',noteView:'all'};
    const slug=(s,i)=>s.toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'')||'h-'+i;
    const noteStoreKey='agent-code-learning-pack-annotations:'+location.pathname;
    let annotations=loadAnnotations();
    let pendingQuote='';
    let pendingType='question';
    function md(x){return DOMPurify.sanitize(marked.parse(x||''));}
    function doc(){return state.kind==='extra'?DATA.extras[state.extra]:DATA.units.find(u=>u.id===state.unit).sections[state.section];}
    function loadAnnotations(){let embedded=[];let stored=[];try{embedded=JSON.parse(document.getElementById('learning-annotations-data')?.textContent||'[]');}catch{}try{stored=JSON.parse(localStorage.getItem(noteStoreKey)||'[]');}catch{}const merged=[...embedded,...stored];const seen=new Set();return merged.filter(n=>{if(!n||!n.id||seen.has(n.id))return false;seen.add(n.id);return true;});}
    function saveAnnotations(){try{localStorage.setItem(noteStoreKey,JSON.stringify(annotations));}catch{}const el=document.getElementById('learning-annotations-data');if(el)el.textContent=JSON.stringify(annotations);}
    function currentDocPath(){return doc().path;}
    function currentNotes(){const p=currentDocPath();return annotations.filter(n=>n.path===p).filter(n=>state.noteView==='all'||(n.type||'question')===state.noteView);}
    function selectionQuote(){const sel=window.getSelection();if(!sel||sel.rangeCount===0)return'';const text=sel.toString().replace(/\s+/g,' ').trim();if(!text)return'';const content=document.getElementById('content');const node=sel.getRangeAt(0).commonAncestorContainer;const owner=node.nodeType===1?node:node.parentElement;if(!content.contains(owner))return'';return text.slice(0,600);}
    function setPendingType(type){pendingType=type;document.getElementById('questionModeBtn').classList.toggle('active',type==='question');document.getElementById('studyNoteModeBtn').classList.toggle('active',type==='note');document.getElementById('noteInput').placeholder=type==='question'?'写下哪里没看懂、希望 AI 后续补充什么。':'写下你的理解、总结、类比或可沉淀进知识库的笔记。';}
    function openNoteModal(){pendingQuote=selectionQuote();if(!pendingQuote){alert('请先在正文里选中一段你看不懂或想记录的内容。');return;}setPendingType('question');document.getElementById('noteQuote').textContent=pendingQuote;document.getElementById('noteInput').value='';document.getElementById('noteModal').classList.add('open');document.getElementById('noteInput').focus();}
    function closeNoteModal(){document.getElementById('noteModal').classList.remove('open');pendingQuote='';}
    function saveNote(){const note=document.getElementById('noteInput').value.trim();if(!note){alert('请先写下注释内容。');return;}const d=doc();annotations.push({id:'note-'+Date.now()+'-'+Math.random().toString(16).slice(2),type:pendingType,path:d.path,title:document.getElementById('pageTitle').textContent,kind:state.kind,unit:state.unit,section:state.section,extra:state.extra,quote:pendingQuote,note,question:pendingType==='question'?note:'',answer:'',createdAt:new Date().toISOString()});saveAnnotations();closeNoteModal();state.noteView=pendingType;render();}
    function textNodes(root){const out=[];const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){if(!node.nodeValue.trim())return NodeFilter.FILTER_REJECT;const p=node.parentElement;if(!p||['SCRIPT','STYLE','TEXTAREA','MARK'].includes(p.tagName))return NodeFilter.FILTER_REJECT;return NodeFilter.FILTER_ACCEPT;}});let n;while((n=walker.nextNode()))out.push(n);return out;}
    function applyNoteHighlight(note){const root=document.getElementById('content');const q=note.quote.replace(/\s+/g,' ').trim();if(!q)return;for(const node of textNodes(root)){const compact=node.nodeValue.replace(/\s+/g,' ');const idx=compact.indexOf(q);if(idx<0)continue;const raw=node.nodeValue;const rawIdx=raw.indexOf(q);if(rawIdx<0)continue;const mark=document.createElement('mark');mark.className='study-note';mark.dataset.noteId=note.id;mark.dataset.noteType=note.type||'question';mark.title=note.note;mark.textContent=raw.slice(rawIdx,rawIdx+q.length);mark.onclick=()=>{const card=document.querySelector('[data-note-card="'+note.id+'"]');if(card)card.scrollIntoView({behavior:'smooth',block:'center'});};const frag=document.createDocumentFragment();frag.append(document.createTextNode(raw.slice(0,rawIdx)),mark,document.createTextNode(raw.slice(rawIdx+q.length)));node.parentNode.replaceChild(frag,node);break;}}
    function highlightNotes(){annotations.filter(n=>n.path===currentDocPath()).forEach(applyNoteHighlight);}
    function deleteNote(id){annotations=annotations.filter(n=>n.id!==id);saveAnnotations();render();}
    function noteViewTitle(){return state.noteView==='question'?'问答 QA':state.noteView==='note'?'学习笔记':'学习注释';}
    function setNoteView(view){state.noteView=view;render();}
    function renderNotes(){const list=document.getElementById('noteList');if(!list)return;document.getElementById('notePanelTitle').textContent=noteViewTitle();const notes=currentNotes();list.innerHTML='';if(!notes.length){list.innerHTML='<div class="note-empty">当前页面还没有'+noteViewTitle()+'。选中正文后点击左侧“给选中文字加注释”。</div>';return;}notes.forEach((n,i)=>{const type=n.type||'question';const isQuestion=type==='question';const label=isQuestion?'疑问':'学习笔记';const answer=n.answer?'<div class="qa-answer"><p class="note-text"><strong>A：</strong>'+escapeHtml(n.answer)+'</p></div>':'<div class="qa-answer"><p class="note-text"><strong>A：</strong>导出 HTML 给 AI 后，这里会回填解答。</p></div>';const review=n.review?'<div class="qa-answer"><p class="note-text"><strong>校正：</strong>'+escapeHtml(n.review)+'</p></div>':'';const card=document.createElement('div');card.className='note-card';card.dataset.noteCard=n.id;card.innerHTML='<span class="note-type '+type+'">'+label+'</span><p class="note-quote">#'+(i+1)+' 引用：'+escapeHtml(n.quote)+'</p><p class="note-text"><strong>'+(isQuestion?'Q：':'笔记：')+'</strong>'+escapeHtml(n.note)+'</p>'+(isQuestion?answer:review)+'<div class="note-meta">'+new Date(n.createdAt).toLocaleString()+'</div><div class="note-actions"><button type="button" data-delete="'+n.id+'">删除</button></div>';list.appendChild(card);});list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteNote(b.dataset.delete));}
    function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function downloadText(filename,text,type='text/plain;charset=utf-8'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();URL.revokeObjectURL(a.href);a.remove();}
    function exportAnnotatedHtml(){saveAnnotations();const html='<!doctype html>\n'+document.documentElement.outerHTML;const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');downloadText('learning-annotated-'+stamp+'.html',html,'text/html;charset=utf-8');}
    function exportStudyNotesMarkdown(){const notes=annotations.filter(n=>(n.type||'question')==='note');if(!notes.length){alert('还没有学习笔记可以导出。');return;}const body=['# 学习笔记导出',''].concat(notes.map((n,i)=>['## '+(i+1)+'. '+n.title,'','- source: '+n.path,'- created: '+n.createdAt,'','> '+n.quote.replace(/\n/g,'\n> '),'','### 原始笔记','',n.note,'',n.review?'### AI 校正\n\n'+n.review+'\n':''].join('\n'))).join('\n');const stamp=new Date().toISOString().slice(0,10);downloadText('learning-notes-'+stamp+'.md',body,'text/markdown;charset=utf-8');}
    function renderNav(){const ul=document.getElementById('unitList');ul.innerHTML='';DATA.units.forEach(u=>{const b=document.createElement('button');b.className='unit '+(state.kind==='unit'&&state.unit===u.id?'active':'');b.onclick=()=>{state.kind='unit';state.unit=u.id;state.section='lesson';render();};b.innerHTML='<span class="kicker">'+u.id+'</span><span class="name">'+u.title+'</span><span class="deps">'+(u.depends_on?.length?'依赖 '+u.depends_on.join(', '):'起点课程')+'</span>';ul.appendChild(b);});const q=document.getElementById('quick');q.innerHTML='';Object.entries(DATA.extras).forEach(([k,v])=>{const b=document.createElement('button');b.className=state.kind==='extra'&&state.extra===k?'active':'';b.textContent=v.label;b.onclick=()=>{state.kind='extra';state.extra=k;render();};q.appendChild(b);});const mu=document.getElementById('mobileUnit');mu.innerHTML='';DATA.units.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.id+' '+u.title;mu.appendChild(o);});mu.value=state.unit;mu.onchange=e=>{state.kind='unit';state.unit=e.target.value;render();};}
    function renderTabs(){const tabs=document.getElementById('tabs');const ms=document.getElementById('mobileSection');tabs.innerHTML='';ms.innerHTML='';if(state.kind==='extra'){tabs.style.display='none';ms.style.display='none';return;}tabs.style.display='flex';ms.style.display='block';Object.entries(labels).forEach(([k,label])=>{const b=document.createElement('button');b.className='tab '+(state.section===k?'active':'');b.textContent=label;b.onclick=()=>{state.section=k;render();};tabs.appendChild(b);const o=document.createElement('option');o.value=k;o.textContent=label;ms.appendChild(o);});ms.value=state.section;ms.onchange=e=>{state.section=e.target.value;render();};}
    function toc(){const c=document.getElementById('content');const heads=[...c.querySelectorAll('h2,h3')];const t=document.getElementById('toc');t.innerHTML='';heads.forEach((h,i)=>{h.id=slug(h.textContent,i);const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.className=h.tagName.toLowerCase();t.appendChild(a);});if(!heads.length)t.innerHTML='<span class="meta">当前页没有二级目录。</span>';}
    function render(){renderNav();renderTabs();const d=doc();const u=DATA.units.find(x=>x.id===state.unit);document.getElementById('pageTitle').textContent=state.kind==='extra'?d.label:u.title+' · '+labels[state.section];document.getElementById('pageMeta').textContent=state.kind==='extra'?'学习包辅助页面':'课程 '+u.id+' · 状态 '+u.status+(u.depends_on?.length?' · 依赖 '+u.depends_on.join(', '):' · 起点课程');document.getElementById('sourcePath').textContent=d.path;document.getElementById('content').innerHTML=md(d.markdown);highlightNotes();toc();renderNotes();document.title=document.getElementById('pageTitle').textContent+' | Learning Pack';}
    document.getElementById('addNoteBtn').onclick=openNoteModal;
    document.getElementById('viewQaBtn').onclick=()=>setNoteView('question');
    document.getElementById('viewStudyNotesBtn').onclick=()=>setNoteView('note');
    document.getElementById('exportNotesBtn').onclick=exportAnnotatedHtml;
    document.getElementById('exportStudyNotesBtn').onclick=exportStudyNotesMarkdown;
    document.getElementById('questionModeBtn').onclick=()=>setPendingType('question');
    document.getElementById('studyNoteModeBtn').onclick=()=>setPendingType('note');
    document.getElementById('cancelNoteBtn').onclick=closeNoteModal;
    document.getElementById('saveNoteBtn').onclick=saveNote;
    document.getElementById('noteModal').addEventListener('click',e=>{if(e.target.id==='noteModal')closeNoteModal();});
    render();
  </script>
</body>
</html>
