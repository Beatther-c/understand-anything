  <script id="learning-data" type="application/json">{"generatedAt":"2026-06-04T04:58:50.591Z","units":[{"id":"01-runnable","title":"LangGraph 的可执行图：从 StateGraph 到 CompiledStateGraph","depends_on":[],"primary_path":"libs/langgraph/langgraph/graph/state.py","primary_symbol":"StateGraph","claim_ids":["claim-01-runnable"],"evidence_ids":["ev-stategraph-compile-code","ev-compiled-extends-pregel","ev-test-compile-invoke","ev-test-stream-basic"],"sections":{"lesson":{"label":"课程","path":"lessons/01-runnable.md","markdown":"# 01 LangGraph 的可执行图：从 Runnable 到 CompiledStateGraph\n\n## 你会学到什么\n\n- StateGraph 作为图构建器的 Builder 模式设计思想。\n- `compile()` 如何将声明式图定义编译为可执行的 `CompiledStateGraph` 实例。\n- `CompiledStateGraph` 继承 `Pregel` 并实现 Runnable 接口（invoke/stream/ainvoke/astream）。\n- Pregel 超步模型如何驱动节点调度和 Channel 读写。\n- 类比 Java 中 Spring State Machine 的 builder → 可执行实例 模式。\n\n## AI 概念从零解释\n\nLangGraph 的核心设计哲学是\"把 AI Agent 的执行逻辑建模为有向图\"。如果你做过后端 workflow 引擎（Temporal、Camunda）或者用 Go 写过 DAG 调度器，LangGraph 的 StateGraph 就是类似的东西：\n\n1. **声明阶段**：用 `add_node` / `add_edge` 描述图拓扑（节点和边），此时不执行任何逻辑。\n2. **编译阶段**：调用 `compile()` 将声明式定义转换为可执行引擎（类比 `Makefile → make`）。\n3. **执行阶段**：对编译产物调用 `invoke()` 或 `stream()`，Pregel 引擎按超步调度节点。\n\n**Pregel 模型类比**：Google Pregel 论文描述的图计算模型是\"所有节点在每一超步中并行读取消息、计算、发送消息\"。LangGraph 借鉴此思想——每个超步中，就绪节点并行执行，通过 Channel（消息管道）传递状态更新。这和 Java 里的 Event Sourcing 思路相似：不是直接改状态，而是写入 Channel，由 reducer 决定如何聚合。\n\n## 源码阅读路径\n\n| 属性 | 值 |\n|------|------|\n| repo | langchain-ai/langgraph |\n| commit | `83dd61feaca993d2ee428706ad04c869895ce400` |\n| scope | `libs/langgraph/langgraph/graph/` |\n| primary path | `libs/langgraph/langgraph/graph/state.py` |\n| primary symbol | `StateGraph` / `CompiledStateGraph` |\n\n**3 步阅读法**：\n1. 从 `StateGraph.__init__` 开始，看它如何初始化 `nodes`、`edges`、`branches` 三个容器。\n2. 跳到 `StateGraph.compile()`（L1164-1388），观察验证→创建 Channel→实例化 CompiledStateGraph→绑定节点/边→validate 的完整流程。\n3. 看 `CompiledStateGraph`（L1391）的类定义，确认它继承 `Pregel[StateT, ContextT, InputT, OutputT]`，从而拥有 `invoke/stream` 能力。\n\n## 关键 claims 与 evidence\n\n### claim-01-runnable\n\n> StateGraph.compile() 返回 CompiledStateGraph 实例，该实例继承 Pregel 并实现 Runnable 接口的 invoke/stream/ainvoke/astream 方法\n\n**证据支持**：\n\n- **ev-stategraph-compile-code**（`state.py` L1164-1388）：`compile()` 方法验证图结构、解析 channels、创建 `CompiledStateGraph` 实例，最终调用 `compiled.validate()` 返回。关键行为是将 builder 中的 `self.nodes` 和 `self.edges` 逐一 attach 到编译产物。\n- **ev-compiled-extends-pregel**（`state.py` L1391-1410）：`class CompiledStateGraph(Pregel[StateT, ContextT, InputT, OutputT])` 明确继承关系，Pregel 基类实现了 Runnable 协议。\n- **ev-test-compile-invoke**（`test_pregel.py` L433-462）：测试 `test_invoke_single_process_in_out` 验证 compile→invoke 链路正常工作。\n- **ev-test-stream-basic**（`test_pregel.py` L1382-1418）：测试 `test_imp_stream_order` 验证 stream 输出顺序正确。\n\n## 真实源码解释\n\n`StateGraph` 采用经典 Builder 模式：`add_node`/`add_edge` 只是往内部字典写入描述，不做任何执行。`compile()` 是\"冻结\"操作——验证图连通性、解析 TypedDict 状态为 Channel 映射、将每个节点包装为 `PregelNode`（带有 Channel 订阅信息），最终产出一个不可变的 `CompiledStateGraph`。\n\n`CompiledStateGraph` 继承 `Pregel`，而 `Pregel` 实现了 LangChain Core 的 `Runnable` 接口。这意味着编译后的图可以像任何 LangChain Runnable 一样被调用：`graph.invoke(input)`、`graph.stream(input)`、`await graph.ainvoke(input)`。这是整个框架的\"万物皆 Runnable\"统一抽象的体现。\n\n设计选择上，compile 阶段会将 `EphemeralValue(START)` 作为输入 Channel 注入，这样外部输入通过 START 通道进入图执行循环，和其他节点间的 Channel 通信使用统一机制。\n\n## 自测题\n\n请前往 `quizzes/01-runnable.quiz.md` 完成自测。\n\n## 掌握度验证\n\n请前往 `mastery/01-runnable.mastery.md` 完成掌握度验证。\n\n## 最小复刻任务\n\n请前往 `labs/01-mini-runnable/` 完成最小复刻任务。\n\n## 学完标准\n\n- 能口述 StateGraph → compile() → CompiledStateGraph → invoke/stream 的完整链路。\n- 能解释 CompiledStateGraph 为何继承 Pregel 而非直接实现 Runnable。\n- 能说明 compile() 阶段做了哪 5 件核心事情（验证、Channel 解析、实例化、attach 节点/边、validate）。\n- 能用 3 行代码写出最简的 StateGraph 声明→编译→执行流程。\n"},"quiz":{"label":"测试","path":"quizzes/01-runnable.quiz.md","markdown":"# LangGraph 的可执行图：从 Runnable 到 CompiledStateGraph — 自测题\n\n## 选择题\n\n### 1. StateGraph.compile() 返回的对象类型是什么？\n\n- A. StateGraph 实例\n- B. Pregel 实例\n- C. CompiledStateGraph 实例（继承自 Pregel）\n- D. RunnableCallable 实例\n\n**答案**: C\n\n> CompiledStateGraph 继承 Pregel，而 Pregel 实现了 Runnable 接口。参见 `ev-compiled-extends-pregel`（`state.py` L1391-1410）。\n\n### 2. compile() 阶段的核心步骤不包括以下哪项？\n\n- A. 验证图结构连通性\n- B. 将 TypedDict 状态解析为 Channel 映射\n- C. 执行第一个节点的 invoke 方法\n- D. 将每个节点包装为 PregelNode 并 attach 到编译产物\n\n**答案**: C\n\n> compile() 只做\"冻结\"操作（验证→Channel 解析→实例化→attach 节点/边→validate），不执行任何节点逻辑。执行发生在后续的 invoke/stream 调用中。\n\n### 3. Pregel 超步模型的核心特征是什么？\n\n- A. 所有节点串行执行，按添加顺序依次处理\n- B. 每个超步中就绪节点并行执行，通过 Channel 传递状态更新\n- C. 每个节点独立运行在不同进程中，通过 RPC 通信\n- D. 所有节点在同一线程中按拓扑排序执行\n\n**答案**: B\n\n> LangGraph 借鉴 Google Pregel 论文：每个超步中就绪节点并行执行，通过 Channel（消息管道）传递状态更新，由 reducer 决定如何聚合。\n\n## 简答题\n\n### 1. 请解释 StateGraph 为什么采用 Builder 模式（声明→编译→执行 三阶段），而不是直接在 add_node/add_edge 时就创建可执行图？\n\n> 提示：考虑验证时机、不可变性保证、和 Pregel 引擎的初始化需求。参考 `ev-stategraph-compile-code`（`state.py` L1164-1388）。\n\n### 2. CompiledStateGraph 为何继承 Pregel 而非直接实现 Runnable 接口？请从代码复用和抽象层次两个角度分析。\n\n> 提示：Pregel 基类提供了超步调度、Channel 管理等核心能力。参考 `ev-compiled-extends-pregel`（`state.py` L1391-1410）和 Pregel 基类的职责。\n\n### 3. 请描述 EphemeralValue(START) 作为输入 Channel 注入的设计意图，以及它如何让外部输入与节点间通信使用统一机制。\n\n> 提示：从 compile() 中 START 通道的注入逻辑出发。参考 `ev-stategraph-compile-code` 中 Channel 创建部分。\n\n## 参考答案说明\n\n简答题没有唯一答案。回答时需要：\n- 引用具体的源码路径\n- 引用相关的 evidence id\n- 区分\"源码证明\"和\"课程推断\"\n"},"mastery":{"label":"掌握度","path":"mastery/01-runnable.mastery.md","markdown":"# LangGraph 的可执行图：从 Runnable 到 CompiledStateGraph — 掌握度检查\n\n## 口头讲解\n\n不看课程，向同事清晰讲出以下要点：\n\n1. StateGraph 是 Builder 模式的实现：`add_node`/`add_edge` 只做声明，`compile()` 才生成可执行产物。\n2. `compile()` 做 5 件事：验证图连通性 → 解析 TypedDict 为 Channel 映射 → 实例化 CompiledStateGraph → attach 节点和边 → validate。\n3. CompiledStateGraph 继承 Pregel，Pregel 实现 Runnable 接口，因此编译后的图拥有 invoke/stream/ainvoke/astream 能力。\n4. Pregel 超步模型驱动执行：每个超步中就绪节点并行执行，通过 Channel 传递状态更新，由 reducer 决定聚合策略。\n\n## 代码阅读检查\n\n- [ ] 能在 `state.py` L1164-1388 中找到 `compile()` 方法的完整实现，并指出验证、Channel 创建和实例化的关键行\n- [ ] 能在 `state.py` L1391-1410 中确认 `CompiledStateGraph` 的继承声明 `Pregel[StateT, ContextT, InputT, OutputT]`\n- [ ] 能追踪 `compile()` 如何将 `self.nodes` 中的声明转化为 `PregelNode` 绑定到编译产物\n- [ ] 能解释 `EphemeralValue(START)` 作为输入 Channel 的设计选择——为什么不直接传参给第一个节点\n\n## 通过标准\n\n你已掌握本课程，如果你能：\n- 解释核心 claim（compile→CompiledStateGraph→Pregel→Runnable 链路）并引用 `ev-compiled-extends-pregel` 和 `ev-stategraph-compile-code`\n- 引用 `ev-test-compile-invoke` 和 `ev-test-stream-basic` 说明 invoke 和 stream 的验证方式\n- 完成 `labs/01-mini-runnable/` 中的最小复刻实验（实现简化版 StateGraph → compile → invoke 流程）\n"},"lab":{"label":"实验","path":"labs/01-mini-runnable/README.md","markdown":"# Mini StateGraph — 最小复刻实验\n\n## 目标\n\n不依赖 LangGraph 源码，用 50-80 行 Python 复刻 StateGraph + compile + invoke 的最小图执行引擎。\n通过这个实验，你将深入理解 LangGraph 的 Builder 模式（声明→编译→执行）和 Pregel 超步调度模型。\n\n## 背景\n\nLangGraph 的核心设计是\"把 AI Agent 的执行逻辑建模为有向图\"。`StateGraph` 是 Builder，通过 `add_node`/`add_edge` 声明图拓扑；`compile()` 将声明式定义冻结为不可变的 `CompiledStateGraph`；执行阶段通过 `invoke()` 驱动 Pregel 超步循环，按拓扑顺序调度节点。\n\n这种\"声明→编译→执行\"三阶段分离是工程中常见的模式（类似 Makefile → make、Spring Bean 定义 → ApplicationContext），它让图定义阶段可以做充分验证，执行阶段只关心调度。\n\n## 任务\n\n用纯 Python（无第三方依赖）实现：\n\n1. `MiniStateGraph`：Builder 类，支持 `add_node(name, func)` 和 `add_edge(source, target)` 声明图拓扑\n2. `MiniCompiledGraph`：编译产物，支持 `invoke(state)` 按拓扑顺序执行节点\n3. `MiniStateGraph.compile()`：验证图连通性后返回 `MiniCompiledGraph` 实例\n\n## 建议接口\n\n```python\nfrom typing import TypedDict, Callable, Any\n\nSTART = \"__start__\"\nEND = \"__end__\"\n\nclass MiniStateGraph:\n    def __init__(self, state_schema: type):\n        \"\"\"初始化，接收 TypedDict 类型作为状态 schema\"\"\"\n        ...\n\n    def add_node(self, name: str, func: Callable[[dict], dict]):\n        \"\"\"注册节点：func 接收 state，返回 partial state 更新\"\"\"\n        ...\n\n    def add_edge(self, source: str, target: str):\n        \"\"\"添加有向边：source → target\"\"\"\n        ...\n\n    def compile(self) -> \"MiniCompiledGraph\":\n        \"\"\"验证图结构 → 生成拓扑排序 → 返回编译产物\"\"\"\n        ...\n\n\nclass MiniCompiledGraph:\n    def __init__(self, nodes, edges, entry_point, state_schema):\n        ...\n\n    def invoke(self, initial_state: dict) -> dict:\n        \"\"\"按拓扑顺序执行节点，每个节点的返回值 merge 到 state\"\"\"\n        ...\n```\n\n## 测试要求\n\n编写至少 2 个测试：\n1. **正常路径**：3 个节点的线性图（A→B→C），验证 invoke 按序执行且状态正确传递\n2. **边界情况**：编译时检测到无法从 START 到达 END 的断裂图，抛出 ValueError\n\n## 验收标准\n\n- [ ] `add_node` / `add_edge` 只做声明，不执行任何逻辑\n- [ ] `compile()` 验证 START 到 END 的可达性\n- [ ] `invoke()` 按拓扑顺序执行，每个节点返回的 dict merge 回 state\n- [ ] 代码不超过 80 行（不含测试）\n- [ ] 测试全部通过\n\n## 提示\n\n- 拓扑排序可用 Kahn 算法（BFS 入度法），10 行左右即可实现\n- `invoke` 的核心循环：`for node in sorted_nodes: state.update(node_func(state))`\n- 不需要实现 stream/async，先聚焦同步 invoke 即可\n"}}},{"id":"02-message-schema","title":"TypedDict、Reducer 与 MessagesState 状态管理","depends_on":["01-runnable"],"primary_path":"libs/langgraph/langgraph/channels/binop.py","primary_symbol":"BinaryOperatorAggregate","claim_ids":["claim-02-message-schema"],"evidence_ids":["ev-get-channels-code","ev-binop-channel-code","ev-test-channels-binop","ev-test-messages-state"],"sections":{"lesson":{"label":"课程","path":"lessons/02-message-schema.md","markdown":"# 02 状态与消息：TypedDict、Reducer 与 MessagesState\n\n## 你会学到什么\n\n- LangGraph 如何用 Python TypedDict 定义图状态 schema。\n- `Annotated[type, reducer]` 如何将字段映射为 `BinaryOperatorAggregate` Channel。\n- 无注解字段默认使用 `LastValue` Channel（\"最后写入者胜\"）。\n- `MessagesState` 和 `add_messages` reducer 的设计思想。\n- 类比 Java/Go 中 Event Sourcing 的 reducer/fold 概念。\n\n## AI 概念从零解释\n\n在 workflow 引擎中，\"状态\"是所有节点共享的上下文。问题是：当多个节点并行写入同一字段时，如何合并？LangGraph 的答案是 **Channel + Reducer** 模式：\n\n- **LastValue Channel**：只保留最后写入的值，类似 Java `AtomicReference.set()`。适用于\"只有一个节点写\"的字段。\n- **BinaryOperatorAggregate Channel**：每次写入时，用你指定的二元操作符（如 `operator.add`、列表拼接）聚合新值和旧值。类似 Kafka Streams 的 `reduce()`。\n\n这和 Redux 的 reducer 概念一样：`newState = reducer(oldState, action)`。在 LangGraph 里，`Annotated[list[Message], add_messages]` 就是在说\"这个字段的 reducer 是 `add_messages` 函数\"。\n\n**`MessagesState`** 是 LangGraph 预定义的 TypedDict，包含一个用 `add_messages` 作为 reducer 的 `messages` 字段。`add_messages` 按消息 ID 合并（相同 ID 覆盖，新 ID 追加），支持 `RemoveMessage` 删除——这和 CRDT（Conflict-free Replicated Data Type）的思路类似。\n\n## 源码阅读路径\n\n| 属性 | 值 |\n|------|------|\n| repo | langchain-ai/langgraph |\n| commit | `83dd61feaca993d2ee428706ad04c869895ce400` |\n| scope | `libs/langgraph/langgraph/channels/` + `libs/langgraph/langgraph/graph/` |\n| primary path | `libs/langgraph/langgraph/channels/binop.py` |\n| primary symbol | `BinaryOperatorAggregate` |\n\n**3 步阅读法**：\n1. 从 `_get_channels()`（`state.py` L1801-1859）开始，看 TypedDict 字段如何被解析为不同 Channel 类型。\n2. 阅读 `BinaryOperatorAggregate`（`binop.py` L51-142），理解其 `update()` 方法如何逐一应用 operator 聚合值。\n3. 看 `MessagesState`（`graph/message.py` L372-373）和 `add_messages`（L60-244）的实现，理解消息合并策略。\n\n## 关键 claims 与 evidence\n\n### claim-02-message-schema\n\n> TypedDict 中使用 Annotated[type, reducer] 标注的字段会被解析为 BinaryOperatorAggregate Channel，未标注字段使用 LastValue Channel\n\n**证据支持**：\n\n- **ev-get-channels-code**（`state.py` L1801-1859）：`_get_channels` 函数遍历 TypedDict 的 `type_hints`，对每个字段调用 `_get_channel`。如果字段是 `Annotated[type, binop]` 则创建 `BinaryOperatorAggregate`，否则 fallback 到 `LastValue`。\n- **ev-binop-channel-code**（`binop.py` L51-142）：`BinaryOperatorAggregate.update()` 接收 `values: Sequence[Value]`，对每个值执行 `self.value = self.operator(self.value, value)` 完成聚合。\n- **ev-test-channels-binop**（`test_channels.py` L92-107）：测试 `test_binop` 使用 `operator.add` 验证 `BinaryOperatorAggregate` 正确聚合多个整数值。\n- **ev-test-messages-state**（`test_messages_state.py` L188-210）：测试验证 `MessagesState` 的 `add_messages` reducer 正确管理消息列表的追加和按 ID 覆盖。\n\n## 相关测试证据\n\n- **ev-test-channels-binop**（`test_channels.py` L92-107）：创建一个 `BinaryOperatorAggregate(int, operator.add)` 实例，分别 update `[1]`、`[2, 3]`，验证累加结果为 6。阅读时重点看 `update()` 被调用后 `get()` 返回的累计值如何变化。\n- **ev-test-messages-state**（`test_messages_state.py` L188-210）：构建一个使用 `MessagesState` 的简单图，验证多轮消息写入后 `messages` 字段正确追加而非覆盖。阅读时关注 `add_messages` 的 ID 合并逻辑。\n\n## 真实源码解释\n\n`_get_channels` 是整个状态解析的入口。它通过 `get_type_hints(schema, include_extras=True)` 提取 TypedDict 每个字段的类型注解。对于 `Annotated[list[Message], add_messages]` 这样的字段，`_is_field_binop()` 检测到第二个元素是 callable，就创建 `BinaryOperatorAggregate(list, add_messages)`。\n\n`BinaryOperatorAggregate` 的核心在 `update()` 方法：如果当前值为 MISSING（未初始化），直接取第一个值；之后逐个应用 `self.operator(self.value, value)`。它还支持 `Overwrite` 语义——某些情况下你需要强制覆盖而非聚合。\n\n`add_messages` 函数并不是简单的 `list.extend`。它按 ID 建立索引：如果新消息 ID 已存在则覆盖，`RemoveMessage` 则删除对应 ID 的消息。这让消息管理有了\"编辑\"和\"撤回\"的能力，而不仅仅是追加。\n\n## 自测题\n\n请前往 `quizzes/02-message-schema.quiz.md` 完成自测。\n\n## 掌握度验证\n\n请前往 `mastery/02-message-schema.mastery.md` 完成掌握度验证。\n\n## 最小复刻任务\n\n请前往 `labs/02-message-types/` 完成最小复刻任务。\n\n## 学完标准\n\n- 能解释 `Annotated[list, add_messages]` 在编译阶段如何被解析为 `BinaryOperatorAggregate` Channel。\n- 能说出 `LastValue` 和 `BinaryOperatorAggregate` 的行为差异及各自适用场景。\n- 能描述 `add_messages` 的三种行为：追加新消息、按 ID 覆盖、RemoveMessage 删除。\n- 能手写一个自定义 reducer 函数并用 `Annotated` 绑定到 TypedDict 字段。\n- 能解释为什么并行节点写入需要 reducer 而非简单覆盖。\n"},"quiz":{"label":"测试","path":"quizzes/02-message-schema.quiz.md","markdown":"# 状态与消息：TypedDict、Reducer 与 MessagesState — 自测题\n\n## 选择题\n\n### 1. 在 TypedDict 中，未使用 Annotated 标注的字段默认使用什么 Channel 类型？\n\n- A. BinaryOperatorAggregate Channel\n- B. LastValue Channel\n- C. EphemeralValue Channel\n- D. DynamicBarrierValue Channel\n\n**答案**: B\n\n> `_get_channels` 函数对无注解字段 fallback 到 `LastValue` Channel（\"最后写入者胜\"语义）。参见 `ev-get-channels-code`（`state.py` L1801-1859）。\n\n### 2. add_messages reducer 的行为不包括以下哪项？\n\n- A. 追加新消息到列表\n- B. 按消息 ID 覆盖已有消息\n- C. 通过 RemoveMessage 删除对应 ID 的消息\n- D. 自动对消息列表去重（基于内容相同）\n\n**答案**: D\n\n> `add_messages` 按 ID 做索引管理：相同 ID 覆盖、新 ID 追加、RemoveMessage 删除。它不做基于内容的去重。参见课程中对 `add_messages`（`graph/message.py` L60-244）的描述。\n\n### 3. BinaryOperatorAggregate 的 update() 方法如何处理多个值？\n\n- A. 只保留最后一个值\n- B. 对每个值逐一执行 `self.operator(self.value, value)` 聚合\n- C. 将所有值放入列表返回\n- D. 计算所有值的平均值\n\n**答案**: B\n\n> `BinaryOperatorAggregate.update()` 对 values 序列中的每个值执行 `self.value = self.operator(self.value, value)` 完成聚合。参见 `ev-binop-channel-code`（`binop.py` L51-142）。\n\n## 简答题\n\n### 1. 请解释为什么并行节点写入同一字段时需要 reducer，而不能简单使用\"最后写入者胜\"策略？\n\n> 提示：考虑并行超步中多个节点同时写入的场景。参考 `ev-binop-channel-code` 和 `ev-get-channels-code` 理解 Channel 设计。\n\n### 2. 请描述 `Annotated[list[Message], add_messages]` 在编译阶段如何被解析为 `BinaryOperatorAggregate` Channel，并说明解析入口函数。\n\n> 提示：从 `_get_channels()`（`state.py` L1801-1859）出发，追踪 `_is_field_binop()` 的检测逻辑。参考 `ev-get-channels-code`。\n\n### 3. MessagesState 的 `add_messages` 被描述为类似 CRDT（Conflict-free Replicated Data Type）。请解释这个类比的合理性——它支持哪三种操作？为什么这比简单的 list.extend 更强大？\n\n> 提示：按 ID 索引管理（追加、覆盖、删除），支持\"编辑\"和\"撤回\"能力。参考 `ev-test-messages-state`。\n\n## 参考答案说明\n\n简答题没有唯一答案。回答时需要：\n- 引用具体的源码路径\n- 引用相关的 evidence id\n- 区分\"源码证明\"和\"课程推断\"\n"},"mastery":{"label":"掌握度","path":"mastery/02-message-schema.mastery.md","markdown":"# 状态与消息：TypedDict、Reducer 与 MessagesState — 掌握度检查\n\n## 口头讲解\n\n不看课程，向同事清晰讲出以下要点：\n\n1. LangGraph 用 TypedDict 定义图状态 schema，每个字段被解析为一个 Channel，控制并行写入时的合并策略。\n2. `Annotated[type, reducer]` 标注的字段映射为 `BinaryOperatorAggregate` Channel（聚合语义），无标注字段使用 `LastValue` Channel（最后写入者胜）。\n3. `MessagesState` 是预定义 TypedDict，其 `messages` 字段使用 `add_messages` 作为 reducer——按 ID 合并（相同 ID 覆盖、新 ID 追加、RemoveMessage 删除）。\n4. `_get_channels()` 是状态解析入口，通过 `get_type_hints(schema, include_extras=True)` 提取字段注解，决定创建何种 Channel。\n\n## 代码阅读检查\n\n- [ ] 能在 `state.py` L1801-1859 中找到 `_get_channels` 函数，并解释其遍历 TypedDict 字段的逻辑\n- [ ] 能在 `binop.py` L51-142 中找到 `BinaryOperatorAggregate.update()`，说明其逐值聚合的机制\n- [ ] 能在 `graph/message.py` 中找到 `add_messages` 实现，解释按 ID 索引的三种行为（追加、覆盖、删除）\n- [ ] 能说明 `LastValue` Channel 和 `BinaryOperatorAggregate` Channel 的适用场景边界\n- [ ] 能解释 `_is_field_binop()` 如何判断一个字段是否需要聚合 Channel\n\n## 通过标准\n\n你已掌握本课程，如果你能：\n- 解释核心 claim（Annotated → BinaryOperatorAggregate，无标注 → LastValue）并引用 `ev-get-channels-code`\n- 引用 `ev-test-channels-binop` 和 `ev-test-messages-state` 说明 Channel 行为的验证方式\n- 完成 `labs/02-message-types/` 中的最小复刻实验（实现简化版 Channel + reducer 机制）\n"},"lab":{"label":"实验","path":"labs/02-message-types/README.md","markdown":"# Mini Channel & Reducer — 最小复刻实验\n\n## 目标\n\n不依赖 LangGraph 源码，用 50-80 行 Python 复刻 TypedDict 状态解析 + Channel + Reducer 机制。\n通过这个实验，你将深入理解 LangGraph 如何用 `Annotated[type, reducer]` 将状态字段映射为不同的 Channel 类型，以及 reducer 如何解决并行写入冲突。\n\n## 背景\n\nLangGraph 的状态管理核心问题是：当多个节点并行写入同一个字段时如何合并？答案是 **Channel + Reducer** 模式。无注解字段使用 `LastValue` Channel（最后写入者胜），`Annotated[type, reducer]` 字段使用 `BinaryOperatorAggregate` Channel（通过 reducer 函数聚合）。\n\n这和 Redux 的 reducer 概念一样：`newState = reducer(oldState, action)`。预定义的 `add_messages` reducer 按消息 ID 合并（相同 ID 覆盖，新 ID 追加），这让消息管理有了\"编辑\"和\"撤回\"的能力。\n\n## 任务\n\n用纯 Python（无第三方依赖）实现：\n\n1. `LastValueChannel`：只保留最后写入的值\n2. `BinaryOpChannel`：接受一个 reducer 函数，每次写入时用 reducer 聚合新旧值\n3. `parse_state_channels(schema)`：解析 TypedDict，根据 `Annotated` 注解决定每个字段用哪种 Channel\n\n## 建议接口\n\n```python\nfrom typing import TypedDict, Annotated, get_type_hints, Any, Callable\n\nclass LastValueChannel:\n    def __init__(self):\n        self.value = None\n\n    def update(self, value: Any):\n        \"\"\"直接覆盖：最后写入者胜\"\"\"\n        ...\n\n    def get(self) -> Any:\n        ...\n\n\nclass BinaryOpChannel:\n    def __init__(self, reducer: Callable[[Any, Any], Any], default: Any):\n        self.reducer = reducer\n        self.value = default\n\n    def update(self, value: Any):\n        \"\"\"聚合：self.value = reducer(self.value, value)\"\"\"\n        ...\n\n    def get(self) -> Any:\n        ...\n\n\ndef parse_state_channels(schema: type) -> dict[str, LastValueChannel | BinaryOpChannel]:\n    \"\"\"\n    解析 TypedDict schema，返回 {field_name: channel} 映射。\n    - Annotated[type, reducer] → BinaryOpChannel(reducer, default)\n    - 普通字段 → LastValueChannel\n    \"\"\"\n    ...\n```\n\n## 测试要求\n\n编写至少 2 个测试：\n1. **正常路径**：定义带 `Annotated[list, operator.add]` 的 TypedDict，验证多次 update 后值正确聚合（如 `[1] + [2] + [3] = [1,2,3]`）\n2. **边界情况**：验证 LastValueChannel 多次 update 只保留最后一个值；验证 BinaryOpChannel 首次写入时的初始化行为\n\n## 验收标准\n\n- [ ] `parse_state_channels` 正确区分 Annotated 和非 Annotated 字段\n- [ ] `LastValueChannel.update()` 只保留最后值\n- [ ] `BinaryOpChannel.update()` 正确调用 reducer 聚合\n- [ ] 支持自定义 reducer 函数（如 `operator.add`、列表拼接、消息合并）\n- [ ] 代码不超过 80 行（不含测试）\n- [ ] 测试全部通过\n\n## 提示\n\n- 用 `get_type_hints(schema, include_extras=True)` 获取包含 `Annotated` 信息的类型注解\n- `Annotated[list, add_messages]` 的 `__metadata__` 属性包含 reducer 函数\n- 初始值可以用 sentinel（如 `_MISSING`）标记\"未初始化\"状态\n"}}},{"id":"03-prompt-template","title":"节点函数作为提示装配层：add_node 与函数签名","depends_on":["01-runnable","02-message-schema"],"primary_path":"libs/langgraph/langgraph/graph/state.py","primary_symbol":"StateGraph.add_node","claim_ids":["claim-03-prompt-template"],"evidence_ids":["ev-add-node-impl-code","ev-state-node-spec-code","ev-test-add-node-function","ev-test-node-name-infer"],"sections":{"lesson":{"label":"课程","path":"lessons/03-prompt-template.md","markdown":"# 03 节点函数即提示装配层：把业务上下文变成模型输入\n\n## 你会学到什么\n\n- `StateGraph.add_node` 如何将普通 Python 函数注册为图节点。\n- 节点函数签名 `(State) -> dict` 和 `(State, config) -> dict` 的设计意图。\n- 函数名自动推断为节点名的机制（类比 Spring Bean 的按方法名注册）。\n- `StateNodeSpec` 数据类如何描述节点的元信息。\n- 节点函数作为\"提示装配层\"——从 State 取数据、组装 prompt、调用模型的模式。\n\n## AI 概念从零解释\n\n在 LangGraph 中，节点不是某个框架提供的复杂类——它就是一个**普通 Python 函数**。函数接收当前 State（一个 TypedDict 字典），返回一个 partial dict 表示\"我要更新这些字段\"。\n\n这和 Go 的 handler 或 Java 的 `Function\u003cState, Map>` 接口本质一样。LangGraph 的设计选择是：\n\n- **约定大于配置**：函数名就是节点名，不需要额外注解。\n- **输入输出透明**：输入是完整 State，输出是你想更新的字段子集（框架帮你 merge 回 State）。\n- **无状态函数**：每个节点函数本身无状态，所有状态通过 State 传递。\n\n为什么说它是\"提示装配层\"？在 Agent 场景中，节点函数的典型职责是：\n1. 从 State 中提取业务上下文（用户消息、历史对话、工具结果）。\n2. 拼装成 LLM 可理解的 prompt（加系统消息、格式化工具结果）。\n3. 调用模型，将结果写回 State。\n\n这层逻辑就像 Java 中的 Service 方法——编排数据、调用外部依赖、返回结果。\n\n## 源码阅读路径\n\n| 属性 | 值 |\n|------|------|\n| repo | langchain-ai/langgraph |\n| commit | `83dd61feaca993d2ee428706ad04c869895ce400` |\n| scope | `libs/langgraph/langgraph/graph/` |\n| primary path | `libs/langgraph/langgraph/graph/state.py` |\n| primary symbol | `StateGraph.add_node` |\n\n**3 步阅读法**：\n1. 从 `add_node`（`state.py` L662-913）入口开始，看第一个 `if not isinstance(node, str)` 分支如何从函数的 `__name__` 推断节点名。\n2. 看 `coerce_to_runnable(action, name=node, trace=False)` 调用，理解普通函数被包装为 `RunnableCallable`。\n3. 阅读 `StateNodeSpec`（`_node.py` L1-80）和节点函数的多种 Protocol 签名，理解框架支持的函数形态。\n\n## 关键 claims 与 evidence\n\n### claim-03-prompt-template\n\n> StateGraph.add_node 接受普通 Python 函数作为节点，函数签名为 (State) -> dict 或 (State, config) -> dict，自动推断函数名为节点名\n\n**证据支持**：\n\n- **ev-add-node-impl-code**（`state.py` L662-913）：`add_node` 核心逻辑——如果第一个参数不是 string，则用 `getattr(action, \"__name__\")` 推断节点名。然后通过 `coerce_to_runnable` 包装为 Runnable，最终创建 `StateNodeSpec` 存入 `self.nodes` 字典。\n- **ev-state-node-spec-code**（`_node.py` L1-80）：`StateNodeSpec` 定义了节点的完整规格：`runnable`（执行逻辑）、`metadata`、`input_schema`、`retry_policy`、`cache_policy` 等。同时 `_node.py` 定义了 `_Node`/`_NodeWithConfig`/`_NodeWithWriter` 等 Protocol，描述函数签名的多种合法形态。\n- **ev-test-add-node-function**（`test_pregel.py` L433-462）：测试 `test_invoke_single_process_in_out` 使用普通函数作为节点，验证完整的 add_node→compile→invoke 流程。\n- **ev-test-node-name-infer**（`test_pregel.py` L505-528）：测试 `test_invoke_single_process_in_out_dict` 验证函数名被正确推断为节点名。\n\n## 相关测试证据\n\n- **ev-test-add-node-function**（`test_pregel.py` L433-462）：定义函数 `add_one(x)`，通过 `builder.add_node(add_one)` 注册，验证 `graph.invoke({\"x\": 1})` 返回 `{\"x\": 2}`。阅读时关注：测试没有显式传节点名，说明 `add_one.__name__` 被自动使用。\n- **ev-test-node-name-infer**（`test_pregel.py` L505-528）：测试使用字典形式的返回值，验证函数名即节点名的行为在不同返回格式下都一致。阅读时注意 `stream` 输出中节点名与函数名的对应关系。\n\n## 真实源码解释\n\n`add_node` 的设计体现了\"零配置优先\"理念。当你传入一个函数时，框架做三件事：\n\n1. **推断节点名**：`node = getattr(action, \"__name__\", action.__class__.__name__)`。如果你传入 lambda 或没名字的 callable，会报错要求显式指定名字。\n2. **包装为 Runnable**：`coerce_to_runnable(action, name=node, trace=False)` 将普通函数包装为 `RunnableCallable`，使其拥有 `invoke/ainvoke` 能力。`trace=False` 意味着节点自身不产生独立的 trace span（图级别已有 trace）。\n3. **创建节点规格**：`StateNodeSpec` 记录节点的 runnable、input_schema（默认为图的 state_schema）、retry_policy 等配置。\n\n函数签名方面，`_node.py` 定义了 9 种合法 Protocol（`_Node`、`_NodeWithConfig`、`_NodeWithWriter`、`_NodeWithStore`、`_NodeWithRuntime` 等）。框架通过 inspect 检测函数参数名来决定注入什么（config、writer、store、runtime），这和 Spring 的依赖注入类似，只是基于参数名约定。\n\n## 自测题\n\n请前往 `quizzes/03-prompt-template.quiz.md` 完成自测。\n\n## 掌握度验证\n\n请前往 `mastery/03-prompt-template.mastery.md` 完成掌握度验证。\n\n## 最小复刻任务\n\n请前往 `labs/03-mini-prompt-template/` 完成最小复刻任务。\n\n## 学完标准\n\n- 能解释 `add_node(my_func)` 内部发生的三步操作（推断名→包装 Runnable→创建 NodeSpec）。\n- 能列举节点函数的至少 4 种合法签名形态及其注入参数。\n- 能说明为什么节点函数返回 `dict` 而非完整 State（partial update 语义）。\n- 能口述节点函数在 Agent 场景中\"从 State 取数据→组装 prompt→调用模型→写回 State\"的标准模式。\n"},"quiz":{"label":"测试","path":"quizzes/03-prompt-template.quiz.md","markdown":"# 节点函数即提示装配层 — 自测题\n\n## 选择题\n\n### 1. 当调用 `builder.add_node(my_func)` 时，框架如何确定节点名？\n\n- A. 使用函数的第一个参数名\n- B. 使用 `getattr(action, \"__name__\")` 获取函数名\n- C. 自动生成 UUID 作为节点名\n- D. 必须由用户显式指定\n\n**答案**: B\n\n> `add_node` 使用 `getattr(action, \"__name__\", action.__class__.__name__)` 推断节点名。如果传入 lambda 或无名 callable，会报错要求显式指定。参见 `ev-add-node-impl-code`（`state.py` L662-913）。\n\n### 2. 节点函数的返回值语义是什么？\n\n- A. 返回完整的新 State 替换旧 State\n- B. 返回一个 partial dict，框架将其 merge 回 State（partial update）\n- C. 返回 None，通过副作用修改 State\n- D. 返回 Runnable 对象供下一步执行\n\n**答案**: B\n\n> 节点函数返回 dict 表示\"我要更新这些字段\"，框架负责将 partial dict merge 回完整 State。这是 partial update 语义。\n\n### 3. add_node 内部对普通函数做了哪些处理？\n\n- A. 推断节点名 → 包装为 RunnableCallable → 创建 StateNodeSpec\n- B. 直接存入 self.nodes 字典，不做任何包装\n- C. 将函数编译为字节码优化执行速度\n- D. 创建线程池为该节点分配独立执行上下文\n\n**答案**: A\n\n> add_node 做三件事：(1) `__name__` 推断节点名，(2) `coerce_to_runnable` 包装为 RunnableCallable，(3) 创建 `StateNodeSpec` 存入 `self.nodes`。参见 `ev-add-node-impl-code`。\n\n## 简答题\n\n### 1. 请列举节点函数的至少 4 种合法签名形态，并说明框架如何通过 inspect 检测参数名来决定注入什么。\n\n> 提示：`_node.py` 定义了 `_Node`、`_NodeWithConfig`、`_NodeWithWriter`、`_NodeWithStore`、`_NodeWithRuntime` 等 Protocol。参考 `ev-state-node-spec-code`（`_node.py` L1-80）。\n\n### 2. 为什么说节点函数在 Agent 场景中充当\"提示装配层\"？请描述其典型职责模式（从 State 取数据→组装 prompt→调用模型→写回 State）。\n\n> 提示：类比 Java 中的 Service 方法——编排数据、调用外部依赖、返回结果。参考 `ev-test-add-node-function`（`test_pregel.py` L433-462）中的测试用例。\n\n## 参考答案说明\n\n简答题没有唯一答案。回答时需要：\n- 引用具体的源码路径\n- 引用相关的 evidence id\n- 区分\"源码证明\"和\"课程推断\"\n"},"mastery":{"label":"掌握度","path":"mastery/03-prompt-template.mastery.md","markdown":"# 节点函数即提示装配层 — 掌握度检查\n\n## 口头讲解\n\n不看课程，向同事清晰讲出以下要点：\n\n1. `add_node` 接受普通 Python 函数，内部做三步：推断函数名为节点名 → `coerce_to_runnable` 包装为 RunnableCallable → 创建 `StateNodeSpec` 存入 `self.nodes`。\n2. 节点函数签名为 `(State) -> dict`（或带 config/writer/store/runtime 参数的变体），返回 partial dict 表示\"要更新哪些字段\"。\n3. 框架通过 inspect 检测参数名决定注入什么（config、writer、store、runtime），类似 Spring 的依赖注入。\n4. 在 Agent 场景中，节点函数充当\"提示装配层\"：从 State 取数据 → 组装 prompt → 调用模型 → 将结果写回 State。\n\n## 代码阅读检查\n\n- [ ] 能在 `state.py` L662-913 中找到 `add_node` 的实现，指出节点名推断的具体代码行\n- [ ] 能在 `_node.py` L1-80 中找到 `StateNodeSpec` 定义和至少 4 种函数签名 Protocol\n- [ ] 能解释 `coerce_to_runnable(action, name=node, trace=False)` 中 `trace=False` 的设计意图\n- [ ] 能说明为什么节点函数返回 partial dict 而非完整 State（与 reducer/Channel 的配合关系）\n\n## 通过标准\n\n你已掌握本课程，如果你能：\n- 解释核心 claim（add_node 接受函数、推断名、包装 Runnable）并引用 `ev-add-node-impl-code`\n- 引用 `ev-test-add-node-function` 和 `ev-test-node-name-infer` 说明函数注册和名称推断的验证方式\n- 完成 `labs/03-mini-prompt-template/` 中的最小复刻实验（实现简化版 add_node + 函数名推断）\n"},"lab":{"label":"实验","path":"labs/03-mini-prompt-template/README.md","markdown":"# Mini Node Function — 最小复刻实验\n\n## 目标\n\n不依赖 LangGraph 源码，用 50-80 行 Python 复刻节点函数注册 + 状态接收 + partial update 返回的机制。\n通过这个实验，你将深入理解 LangGraph 节点函数如何作为\"提示装配层\"——从 State 取数据、组装 prompt、返回状态更新。\n\n## 背景\n\n在 LangGraph 中，节点不是框架提供的复杂类——它就是一个普通 Python 函数。`add_node` 将函数注册为节点，自动推断函数名为节点名。函数接收完整 State（TypedDict），返回一个 partial dict 表示\"要更新的字段子集\"。框架负责将返回值 merge 回 State。\n\n这种设计让节点函数成为\"提示装配层\"：从 State 中提取业务上下文（用户消息、历史对话），拼装成 LLM prompt，调用模型后将结果写回 State。本实验聚焦这个\"State → 装配 → 返回更新\"的模式。\n\n## 任务\n\n用纯 Python（无第三方依赖）实现：\n\n1. `MiniNodeRegistry`：支持通过装饰器或 `add_node` 注册函数，自动推断函数名为节点名\n2. 节点执行器：接收 state，调用节点函数，将返回的 partial dict merge 回 state\n3. 一个示例\"提示装配\"节点：从 state 提取 messages，拼装为 prompt 字符串，写回 state\n\n## 建议接口\n\n```python\nfrom typing import Callable, Any\n\nclass MiniNodeRegistry:\n    def __init__(self):\n        self.nodes: dict[str, Callable] = {}\n\n    def add_node(self, func_or_name, func=None):\n        \"\"\"\n        支持两种用法：\n        - add_node(my_func)       → 自动推断 'my_func' 为节点名\n        - add_node('name', func)  → 显式指定节点名\n        \"\"\"\n        ...\n\n    def execute_node(self, name: str, state: dict) -> dict:\n        \"\"\"执行节点函数，将返回的 partial dict merge 回 state 副本\"\"\"\n        ...\n\n    def run_pipeline(self, node_names: list[str], initial_state: dict) -> dict:\n        \"\"\"按顺序执行多个节点，状态逐步累积\"\"\"\n        ...\n\n\ndef assemble_prompt(state: dict) -> dict:\n    \"\"\"\n    示例节点函数：从 state['messages'] 组装 prompt 字符串。\n    返回 {'prompt': '组装后的 prompt 内容'}\n    \"\"\"\n    ...\n```\n\n## 测试要求\n\n编写至少 2 个测试：\n1. **正常路径**：注册 2 个节点函数，pipeline 依次执行，验证 state 逐步更新（后一个节点能看到前一个节点的写入）\n2. **边界情况**：未传显式名称时验证函数名自动推断；传入 lambda 时抛出错误要求显式指定名称\n\n## 验收标准\n\n- [ ] 支持函数名自动推断（`func.__name__`）\n- [ ] 节点函数接收完整 state，返回 partial dict\n- [ ] `execute_node` 不修改原 state（返回新副本）\n- [ ] pipeline 按序执行，状态正确传递\n- [ ] 代码不超过 80 行（不含测试）\n- [ ] 测试全部通过\n\n## 提示\n\n- `getattr(func, '__name__', None)` 可获取函数名，lambda 的 `__name__` 是 `'\u003clambda>'`\n- merge 语义：`{**state, **partial_update}`，新值覆盖旧值\n- 节点函数应该是无副作用的纯函数——所有状态通过 state 传递\n"}}},{"id":"04-chat-model-adapter","title":"ChatModel 作为图节点：create_react_agent 中的模型适配","depends_on":["03-prompt-template"],"primary_path":"libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py","primary_symbol":"create_react_agent","claim_ids":["claim-04-chat-model-adapter"],"evidence_ids":["ev-create-react-agent-code","ev-should-bind-tools-code","ev-test-react-agent-basic","ev-test-react-agent-prompt"],"sections":{"lesson":{"label":"课程","path":"lessons/04-chat-model-adapter.md","markdown":"# 04 模型适配：把 ChatModel 当成图节点的一部分\n\n## 你会学到什么\n\n- `create_react_agent` 如何接受 `LanguageModelLike` 参数并自动绑定工具。\n- `_should_bind_tools` 的检测逻辑：判断模型是否已经绑定了工具。\n- `prompt | model` chain 如何组成 agent 节点的执行管道。\n- `LanguageModelLike` 协议的\"鸭子类型\"设计——任何实现 `invoke(messages)` 的对象都能用。\n- 类比 Java 中的 Adapter Pattern：将第三方 SDK 的 ChatModel 适配为框架内的节点。\n\n## AI 概念从零解释\n\n在 Agent 系统中，ChatModel（如 GPT-4、Claude）不是独立工作的——它需要被\"嵌入\"到图的执行流中。问题是：不同 LLM 提供商的 API 格式不同（OpenAI 的 function calling、Anthropic 的 tool use），如何统一？\n\nLangGraph 的策略是**适配器模式**：\n\n1. **LanguageModelLike**：LangChain Core 定义的协议类型，只要对象有 `invoke(messages) -> BaseMessage` 方法就满足。类似 Go 的 interface——不需要显式 implement，有方法就行。\n2. **bind_tools**：模型实例调用 `.bind_tools(tools)` 后，返回一个 `RunnableBinding`——原模型加上工具定义。这和 Java 中\"装饰器\"或\"代理\"模式一样：不修改原对象，包装后增加能力。\n3. **agent 节点 = prompt | model**：在 `create_react_agent` 中，agent 节点的执行逻辑是 `prompt_runnable | model`（RunnableSequence），先组装消息列表，再调用模型。\n\n这种设计让你可以用**任何 LLM**（包括自部署的开源模型），只要它遵循 `LanguageModelLike` 协议。类比 Java JDBC 驱动适配器——不同数据库的驱动不同，但对上层暴露统一的 `Connection.execute()` 接口。\n\n## 源码阅读路径\n\n| 属性 | 值 |\n|------|------|\n| repo | langchain-ai/langgraph |\n| commit | `83dd61feaca993d2ee428706ad04c869895ce400` |\n| scope | `libs/prebuilt/langgraph/prebuilt/` |\n| primary path | `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py` |\n| primary symbol | `create_react_agent` |\n\n**3 步阅读法**：\n1. 从 `_should_bind_tools`（L173-217）开始，理解框架如何判断模型是否需要自动绑定工具。\n2. 阅读 `create_react_agent`（L278-500）的参数定义和函数签名，重点看 `model` 参数的类型联合体（支持 str、LanguageModelLike、动态 Callable）。\n3. 追踪函数内部如何构建 `StateGraph`、注册 agent 节点（model 作为核心）和 tools 节点，最后 compile 返回。\n\n## 关键 claims 与 evidence\n\n### claim-04-chat-model-adapter\n\n> create_react_agent 接受 LanguageModelLike 参数，自动调用 model.bind_tools(tools) 绑定工具，并将 prompt|model 组成的 chain 作为 agent 节点\n\n**证据支持**：\n\n- **ev-create-react-agent-code**（`chat_agent_executor.py` L278-500）：`create_react_agent` 接受 `model: LanguageModelLike` 参数，内部构建包含 `agent` 和 `tools` 两个节点的 `StateGraph`。agent 节点的执行逻辑是 prompt + model 的 chain。\n- **ev-should-bind-tools-code**（`chat_agent_executor.py` L173-198）：`_should_bind_tools` 检查模型是否为 `RunnableBinding` 且 kwargs 中包含 `tools` 键。如果未绑定则返回 True，触发自动 `model.bind_tools(tools)` 调用。还做了工具数量一致性校验。\n- **ev-test-react-agent-basic**（`test_react_agent.py` L91-121）：测试 `test_no_prompt` 验证不带 prompt 时 create_react_agent 的基本 ReAct 循环执行——模型生成 tool_calls，ToolNode 执行，再回到模型。\n- **ev-test-react-agent-prompt**（`test_react_agent.py` L148-168）：测试 `test_system_message_prompt` 验证 SystemMessage 作为 prompt 参数被正确注入到消息列表开头。\n\n## 相关测试证据\n\n- **ev-test-react-agent-basic**（`test_react_agent.py` L91-121）：使用 `FakeToolCallingModel` 模拟 LLM 返回 tool_calls，验证 agent→tools→agent 的循环直到模型不再返回 tool_calls。阅读时关注：模型的 `bind_tools` 是否被自动调用，以及循环终止条件。\n- **ev-test-react-agent-prompt**（`test_react_agent.py` L148-168）：传入 `SystemMessage(\"You are helpful\")` 作为 prompt，验证模型收到的消息列表中第一条确实是该 SystemMessage。阅读时观察 prompt 是如何被插入到 messages 前面的。\n\n## 真实源码解释\n\n`create_react_agent` 是 LangGraph 最重要的预构建函数——它把\"ChatModel + Tools\"组装成完整的 ReAct Agent 图。核心设计决策有三个：\n\n**1. 智能工具绑定**：`_should_bind_tools` 先检查模型是否已通过 `model.bind_tools()` 绑定了工具。如果是 `RunnableBinding` 且 kwargs 有 `tools`，说明用户已手动绑定，跳过；否则自动调用 `model.bind_tools(tools)`。这避免了重复绑定，同时支持用户自定义绑定参数。\n\n**2. prompt 多态**：`prompt` 参数支持 4 种形态——字符串（转为 SystemMessage）、SystemMessage 对象、Callable（动态生成）、Runnable。框架将其统一包装为 `prompt_runnable`，在 agent 节点执行时先 run prompt 组装消息，再 pipe 给 model。\n\n**3. 图拓扑固定**：无论参数如何变化，生成的图结构始终是 `agent` → 条件边（有 tool_calls?） → `tools` → `agent`（循环）或 `END`。这就是经典的 ReAct 循环。`tools_condition` 函数检查最后一条 AIMessage 是否包含 tool_calls 来决定路由。\n\n`LanguageModelLike` 的鸭子类型设计意味着：你自己实现一个类，只要有 `invoke(messages: list[BaseMessage]) -> BaseMessage` 方法，就能直接传入 `create_react_agent`，无需继承任何基类。\n\n## 自测题\n\n请前往 `quizzes/04-chat-model-adapter.quiz.md` 完成自测。\n\n## 掌握度验证\n\n请前往 `mastery/04-chat-model-adapter.mastery.md` 完成掌握度验证。\n\n## 最小复刻任务\n\n请前往 `labs/04-mini-chat-model-adapter/` 完成最小复刻任务。\n\n## 学完标准\n\n- 能解释 `_should_bind_tools` 的判断逻辑及其三种返回路径。\n- 能说明 `LanguageModelLike` 协议的最小满足条件。\n- 能描述 create_react_agent 生成的图拓扑（agent → tools_condition → tools/END 循环）。\n- 能口述 prompt 参数的 4 种形态及各自的处理方式。\n- 能解释为什么 agent 节点使用 `prompt | model` 的 pipeline 模式而非直接调用 model。\n"},"quiz":{"label":"测试","path":"quizzes/04-chat-model-adapter.quiz.md","markdown":"# 模型适配：把 ChatModel 当成图节点的一部分 — 自测题\n\n## 选择题\n\n### 1. `_should_bind_tools` 函数在什么情况下返回 False（不自动绑定工具）？\n\n- A. 模型没有 `bind_tools` 方法时\n- B. 模型已经是 `RunnableBinding` 且 kwargs 中包含 `tools` 键时\n- C. tools 列表为空时\n- D. 模型不支持流式输出时\n\n**答案**: B\n\n> `_should_bind_tools` 检查模型是否为 `RunnableBinding` 且 kwargs 有 `tools` 键，如果已绑定则返回 False。参见 `ev-should-bind-tools-code`（`chat_agent_executor.py` L173-198）。\n\n### 2. create_react_agent 生成的图拓扑结构中，agent 节点的执行逻辑是什么？\n\n- A. 直接调用 model.invoke(state)\n- B. prompt_runnable | model 的 RunnableSequence（先组装消息，再调用模型）\n- C. 遍历所有工具并选择最匹配的执行\n- D. 将 state 序列化后发送到远程服务\n\n**答案**: B\n\n> agent 节点的执行逻辑是 `prompt | model`（RunnableSequence），先 run prompt 组装消息列表，再 pipe 给 model。参见 `ev-create-react-agent-code`（`chat_agent_executor.py` L278-500）。\n\n### 3. LanguageModelLike 协议的最小满足条件是什么？\n\n- A. 必须继承 BaseChatModel 基类\n- B. 必须实现 invoke/ainvoke/stream/astream 四个方法\n- C. 只要有 `invoke(messages: list[BaseMessage]) -> BaseMessage` 方法就满足\n- D. 必须注册到 LangChain 的模型注册表中\n\n**答案**: C\n\n> LanguageModelLike 是鸭子类型协议——只要对象有 `invoke(messages) -> BaseMessage` 方法就能传入 create_react_agent，无需继承任何基类。\n\n## 简答题\n\n### 1. 请描述 create_react_agent 中 prompt 参数支持的 4 种形态，以及框架如何将它们统一包装为 prompt_runnable。\n\n> 提示：字符串（转 SystemMessage）、SystemMessage 对象、Callable（动态生成）、Runnable。参考 `ev-create-react-agent-code`（`chat_agent_executor.py` L278-500）。\n\n### 2. 为什么 agent 节点使用 `prompt | model` 的 pipeline 模式，而不是在节点函数中直接调用 `model.invoke(messages)`？请从组合性和可复用性角度分析。\n\n> 提示：RunnableSequence 允许独立替换 prompt 或 model 组件，且支持 trace 和 streaming。参考 `ev-test-react-agent-prompt`（`test_react_agent.py` L148-168）。\n\n### 3. 请解释 `_should_bind_tools` 的三种返回路径，以及为什么框架需要做工具数量一致性校验。\n\n> 提示：已绑定相同工具→False，未绑定→True，绑定工具数量不匹配→抛异常。参考 `ev-should-bind-tools-code`。\n\n## 参考答案说明\n\n简答题没有唯一答案。回答时需要：\n- 引用具体的源码路径\n- 引用相关的 evidence id\n- 区分\"源码证明\"和\"课程推断\"\n"},"mastery":{"label":"掌握度","path":"mastery/04-chat-model-adapter.mastery.md","markdown":"# 模型适配：把 ChatModel 当成图节点的一部分 — 掌握度检查\n\n## 口头讲解\n\n不看课程，向同事清晰讲出以下要点：\n\n1. `create_react_agent` 接受 `LanguageModelLike` 参数（鸭子类型协议），只要有 `invoke(messages) -> BaseMessage` 方法就能使用。\n2. `_should_bind_tools` 智能判断：已绑定工具则跳过，未绑定则自动调用 `model.bind_tools(tools)`，绑定数量不一致则报错。\n3. agent 节点的执行逻辑是 `prompt_runnable | model` 的 RunnableSequence——先组装消息列表，再调用模型。\n4. 生成的图拓扑固定为 `agent → tools_condition → tools/END` 循环结构（经典 ReAct 模式）。\n\n## 代码阅读检查\n\n- [ ] 能在 `chat_agent_executor.py` L173-198 中找到 `_should_bind_tools` 的判断逻辑，说明三种返回路径\n- [ ] 能在 `chat_agent_executor.py` L278-500 中追踪 `create_react_agent` 如何构建 StateGraph 并注册 agent/tools 节点\n- [ ] 能解释 prompt 参数的 4 种形态（str/SystemMessage/Callable/Runnable）及其统一包装方式\n- [ ] 能说明 `LanguageModelLike` 鸭子类型协议与 Java 显式接口实现的设计哲学差异\n\n## 通过标准\n\n你已掌握本课程，如果你能：\n- 解释核心 claim（LanguageModelLike + 自动 bind_tools + prompt|model chain）并引用 `ev-create-react-agent-code` 和 `ev-should-bind-tools-code`\n- 引用 `ev-test-react-agent-basic` 和 `ev-test-react-agent-prompt` 说明基本 ReAct 循环和 prompt 注入的验证方式\n- 完成 `labs/04-mini-chat-model-adapter/` 中的最小复刻实验（实现简化版模型适配和 prompt pipeline）\n"},"lab":{"label":"实验","path":"labs/04-mini-chat-model-adapter/README.md","markdown":"# Mini Chat Model Adapter — 最小复刻实验\n\n## 目标\n\n不依赖 LangGraph 源码，用 50-80 行 Python 复刻模型适配器 + 工具绑定判断的机制。\n通过这个实验，你将深入理解 LangGraph 如何通过适配器模式统一不同 LLM 提供商的接口，以及 `bind_tools` 的装饰器设计。\n\n## 背景\n\n在 Agent 系统中，不同 LLM 的 API 格式不同（OpenAI function calling、Anthropic tool use）。LangGraph 用**适配器模式**解决：定义 `LanguageModelLike` 协议（鸭子类型），任何实现 `invoke(messages)` 的对象都能用。`bind_tools` 不修改原模型，而是返回一个包装后的新对象（装饰器模式）。\n\n`create_react_agent` 内部通过 `_should_bind_tools` 检查模型是否已绑定工具——如果已绑定则跳过，未绑定则自动调用 `model.bind_tools(tools)`。最终 agent 节点的执行逻辑是 `prompt | model` 的管道。\n\n## 任务\n\n用纯 Python（无第三方依赖）实现：\n\n1. `MiniChatModel`：最小模型接口，支持 `invoke(messages)` 和 `bind_tools(tools)`\n2. `MiniModelWithTools`：`bind_tools` 返回的包装对象，包含原模型 + 工具定义\n3. `should_bind_tools(model, tools)`：判断模型是否需要自动绑定工具\n\n## 建议接口\n\n```python\nfrom typing import Any\nfrom dataclasses import dataclass\n\n@dataclass\nclass Message:\n    role: str       # \"system\" | \"user\" | \"assistant\" | \"tool\"\n    content: str\n    tool_calls: list[dict] | None = None\n    tool_call_id: str | None = None\n\n\nclass MiniChatModel:\n    def __init__(self, response_fn):\n        \"\"\"response_fn: (messages, tools) -> Message，模拟 LLM 响应\"\"\"\n        self.response_fn = response_fn\n        self.bound_tools = None\n\n    def invoke(self, messages: list[Message]) -> Message:\n        \"\"\"调用模型，返回 assistant Message\"\"\"\n        ...\n\n    def bind_tools(self, tools: list[dict]) -> \"MiniModelWithTools\":\n        \"\"\"返回绑定了工具定义的新模型实例（装饰器模式）\"\"\"\n        ...\n\n\nclass MiniModelWithTools:\n    def __init__(self, base_model: MiniChatModel, tools: list[dict]):\n        self.base_model = base_model\n        self.tools = tools\n\n    def invoke(self, messages: list[Message]) -> Message:\n        \"\"\"调用底层模型，传入工具定义\"\"\"\n        ...\n\n    def bind_tools(self, tools: list[dict]) -> \"MiniModelWithTools\":\n        \"\"\"重新绑定（覆盖旧工具列表）\"\"\"\n        ...\n\n\ndef should_bind_tools(model, tools: list[dict]) -> bool:\n    \"\"\"\n    判断是否需要自动绑定工具：\n    - 如果 model 是 MiniModelWithTools 且已有工具 → False\n    - 否则 → True\n    \"\"\"\n    ...\n```\n\n## 测试要求\n\n编写至少 2 个测试：\n1. **正常路径**：创建模型 → bind_tools → invoke，验证工具定义被传入且响应正确\n2. **边界情况**：验证 `should_bind_tools` 对已绑定模型返回 False，对未绑定模型返回 True\n\n## 验收标准\n\n- [ ] `bind_tools` 返回新对象，不修改原模型（装饰器模式）\n- [ ] `MiniModelWithTools.invoke` 调用时将 tools 传递给底层 response_fn\n- [ ] `should_bind_tools` 正确检测绑定状态\n- [ ] 满足鸭子类型：`MiniChatModel` 和 `MiniModelWithTools` 都有 `invoke` 方法\n- [ ] 代码不超过 80 行（不含测试）\n- [ ] 测试全部通过\n\n## 提示\n\n- `bind_tools` 的关键是**不修改原对象**，返回新的包装实例\n- `should_bind_tools` 用 `isinstance` 或 `hasattr` 检测即可\n- response_fn 模拟 LLM 行为，可以根据 tools 是否存在决定是否返回 tool_calls\n"}}},{"id":"05-tool-interface","title":"ToolNode、InjectedState 与 ToolMessage 工具接口","depends_on":["02-message-schema","04-chat-model-adapter"],"primary_path":"libs/prebuilt/langgraph/prebuilt/tool_node.py","primary_symbol":"ToolNode","claim_ids":["claim-05-tool-interface"],"evidence_ids":["ev-toolnode-class-code","ev-toolnode-invoke-code","ev-test-tool-node-basic","ev-test-tool-node-parallel"],"sections":{"lesson":{"label":"课程","path":"lessons/05-tool-interface.md","markdown":"# 05 工具接口：ToolNode、InjectedState 与 ToolMessage\n\n## 你会学到什么\n\n- ToolNode 如何从 AIMessage 提取 tool_calls 并并行执行工具\n- InjectedState 注解如何让工具函数获取当前图状态\n- tools_condition 如何决定 ReAct 循环的路由走向\n- ToolMessage 如何将工具结果回填到消息流中\n- ToolNode 的错误处理策略如何影响 Agent 稳定性\n\n## AI 概念从零解释\n\nToolNode 本质是一个\"批量 RPC dispatcher\"。想象一个微服务网关：上游（LLM）发出一批调用意图（tool_calls），网关并行路由到对应的 handler，收集结果后统一返回。\n\n类比后端经验：\n- **tool_calls** = 一批 RPC request（包含 method name + args + correlation ID）\n- **ToolNode** = 网关/dispatcher，负责路由、并发执行和结果收集\n- **InjectedState** = sidecar 注入的上下文（类似 gRPC interceptor 注入 metadata）\n- **ToolMessage** = RPC response（带 tool_call_id 做关联）\n- **tools_condition** = 网关前的 router，决定请求是否需要 dispatch\n- **ToolCallRequest** = 内部调度单元，包含 tool_call、state、config 等运行时上下文\n\n关键区别：这里的\"调用方\"是一个 LLM，它输出的是结构化意图而非真正的函数调用。框架负责把意图映射到真实执行。\n\n整个流程形成闭环：LLM → AIMessage(tool_calls) → ToolNode → ToolMessage → 写回 messages Channel → LLM 在下轮看到结果。这个闭环是 ReAct 循环中\"执行\"阶段的核心。\n\n## 源码阅读路径\n\n- **repo**: langchain-ai/langgraph\n- **commit**: 83dd61feaca993d2ee428706ad04c869895ce400\n- **scope**: libs/prebuilt/\n- **primary path**: `libs/prebuilt/langgraph/prebuilt/tool_node.py`\n- **primary symbol**: `ToolNode`\n\n**3 步阅读方法**：\n\n1. **看类定义**（L622-740）：ToolNode 继承 RunnableCallable，初始化时将工具列表注册到 `tools_by_name` 字典，支持 BaseTool 实例和普通函数两种输入\n2. **看 `_func` / `_afunc`**（L800-860）：从 input 解析 tool_calls → 为每个 call 构造 ToolRuntime → 用 executor.map 并行执行 → `_combine_tool_outputs` 合并输出\n3. **看 `tools_condition`**：检查最后一条消息是否有 tool_calls，有则路由到 \"tools\" 节点，否则到 END\n\n补充阅读：关注 `InjectedState` 类定义（同文件）和 `ToolCallRequest` 数据类，理解工具调用的完整上下文如何构建。还可以看 `_run_one` 方法理解单个工具的执行流程：参数注入 → 工具调用 → 结果包装。\n\n## 关键 claims 与 evidence\n\n**claim-05-tool-interface**：ToolNode 从输入 state 的最后一条 AIMessage 中提取 tool_calls，并行执行对应工具，返回 ToolMessage 列表写入 messages Channel。\n\n这个 claim 描述了 ToolNode 的核心职责：它不做推理，只做执行。LLM 输出的 AIMessage 中包含一个或多个 tool_calls（结构化意图），ToolNode 提取这些意图，根据 tool name 在 `tools_by_name` 字典中查找注册的工具，并行调用，然后把每个结果包装成 ToolMessage（带 tool_call_id 关联）写回 messages Channel。这实现了\"意图-执行-结果\"的完整闭环。\n\n**证据支持**：\n- `ev-toolnode-class-code`：ToolNode 类定义，展示工具注册和输入解析逻辑\n- `ev-toolnode-invoke-code`：`_func` 方法实现并行执行和结果收集\n- `ev-test-tool-node-basic`：验证单个 tool_call 的正确解析和执行\n- `ev-test-tool-node-parallel`：验证多个并行 tool_calls 的执行\n\n## 相关测试证据\n\n- **ev-test-tool-node-basic**（`libs/prebuilt/tests/test_tool_node.py:125-221`）：构造一个 AIMessage 包含 tool_calls，传入 ToolNode，验证输出为对应的 ToolMessage 列表。阅读时关注测试如何构造 tool_calls 数组和如何断言 ToolMessage 的 tool_call_id 匹配。这个测试覆盖了最基本的\"调用意图 → 执行 → 结果\"路径。\n\n- **ev-test-tool-node-parallel**（`libs/prebuilt/tests/test_tool_node.py:222-268`）：构造包含多个 tool_calls 的 AIMessage，验证 ToolNode 并行执行所有工具并返回等量的 ToolMessage。关注 executor.map 的并行调度是否正确分发，以及多个 ToolMessage 的顺序是否与 tool_calls 顺序一致。\n\n## 真实源码解释\n\n**ToolNode 的设计选择**：继承 RunnableCallable 而非 BaseTool，因为它不是一个工具，而是一个执行多个工具的调度节点。初始化时接受工具列表，构建 `tools_by_name` 字典用于 O(1) 查找。`name` 默认为 `\"tools\"`，在图可视化中显示为 tools 节点。\n\n**输入解析的三种模式**：ToolNode 支持 dict（图状态）、list（消息列表）和 tool_calls 列表三种输入。`_parse_input` 方法统一从中提取 `tool_calls` 数组。对于 dict 输入，从 `state[messages_key]` 的最后一条 AIMessage 中取；对于 list 输入，直接取末尾 AIMessage。\n\n**并行执行策略**：`_func` 使用 `get_executor_for_config` 获取线程池，对所有 tool_calls 做 `executor.map` 并行执行。异步版本 `_afunc` 使用 `asyncio.gather`。每个 tool_call 独立构造 `ToolRuntime` 上下文，包含 state、config、store 等运行时信息。这意味着多个工具调用不会串行阻塞，但共享同一份 state 快照。\n\n**InjectedState 机制**：通过 `_extract_state` 从输入中提取当前图状态，注入到 ToolRuntime 中。工具函数如果声明了 `Annotated[dict, InjectedState]` 参数，框架会自动注入状态，而这个参数不会暴露在 tool schema 中（LLM 看不到它）。这类似 Spring 的 `@Autowired`——框架注入运行时上下文，调用方无需感知。\n\n**tools_condition 的路由逻辑**：这是一个简单的条件边辅助函数——检查 `state[\"messages\"][-1]` 是否有 `tool_calls` 属性。有则返回 `\"tools\"`（路由到 ToolNode），无则返回 `END`（结束循环）。它是 ReAct 模式的\"退出条件\"。\n\n**错误处理**：`handle_tool_errors` 支持多种策略——布尔值、字符串模板、异常类型过滤或自定义 callable。默认行为是捕获参数校验错误（模型给了错误参数）并返回错误描述作为 ToolMessage 内容，让 LLM 有机会在下一轮修正参数并重试。工具本身的执行异常默认会重新抛出。\n\n**Command 工具的特殊处理**：如果工具返回 Command 对象而非普通值，ToolNode 会直接传递 Command 而非包装为 ToolMessage。`_combine_tool_outputs` 方法处理混合输出——普通 ToolMessage 和 Command 可以共存。这允许工具控制图的执行流程——例如工具执行后直接路由到特定节点，而不是回到 agent 继续推理。\n\n**输出格式的自动适配**：ToolNode 根据输入类型自动决定输出格式。dict 输入返回 `{messages_key: [ToolMessage...]}`；list 输入返回 `[ToolMessage...]`。这保证了 ToolNode 可以无缝嵌入不同的图状态结构中。\n\n## 自测题\n\n见 `../quizzes/05-tool-interface.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/05-tool-interface.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/05-mini-tool-calling/README.md`。\n\n## 学完标准\n\n- 能解释 ToolNode 从 AIMessage 到 ToolMessage 的完整数据流\n- 能说明 InjectedState 如何在不暴露给 LLM 的前提下注入图状态\n- 能画出 agent → tools_condition → ToolNode → agent 的循环结构\n- 能描述 ToolNode 的并行执行机制（executor.map / asyncio.gather）和错误恢复策略\n- 理解 tool_call_id 如何实现请求-响应关联（类似 correlation ID）\n- 能区分 ToolNode 输出 ToolMessage 和 Command 两种模式的适用场景\n"},"quiz":{"label":"测试","path":"quizzes/05-tool-interface.quiz.md","markdown":"# 工具接口：ToolNode、InjectedState 与 ToolMessage — 自测题\n\n## 选择题\n\n### 1. ToolNode 从输入中提取 tool_calls 的数据来源是什么？\n\n- A. state 中专门的 `tool_calls` 字段\n- B. state[messages_key] 的最后一条 AIMessage 中的 tool_calls 属性\n- C. 上一个节点显式传递的参数\n- D. 从全局配置中读取\n\n**答案**: B\n\n> ToolNode 从输入 state 的 `messages` 列表中取最后一条 AIMessage，提取其 `tool_calls` 数组。参见 `ev-toolnode-class-code`（`tool_node.py` L622-800）。\n\n### 2. InjectedState 注解的作用是什么？\n\n- A. 将工具参数暴露给 LLM 以便 LLM 决定传什么值\n- B. 让工具函数获取当前图状态，但该参数不暴露在 tool schema 中（LLM 看不到）\n- C. 强制工具在特定状态下才能执行\n- D. 将工具的返回值注入到图状态中\n\n**答案**: B\n\n> InjectedState 让框架自动注入当前图状态到工具函数，但该参数不出现在 tool schema 中，LLM 无法感知它的存在。类似 Spring 的 `@Autowired`。\n\n### 3. ToolNode 的并行执行策略是什么？\n\n- A. 所有 tool_calls 串行执行，按顺序返回结果\n- B. 使用 executor.map（同步）/ asyncio.gather（异步）并行执行所有 tool_calls\n- C. 只执行第一个 tool_call，忽略其余\n- D. 将所有 tool_calls 打包为一次批量请求\n\n**答案**: B\n\n> `_func` 使用 `get_executor_for_config` 获取线程池做 `executor.map` 并行执行，异步版本用 `asyncio.gather`。参见 `ev-toolnode-invoke-code`（`tool_node.py` L800-1000）。\n\n## 简答题\n\n### 1. 请描述 ToolNode 从 AIMessage 到 ToolMessage 的完整数据流，包括 tool_call_id 如何实现请求-响应关联。\n\n> 提示：AIMessage.tool_calls[i].id == ToolMessage.tool_call_id，类似 RPC 的 correlation ID。参考 `ev-test-tool-node-basic`（`test_tool_node.py` L125-221）。\n\n### 2. tools_condition 函数的路由逻辑是什么？它如何实现 ReAct 循环的\"退出条件\"？\n\n> 提示：检查 `state[\"messages\"][-1]` 是否有 `tool_calls` 属性，有→\"tools\"，无→END。参考课程中 tools_condition 的描述。\n\n### 3. ToolNode 的 `handle_tool_errors` 支持哪些错误处理策略？为什么默认行为是返回错误描述而非直接抛出异常？\n\n> 提示：布尔值、字符串模板、异常类型过滤、自定义 callable。让 LLM 有机会在下一轮修正参数并重试。参考 `ev-toolnode-class-code`。\n\n## 参考答案说明\n\n简答题没有唯一答案。回答时需要：\n- 引用具体的源码路径\n- 引用相关的 evidence id\n- 区分\"源码证明\"和\"课程推断\"\n"},"mastery":{"label":"掌握度","path":"mastery/05-tool-interface.mastery.md","markdown":"# 工具接口：ToolNode、InjectedState 与 ToolMessage — 掌握度检查\n\n## 口头讲解\n\n不看课程，向同事清晰讲出以下要点：\n\n1. ToolNode 是\"批量 RPC dispatcher\"：从最后一条 AIMessage 提取 tool_calls，按 tool name 在 `tools_by_name` 字典中查找，并行执行，结果包装为 ToolMessage（带 tool_call_id 关联）。\n2. InjectedState 让工具函数获取当前图状态，但该参数不暴露在 tool schema 中（LLM 看不到），类似 Spring 的 `@Autowired` 注入。\n3. tools_condition 是 ReAct 循环的退出条件：检查最后一条消息是否有 tool_calls，有→\"tools\"，无→END。\n4. ToolNode 的错误处理策略支持多种模式（布尔值、字符串模板、异常过滤、自定义 callable），默认让 LLM 在下一轮修正参数。\n\n## 代码阅读检查\n\n- [ ] 能在 `tool_node.py` L622-740 中找到 ToolNode 类定义，解释 `tools_by_name` 字典的构建方式\n- [ ] 能在 `tool_node.py` L800-860 中追踪 `_func` 方法的并行执行逻辑（executor.map）\n- [ ] 能解释 `_parse_input` 如何支持 dict、list 和 tool_calls 三种输入模式\n- [ ] 能说明 InjectedState 参数如何在不暴露给 LLM 的前提下注入图状态（ToolRuntime 的构建）\n- [ ] 能区分工具返回 ToolMessage 和 Command 两种模式的适用场景\n\n## 通过标准\n\n你已掌握本课程，如果你能：\n- 解释核心 claim（ToolNode 提取 tool_calls → 并行执行 → ToolMessage 写回 messages Channel）并引用 `ev-toolnode-class-code` 和 `ev-toolnode-invoke-code`\n- 引用 `ev-test-tool-node-basic` 和 `ev-test-tool-node-parallel` 说明单个和并行 tool_calls 的验证方式\n- 完成 `labs/05-mini-tool-calling/` 中的最小复刻实验（实现简化版 ToolNode 调度器）\n"},"lab":{"label":"实验","path":"labs/05-mini-tool-calling/README.md","markdown":"# Mini ToolNode — 最小复刻实验\n\n## 目标\n\n不依赖 LangGraph 源码，用 60-100 行 Python 复刻 ToolNode 的并行工具调用 + 结果回写机制。\n通过这个实验，你将深入理解 LangGraph 如何将 LLM 输出的 tool_calls 意图分发到对应工具、并行执行、并将结果以 ToolMessage 形式回填到状态中。\n\n## 背景\n\nToolNode 本质是一个\"批量 RPC dispatcher\"。LLM 输出的 AIMessage 中包含一个或多个 `tool_calls`（结构化调用意图），ToolNode 提取这些意图，在 `tools_by_name` 字典中查找对应工具，并行调用，然后把每个结果包装成 ToolMessage（带 `tool_call_id` 关联）写回 messages Channel。\n\n整个流程形成闭环：LLM → AIMessage(tool_calls) → ToolNode → ToolMessage → 写回 state → LLM 在下轮看到结果。这是 ReAct 循环中\"执行\"阶段的核心。\n\n## 任务\n\n用纯 Python（仅依赖标准库 `concurrent.futures`）实现：\n\n1. `MiniToolNode`：注册工具函数，从 state 的最后一条 AIMessage 提取 tool_calls，并行执行\n2. `tools_condition(state)`：检查最后一条消息是否包含 tool_calls，返回路由决策\n3. ToolMessage 数据结构：包含 `tool_call_id` + `content` 字段\n\n## 建议接口\n\n```python\nfrom dataclasses import dataclass, field\nfrom typing import Callable, Any\nfrom concurrent.futures import ThreadPoolExecutor\n\n@dataclass\nclass ToolCall:\n    id: str\n    name: str\n    args: dict\n\n@dataclass\nclass AIMessage:\n    content: str\n    tool_calls: list[ToolCall] = field(default_factory=list)\n\n@dataclass\nclass ToolMessage:\n    content: str\n    tool_call_id: str\n\n\nclass MiniToolNode:\n    def __init__(self, tools: list[Callable]):\n        \"\"\"注册工具列表，构建 name → func 的查找字典\"\"\"\n        self.tools_by_name: dict[str, Callable] = {}\n        ...\n\n    def invoke(self, state: dict) -> dict:\n        \"\"\"\n        1. 从 state['messages'][-1] 提取 tool_calls\n        2. 并行执行每个 tool_call 对应的工具函数\n        3. 返回 {'messages': [ToolMessage(...), ...]}\n        \"\"\"\n        ...\n\n    def _run_one(self, tool_call: ToolCall) -> ToolMessage:\n        \"\"\"执行单个工具调用，返回 ToolMessage\"\"\"\n        ...\n\n\ndef tools_condition(state: dict) -> str:\n    \"\"\"\n    检查 state['messages'][-1] 是否有 tool_calls：\n    - 有 → 返回 \"tools\"\n    - 无 → 返回 \"__end__\"\n    \"\"\"\n    ...\n```\n\n## 测试要求\n\n编写至少 2 个测试：\n1. **正常路径**：注册 2 个工具函数，构造包含 2 个 tool_calls 的 AIMessage，验证并行执行后返回 2 个 ToolMessage 且 tool_call_id 正确关联\n2. **边界情况**：tool_call 引用了未注册的工具名时，返回包含错误信息的 ToolMessage（而非抛异常）\n\n## 验收标准\n\n- [ ] 工具通过函数名自动注册到 `tools_by_name` 字典\n- [ ] 并行执行多个 tool_calls（使用 ThreadPoolExecutor）\n- [ ] 每个 ToolMessage 的 `tool_call_id` 与对应 ToolCall 的 `id` 匹配\n- [ ] 工具不存在时优雅降级（返回错误 ToolMessage 而非崩溃）\n- [ ] `tools_condition` 正确判断路由\n- [ ] 代码不超过 100 行（不含测试）\n- [ ] 测试全部通过\n\n## 提示\n\n- `ThreadPoolExecutor.map(self._run_one, tool_calls)` 实现并行\n- 工具函数用 `func.__name__` 作为注册名，和 tool_call.name 匹配\n- 错误处理：`try/except` 包裹每个工具调用，失败时返回错误描述作为 ToolMessage 内容\n"}}},{"id":"06-callback-tracing","title":"流式输出、StreamMode 与回调追踪系统","depends_on":["01-runnable"],"primary_path":"libs/langgraph/langgraph/types.py","primary_symbol":"StreamMode","claim_ids":["claim-06-callback-tracing"],"evidence_ids":["ev-stream-mode-def-code","ev-stream-messages-handler-code","ev-test-stream-values","ev-test-stream-messages"],"sections":{"lesson":{"label":"课程","path":"lessons/06-callback-tracing.md","markdown":"# 06 流式输出、调试事件与追踪\n\n## 你会学到什么\n\n- StreamMode 七种模式的设计意图和适用场景\n- StreamMessagesHandler 如何实现 token 级流式输出\n- StreamWriter 如何让节点向 custom 流写入自定义数据\n- Pregel 执行循环如何驱动多模式并行输出\n- 回调系统与 LangSmith 追踪的集成方式\n\n## AI 概念从零解释\n\n流式输出的本质是\"观察者模式 + 多路复用\"。类比后端经验：\n\n- **StreamMode** = Kafka topic 的分区策略——同一个执行过程可以按不同维度（全量状态、增量更新、token 粒度、debug 事件）投递到不同\"topic\"\n- **values 模式** = 每步结束后的 state snapshot（类似 event sourcing 的 projection）\n- **updates 模式** = 增量 diff（类似 CDC change event，只包含本步修改的字段）\n- **messages 模式** = LLM 输出的 token 流（类似 WebSocket 推送逐字符，前端可实时渲染打字效果）\n- **custom 模式** = 节点内部主动 emit 的自定义事件（类似 OpenTelemetry span event）\n- **checkpoints 模式** = 状态快照事件（类似数据库的 WAL checkpoint 通知）\n- **tasks 模式** = 任务生命周期事件（类似分布式追踪中的 span start/end）\n- **debug 模式** = checkpoints + tasks 的组合，用于开发环境全量观测\n- **StreamMessagesHandler** = 一个 callback handler，拦截 LLM 的 `on_llm_new_token` 事件并转发到输出流\n\n这些模式可以**组合使用**：`stream_mode=[\"values\", \"messages\"]` 同时获取状态快照和 token 流。框架为每种模式独立输出，客户端可以按需消费。\n\n## 源码阅读路径\n\n- **repo**: langchain-ai/langgraph\n- **commit**: 83dd61feaca993d2ee428706ad04c869895ce400\n- **scope**: libs/langgraph/\n- **primary path**: `libs/langgraph/langgraph/types.py`\n- **primary symbol**: `StreamMode`\n\n**3 步阅读方法**：\n\n1. **看 StreamMode 定义**（`types.py:120-134`）：7 种 Literal 类型 + 详细注释说明每种模式的语义\n2. **看 StreamMessagesHandler**（`pregel/_messages.py:49-`）：继承 BaseCallbackHandler，实现 `on_llm_new_token` 拦截 LLM 输出，包装为 `(message_chunk, metadata)` 元组\n3. **看 Pregel.stream**（`pregel/main.py`）：理解执行循环如何根据 stream_mode 列表分发事件到不同输出通道\n\n补充阅读：查看 `StreamWriter` 的类型定义（`types.py:136-139`）和 `GraphCallbackHandler`（`callbacks.py`），理解自定义流和图级事件的实现。还可以看 `SyncPregelLoop` 中的流式分发逻辑。\n\n## 关键 claims 与 evidence\n\n**claim-06-callback-tracing**：Pregel.stream() 支持多种 stream_mode（values/updates/messages/custom/debug），通过回调系统和 StreamMessagesHandler 实现 token 级流式输出。\n\n这个 claim 的核心含义：LangGraph 的流式不是简单的\"结束后返回\"，而是在执行过程中通过多种模式持续输出。`values` 和 `updates` 在每个超步结束时输出；`messages` 通过回调机制实现 token 级粒度；`custom` 让节点开发者可以注入任意事件。这种设计让同一次执行可以同时服务\"前端实时展示\"和\"后端调试追踪\"两种需求。\n\n**证据支持**：\n- `ev-stream-mode-def-code`：StreamMode 类型定义，7 种模式的 Literal union\n- `ev-stream-messages-handler-code`：StreamMessagesHandler 回调处理器，拦截 token 并转发\n- `ev-test-stream-values`：验证多节点图的 stream 按步骤输出中间状态\n- `ev-test-stream-messages`：验证 messages 模式正确输出 LLM token\n\n## 相关测试证据\n\n- **ev-test-stream-values**（`libs/langgraph/tests/test_pregel.py:555-684`）：构建两个节点的图，验证 `stream(mode=\"values\")` 按执行顺序输出每步完整状态。阅读时关注测试如何断言输出顺序和状态累积——每步输出的是完整 state 而非 diff。\n\n- **ev-test-stream-messages**（`libs/langgraph/tests/test_pregel.py:6986-7127`）：验证 `stream_mode=\"messages\"` 结合 Command 时能正确输出 LLM 消息 token。关注测试如何模拟 LLM 的逐 token 输出和 StreamMessagesHandler 的转发行为。每个 token 输出都带有 metadata 标识来源节点。\n\n## 真实源码解释\n\n**StreamMode 的类型定义**：使用 `Literal` union 而非枚举，因为它需要支持字符串列表组合（`stream_mode=[\"values\", \"messages\"]`）。7 种模式覆盖了从粗粒度（values）到细粒度（messages）再到完全自定义（custom）的全谱。注释中明确说明了 functional API 下 values 模式只在工作流结束时输出一次。\n\n**StreamMessagesHandler 的设计**：继承 `BaseCallbackHandler` 和 `_StreamingCallbackHandler`，实现了 langchain_core 的回调协议。当 LLM 产生新 token 时，handler 将其包装为 `(message_chunk, metadata)` 元组推入输出流。metadata 包含节点名和命名空间信息（通过 `filter_to_user_tags`），让客户端知道 token 来自哪个节点的 LLM 调用。handler 还会过滤带有 `TAG_NOSTREAM` 或 `TAG_HIDDEN` 标签的节点。\n\n**StreamWriter 的注入**：节点函数可以声明 `writer: StreamWriter` 参数，框架自动注入。当 `stream_mode` 包含 `\"custom\"` 时，调用 `writer(data)` 会将数据推入输出流；否则 writer 是 no-op（`Callable[[Any], None]`）。这是一种优雅的\"按需激活\"模式——节点代码不需要知道外部是否在监听。\n\n**Pregel 循环的流式分发**：每完成一个超步，循环检查当前激活的 stream_mode 列表，分别将 values/updates/checkpoints 等数据推入对应的输出 channel。多种模式的数据通过 `StreamChunk` 协议统一格式化。这使得一次 stream 调用可以同时输出多种粒度的数据。\n\n**debug 和 tasks 模式**：`debug` 是 `checkpoints` + `tasks` 的组合，用于开发调试。`tasks` 模式在 task 开始和结束时发射事件，包含节点名、执行结果和错误信息。这对于生产环境的可观测性至关重要——类似分布式追踪中的 span 事件。\n\n**与 LangSmith 的集成**：LangGraph 的回调系统与 LangSmith 追踪天然集成。每个节点执行、LLM 调用、工具执行都会通过 callback 上报为 trace span，形成完整的执行时序图。GraphCallbackHandler 负责发射图级别的生命周期事件（如 GraphInterruptEvent、GraphResumeEvent）。\n\n**多模式组合的实践建议**：前端实时展示用 `[\"messages\"]`；后端监控用 `[\"updates\", \"tasks\"]`；调试问题用 `[\"debug\"]`；自定义进度上报用 `[\"custom\"]`。多种模式可以组合，框架会为每种模式独立输出数据，互不干扰。\n\n**节点过滤与 TAG**：通过给节点添加 `TAG_NOSTREAM` 或 `TAG_HIDDEN` 标签，可以让特定节点的输出不出现在 messages 流中。这对于隐藏内部处理节点（如工具执行）的 LLM 输出很有用——前端只需要看到最终 agent 节点的回复。\n\n## 自测题\n\n见 `../quizzes/06-callback-tracing.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/06-callback-tracing.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/06-mini-callback-tracer/README.md`。\n\n## 学完标准\n\n- 能列举 7 种 StreamMode 并说明各自的数据粒度和适用场景\n- 能解释 StreamMessagesHandler 如何实现从 LLM token 到客户端流的转发\n- 能描述 StreamWriter 的注入时机和 no-op 行为\n- 理解 Pregel 超步循环如何驱动多模式并行输出\n- 能为不同业务场景选择合适的 stream_mode 组合\n- 理解 TAG_NOSTREAM 和 TAG_HIDDEN 如何控制节点输出的可见性\n"},"quiz":{"label":"测试","path":"quizzes/06-callback-tracing.quiz.md","markdown":"# 流式输出、调试事件与追踪 — 自测题\n\n## 选择题\n\n### 1. LangGraph 的 StreamMode 一共支持多少种模式？\n\n- A. 3 种（values/updates/messages）\n- B. 5 种（values/updates/messages/custom/debug）\n- C. 7 种（values/updates/messages/custom/checkpoints/tasks/debug）\n- D. 2 种（values/messages）\n\n**答案**: C\n\n> StreamMode 使用 Literal union 定义了 7 种模式：values、updates、messages、custom、checkpoints、tasks、debug。参见 `ev-stream-mode-def-code`（`types.py` L120-139）。\n\n### 2. StreamMessagesHandler 通过什么机制实现 token 级流式输出？\n\n- A. 轮询 LLM 的输出缓冲区\n- B. 继承 BaseCallbackHandler，拦截 `on_llm_new_token` 事件并转发到输出流\n- C. 在 LLM 调用前预设输出缓冲区大小\n- D. 使用 WebSocket 连接 LLM 服务器\n\n**答案**: B\n\n> StreamMessagesHandler 继承 BaseCallbackHandler，实现回调协议，当 LLM 产生新 token 时包装为 `(message_chunk, metadata)` 元组推入输出流。参见 `ev-stream-messages-handler-code`。\n\n### 3. 当 stream_mode 不包含 \"custom\" 时，节点中注入的 StreamWriter 有什么行为？\n\n- A. 抛出 NotImplementedError\n- B. 是 no-op（无操作），调用不报错但不产生输出\n- C. 自动切换到 \"values\" 模式输出\n- D. 将数据写入日志文件\n\n**答案**: B\n\n> 当 stream_mode 不包含 \"custom\" 时，writer 是 no-op（`Callable[[Any], None]`）——节点代码不需要知道外部是否在监听。这是\"按需激活\"模式。\n\n## 简答题\n\n### 1. 请分别说明 values 模式和 updates 模式的数据粒度差异，以及它们各自适用的业务场景。\n\n> 提示：values = 每步结束后的完整 state snapshot；updates = 增量 diff（只包含本步修改的字段）。参考 `ev-test-stream-values`（`test_pregel.py` L555-684）。\n\n### 2. TAG_NOSTREAM 和 TAG_HIDDEN 如何控制节点输出的可见性？请举例说明在什么场景下需要隐藏特定节点的 messages 流输出。\n\n> 提示：隐藏内部处理节点（如工具执行节点）的 LLM 输出，前端只需看到最终 agent 节点的回复。参考课程中节点过滤与 TAG 的描述。\n\n### 3. 如果你需要同时满足\"前端实时展示打字效果\"和\"后端监控任务执行进度\"两种需求，应该如何组合 stream_mode？请解释你的选择。\n\n> 提示：前端用 `[\"messages\"]`，后端用 `[\"updates\", \"tasks\"]`。多种模式可组合，框架独立输出。参考 `ev-stream-mode-def-code`。\n\n## 参考答案说明\n\n简答题没有唯一答案。回答时需要：\n- 引用具体的源码路径\n- 引用相关的 evidence id\n- 区分\"源码证明\"和\"课程推断\"\n"},"mastery":{"label":"掌握度","path":"mastery/06-callback-tracing.mastery.md","markdown":"# 流式输出、调试事件与追踪 — 掌握度检查\n\n## 口头讲解\n\n不看课程，向同事清晰讲出以下要点：\n\n1. StreamMode 定义了 7 种模式（values/updates/messages/custom/checkpoints/tasks/debug），覆盖从粗粒度到细粒度的全谱，可组合使用。\n2. StreamMessagesHandler 继承 BaseCallbackHandler，拦截 `on_llm_new_token` 事件，将 token 包装为 `(message_chunk, metadata)` 推入输出流，实现 token 级流式。\n3. StreamWriter 通过参数注入给节点函数，当 stream_mode 包含 \"custom\" 时激活，否则是 no-op——\"按需激活\"模式。\n4. Pregel 超步循环在每步结束后检查激活的 stream_mode 列表，分别将对应数据推入输出 channel，实现多模式并行输出。\n\n## 代码阅读检查\n\n- [ ] 能在 `types.py` L120-134 中找到 StreamMode 的 Literal union 定义，说明为什么用 Literal 而非枚举\n- [ ] 能在 `pregel/_messages.py` 中找到 StreamMessagesHandler，解释其如何过滤 TAG_NOSTREAM 标签的节点\n- [ ] 能追踪 Pregel.stream 循环中多模式数据的分发逻辑\n- [ ] 能说明 messages 模式中 metadata 包含哪些信息（节点名、命名空间），以及客户端如何利用它\n\n## 通过标准\n\n你已掌握本课程，如果你能：\n- 解释核心 claim（Pregel.stream 支持多种 stream_mode + StreamMessagesHandler 实现 token 级流式）并引用 `ev-stream-mode-def-code` 和 `ev-stream-messages-handler-code`\n- 引用 `ev-test-stream-values` 和 `ev-test-stream-messages` 说明 values 和 messages 模式的验证方式\n- 完成 `labs/06-mini-callback-tracer/` 中的最小复刻实验（实现简化版回调 + 流式输出机制）\n"},"lab":{"label":"实验","path":"labs/06-mini-callback-tracer/README.md","markdown":"# Mini Stream & Callback — 最小复刻实验\n\n## 目标\n\n不依赖 LangGraph 源码，用 60-100 行 Python 复刻事件流 + 回调追踪器机制。\n通过这个实验，你将深入理解 LangGraph 的多模式流式输出设计（观察者模式 + 多路复用）以及回调系统如何实现 token 级流式转发。\n\n## 背景\n\nLangGraph 的流式输出不是简单的\"结束后返回\"，而是在执行过程中通过多种模式持续输出。核心设计是\"观察者模式 + 多路复用\"：\n\n- **values 模式**：每步结束后输出完整 state 快照\n- **updates 模式**：只输出本步修改的增量 diff\n- **custom 模式**：节点内部主动 emit 的自定义事件\n\n回调系统通过 `StreamMessagesHandler` 拦截 LLM 的 `on_new_token` 事件并转发到输出流，实现 token 级粒度的流式输出。节点可以通过 `StreamWriter` 注入自定义事件。\n\n## 任务\n\n用纯 Python（无第三方依赖）实现：\n\n1. `MiniEventStream`：事件流，支持多种模式（values/updates/custom）的事件分发\n2. `MiniCallbackHandler`：回调处理器，拦截节点执行事件（on_node_start/on_node_end/on_token）\n3. `MiniStreamWriter`：注入节点的 writer，向 custom 流写入自定义数据\n\n## 建议接口\n\n```python\nfrom typing import Any, Callable, Generator\nfrom dataclasses import dataclass\n\n@dataclass\nclass StreamEvent:\n    mode: str       # \"values\" | \"updates\" | \"custom\"\n    node: str       # 产生事件的节点名\n    data: Any       # 事件数据\n\nclass MiniCallbackHandler:\n    def __init__(self):\n        self.events: list[dict] = []\n\n    def on_node_start(self, node_name: str, state: dict):\n        \"\"\"节点开始执行时回调\"\"\"\n        ...\n\n    def on_node_end(self, node_name: str, result: dict):\n        \"\"\"节点执行结束时回调\"\"\"\n        ...\n\n    def on_token(self, node_name: str, token: str):\n        \"\"\"LLM 产生新 token 时回调\"\"\"\n        ...\n\n\nclass MiniEventStream:\n    def __init__(self, stream_modes: list[str]):\n        \"\"\"初始化，指定激活的流模式列表\"\"\"\n        self.modes = set(stream_modes)\n        self.buffer: list[StreamEvent] = []\n\n    def emit(self, mode: str, node: str, data: Any):\n        \"\"\"向指定模式的流中写入事件（模式未激活则忽略）\"\"\"\n        ...\n\n    def stream(self) -> Generator[StreamEvent, None, None]:\n        \"\"\"消费并 yield 所有缓冲的事件\"\"\"\n        ...\n\n\nclass MiniStreamWriter:\n    def __init__(self, event_stream: MiniEventStream, node_name: str):\n        ...\n\n    def __call__(self, data: Any):\n        \"\"\"向 custom 流写入自定义数据\"\"\"\n        ...\n```\n\n## 测试要求\n\n编写至少 2 个测试：\n1. **正常路径**：配置 `[\"values\", \"updates\"]` 双模式，模拟 2 个节点执行，验证 stream 输出包含两种模式的事件且顺序正确\n2. **边界情况**：未激活的模式（如 custom）调用 emit 时被静默忽略；验证 StreamWriter 在 custom 模式未激活时是 no-op\n\n## 验收标准\n\n- [ ] 支持多种 stream_mode 的组合配置\n- [ ] 未激活模式的 emit 是 no-op（不报错、不缓冲）\n- [ ] CallbackHandler 记录完整的节点执行生命周期事件\n- [ ] StreamWriter 正确向 custom 流写入数据\n- [ ] 代码不超过 100 行（不含测试）\n- [ ] 测试全部通过\n\n## 提示\n\n- 事件缓冲用简单的 list 即可，`stream()` 消费时 pop\n- `StreamWriter` 本质是对 `event_stream.emit(\"custom\", node, data)` 的闭包封装\n- CallbackHandler 可以同时更新 EventStream，实现\"回调驱动流式输出\"\n"}}},{"id":"07-agent-loop","title":"条件边、Command、interrupt 与 ReAct 循环","depends_on":["03-prompt-template","05-tool-interface"],"primary_path":"libs/langgraph/langgraph/graph/state.py","primary_symbol":"StateGraph.add_conditional_edges","claim_ids":["claim-07-agent-loop-conditional","claim-07-agent-loop-interrupt"],"evidence_ids":["ev-conditional-edges-code","ev-command-class-code","ev-test-conditional-edges","ev-test-command-goto","ev-interrupt-func-code","ev-command-resume-code","ev-test-interrupt-resume","ev-test-interrupt-multiple"],"sections":{"lesson":{"label":"课程","path":"lessons/07-agent-loop.md","markdown":"# 07 Agent Loop：条件边、Command、interrupt 与 ReAct 循环\n\n## 你会学到什么\n\n- add_conditional_edges 如何注册路由函数实现动态分支\n- Command 原语如何统一状态更新、路由控制和中断恢复\n- interrupt() 如何暂停执行并实现 human-in-the-loop\n- Send 如何实现 map-reduce 动态并行调度\n- ReAct 循环的完整控制流：agent → tools_condition → tools → agent\n\n## AI 概念从零解释\n\nAgent Loop 是 LangGraph 的核心——它把\"LLM 做决策、工具做执行\"的循环用图的控制流表达出来。类比分布式系统：\n\n- **条件边（conditional edges）** = saga 编排器中的路由决策节点。saga 的每一步完成后，编排器根据结果决定下一步走 compensate 还是 continue。条件边做的是同样的事：节点完成后，路由函数检查状态决定下一个节点。路由函数可以返回单个节点名（顺序执行）或列表（并行扇出）。\n\n- **Command** = 一个复合控制指令，类似 saga 中的\"更新状态 + 发送下一步事件\"原子操作。它把 `update`（修改状态）和 `goto`（路由到节点）合并为一个返回值，避免了\"先更新状态、再靠条件边路由\"的两步拆分。Command 还能通过 `graph=Command.PARENT` 向父图发送指令，实现子图到父图的跨层通信。\n\n- **interrupt()** = checkpoint/replay 中的暂停点。就像一个分布式事务执行到需要人工审批时，持久化当前状态后挂起，等审批通过后从 checkpoint 恢复继续执行。interrupt 必须配合 checkpointer 使用，因为暂停后进程可能重启——没有持久化就没有恢复的基础。\n\n- **Send** = map-reduce 的 map 阶段——在条件边中向多个节点实例发送不同输入，实现动态扇出。类似一个 scatter-gather 模式：一个路由决策产生多个并行任务，每个任务接收不同的输入参数。\n\n- **ReAct 循环** = 最经典的 Agent 模式：LLM 生成 tool_calls → tools_condition 检查是否有调用 → 有则执行工具 → 结果回填 → LLM 再次决策。循环直到 LLM 不再调用工具（类似 while loop 的退出条件）。这是 LangGraph 中最重要的控制流模式。\n\n## 源码阅读路径\n\n- **repo**: langchain-ai/langgraph\n- **commit**: 83dd61feaca993d2ee428706ad04c869895ce400\n- **scope**: libs/langgraph/ + libs/prebuilt/\n- **primary path**: `libs/langgraph/langgraph/graph/state.py`\n- **primary symbol**: `StateGraph.add_conditional_edges`\n\n**3 步阅读方法**：\n\n1. **看 add_conditional_edges**（`state.py:969-1017`）：将路由函数包装为 `BranchSpec` 存储在 `self.branches[source]` 中。注意 `coerce_to_runnable` 的包装和重名检查逻辑\n2. **看 Command 数据类**（`types.py:759-808`）：4 个字段 `graph/update/resume/goto`，`_update_as_tuples` 将 update 转为 Channel 写入格式。注意 `PARENT` 类变量的定义\n3. **看 interrupt() 函数**（`types.py:811-934`）：追踪中断索引（scratchpad.interrupt_counter）、查找 resume 值、未找到则抛出 GraphInterrupt 暂停执行\n\n补充阅读：看 `tools_condition`（`prebuilt/tool_node.py`）理解 ReAct 循环的退出条件；看 `Send` 数据类（`types.py`）理解 map-reduce 的 API；看 `BranchSpec`（`graph/_branch.py`）理解条件边的编译时绑定。\n\n## 关键 claims 与 evidence\n\n### claim-07-agent-loop-conditional\n\n**claim**：add_conditional_edges 注册路由函数，节点完成后调用该函数决定下一步；节点也可直接返回 Command(goto=...) 实现动态路由而无需显式条件边。\n\n**含义解读**：LangGraph 提供了两种路由方式。传统方式是 `add_conditional_edges(source, router_fn)`——router_fn 接收当前状态，返回目标节点名。这种方式适合路由逻辑与业务逻辑分离的场景，例如 `tools_condition` 只检查消息中有没有 tool_calls。\n\n新方式是节点直接返回 `Command(goto=\"next_node\")`，这让路由逻辑和业务逻辑在同一个函数中，减少了图定义的复杂度。这种方式适合路由决策依赖节点内部计算结果的场景——例如根据 LLM 输出动态选择下一步。\n\n两种方式可以共存：同一个图中有些边用 `add_conditional_edges`，有些节点返回 Command。\n\n**证据支持**：\n- `ev-conditional-edges-code`：`add_conditional_edges` 实现，path 函数被包装为 BranchSpec\n- `ev-command-class-code`：Command 数据类定义，goto 字段支持单节点名或列表\n- `ev-test-conditional-edges`：测试验证路由函数的正确行为\n- `ev-test-command-goto`：测试验证 Command(goto=...) 的动态路由\n\n### claim-07-agent-loop-interrupt\n\n**claim**：interrupt() 函数抛出 GraphInterrupt 暂停执行，必须配合 checkpointer 使用；通过 Command(resume=value) 恢复执行并将 value 作为 interrupt 返回值。\n\n**含义解读**：interrupt 实现了 human-in-the-loop 模式。完整流程如下：\n1. 节点代码调用 `answer = interrupt(\"请确认是否继续\")`\n2. 框架检查 scratchpad 中是否有对应的 resume 值\n3. 没有 → 抛出 `GraphInterrupt`，暂停图执行，中断值发送给客户端\n4. 客户端展示中断信息给用户，用户做出决定\n5. 客户端调用 `graph.stream(Command(resume=\"confirmed\"), config)`\n6. 图从节点开头重新执行（replay），这次 interrupt() 找到 resume 值，直接返回\n\n关键设计约束：节点代码必须是**幂等的**——interrupt 之前的逻辑会重新跑一遍。如果有副作用（如发送邮件），需要在 interrupt 之前做幂等检查。\n\n**证据支持**：\n- `ev-interrupt-func-code`：interrupt() 函数实现，追踪中断索引和 resume 值查找\n- `ev-command-resume-code`：Command.resume 字段定义\n- `ev-test-interrupt-resume`：测试验证暂停和恢复行为\n- `ev-test-interrupt-multiple`：测试验证多次中断的状态持久化\n\n## 相关测试证据\n\n- **ev-test-conditional-edges**（`libs/langgraph/tests/test_pregel.py:2925-2976`）：构建带条件边的图，路由函数根据状态返回不同节点名。测试验证不同输入会走向不同分支。阅读时关注路由函数的签名 `(state: State) -> str` 和返回值格式。\n\n- **ev-test-interrupt-resume**（`libs/langgraph/tests/test_pregel.py:4852-4920`）：构建包含 interrupt 的节点，第一次执行触发中断，第二次用 Command(resume=...) 恢复。测试验证 interrupt 的返回值是 resume 提供的值，且后续状态更新正确。\n\n- **ev-test-interrupt-multiple**（`libs/langgraph/tests/test_pregel.py:5305-5722`）：验证同一节点中多个 interrupt 调用的行为——每次恢复只推进一个 interrupt，框架通过索引追踪匹配。这是 interrupt 最复杂的场景，证明了索引追踪机制的正确性。\n\n## 真实源码解释\n\n**add_conditional_edges 的实现**：将路由函数通过 `coerce_to_runnable` 转为 Runnable（支持 trace），然后包装为 `BranchSpec` 存入 `self.branches[source][name]`。name 从路由函数名推断，默认为 \"condition\"。编译时，Pregel 执行器会在源节点完成后执行所有注册的 branch，根据返回值确定下一步激活哪些节点。如果路由函数返回列表，会同时激活多个节点（扇出）。`path_map` 参数可选——如果提供，路由函数返回 key，path_map 映射为节点名；不提供则路由函数直接返回节点名。\n\n**Command 的双重角色**：Command 既是节点返回值（告诉引擎如何路由），也是用户输入（`graph.stream(Command(resume=...))` 恢复中断）。四个字段各有用途：\n- `graph`：指定命令目标图（None=当前图，`Command.PARENT`=父图），用于子图跨层通信\n- `update`：原子性状态更新，通过 `_update_as_tuples` 转为 Channel 写入格式\n- `goto`：路由目标，支持字符串、字符串列表和 Send 对象\n- `resume`：恢复中断的值，支持 dict（按 interrupt ID 映射）或单值\n\n**interrupt() 的状态机**：函数内部维护一个中断计数器（通过 `scratchpad.interrupt_counter()`）。每次调用递增索引。恢复执行时，节点从头重新运行：\n1. 如果 `scratchpad.resume` 中有对应索引的值，直接返回（快速跳过已恢复的 interrupt）\n2. 如果找到 `get_null_resume`（新的恢复值），消费它并追加到 resume 列表\n3. 否则抛出 `GraphInterrupt`，携带 `Interrupt.from_ns` 创建的中断对象\n\n这个三段式逻辑保证了多 interrupt 场景的正确性——每个 interrupt 按调用顺序与 resume 值一一对应。\n\n**BranchSpec 的编译时绑定**：`BranchSpec.from_path(path, path_map, True)` 将路由函数和路径映射打包。第三个参数 `True` 表示这是一条\"消费性\"边——源节点的输出已被消费。编译时，每个源节点的 branches 会被转化为 Pregel 的超步后路由逻辑。\n\n**Send 原语的 map-reduce 模式**：在条件边中，路由函数可以返回 `[Send(\"node_a\", input1), Send(\"node_a\", input2)]`。这会创建 node_a 的两个并行实例，各自接收不同输入——类似 MapReduce 的 map 阶段。每个 Send 实例独立执行，结果通过 reducer 聚合回主状态。这对于\"并行处理多个子任务\"的场景非常有用。\n\nSend 的典型用例包括：并行查询多个数据源、并行调用多个 LLM 生成不同视角的回答、并行处理文档的多个章节。它与普通的“多节点并行”不同：Send 允许同一个节点的多个实例并行执行，每个实例有不同的输入。\n\n**ReAct 循环的组装**：`create_react_agent` 中的图结构：\n1. 添加 `agent` 节点（执行 LLM 推理，输出 AIMessage）\n2. 添加 `tools` 节点（ToolNode 执行工具，输出 ToolMessage）\n3. `START` → `agent`（入口边）\n4. `agent` → `tools_condition`（条件边：有 tool_calls → \"tools\"，无 → END）\n5. `tools` → `agent`（普通边：工具结果回到 agent 继续推理）\n\n这个循环持续直到 LLM 不再产生 tool_calls——每一轮都是完整的\"推理→执行→观察\"周期。配合 checkpointer 时，可以在任意步骤中断并恢复。\n\n**循环次数控制**：`create_react_agent` 支持 `recursion_limit` 参数限制最大循环次数，防止 LLM 无限调用工具。还可以通过 `interrupt_before`/`interrupt_after` 参数在指定节点前后自动中断，实现更细粒度的 human-in-the-loop 控制。\n\n## 自测题\n\n见 `../quizzes/07-agent-loop.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/07-agent-loop.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/07-mini-agent-loop/README.md`。\n\n## 学完标准\n\n- 能解释 add_conditional_edges 和 Command(goto=...) 两种路由方式的适用场景\n- 能描述 interrupt/resume 的完整生命周期，包括多 interrupt 的索引匹配\n- 能画出 ReAct 循环的完整图结构（节点 + 边 + 条件边）\n- 能说明 Command 的 graph/update/goto/resume 四个字段各自的作用\n- 理解 Send 如何在条件边中实现动态 map-reduce 扇出\n- 能解释为什么 interrupt 要求节点代码幂等\n"},"quiz":{"label":"测试","path":"quizzes/07-agent-loop.quiz.md","markdown":"# Agent Loop：条件边、Command、interrupt 与 ReAct 循环 — 自测题\n\n## 选择题\n\n### 1. 以下哪种方式不是 LangGraph 支持的动态路由机制？\n\n- A. `add_conditional_edges(source, router_fn)` 注册路由函数\n- B. 节点直接返回 `Command(goto=\"next_node\")`\n- C. 在 `add_edge` 中传入条件表达式字符串\n- D. 条件边中路由函数返回列表实现并行扇出\n\n**答案**: C\n\n> LangGraph 支持两种路由方式：`add_conditional_edges` 注册路由函数，或节点返回 `Command(goto=...)`。`add_edge` 只用于静态边。参见 `ev-conditional-edges-code` 和 `ev-command-class-code`。\n\n### 2. interrupt() 被调用后，如果 scratchpad 中没有对应的 resume 值，会发生什么？\n\n- A. 返回 None 并继续执行\n- B. 抛出 GraphInterrupt 异常，暂停图执行\n- C. 自动跳过当前节点，执行下一个节点\n- D. 等待一个超时时间后自动恢复\n\n**答案**: B\n\n> interrupt() 检查 resume 值，未找到则抛出 `GraphInterrupt`，暂停图执行。中断值发送给客户端，等待 `Command(resume=value)` 恢复。参见 `ev-interrupt-func-code`（`types.py` L811-934）。\n\n### 3. Command 数据类的四个字段分别是什么？\n\n- A. source / target / data / metadata\n- B. graph / update / resume / goto\n- C. node / edge / state / config\n- D. input / output / next / prev\n\n**答案**: B\n\n> Command 包含 graph（目标图）、update（状态更新）、resume（恢复值）、goto（路由目标）四个字段。参见 `ev-command-class-code`（`types.py` L759-808）。\n\n## 简答题\n\n### 1. 请描述 interrupt/resume 的完整生命周期（6 步），并解释为什么节点代码必须是幂等的。\n\n> 提示：节点调用 interrupt → 框架检查 resume → 无则抛 GraphInterrupt → 客户端展示 → 用户决定 → Command(resume=...) 恢复。恢复时节点从头重新执行。参考 `ev-test-interrupt-resume`（`test_pregel.py` L4852-4920）。\n\n### 2. Send 原语如何在条件边中实现 map-reduce 动态并行调度？请举一个典型用例并说明它与普通\"多节点并行\"的区别。\n\n> 提示：`[Send(\"node_a\", input1), Send(\"node_a\", input2)]` 创建同一节点的多个实例。区别在于 Send 允许同一节点的多个实例并行执行，每个实例有不同输入。参考课程中 Send 的描述。\n\n### 3. 请画出 ReAct 循环的完整图结构（用文字描述节点和边的关系），并解释 `recursion_limit` 如何防止无限循环。\n\n> 提示：START → agent → tools_condition（有 tool_calls → \"tools\"，无 → END）→ tools → agent。参考 `ev-test-conditional-edges` 和 `ev-test-command-goto`。\n\n## 参考答案说明\n\n简答题没有唯一答案。回答时需要：\n- 引用具体的源码路径\n- 引用相关的 evidence id\n- 区分\"源码证明\"和\"课程推断\"\n"},"mastery":{"label":"掌握度","path":"mastery/07-agent-loop.mastery.md","markdown":"# Agent Loop：条件边、Command、interrupt 与 ReAct 循环 — 掌握度检查\n\n## 口头讲解\n\n不看课程，向同事清晰讲出以下要点：\n\n1. `add_conditional_edges(source, router_fn)` 将路由函数包装为 BranchSpec，节点完成后框架调用该函数决定下一步。路由函数返回列表可实现扇出。\n2. Command 是复合控制原语，包含 graph/update/resume/goto 四个字段——把状态更新和路由控制合并为原子操作，还支持子图向父图的跨层通信。\n3. `interrupt()` 通过中断计数器追踪索引，未找到 resume 值则抛出 GraphInterrupt 暂停。恢复时节点从头 replay，interrupt() 直接返回 resume 值。节点代码必须幂等。\n4. Send 在条件边中实现 map-reduce 动态扇出：`[Send(\"node\", input1), Send(\"node\", input2)]` 创建同一节点的多个并行实例。\n\n## 代码阅读检查\n\n- [ ] 能在 `state.py` L969-1017 中找到 `add_conditional_edges` 的实现，说明 BranchSpec 的创建逻辑\n- [ ] 能在 `types.py` L759-808 中找到 Command 数据类定义，解释 `_update_as_tuples` 如何将 update 转为 Channel 写入格式\n- [ ] 能在 `types.py` L811-934 中追踪 `interrupt()` 的三段式逻辑（已有 resume → 返回，新 resume → 消费，无 resume → 抛异常）\n- [ ] 能画出 ReAct 循环的完整图结构：START → agent → tools_condition → tools/END → agent（循环）\n- [ ] 能解释 `Command.PARENT` 如何实现子图到父图的跨层通信\n\n## 通过标准\n\n你已掌握本课程，如果你能：\n- 解释核心 claim（条件边 + Command 路由 + interrupt 暂停恢复）并引用 `ev-conditional-edges-code` 和 `ev-interrupt-func-code`\n- 引用 `ev-test-interrupt-resume` 和 `ev-test-interrupt-multiple` 说明中断恢复和多 interrupt 场景的验证方式\n- 完成 `labs/07-mini-agent-loop/` 中的最小复刻实验（实现简化版条件边 + interrupt/resume 机制）\n"},"lab":{"label":"实验","path":"labs/07-mini-agent-loop/README.md","markdown":"# Mini Agent Loop — 最小复刻实验\n\n## 目标\n\n不依赖 LangGraph 源码，用 80-120 行 Python 复刻条件边 + ReAct 循环 + interrupt/resume 机制。\n通过这个实验，你将深入理解 LangGraph Agent Loop 的核心控制流——条件路由、循环执行和 human-in-the-loop 中断恢复。\n\n## 背景\n\nAgent Loop 是 LangGraph 的核心——它把\"LLM 做决策、工具做执行\"的循环用图的控制流表达出来。条件边（conditional edges）是 saga 编排器中的路由决策：节点完成后，路由函数检查状态决定下一个节点。\n\nReAct 循环的标准模式是：agent → tools_condition → tools → agent（循环），直到 LLM 不再产生 tool_calls。`interrupt()` 则实现了 human-in-the-loop：暂停执行、等待外部输入、恢复继续。这要求节点代码必须是**幂等的**——恢复时节点会从头重新执行。\n\n## 任务\n\n用纯 Python（无第三方依赖）实现：\n\n1. `MiniGraphRunner`：支持条件边路由 + 循环执行的图运行器\n2. `interrupt(value)`：在节点内暂停执行，返回中断值\n3. `resume(graph, state, value)`：恢复中断的执行，将 value 作为 interrupt 的返回值\n\n## 建议接口\n\n```python\nfrom typing import Callable, Any\n\nclass GraphInterrupt(Exception):\n    \"\"\"中断异常，携带中断值\"\"\"\n    def __init__(self, value: Any):\n        self.value = value\n\n\nclass MiniGraphRunner:\n    def __init__(self):\n        self.nodes: dict[str, Callable] = {}\n        self.edges: dict[str, str] = {}                    # 普通边\n        self.conditional_edges: dict[str, Callable] = {}   # 条件边\n\n    def add_node(self, name: str, func: Callable):\n        ...\n\n    def add_edge(self, source: str, target: str):\n        \"\"\"添加普通边：source 完成后固定走 target\"\"\"\n        ...\n\n    def add_conditional_edge(self, source: str, router: Callable[[dict], str]):\n        \"\"\"添加条件边：source 完成后调用 router(state) 决定下一步\"\"\"\n        ...\n\n    def invoke(self, state: dict, resume_value: Any = None) -> dict:\n        \"\"\"\n        从 START 开始执行：\n        1. 按边/条件边决定下一个节点\n        2. 执行节点，merge 结果到 state\n        3. 遇到 GraphInterrupt 时保存中断状态并返回\n        4. resume_value 不为 None 时，跳过已完成节点，恢复执行\n        \"\"\"\n        ...\n\n\n# 全局中断上下文（简化实现）\n_resume_values: list = []\n\ndef interrupt(value: Any) -> Any:\n    \"\"\"\n    暂停图执行：\n    - 如果有 resume_value 可用，直接返回\n    - 否则抛出 GraphInterrupt 暂停\n    \"\"\"\n    ...\n```\n\n## 测试要求\n\n编写至少 2 个测试：\n1. **正常路径**：构建 ReAct 循环（agent → condition → tools → agent），模拟 2 轮工具调用后退出，验证循环次数和最终状态正确\n2. **边界情况**：节点内调用 `interrupt(\"请确认\")`，验证第一次执行抛出中断；第二次带 resume_value 调用时恢复执行并正确传递值\n\n## 验收标准\n\n- [ ] 条件边正确根据 router 返回值决定路由\n- [ ] ReAct 循环能正确执行多轮后在条件边终止\n- [ ] `interrupt()` 正确抛出 GraphInterrupt 暂停执行\n- [ ] resume 后节点从头重执行，interrupt 返回 resume_value\n- [ ] 支持 `recursion_limit` 防止无限循环\n- [ ] 代码不超过 120 行（不含测试）\n- [ ] 测试全部通过\n\n## 提示\n\n- 图执行用 while 循环 + current_node 指针实现\n- 条件边优先于普通边：如果 source 有条件边，走条件边；否则走普通边\n- interrupt/resume 的最简实现：用全局变量或 context 传递 resume_value\n- recursion_limit：计数器超过阈值时抛出 RecursionError\n"}}},{"id":"08-provider-integration","title":"Checkpoint 持久化、Store、SDK 与远程部署","depends_on":["01-runnable","07-agent-loop"],"primary_path":"libs/checkpoint/langgraph/checkpoint/base/__init__.py","primary_symbol":"BaseCheckpointSaver","claim_ids":["claim-08-provider-integration"],"evidence_ids":["ev-base-saver-code","ev-inmemory-saver-code","ev-remote-graph-code","ev-test-checkpoint-roundtrip"],"sections":{"lesson":{"label":"课程","path":"lessons/08-provider-integration.md","markdown":"# 08 持久化与远程集成：Checkpoint、Store、SDK 与部署边界\n\n## 你会学到什么\n\n- BaseCheckpointSaver 的四个核心方法及其语义\n- InMemorySaver 如何作为开发测试的参考实现\n- Checkpoint 数据结构如何保存图的完整状态快照\n- RemoteGraph 如何通过 SDK 实现本地/远程的透明切换\n- checkpoint saver、store、SDK 三者的职责边界\n\n## AI 概念从零解释\n\n持久化是让 Agent 从\"一次性函数调用\"升级为\"有状态长期服务\"的关键。类比分布式系统经验：\n\n- **BaseCheckpointSaver** = 分布式系统中的 State Store 接口（类似 Kafka Streams 的 StateStore 或 Flink 的 StateBackend）。定义了 `get_tuple/put/put_writes/list` 四个操作——读取快照、写入快照、写入中间结果、列举历史。\n\n- **Checkpoint** = event sourcing 中的 snapshot。它不是增量日志，而是某一时刻所有 Channel 的完整值。配合 `channel_versions` 做乐观并发控制（类似数据库的 MVCC 版本号）。\n\n- **InMemorySaver** = 类似 Redis 作为开发环境的 state backend——快但不持久。生产环境应换成 PostgresSaver（类似 Flink 从 MemoryStateBackend 切换到 RocksDBStateBackend）。\n\n- **RemoteGraph** = 一个 HTTP 代理客户端，实现了与本地 CompiledStateGraph 相同的接口（PregelProtocol）。类似 gRPC 的 stub——调用方不知道也不关心对方是本地还是远程。它可以直接作为另一个图的子节点使用。\n\n- **LangGraphClient SDK** = 类型安全的 HTTP 客户端，提供 threads/runs/assistants 等资源的 CRUD 操作。类似 Kubernetes client-go——它定义了\"控制面\"的 API 边界。\n\n- **Store** = 跨 thread 的共享状态存储。如果 Checkpoint 是\"会话内的状态\"，Store 就是\"会话间的记忆\"（类似 Redis 中按 user_id 存储的长期偏好数据）。\n\n## 源码阅读路径\n\n- **repo**: langchain-ai/langgraph\n- **commit**: 83dd61feaca993d2ee428706ad04c869895ce400\n- **scope**: libs/checkpoint/ + libs/langgraph/ + libs/sdk-py/\n- **primary path**: `libs/checkpoint/langgraph/checkpoint/base/__init__.py`\n- **primary symbol**: `BaseCheckpointSaver`\n\n**3 步阅读方法**：\n\n1. **看 BaseCheckpointSaver**（`base/__init__.py:176-348`）：抽象基类定义 `get_tuple/put/put_writes/list/delete_thread` 接口，理解每个方法的输入输出语义\n2. **看 InMemorySaver**（`memory/__init__.py:33-100`）：用 `defaultdict` 实现所有接口，理解 `storage[thread_id][checkpoint_ns][checkpoint_id]` 的三级索引结构\n3. **看 RemoteGraph**（`pregel/remote.py:118-200`）：实现 `PregelProtocol`，通过 `LangGraphClient` 发起 HTTP 调用，关注 `invoke/stream` 如何委托到远程\n\n补充阅读：查看 `CheckpointTuple`（`base/__init__.py`）理解快照的完整结构；看 `SerializerProtocol`（`serde/base.py`）理解序列化层；看 `LangGraphClient`（`libs/sdk-py/langgraph_sdk/client.py`）理解 SDK 的 API 设计。\n\n## 关键 claims 与 evidence\n\n**claim-08-provider-integration**：BaseCheckpointSaver 定义 get_tuple/put/put_writes/list 四个核心方法；InMemorySaver 是其内存实现；RemoteGraph 通过 SDK 连接远程部署。\n\n**含义解读**：这个 claim 描述了 LangGraph 持久化层的分层架构。`BaseCheckpointSaver` 是接口层，定义了状态持久化的契约——任何实现这四个方法的类都可以作为图的 checkpointer。`InMemorySaver` 是最简参考实现，用内存字典存储，适合测试。`RemoteGraph` 则展示了另一个维度：通过 SDK 将一个远程部署的图当作本地节点使用。三者共同定义了\"状态在哪里\"和\"图在哪里执行\"的边界。\n\n**证据支持**：\n- `ev-base-saver-code`：BaseCheckpointSaver 抽象类定义，所有方法签名和文档\n- `ev-inmemory-saver-code`：InMemorySaver 的 defaultdict 存储实现\n- `ev-remote-graph-code`：RemoteGraph 通过 LangGraphClient 实现 PregelProtocol\n- `ev-test-checkpoint-roundtrip`：验证 InMemorySaver 的读写一致性\n\n## 相关测试证据\n\n- **ev-test-checkpoint-roundtrip**（`libs/checkpoint/tests/test_memory.py:210-220`）：对 InMemorySaver 执行 put 写入一个 checkpoint，再用 get_tuple 读取，验证数据一致。阅读时关注 CheckpointTuple 的结构：它包含 checkpoint、config、metadata 和 parent_config，形成链表式版本历史。\n\n- **ev-test-react-agent-with-checkpoint**（`libs/prebuilt/tests/test_react_agent.py:91-121`）：验证 create_react_agent 配合 checkpointer 后，执行中断和恢复时状态正确持久化。关注测试如何传入 `thread_id` 配置和如何验证恢复后的状态连续性。\n\n## 真实源码解释\n\n**BaseCheckpointSaver 的接口设计**：`get_tuple` 返回 `CheckpointTuple`（包含 checkpoint + config + metadata），`put` 接受 checkpoint + metadata + new_versions 并返回更新后的 config。`put_writes` 专门用于中间写入（task 产生的中间结果），与 `put` 分离是为了支持细粒度持久化——一个超步中多个节点的写入可以独立保存，不必等到超步结束。`list` 方法支持 filter、before 和 limit 参数，实现时间旅行调试。\n\n**InMemorySaver 的索引结构**：三级 `defaultdict` — `storage[thread_id][checkpoint_ns][checkpoint_id]`。`thread_id` 是对话级别的隔离键，`checkpoint_ns` 支持子图的命名空间隔离，`checkpoint_id` 是每次快照的唯一标识。另外还有 `writes` 字典存储中间写入，`blobs` 字典存储 channel 的序列化值。这个结构直接映射了 LangGraph 的多租户 + 子图嵌套设计。\n\n**SerializerProtocol 与 JsonPlusSerializer**：所有 checkpoint 数据在存储前需要序列化。`SerializerProtocol` 定义了 `dumps_typed/loads_typed` 接口，默认实现 `JsonPlusSerializer` 支持 JSON 扩展类型（如 datetime、bytes、set）。这意味着切换存储后端只需实现 BaseCheckpointSaver 接口，无需关心序列化细节。\n\n**RemoteGraph 的透明代理**：继承 `PregelProtocol`，暴露与 CompiledStateGraph 相同的 `invoke/stream/get_state/update_state` 接口。内部通过 `LangGraphClient`（异步）或 `SyncLangGraphClient`（同步）发起 HTTP 请求。这意味着你可以用 `graph.add_node(\"remote\", RemoteGraph(\"assistant-id\", url=\"...\"))` 把远程图当作本地子节点使用。\n\n**SDK 的边界**：`libs/sdk-py/` 中的 `LangGraphClient` 提供 `threads`、`runs`、`assistants` 等资源的类型安全访问。它定义了 LangGraph Server API 的客户端边界——本地开发用 CompiledStateGraph 直接执行，生产环境用 SDK 调用远程部署。两者接口一致（PregelProtocol），切换只需改注入方式。\n\n**StateSnapshot 与 get_state**：`get_state()` 返回 `StateSnapshot` 命名元组，包含 values/next/config/metadata/tasks/interrupts。这是检查图当前执行状态的标准方式——类似查看一个状态机\"停在哪一步、下一步该做什么、是否有中断等待处理\"。\n\n**生产环境的选择**：开发用 InMemorySaver，生产用 PostgresSaver（`libs/checkpoint-postgres/`），LangSmith 部署时无需指定 checkpointer（平台自动管理）。如果你的图需要中断恢复、对话记忆或时间旅行调试，就必须配置 checkpointer；如果只是单次执行，可以不配置。\n\n## 自测题\n\n见 `../quizzes/08-provider-integration.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/08-provider-integration.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/08-mini-provider-adapter/README.md`。\n\n## 学完标准\n\n- 能说明 BaseCheckpointSaver 四个核心方法的语义和调用时机\n- 能解释 InMemorySaver 的三级索引结构和它为什么只适合测试\n- 能描述 RemoteGraph 如何实现本地图和远程部署的透明切换\n- 理解 checkpoint_ns 如何支持子图的状态隔离\n- 能为一个生产场景选择合适的 checkpoint saver 和部署拓扑\n"},"quiz":{"label":"测试","path":"quizzes/08-provider-integration.quiz.md","markdown":"# 持久化与远程集成：Checkpoint、Store、SDK 与部署边界 — 自测题\n\n## 选择题\n\n### 1. BaseCheckpointSaver 的四个核心方法是什么？\n\n- A. save / load / delete / list\n- B. get_tuple / put / put_writes / list\n- C. read / write / update / query\n- D. serialize / deserialize / store / retrieve\n\n**答案**: B\n\n> BaseCheckpointSaver 定义了 `get_tuple`（读取快照）、`put`（写入快照）、`put_writes`（写入中间结果）、`list`（列举历史）四个核心方法。参见 `ev-base-saver-code`（`base/__init__.py` L176-348）。\n\n### 2. InMemorySaver 的存储索引结构是什么？\n\n- A. 单层字典：storage[checkpoint_id]\n- B. 两层字典：storage[thread_id][checkpoint_id]\n- C. 三层字典：storage[thread_id][checkpoint_ns][checkpoint_id]\n- D. 数据库表：thread_id + checkpoint_id 联合主键\n\n**答案**: C\n\n> InMemorySaver 使用三级 defaultdict：`storage[thread_id][checkpoint_ns][checkpoint_id]`，支持多租户和子图命名空间隔离。参见 `ev-inmemory-saver-code`（`memory/__init__.py` L33-100）。\n\n### 3. RemoteGraph 如何实现本地图和远程部署的透明切换？\n\n- A. 通过文件系统共享编译产物\n- B. 实现 PregelProtocol 接口，通过 LangGraphClient SDK 发起 HTTP 调用\n- C. 使用消息队列异步通信\n- D. 通过 Python multiprocessing 在子进程中执行\n\n**答案**: B\n\n> RemoteGraph 继承 PregelProtocol，暴露与 CompiledStateGraph 相同的接口，内部通过 LangGraphClient 发起 HTTP 请求。参见 `ev-remote-graph-code`（`pregel/remote.py` L118-300）。\n\n## 简答题\n\n### 1. 请解释 `put` 和 `put_writes` 为什么被设计为两个独立方法，而不是合并为一个。它们各自的调用时机是什么？\n\n> 提示：`put` 在超步结束时保存完整快照，`put_writes` 保存中间结果（细粒度持久化）。一个超步中多个节点的写入可以独立保存。参考 `ev-base-saver-code`。\n\n### 2. 请描述 Checkpoint 与 Store 的职责边界差异。在什么场景下需要 Store 而 Checkpoint 不够用？\n\n> 提示：Checkpoint 是\"会话内的状态\"（单个 thread），Store 是\"会话间的记忆\"（跨 thread 共享）。例如用户长期偏好数据。参考课程中 Store 的描述。\n\n### 3. 为什么说 InMemorySaver 只适合开发测试？生产环境应该如何选择 checkpoint saver？请结合 `checkpoint_ns` 的设计说明子图状态隔离。\n\n> 提示：InMemorySaver 不持久（进程重启即丢失）。生产用 PostgresSaver。`checkpoint_ns` 让子图有独立的命名空间。参考 `ev-test-checkpoint-roundtrip`（`test_memory.py` L210-220）。\n\n## 参考答案说明\n\n简答题没有唯一答案。回答时需要：\n- 引用具体的源码路径\n- 引用相关的 evidence id\n- 区分\"源码证明\"和\"课程推断\"\n"},"mastery":{"label":"掌握度","path":"mastery/08-provider-integ
