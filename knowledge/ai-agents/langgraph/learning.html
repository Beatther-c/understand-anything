  <script id="learning-data" type="application/json">{"generatedAt":"2026-06-02T01:27:58.398Z","units":[{"id":"01-runnable","title":"LangGraph 的可执行图：从 Runnable 到 CompiledStateGraph","status":"complete","depends_on":[],"lesson":"lessons/01-runnable.md","quiz":"quizzes/01-runnable.quiz.md","mastery":"mastery/01-runnable.mastery.md","lab":"labs/01-mini-runnable/README.md","evidence_ids":["ev-stategraph-code","ev-compiled-code","ev-test-state-basic","ev-test-runnable"],"sections":{"lesson":{"label":"课程","path":"lessons/01-runnable.md","markdown":"# LangGraph 的可执行图：从 Runnable 到 CompiledStateGraph\n\n## 你会学到什么\n\n- 用工程视角解释 LangGraph 的核心抽象：StateGraph, CompiledStateGraph。\n- 从源码入口 `libs/langgraph/langgraph/graph/state.py` 追踪到测试证据，理解它解决的真实问题。\n- 把本课概念复刻成一个最小实验，并能说明它在生产 Agent 中的边界。\n\n## AI 概念从零解释\n\n把图看成一个可调用程序：输入状态进入 START，节点函数写入局部更新，运行时把更新合并成下一轮状态，直到 END。\n\n如果把一次 LLM 调用看成普通 RPC，Agent 就会显得神秘；但 LangGraph 的观点更像“长期运行的工作流”。LLM 只是节点之一，状态、边、工具、恢复点和事件流共同决定系统行为。本课的核心是：StateGraph, CompiledStateGraph 如何把不稳定的模型行为包进稳定的软件结构。\n\n## 为什么工程上需要这个抽象\n\nAgent 不是单次函数调用，而是可暂停、可恢复、可观测的状态机。可执行图让工程师把复杂流程拆成节点、边和稳定的调用入口。\n\n对后端工程师可以类比为：普通函数像同步 controller；LangGraph 图像可恢复 saga/workflow；checkpoint 像持久化执行日志；stream/debug 像领域事件与 tracing。\n\n## 最小心智模型\n\n```python\n# 伪代码：不是逐字源码，而是本课抽象的最小模型\nstate = initial_input\nwhile current_node != END:\n    update = current_node.run(state, runtime)\n    state = merge_by_schema(state, update)\n    current_node = route_by_edges(state)\nreturn project_output(state)\n```\n\n本课在这个循环中关注：`GraphBuilder.add_node(fn) -> add_edge(A, B) -> compile() -> Pregel.invoke(input)`。\n\n## Source entry points\n\n- repo: `langchain-ai/langgraph`\n- commit: `83dd61feaca993d2ee428706ad04c869895ce400`\n- scope: `libs/langgraph, libs/prebuilt, libs/checkpoint, libs/sdk-py`\n- primary path: `libs/langgraph/langgraph/graph/state.py`\n- primary symbol: `StateGraph.compile`\n- related symbols: `StateGraph, CompiledStateGraph`\n- previous lesson: 无\n- next lesson: 状态与消息：TypedDict、Reducer 与 MessagesState\n\n## 源码阅读路径\n\n1. 先读 `libs/langgraph/langgraph/graph/state.py` 中的 `StateGraph.compile`，只标记输入参数、返回值和它读写的状态。\n2. 再读本课 evidence 中的测试文件，观察测试如何构造图、输入和断言。\n3. 最后回到源码，把测试中的断言映射到具体分支：错误处理、状态合并、路由、持久化或事件输出。\n\n## 核心 entities 与 relations\n\n- entity: `lesson:01-runnable`，课程单元。\n- entity: `concept:01-runnable`，源码概念 `StateGraph, CompiledStateGraph`。\n- relation: 本课概念与前后课程的依赖关系见 `graph/relations.json`。\n\n## 关键 claims 与 evidence\n\n- claim: `claim-01-runnable`，StateGraph.compile 会把声明式节点/边转换为可 invoke/stream 的 CompiledStateGraph，而不是直接执行节点函数。\n\n- `ev-stategraph-code`: `libs/langgraph/langgraph/graph/state.py:130`，StateGraph 是有状态图构建器，接收 state_schema/context_schema/input/output 等图定义。\n- `ev-compiled-code`: `libs/langgraph/langgraph/graph/state.py:1164`，compile 接收 checkpointer/store/interrupt/cache/debug 等参数并产出 CompiledStateGraph。\n- `ev-test-state-basic`: `libs/langgraph/tests/test_state.py:1`，状态图测试覆盖基础节点、边和状态更新行为。\n- `ev-test-runnable`: `libs/langgraph/tests/test_runnable.py:1`，Runnable 互操作测试证明编译图可作为可调用对象使用。\n\n## 相关测试证据\n\n- `ev-test-state-basic`: `libs/langgraph/tests/test_state.py:1`，状态图测试覆盖基础节点、边和状态更新行为。\n- `ev-test-runnable`: `libs/langgraph/tests/test_runnable.py:1`，Runnable 互操作测试证明编译图可作为可调用对象使用。\n\n阅读测试时不要只看 test name。建议记录三件事：输入状态是什么、预期输出是什么、测试是否覆盖失败/边界路径。\n\n## 真实源码解释\n\nStateGraph 收集节点、边、schema 和运行参数；compile 阶段把这些声明转换为 CompiledStateGraph。CompiledStateGraph 继承 Pregel 能力，因此用户看到的是 invoke/stream 这样的执行入口，而构建期对象本身不直接跑节点。\n\n## 设计取舍\n\n- 显式图结构让流程更可审查，但需要学习节点、边、状态和运行时的词汇。\n- 类型 schema 能提前暴露状态合并错误，但动态消息和工具调用仍需要运行时测试兜底。\n- 运行时事件和 checkpoint 增加复杂度，但换来可恢复、可观测和可回放的生产能力。\n\n## Java/backend 类比\n\n可以把 LangGraph 想成 Temporal/Cadence 风格的工作流内核加上 LLM 节点：节点像 activity，状态像 workflow state，checkpoint 像 event history，ToolNode 像受控外部副作用适配器，Command/interrupt 像工作流信号和人工审批。\n\n## 常见误解\n\n- 误解：LangGraph 是“画图工具”。更准确地说，它是可执行状态图运行时。\n- 误解：Agent loop 必须手写 while。LangGraph 倾向用条件边、Command 和节点返回值表达循环。\n- 误解：测试只需要 mock 模型输出。实际还要测试状态合并、工具注入、checkpoint、stream 事件和恢复路径。\n\n## 自测题\n\n见 `../quizzes/01-runnable.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/01-runnable.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/01-mini-runnable/README.md`。\n\n## 学完标准\n\n- 能不看答案说出 `StateGraph, CompiledStateGraph` 解决什么工程问题。\n- 能在源码中定位本课 primary symbol，并说明至少两个测试如何证明行为。\n- 能完成实验，并把自己的实现与 LangGraph 源码设计差异写成 5 条以内的笔记。\n\n"},"quiz":{"label":"测试","path":"quizzes/01-runnable.quiz.md","markdown":"# LangGraph 的可执行图：从 Runnable 到 CompiledStateGraph - Quiz\n\n## 选择题\n\n1. 本课核心抽象主要解决什么问题？\n   - A. 让 LLM 自动变聪明\n   - B. 把 Agent 行为放进可测试、可恢复、可观测的软件结构\n   - C. 替代所有业务代码\n   - D. 只用于画流程图\n\n2. 阅读 evidence 时最应该优先确认什么？\n   - A. README 是否写得漂亮\n   - B. claim 是否能被源码路径和测试断言支撑\n   - C. 文件名是否足够短\n   - D. 是否没有任何抽象\n\n## 简答题\n\n1. 用 5 句话以内解释 `StateGraph, CompiledStateGraph` 与本课 claim 的关系。\n2. 从 `ev-test-state-basic` 和 `ev-test-runnable` 各选一个测试，说明它们分别证明了什么。\n3. 如果你要把本课能力用于公司内部客服 Agent，你会新增哪两个失败路径测试？\n\n## 参考答案\n\n- 选择题：1-B，2-B。\n- 简答题没有唯一答案，但必须引用本课源码路径、测试 evidence id，并能区分“源码证明”和“课程推断”。\n"},"mastery":{"label":"掌握度","path":"mastery/01-runnable.mastery.md","markdown":"# LangGraph 的可执行图：从 Runnable 到 CompiledStateGraph - 掌握度验证\n\n## 口头讲解\n\n不用看课程，向同事讲清楚：\n\n- `StateGraph, CompiledStateGraph` 的输入、输出和边界。\n- 为什么 LangGraph 需要这个抽象。\n- 哪两个测试最能证明本课 claim。\n\n## 代码阅读检查\n\n- 在源码中定位 `StateGraph.compile`。\n- 找到本课至少一个错误处理或边界条件。\n- 把测试断言与源码分支画成一条因果链。\n\n## 通过标准\n\n- 能解释 claim: `claim-01-runnable`。\n- 能引用至少 1 个 code evidence 和 2 个 test evidence。\n- 能完成实验并写出“我的最小实现缺少 LangGraph 哪些生产能力”。\n"},"lab":{"label":"实验","path":"labs/01-mini-runnable/README.md","markdown":"# LangGraph 的可执行图：从 Runnable 到 CompiledStateGraph - 最小实验\n\n## 目标\n\n实现一个不依赖 LangGraph 的最小版本，复刻本课概念：`StateGraph, CompiledStateGraph`。\n\n## 任务\n\n1. 写一个 50-120 行的小程序，输入一个初始 state。\n2. 至少包含两个节点、一个状态合并函数和一个可观察的中间事件。\n3. 加两个测试：正常路径一个，失败或边界路径一个。\n4. 在 README 末尾写 5 条对比：你的实现缺少 LangGraph 的哪些能力。\n\n## 建议接口\n\n```python\nclass MiniGraph:\n    def add_node(self, name, fn): ...\n    def add_edge(self, start, end): ...\n    def invoke(self, state): ...\n    def stream(self, state): ...\n```\n\n## 验收\n\n- 能跑通输入到输出。\n- 能解释状态如何合并。\n- 能说明本课 evidence 中的测试为什么比你的实验更完整。\n"}}},{"id":"02-message-schema","title":"状态与消息：TypedDict、Reducer 与 MessagesState","status":"complete","depends_on":["01-runnable"],"lesson":"lessons/02-message-schema.md","quiz":"quizzes/02-message-schema.quiz.md","mastery":"mastery/02-message-schema.mastery.md","lab":"labs/02-message-types/README.md","evidence_ids":["ev-messages-state-code","ev-add-messages-code","ev-test-messages-state","ev-test-channels-overwrite"],"sections":{"lesson":{"label":"课程","path":"lessons/02-message-schema.md","markdown":"# 状态与消息：TypedDict、Reducer 与 MessagesState\n\n## 你会学到什么\n\n- 用工程视角解释 LangGraph 的核心抽象：MessagesState, add_messages, Overwrite。\n- 从源码入口 `libs/langgraph/langgraph/graph/message.py` 追踪到测试证据，理解它解决的真实问题。\n- 把本课概念复刻成一个最小实验，并能说明它在生产 Agent 中的边界。\n\n## AI 概念从零解释\n\n状态不是一个普通 dict；每个字段可以有合并规则。消息字段通常用 reducer 追加、覆盖或按 id 更新。\n\n如果把一次 LLM 调用看成普通 RPC，Agent 就会显得神秘；但 LangGraph 的观点更像“长期运行的工作流”。LLM 只是节点之一，状态、边、工具、恢复点和事件流共同决定系统行为。本课的核心是：MessagesState, add_messages, Overwrite 如何把不稳定的模型行为包进稳定的软件结构。\n\n## 为什么工程上需要这个抽象\n\n多节点并发写入时必须有确定性合并策略，否则同一 super-step 的两个节点会把状态写乱。\n\n对后端工程师可以类比为：普通函数像同步 controller；LangGraph 图像可恢复 saga/workflow；checkpoint 像持久化执行日志；stream/debug 像领域事件与 tracing。\n\n## 最小心智模型\n\n```python\n# 伪代码：不是逐字源码，而是本课抽象的最小模型\nstate = initial_input\nwhile current_node != END:\n    update = current_node.run(state, runtime)\n    state = merge_by_schema(state, update)\n    current_node = route_by_edges(state)\nreturn project_output(state)\n```\n\n本课在这个循环中关注：`State = {messages: Annotated[list, add_messages]}；node -> partial update；reducer(old, update) -> next`。\n\n## Source entry points\n\n- repo: `langchain-ai/langgraph`\n- commit: `83dd61feaca993d2ee428706ad04c869895ce400`\n- scope: `libs/langgraph, libs/prebuilt, libs/checkpoint, libs/sdk-py`\n- primary path: `libs/langgraph/langgraph/graph/message.py`\n- primary symbol: `MessagesState`\n- related symbols: `MessagesState, add_messages, Overwrite`\n- previous lesson: LangGraph 的可执行图：从 Runnable 到 CompiledStateGraph\n- next lesson: 节点函数即提示装配层：把业务上下文变成模型输入\n\n## 源码阅读路径\n\n1. 先读 `libs/langgraph/langgraph/graph/message.py` 中的 `MessagesState`，只标记输入参数、返回值和它读写的状态。\n2. 再读本课 evidence 中的测试文件，观察测试如何构造图、输入和断言。\n3. 最后回到源码，把测试中的断言映射到具体分支：错误处理、状态合并、路由、持久化或事件输出。\n\n## 核心 entities 与 relations\n\n- entity: `lesson:02-message-schema`，课程单元。\n- entity: `concept:02-message-schema`，源码概念 `MessagesState, add_messages, Overwrite`。\n- relation: 本课概念与前后课程的依赖关系见 `graph/relations.json`。\n\n## 关键 claims 与 evidence\n\n- claim: `claim-02-message-schema`，MessagesState 通过预定义 messages 字段和 add_messages reducer 支撑对话状态的增量合并。\n\n- `ev-messages-state-code`: `libs/langgraph/langgraph/graph/message.py:372`，MessagesState 定义 messages 字段并绑定 add_messages reducer。\n- `ev-add-messages-code`: `libs/langgraph/langgraph/graph/message.py:31`，add_messages 负责合并消息、按 id 更新以及处理消息格式。\n- `ev-test-messages-state`: `libs/langgraph/tests/test_messages_state.py:1`，消息状态测试覆盖 TypedDict/Pydantic 状态和消息合并。\n- `ev-test-channels-overwrite`: `libs/langgraph/tests/test_channels.py:497`，Overwrite 测试验证 reducer 可被显式覆盖且保持 dict 形状。\n\n## 相关测试证据\n\n- `ev-test-messages-state`: `libs/langgraph/tests/test_messages_state.py:1`，消息状态测试覆盖 TypedDict/Pydantic 状态和消息合并。\n- `ev-test-channels-overwrite`: `libs/langgraph/tests/test_channels.py:497`，Overwrite 测试验证 reducer 可被显式覆盖且保持 dict 形状。\n\n阅读测试时不要只看 test name。建议记录三件事：输入状态是什么、预期输出是什么、测试是否覆盖失败/边界路径。\n\n## 真实源码解释\n\nmessage.py 把消息合并逻辑封装成 reducer。MessagesState 只是很小的 TypedDict，但它把 messages 字段的合并语义固定下来。测试中对 Pydantic、TypedDict、Overwrite 的覆盖说明：状态字段不是随便 append，而是由 channel/reducer 规则决定。\n\n## 设计取舍\n\n- 显式图结构让流程更可审查，但需要学习节点、边、状态和运行时的词汇。\n- 类型 schema 能提前暴露状态合并错误，但动态消息和工具调用仍需要运行时测试兜底。\n- 运行时事件和 checkpoint 增加复杂度，但换来可恢复、可观测和可回放的生产能力。\n\n## Java/backend 类比\n\n可以把 LangGraph 想成 Temporal/Cadence 风格的工作流内核加上 LLM 节点：节点像 activity，状态像 workflow state，checkpoint 像 event history，ToolNode 像受控外部副作用适配器，Command/interrupt 像工作流信号和人工审批。\n\n## 常见误解\n\n- 误解：LangGraph 是“画图工具”。更准确地说，它是可执行状态图运行时。\n- 误解：Agent loop 必须手写 while。LangGraph 倾向用条件边、Command 和节点返回值表达循环。\n- 误解：测试只需要 mock 模型输出。实际还要测试状态合并、工具注入、checkpoint、stream 事件和恢复路径。\n\n## 自测题\n\n见 `../quizzes/02-message-schema.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/02-message-schema.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/02-message-types/README.md`。\n\n## 学完标准\n\n- 能不看答案说出 `MessagesState, add_messages, Overwrite` 解决什么工程问题。\n- 能在源码中定位本课 primary symbol，并说明至少两个测试如何证明行为。\n- 能完成实验，并把自己的实现与 LangGraph 源码设计差异写成 5 条以内的笔记。\n\n"},"quiz":{"label":"测试","path":"quizzes/02-message-schema.quiz.md","markdown":"# 状态与消息：TypedDict、Reducer 与 MessagesState - Quiz\n\n## 选择题\n\n1. 本课核心抽象主要解决什么问题？\n   - A. 让 LLM 自动变聪明\n   - B. 把 Agent 行为放进可测试、可恢复、可观测的软件结构\n   - C. 替代所有业务代码\n   - D. 只用于画流程图\n\n2. 阅读 evidence 时最应该优先确认什么？\n   - A. README 是否写得漂亮\n   - B. claim 是否能被源码路径和测试断言支撑\n   - C. 文件名是否足够短\n   - D. 是否没有任何抽象\n\n## 简答题\n\n1. 用 5 句话以内解释 `MessagesState, add_messages, Overwrite` 与本课 claim 的关系。\n2. 从 `ev-test-messages-state` 和 `ev-test-channels-overwrite` 各选一个测试，说明它们分别证明了什么。\n3. 如果你要把本课能力用于公司内部客服 Agent，你会新增哪两个失败路径测试？\n\n## 参考答案\n\n- 选择题：1-B，2-B。\n- 简答题没有唯一答案，但必须引用本课源码路径、测试 evidence id，并能区分“源码证明”和“课程推断”。\n"},"mastery":{"label":"掌握度","path":"mastery/02-message-schema.mastery.md","markdown":"# 状态与消息：TypedDict、Reducer 与 MessagesState - 掌握度验证\n\n## 口头讲解\n\n不用看课程，向同事讲清楚：\n\n- `MessagesState, add_messages, Overwrite` 的输入、输出和边界。\n- 为什么 LangGraph 需要这个抽象。\n- 哪两个测试最能证明本课 claim。\n\n## 代码阅读检查\n\n- 在源码中定位 `MessagesState`。\n- 找到本课至少一个错误处理或边界条件。\n- 把测试断言与源码分支画成一条因果链。\n\n## 通过标准\n\n- 能解释 claim: `claim-02-message-schema`。\n- 能引用至少 1 个 code evidence 和 2 个 test evidence。\n- 能完成实验并写出“我的最小实现缺少 LangGraph 哪些生产能力”。\n"},"lab":{"label":"实验","path":"labs/02-message-types/README.md","markdown":"# 状态与消息：TypedDict、Reducer 与 MessagesState - 最小实验\n\n## 目标\n\n实现一个不依赖 LangGraph 的最小版本，复刻本课概念：`MessagesState, add_messages, Overwrite`。\n\n## 任务\n\n1. 写一个 50-120 行的小程序，输入一个初始 state。\n2. 至少包含两个节点、一个状态合并函数和一个可观察的中间事件。\n3. 加两个测试：正常路径一个，失败或边界路径一个。\n4. 在 README 末尾写 5 条对比：你的实现缺少 LangGraph 的哪些能力。\n\n## 建议接口\n\n```python\nclass MiniGraph:\n    def add_node(self, name, fn): ...\n    def add_edge(self, start, end): ...\n    def invoke(self, state): ...\n    def stream(self, state): ...\n```\n\n## 验收\n\n- 能跑通输入到输出。\n- 能解释状态如何合并。\n- 能说明本课 evidence 中的测试为什么比你的实验更完整。\n"}}},{"id":"03-prompt-template","title":"节点函数即提示装配层：把业务上下文变成模型输入","status":"complete","depends_on":["02-message-schema"],"lesson":"lessons/03-prompt-template.md","quiz":"quizzes/03-prompt-template.quiz.md","mastery":"mastery/03-prompt-template.mastery.md","lab":"labs/03-mini-prompt-template/README.md","evidence_ids":["ev-runtime-code","ev-react-prompt-code","ev-test-react-prompt","ev-test-runtime-context"],"sections":{"lesson":{"label":"课程","path":"lessons/03-prompt-template.md","markdown":"# 节点函数即提示装配层：把业务上下文变成模型输入\n\n## 你会学到什么\n\n- 用工程视角解释 LangGraph 的核心抽象：Runtime, prompt, pre_model_hook。\n- 从源码入口 `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py` 追踪到测试证据，理解它解决的真实问题。\n- 把本课概念复刻成一个最小实验，并能说明它在生产 Agent 中的边界。\n\n## AI 概念从零解释\n\nLangGraph 不把 prompt 固定成特殊类；节点函数负责读取状态、上下文和历史消息，决定下一次模型调用的输入。\n\n如果把一次 LLM 调用看成普通 RPC，Agent 就会显得神秘；但 LangGraph 的观点更像“长期运行的工作流”。LLM 只是节点之一，状态、边、工具、恢复点和事件流共同决定系统行为。本课的核心是：Runtime, prompt, pre_model_hook 如何把不稳定的模型行为包进稳定的软件结构。\n\n## 为什么工程上需要这个抽象\n\nAgent 需要把检索结果、用户上下文、工具结果和系统规则组合起来。把装配逻辑放进节点，比把 prompt 写死更适合生产流程。\n\n对后端工程师可以类比为：普通函数像同步 controller；LangGraph 图像可恢复 saga/workflow；checkpoint 像持久化执行日志；stream/debug 像领域事件与 tracing。\n\n## 最小心智模型\n\n```python\n# 伪代码：不是逐字源码，而是本课抽象的最小模型\nstate = initial_input\nwhile current_node != END:\n    update = current_node.run(state, runtime)\n    state = merge_by_schema(state, update)\n    current_node = route_by_edges(state)\nreturn project_output(state)\n```\n\n本课在这个循环中关注：`state -> node(state, runtime) -> model_input/messages -> update`。\n\n## Source entry points\n\n- repo: `langchain-ai/langgraph`\n- commit: `83dd61feaca993d2ee428706ad04c869895ce400`\n- scope: `libs/langgraph, libs/prebuilt, libs/checkpoint, libs/sdk-py`\n- primary path: `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py`\n- primary symbol: `create_react_agent`\n- related symbols: `Runtime, prompt, pre_model_hook`\n- previous lesson: 状态与消息：TypedDict、Reducer 与 MessagesState\n- next lesson: 模型适配：把 ChatModel 当成图节点的一部分\n\n## 源码阅读路径\n\n1. 先读 `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py` 中的 `create_react_agent`，只标记输入参数、返回值和它读写的状态。\n2. 再读本课 evidence 中的测试文件，观察测试如何构造图、输入和断言。\n3. 最后回到源码，把测试中的断言映射到具体分支：错误处理、状态合并、路由、持久化或事件输出。\n\n## 核心 entities 与 relations\n\n- entity: `lesson:03-prompt-template`，课程单元。\n- entity: `concept:03-prompt-template`，源码概念 `Runtime, prompt, pre_model_hook`。\n- relation: 本课概念与前后课程的依赖关系见 `graph/relations.json`。\n\n## 关键 claims 与 evidence\n\n- claim: `claim-03-prompt-template`，LangGraph 的 prompt 装配通常发生在节点或 pre_model_hook 中，运行时通过 state/context/store 注入所需上下文。\n\n- `ev-runtime-code`: `libs/langgraph/langgraph/runtime.py:1`，Runtime 为节点提供 context、store、stream_writer 等运行期依赖。\n- `ev-react-prompt-code`: `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py:278`，create_react_agent 接收 prompt、state_schema、context_schema、hooks 等参数。\n- `ev-test-react-prompt`: `libs/prebuilt/tests/test_react_agent.py:150`，ReAct agent 测试覆盖多种 prompt 输入形态。\n- `ev-test-runtime-context`: `libs/langgraph/tests/test_runtime.py:1`，Runtime 测试验证节点能读取 context/store/stream_writer 等运行期对象。\n\n## 相关测试证据\n\n- `ev-test-react-prompt`: `libs/prebuilt/tests/test_react_agent.py:150`，ReAct agent 测试覆盖多种 prompt 输入形态。\n- `ev-test-runtime-context`: `libs/langgraph/tests/test_runtime.py:1`，Runtime 测试验证节点能读取 context/store/stream_writer 等运行期对象。\n\n阅读测试时不要只看 test name。建议记录三件事：输入状态是什么、预期输出是什么、测试是否覆盖失败/边界路径。\n\n## 真实源码解释\n\nLangGraph 核心没有强制 PromptTemplate 类型。create_react_agent 的 prompt、pre_model_hook 和 Runtime/context 共同构成提示装配层。节点可以把状态、上下文、store 和历史消息编排成模型输入，这也是生产系统常需要插入策略、权限和检索结果的位置。\n\n## 设计取舍\n\n- 显式图结构让流程更可审查，但需要学习节点、边、状态和运行时的词汇。\n- 类型 schema 能提前暴露状态合并错误，但动态消息和工具调用仍需要运行时测试兜底。\n- 运行时事件和 checkpoint 增加复杂度，但换来可恢复、可观测和可回放的生产能力。\n\n## Java/backend 类比\n\n可以把 LangGraph 想成 Temporal/Cadence 风格的工作流内核加上 LLM 节点：节点像 activity，状态像 workflow state，checkpoint 像 event history，ToolNode 像受控外部副作用适配器，Command/interrupt 像工作流信号和人工审批。\n\n## 常见误解\n\n- 误解：LangGraph 是“画图工具”。更准确地说，它是可执行状态图运行时。\n- 误解：Agent loop 必须手写 while。LangGraph 倾向用条件边、Command 和节点返回值表达循环。\n- 误解：测试只需要 mock 模型输出。实际还要测试状态合并、工具注入、checkpoint、stream 事件和恢复路径。\n\n## 自测题\n\n见 `../quizzes/03-prompt-template.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/03-prompt-template.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/03-mini-prompt-template/README.md`。\n\n## 学完标准\n\n- 能不看答案说出 `Runtime, prompt, pre_model_hook` 解决什么工程问题。\n- 能在源码中定位本课 primary symbol，并说明至少两个测试如何证明行为。\n- 能完成实验，并把自己的实现与 LangGraph 源码设计差异写成 5 条以内的笔记。\n\n"},"quiz":{"label":"测试","path":"quizzes/03-prompt-template.quiz.md","markdown":"# 节点函数即提示装配层：把业务上下文变成模型输入 - Quiz\n\n## 选择题\n\n1. 本课核心抽象主要解决什么问题？\n   - A. 让 LLM 自动变聪明\n   - B. 把 Agent 行为放进可测试、可恢复、可观测的软件结构\n   - C. 替代所有业务代码\n   - D. 只用于画流程图\n\n2. 阅读 evidence 时最应该优先确认什么？\n   - A. README 是否写得漂亮\n   - B. claim 是否能被源码路径和测试断言支撑\n   - C. 文件名是否足够短\n   - D. 是否没有任何抽象\n\n## 简答题\n\n1. 用 5 句话以内解释 `Runtime, prompt, pre_model_hook` 与本课 claim 的关系。\n2. 从 `ev-test-react-prompt` 和 `ev-test-runtime-context` 各选一个测试，说明它们分别证明了什么。\n3. 如果你要把本课能力用于公司内部客服 Agent，你会新增哪两个失败路径测试？\n\n## 参考答案\n\n- 选择题：1-B，2-B。\n- 简答题没有唯一答案，但必须引用本课源码路径、测试 evidence id，并能区分“源码证明”和“课程推断”。\n"},"mastery":{"label":"掌握度","path":"mastery/03-prompt-template.mastery.md","markdown":"# 节点函数即提示装配层：把业务上下文变成模型输入 - 掌握度验证\n\n## 口头讲解\n\n不用看课程，向同事讲清楚：\n\n- `Runtime, prompt, pre_model_hook` 的输入、输出和边界。\n- 为什么 LangGraph 需要这个抽象。\n- 哪两个测试最能证明本课 claim。\n\n## 代码阅读检查\n\n- 在源码中定位 `create_react_agent`。\n- 找到本课至少一个错误处理或边界条件。\n- 把测试断言与源码分支画成一条因果链。\n\n## 通过标准\n\n- 能解释 claim: `claim-03-prompt-template`。\n- 能引用至少 1 个 code evidence 和 2 个 test evidence。\n- 能完成实验并写出“我的最小实现缺少 LangGraph 哪些生产能力”。\n"},"lab":{"label":"实验","path":"labs/03-mini-prompt-template/README.md","markdown":"# 节点函数即提示装配层：把业务上下文变成模型输入 - 最小实验\n\n## 目标\n\n实现一个不依赖 LangGraph 的最小版本，复刻本课概念：`Runtime, prompt, pre_model_hook`。\n\n## 任务\n\n1. 写一个 50-120 行的小程序，输入一个初始 state。\n2. 至少包含两个节点、一个状态合并函数和一个可观察的中间事件。\n3. 加两个测试：正常路径一个，失败或边界路径一个。\n4. 在 README 末尾写 5 条对比：你的实现缺少 LangGraph 的哪些能力。\n\n## 建议接口\n\n```python\nclass MiniGraph:\n    def add_node(self, name, fn): ...\n    def add_edge(self, start, end): ...\n    def invoke(self, state): ...\n    def stream(self, state): ...\n```\n\n## 验收\n\n- 能跑通输入到输出。\n- 能解释状态如何合并。\n- 能说明本课 evidence 中的测试为什么比你的实验更完整。\n"}}},{"id":"04-chat-model-adapter","title":"模型适配：把 ChatModel 当成图节点的一部分","status":"complete","depends_on":["03-prompt-template"],"lesson":"lessons/04-chat-model-adapter.md","quiz":"quizzes/04-chat-model-adapter.quiz.md","mastery":"mastery/04-chat-model-adapter.mastery.md","lab":"labs/04-mini-chat-model-adapter/README.md","evidence_ids":["ev-react-call-model-code","ev-tool-binding-code","ev-test-dynamic-model","ev-test-model-tool-mismatch"],"sections":{"lesson":{"label":"课程","path":"lessons/04-chat-model-adapter.md","markdown":"# 模型适配：把 ChatModel 当成图节点的一部分\n\n## 你会学到什么\n\n- 用工程视角解释 LangGraph 的核心抽象：call_model, model.bind_tools, dynamic model。\n- 从源码入口 `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py` 追踪到测试证据，理解它解决的真实问题。\n- 把本课概念复刻成一个最小实验，并能说明它在生产 Agent 中的边界。\n\n## AI 概念从零解释\n\n模型不是全局魔法；它是节点调用链里的一个可替换组件。节点根据状态调用模型，模型返回 AIMessage 或工具调用请求。\n\n如果把一次 LLM 调用看成普通 RPC，Agent 就会显得神秘；但 LangGraph 的观点更像“长期运行的工作流”。LLM 只是节点之一，状态、边、工具、恢复点和事件流共同决定系统行为。本课的核心是：call_model, model.bind_tools, dynamic model 如何把不稳定的模型行为包进稳定的软件结构。\n\n## 为什么工程上需要这个抽象\n\n生产 Agent 要支持静态模型、动态模型选择、绑定工具、结构化输出和错误重试。适配层让这些变化不破坏图结构。\n\n对后端工程师可以类比为：普通函数像同步 controller；LangGraph 图像可恢复 saga/workflow；checkpoint 像持久化执行日志；stream/debug 像领域事件与 tracing。\n\n## 最小心智模型\n\n```python\n# 伪代码：不是逐字源码，而是本课抽象的最小模型\nstate = initial_input\nwhile current_node != END:\n    update = current_node.run(state, runtime)\n    state = merge_by_schema(state, update)\n    current_node = route_by_edges(state)\nreturn project_output(state)\n```\n\n本课在这个循环中关注：`call_model(state) -> model.invoke(messages) -> AIMessage -> route/tool/end`。\n\n## Source entry points\n\n- repo: `langchain-ai/langgraph`\n- commit: `83dd61feaca993d2ee428706ad04c869895ce400`\n- scope: `libs/langgraph, libs/prebuilt, libs/checkpoint, libs/sdk-py`\n- primary path: `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py`\n- primary symbol: `create_react_agent`\n- related symbols: `call_model, model.bind_tools, dynamic model`\n- previous lesson: 节点函数即提示装配层：把业务上下文变成模型输入\n- next lesson: 工具接口：ToolNode、InjectedState 与 ToolMessage\n\n## 源码阅读路径\n\n1. 先读 `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py` 中的 `create_react_agent`，只标记输入参数、返回值和它读写的状态。\n2. 再读本课 evidence 中的测试文件，观察测试如何构造图、输入和断言。\n3. 最后回到源码，把测试中的断言映射到具体分支：错误处理、状态合并、路由、持久化或事件输出。\n\n## 核心 entities 与 relations\n\n- entity: `lesson:04-chat-model-adapter`，课程单元。\n- entity: `concept:04-chat-model-adapter`，源码概念 `call_model, model.bind_tools, dynamic model`。\n- relation: 本课概念与前后课程的依赖关系见 `graph/relations.json`。\n\n## 关键 claims 与 evidence\n\n- claim: `claim-04-chat-model-adapter`，预构建 ReAct agent 会把模型调用封装成图节点，并校验模型绑定工具与传入工具集合的一致性。\n\n- `ev-react-call-model-code`: `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py:560`，ReAct agent 内部模型节点负责调用 chat model 并写回消息。\n- `ev-tool-binding-code`: `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py:180`，工具绑定校验逻辑要求模型绑定工具集合与传入工具匹配。\n- `ev-test-dynamic-model`: `libs/prebuilt/tests/test_react_agent.py:1565`，动态模型测试覆盖运行时选择模型和静态/动态模型差异。\n- `ev-test-model-tool-mismatch`: `libs/prebuilt/tests/test_react_agent.py:329`，测试验证模型已绑定工具与传入工具不一致时会报错。\n\n## 相关测试证据\n\n- `ev-test-dynamic-model`: `libs/prebuilt/tests/test_react_agent.py:1565`，动态模型测试覆盖运行时选择模型和静态/动态模型差异。\n- `ev-test-model-tool-mismatch`: `libs/prebuilt/tests/test_react_agent.py:329`，测试验证模型已绑定工具与传入工具不一致时会报错。\n\n阅读测试时不要只看 test name。建议记录三件事：输入状态是什么、预期输出是什么、测试是否覆盖失败/边界路径。\n\n## 真实源码解释\n\nReAct agent 的模型节点会调用 chat model，并把返回的 AIMessage 写回 messages。工具绑定检查避免出现模型知道一组工具、ToolNode 却执行另一组工具的漂移。动态模型测试说明模型选择可以依赖运行时，而不是固定在图定义时。\n\n## 设计取舍\n\n- 显式图结构让流程更可审查，但需要学习节点、边、状态和运行时的词汇。\n- 类型 schema 能提前暴露状态合并错误，但动态消息和工具调用仍需要运行时测试兜底。\n- 运行时事件和 checkpoint 增加复杂度，但换来可恢复、可观测和可回放的生产能力。\n\n## Java/backend 类比\n\n可以把 LangGraph 想成 Temporal/Cadence 风格的工作流内核加上 LLM 节点：节点像 activity，状态像 workflow state，checkpoint 像 event history，ToolNode 像受控外部副作用适配器，Command/interrupt 像工作流信号和人工审批。\n\n## 常见误解\n\n- 误解：LangGraph 是“画图工具”。更准确地说，它是可执行状态图运行时。\n- 误解：Agent loop 必须手写 while。LangGraph 倾向用条件边、Command 和节点返回值表达循环。\n- 误解：测试只需要 mock 模型输出。实际还要测试状态合并、工具注入、checkpoint、stream 事件和恢复路径。\n\n## 自测题\n\n见 `../quizzes/04-chat-model-adapter.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/04-chat-model-adapter.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/04-mini-chat-model-adapter/README.md`。\n\n## 学完标准\n\n- 能不看答案说出 `call_model, model.bind_tools, dynamic model` 解决什么工程问题。\n- 能在源码中定位本课 primary symbol，并说明至少两个测试如何证明行为。\n- 能完成实验，并把自己的实现与 LangGraph 源码设计差异写成 5 条以内的笔记。\n\n"},"quiz":{"label":"测试","path":"quizzes/04-chat-model-adapter.quiz.md","markdown":"# 模型适配：把 ChatModel 当成图节点的一部分 - Quiz\n\n## 选择题\n\n1. 本课核心抽象主要解决什么问题？\n   - A. 让 LLM 自动变聪明\n   - B. 把 Agent 行为放进可测试、可恢复、可观测的软件结构\n   - C. 替代所有业务代码\n   - D. 只用于画流程图\n\n2. 阅读 evidence 时最应该优先确认什么？\n   - A. README 是否写得漂亮\n   - B. claim 是否能被源码路径和测试断言支撑\n   - C. 文件名是否足够短\n   - D. 是否没有任何抽象\n\n## 简答题\n\n1. 用 5 句话以内解释 `call_model, model.bind_tools, dynamic model` 与本课 claim 的关系。\n2. 从 `ev-test-dynamic-model` 和 `ev-test-model-tool-mismatch` 各选一个测试，说明它们分别证明了什么。\n3. 如果你要把本课能力用于公司内部客服 Agent，你会新增哪两个失败路径测试？\n\n## 参考答案\n\n- 选择题：1-B，2-B。\n- 简答题没有唯一答案，但必须引用本课源码路径、测试 evidence id，并能区分“源码证明”和“课程推断”。\n"},"mastery":{"label":"掌握度","path":"mastery/04-chat-model-adapter.mastery.md","markdown":"# 模型适配：把 ChatModel 当成图节点的一部分 - 掌握度验证\n\n## 口头讲解\n\n不用看课程，向同事讲清楚：\n\n- `call_model, model.bind_tools, dynamic model` 的输入、输出和边界。\n- 为什么 LangGraph 需要这个抽象。\n- 哪两个测试最能证明本课 claim。\n\n## 代码阅读检查\n\n- 在源码中定位 `create_react_agent`。\n- 找到本课至少一个错误处理或边界条件。\n- 把测试断言与源码分支画成一条因果链。\n\n## 通过标准\n\n- 能解释 claim: `claim-04-chat-model-adapter`。\n- 能引用至少 1 个 code evidence 和 2 个 test evidence。\n- 能完成实验并写出“我的最小实现缺少 LangGraph 哪些生产能力”。\n"},"lab":{"label":"实验","path":"labs/04-mini-chat-model-adapter/README.md","markdown":"# 模型适配：把 ChatModel 当成图节点的一部分 - 最小实验\n\n## 目标\n\n实现一个不依赖 LangGraph 的最小版本，复刻本课概念：`call_model, model.bind_tools, dynamic model`。\n\n## 任务\n\n1. 写一个 50-120 行的小程序，输入一个初始 state。\n2. 至少包含两个节点、一个状态合并函数和一个可观察的中间事件。\n3. 加两个测试：正常路径一个，失败或边界路径一个。\n4. 在 README 末尾写 5 条对比：你的实现缺少 LangGraph 的哪些能力。\n\n## 建议接口\n\n```python\nclass MiniGraph:\n    def add_node(self, name, fn): ...\n    def add_edge(self, start, end): ...\n    def invoke(self, state): ...\n    def stream(self, state): ...\n```\n\n## 验收\n\n- 能跑通输入到输出。\n- 能解释状态如何合并。\n- 能说明本课 evidence 中的测试为什么比你的实验更完整。\n"}}},{"id":"05-tool-interface","title":"工具接口：ToolNode、InjectedState 与 ToolMessage","status":"complete","depends_on":["04-chat-model-adapter"],"lesson":"lessons/05-tool-interface.md","quiz":"quizzes/05-tool-interface.quiz.md","mastery":"mastery/05-tool-interface.mastery.md","lab":"labs/05-mini-tool-calling/README.md","evidence_ids":["ev-toolnode-code","ev-injected-state-code","ev-test-toolnode","ev-test-injected-state"],"sections":{"lesson":{"label":"课程","path":"lessons/05-tool-interface.md","markdown":"# 工具接口：ToolNode、InjectedState 与 ToolMessage\n\n## 你会学到什么\n\n- 用工程视角解释 LangGraph 的核心抽象：ToolNode, tools_condition, InjectedState, InjectedStore。\n- 从源码入口 `libs/prebuilt/langgraph/prebuilt/tool_node.py` 追踪到测试证据，理解它解决的真实问题。\n- 把本课概念复刻成一个最小实验，并能说明它在生产 Agent 中的边界。\n\n## AI 概念从零解释\n\n工具调用是模型提出的结构化动作，ToolNode 把动作解析、注入隐藏参数、执行工具，再把结果写回消息流。\n\n如果把一次 LLM 调用看成普通 RPC，Agent 就会显得神秘；但 LangGraph 的观点更像“长期运行的工作流”。LLM 只是节点之一，状态、边、工具、恢复点和事件流共同决定系统行为。本课的核心是：ToolNode, tools_condition, InjectedState, InjectedStore 如何把不稳定的模型行为包进稳定的软件结构。\n\n## 为什么工程上需要这个抽象\n\n让 LLM 只负责选择工具和公开参数，权限、状态、存储和运行时对象由系统注入，能降低提示泄露和参数伪造风险。\n\n对后端工程师可以类比为：普通函数像同步 controller；LangGraph 图像可恢复 saga/workflow；checkpoint 像持久化执行日志；stream/debug 像领域事件与 tracing。\n\n## 最小心智模型\n\n```python\n# 伪代码：不是逐字源码，而是本课抽象的最小模型\nstate = initial_input\nwhile current_node != END:\n    update = current_node.run(state, runtime)\n    state = merge_by_schema(state, update)\n    current_node = route_by_edges(state)\nreturn project_output(state)\n```\n\n本课在这个循环中关注：`AIMessage.tool_calls -> ToolNode -> tool(args + injected) -> ToolMessage`。\n\n## Source entry points\n\n- repo: `langchain-ai/langgraph`\n- commit: `83dd61feaca993d2ee428706ad04c869895ce400`\n- scope: `libs/langgraph, libs/prebuilt, libs/checkpoint, libs/sdk-py`\n- primary path: `libs/prebuilt/langgraph/prebuilt/tool_node.py`\n- primary symbol: `ToolNode`\n- related symbols: `ToolNode, tools_condition, InjectedState, InjectedStore`\n- previous lesson: 模型适配：把 ChatModel 当成图节点的一部分\n- next lesson: 流式输出、调试事件与追踪\n\n## 源码阅读路径\n\n1. 先读 `libs/prebuilt/langgraph/prebuilt/tool_node.py` 中的 `ToolNode`，只标记输入参数、返回值和它读写的状态。\n2. 再读本课 evidence 中的测试文件，观察测试如何构造图、输入和断言。\n3. 最后回到源码，把测试中的断言映射到具体分支：错误处理、状态合并、路由、持久化或事件输出。\n\n## 核心 entities 与 relations\n\n- entity: `lesson:05-tool-interface`，课程单元。\n- entity: `concept:05-tool-interface`，源码概念 `ToolNode, tools_condition, InjectedState, InjectedStore`。\n- relation: 本课概念与前后课程的依赖关系见 `graph/relations.json`。\n\n## 关键 claims 与 evidence\n\n- claim: `claim-05-tool-interface`，ToolNode 会识别 AIMessage 中的工具调用，并把 InjectedState/InjectedStore 等系统参数从 LLM 可见 schema 中隔离出来。\n\n- `ev-toolnode-code`: `libs/prebuilt/langgraph/prebuilt/tool_node.py:622`，ToolNode 是执行工具调用的 Runnable 节点。\n- `ev-injected-state-code`: `libs/prebuilt/langgraph/prebuilt/tool_node.py:1753`，注入注解让状态和存储在执行期传入工具，且不暴露给模型 schema。\n- `ev-test-toolnode`: `libs/prebuilt/tests/test_tool_node.py:1`，ToolNode 测试覆盖工具调用输入、输出和错误处理。\n- `ev-test-injected-state`: `libs/prebuilt/tests/test_tool_node.py:1315`，InjectedState/InjectedStore 测试覆盖状态与存储注入。\n\n## 相关测试证据\n\n- `ev-test-toolnode`: `libs/prebuilt/tests/test_tool_node.py:1`，ToolNode 测试覆盖工具调用输入、输出和错误处理。\n- `ev-test-injected-state`: `libs/prebuilt/tests/test_tool_node.py:1315`，InjectedState/InjectedStore 测试覆盖状态与存储注入。\n\n阅读测试时不要只看 test name。建议记录三件事：输入状态是什么、预期输出是什么、测试是否覆盖失败/边界路径。\n\n## 真实源码解释\n\nToolNode 读取最近消息中的 tool_calls，查找对应工具并执行。InjectedState/InjectedStore 标注的参数不会交给模型填写，而是在执行期由系统注入。这种设计把 LLM 可控输入和系统可信上下文拆开。\n\n## 设计取舍\n\n- 显式图结构让流程更可审查，但需要学习节点、边、状态和运行时的词汇。\n- 类型 schema 能提前暴露状态合并错误，但动态消息和工具调用仍需要运行时测试兜底。\n- 运行时事件和 checkpoint 增加复杂度，但换来可恢复、可观测和可回放的生产能力。\n\n## Java/backend 类比\n\n可以把 LangGraph 想成 Temporal/Cadence 风格的工作流内核加上 LLM 节点：节点像 activity，状态像 workflow state，checkpoint 像 event history，ToolNode 像受控外部副作用适配器，Command/interrupt 像工作流信号和人工审批。\n\n## 常见误解\n\n- 误解：LangGraph 是“画图工具”。更准确地说，它是可执行状态图运行时。\n- 误解：Agent loop 必须手写 while。LangGraph 倾向用条件边、Command 和节点返回值表达循环。\n- 误解：测试只需要 mock 模型输出。实际还要测试状态合并、工具注入、checkpoint、stream 事件和恢复路径。\n\n## 自测题\n\n见 `../quizzes/05-tool-interface.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/05-tool-interface.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/05-mini-tool-calling/README.md`。\n\n## 学完标准\n\n- 能不看答案说出 `ToolNode, tools_condition, InjectedState, InjectedStore` 解决什么工程问题。\n- 能在源码中定位本课 primary symbol，并说明至少两个测试如何证明行为。\n- 能完成实验，并把自己的实现与 LangGraph 源码设计差异写成 5 条以内的笔记。\n\n"},"quiz":{"label":"测试","path":"quizzes/05-tool-interface.quiz.md","markdown":"# 工具接口：ToolNode、InjectedState 与 ToolMessage - Quiz\n\n## 选择题\n\n1. 本课核心抽象主要解决什么问题？\n   - A. 让 LLM 自动变聪明\n   - B. 把 Agent 行为放进可测试、可恢复、可观测的软件结构\n   - C. 替代所有业务代码\n   - D. 只用于画流程图\n\n2. 阅读 evidence 时最应该优先确认什么？\n   - A. README 是否写得漂亮\n   - B. claim 是否能被源码路径和测试断言支撑\n   - C. 文件名是否足够短\n   - D. 是否没有任何抽象\n\n## 简答题\n\n1. 用 5 句话以内解释 `ToolNode, tools_condition, InjectedState, InjectedStore` 与本课 claim 的关系。\n2. 从 `ev-test-toolnode` 和 `ev-test-injected-state` 各选一个测试，说明它们分别证明了什么。\n3. 如果你要把本课能力用于公司内部客服 Agent，你会新增哪两个失败路径测试？\n\n## 参考答案\n\n- 选择题：1-B，2-B。\n- 简答题没有唯一答案，但必须引用本课源码路径、测试 evidence id，并能区分“源码证明”和“课程推断”。\n"},"mastery":{"label":"掌握度","path":"mastery/05-tool-interface.mastery.md","markdown":"# 工具接口：ToolNode、InjectedState 与 ToolMessage - 掌握度验证\n\n## 口头讲解\n\n不用看课程，向同事讲清楚：\n\n- `ToolNode, tools_condition, InjectedState, InjectedStore` 的输入、输出和边界。\n- 为什么 LangGraph 需要这个抽象。\n- 哪两个测试最能证明本课 claim。\n\n## 代码阅读检查\n\n- 在源码中定位 `ToolNode`。\n- 找到本课至少一个错误处理或边界条件。\n- 把测试断言与源码分支画成一条因果链。\n\n## 通过标准\n\n- 能解释 claim: `claim-05-tool-interface`。\n- 能引用至少 1 个 code evidence 和 2 个 test evidence。\n- 能完成实验并写出“我的最小实现缺少 LangGraph 哪些生产能力”。\n"},"lab":{"label":"实验","path":"labs/05-mini-tool-calling/README.md","markdown":"# 工具接口：ToolNode、InjectedState 与 ToolMessage - 最小实验\n\n## 目标\n\n实现一个不依赖 LangGraph 的最小版本，复刻本课概念：`ToolNode, tools_condition, InjectedState, InjectedStore`。\n\n## 任务\n\n1. 写一个 50-120 行的小程序，输入一个初始 state。\n2. 至少包含两个节点、一个状态合并函数和一个可观察的中间事件。\n3. 加两个测试：正常路径一个，失败或边界路径一个。\n4. 在 README 末尾写 5 条对比：你的实现缺少 LangGraph 的哪些能力。\n\n## 建议接口\n\n```python\nclass MiniGraph:\n    def add_node(self, name, fn): ...\n    def add_edge(self, start, end): ...\n    def invoke(self, state): ...\n    def stream(self, state): ...\n```\n\n## 验收\n\n- 能跑通输入到输出。\n- 能解释状态如何合并。\n- 能说明本课 evidence 中的测试为什么比你的实验更完整。\n"}}},{"id":"06-callback-tracing","title":"流式输出、调试事件与追踪","status":"complete","depends_on":["05-tool-interface"],"lesson":"lessons/06-callback-tracing.md","quiz":"quizzes/06-callback-tracing.quiz.md","mastery":"mastery/06-callback-tracing.mastery.md","lab":"labs/06-mini-callback-tracer/README.md","evidence_ids":["ev-pregel-stream-code","ev-debug-code","ev-test-stream-events","ev-test-debug-checkpoints"],"sections":{"lesson":{"label":"课程","path":"lessons/06-callback-tracing.md","markdown":"# 流式输出、调试事件与追踪\n\n## 你会学到什么\n\n- 用工程视角解释 LangGraph 的核心抽象：stream, astream, debug events。\n- 从源码入口 `libs/langgraph/langgraph/pregel/main.py` 追踪到测试证据，理解它解决的真实问题。\n- 把本课概念复刻成一个最小实验，并能说明它在生产 Agent 中的边界。\n\n## AI 概念从零解释\n\n图运行不是黑盒返回值；Pregel 运行时可以按 values、updates、debug、messages 等模式暴露中间事件。\n\n如果把一次 LLM 调用看成普通 RPC，Agent 就会显得神秘；但 LangGraph 的观点更像“长期运行的工作流”。LLM 只是节点之一，状态、边、工具、恢复点和事件流共同决定系统行为。本课的核心是：stream, astream, debug events 如何把不稳定的模型行为包进稳定的软件结构。\n\n## 为什么工程上需要这个抽象\n\nAgent 的失败常发生在中间步骤。流式事件、checkpoint 事件和 tracing 让工程师能定位是哪一步、哪个节点、哪个工具导致偏差。\n\n对后端工程师可以类比为：普通函数像同步 controller；LangGraph 图像可恢复 saga/workflow；checkpoint 像持久化执行日志；stream/debug 像领域事件与 tracing。\n\n## 最小心智模型\n\n```python\n# 伪代码：不是逐字源码，而是本课抽象的最小模型\nstate = initial_input\nwhile current_node != END:\n    update = current_node.run(state, runtime)\n    state = merge_by_schema(state, update)\n    current_node = route_by_edges(state)\nreturn project_output(state)\n```\n\n本课在这个循环中关注：`graph.stream(input, stream_mode=[...]) -> event chunks -> tracer/debug UI`。\n\n## Source entry points\n\n- repo: `langchain-ai/langgraph`\n- commit: `83dd61feaca993d2ee428706ad04c869895ce400`\n- scope: `libs/langgraph, libs/prebuilt, libs/checkpoint, libs/sdk-py`\n- primary path: `libs/langgraph/langgraph/pregel/main.py`\n- primary symbol: `Pregel.stream`\n- related symbols: `stream, astream, debug events`\n- previous lesson: 工具接口：ToolNode、InjectedState 与 ToolMessage\n- next lesson: Agent Loop：条件边、Command、interrupt 与 ReAct 循环\n\n## 源码阅读路径\n\n1. 先读 `libs/langgraph/langgraph/pregel/main.py` 中的 `Pregel.stream`，只标记输入参数、返回值和它读写的状态。\n2. 再读本课 evidence 中的测试文件，观察测试如何构造图、输入和断言。\n3. 最后回到源码，把测试中的断言映射到具体分支：错误处理、状态合并、路由、持久化或事件输出。\n\n## 核心 entities 与 relations\n\n- entity: `lesson:06-callback-tracing`，课程单元。\n- entity: `concept:06-callback-tracing`，源码概念 `stream, astream, debug events`。\n- relation: 本课概念与前后课程的依赖关系见 `graph/relations.json`。\n\n## 关键 claims 与 evidence\n\n- claim: `claim-06-callback-tracing`，Pregel.stream/astream 提供多种 stream_mode，使调用方可以观察值、更新、消息、debug 和 checkpoint 事件。\n\n- `ev-pregel-stream-code`: `libs/langgraph/langgraph/pregel/main.py:1`，Pregel 主运行时提供 invoke/stream/astream 等执行入口。\n- `ev-debug-code`: `libs/langgraph/langgraph/pregel/debug.py:1`，debug 模块组织任务、写入、checkpoint 等调试事件。\n- `ev-test-stream-events`: `libs/langgraph/tests/test_stream_events_v3.py:1`，stream events v3 测试覆盖事件结构和生命周期。\n- `ev-test-debug-checkpoints`: `libs/langgraph/tests/test_pregel.py:4359`，debug retry 测试验证 checkpoint 事件与历史状态一致。\n\n## 相关测试证据\n\n- `ev-test-stream-events`: `libs/langgraph/tests/test_stream_events_v3.py:1`，stream events v3 测试覆盖事件结构和生命周期。\n- `ev-test-debug-checkpoints`: `libs/langgraph/tests/test_pregel.py:4359`，debug retry 测试验证 checkpoint 事件与历史状态一致。\n\n阅读测试时不要只看 test name。建议记录三件事：输入状态是什么、预期输出是什么、测试是否覆盖失败/边界路径。\n\n## 真实源码解释\n\nPregel 的 stream/astream 不是只返回最终状态，而是按 stream mode 发出事件。debug 模块把任务、写入和 checkpoint 组织成可观测事件。测试把事件与状态历史比对，证明事件不是纯日志，而是可核验的执行证据。\n\n## 设计取舍\n\n- 显式图结构让流程更可审查，但需要学习节点、边、状态和运行时的词汇。\n- 类型 schema 能提前暴露状态合并错误，但动态消息和工具调用仍需要运行时测试兜底。\n- 运行时事件和 checkpoint 增加复杂度，但换来可恢复、可观测和可回放的生产能力。\n\n## Java/backend 类比\n\n可以把 LangGraph 想成 Temporal/Cadence 风格的工作流内核加上 LLM 节点：节点像 activity，状态像 workflow state，checkpoint 像 event history，ToolNode 像受控外部副作用适配器，Command/interrupt 像工作流信号和人工审批。\n\n## 常见误解\n\n- 误解：LangGraph 是“画图工具”。更准确地说，它是可执行状态图运行时。\n- 误解：Agent loop 必须手写 while。LangGraph 倾向用条件边、Command 和节点返回值表达循环。\n- 误解：测试只需要 mock 模型输出。实际还要测试状态合并、工具注入、checkpoint、stream 事件和恢复路径。\n\n## 自测题\n\n见 `../quizzes/06-callback-tracing.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/06-callback-tracing.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/06-mini-callback-tracer/README.md`。\n\n## 学完标准\n\n- 能不看答案说出 `stream, astream, debug events` 解决什么工程问题。\n- 能在源码中定位本课 primary symbol，并说明至少两个测试如何证明行为。\n- 能完成实验，并把自己的实现与 LangGraph 源码设计差异写成 5 条以内的笔记。\n\n"},"quiz":{"label":"测试","path":"quizzes/06-callback-tracing.quiz.md","markdown":"# 流式输出、调试事件与追踪 - Quiz\n\n## 选择题\n\n1. 本课核心抽象主要解决什么问题？\n   - A. 让 LLM 自动变聪明\n   - B. 把 Agent 行为放进可测试、可恢复、可观测的软件结构\n   - C. 替代所有业务代码\n   - D. 只用于画流程图\n\n2. 阅读 evidence 时最应该优先确认什么？\n   - A. README 是否写得漂亮\n   - B. claim 是否能被源码路径和测试断言支撑\n   - C. 文件名是否足够短\n   - D. 是否没有任何抽象\n\n## 简答题\n\n1. 用 5 句话以内解释 `stream, astream, debug events` 与本课 claim 的关系。\n2. 从 `ev-test-stream-events` 和 `ev-test-debug-checkpoints` 各选一个测试，说明它们分别证明了什么。\n3. 如果你要把本课能力用于公司内部客服 Agent，你会新增哪两个失败路径测试？\n\n## 参考答案\n\n- 选择题：1-B，2-B。\n- 简答题没有唯一答案，但必须引用本课源码路径、测试 evidence id，并能区分“源码证明”和“课程推断”。\n"},"mastery":{"label":"掌握度","path":"mastery/06-callback-tracing.mastery.md","markdown":"# 流式输出、调试事件与追踪 - 掌握度验证\n\n## 口头讲解\n\n不用看课程，向同事讲清楚：\n\n- `stream, astream, debug events` 的输入、输出和边界。\n- 为什么 LangGraph 需要这个抽象。\n- 哪两个测试最能证明本课 claim。\n\n## 代码阅读检查\n\n- 在源码中定位 `Pregel.stream`。\n- 找到本课至少一个错误处理或边界条件。\n- 把测试断言与源码分支画成一条因果链。\n\n## 通过标准\n\n- 能解释 claim: `claim-06 模型\nstate = initial_input\nwhile current_node != END:\n    update = current_node.run(state, runtime)\n    state = merge_by_schema(state, update)\n    current_node = route_by_edges(state)\nreturn project_output(state)\n```\n\n本课在这个循环中关注：`agent -> should_continue? tools : END；tools -> agent；interrupt -> Command(resume=...)`。\n\n## Source entry points\n\n- repo: `langchain-ai/langgraph`\n- commit: `83dd61feaca993d2ee428706ad04c869895ce400`\n- scope: `libs/langgraph, libs/prebuilt, libs/checkpoint, libs/sdk-py`\n- primary path: `libs/langgraph/langgraph/types.py`\n- primary symbol: `Command, interrupt`\n- related symbols: `add_conditional_edges, Command, interrupt, create_react_agent`\n- previous lesson: 流式输出、调试事件与追踪\n- next lesson: 持久化与远程集成：Checkpoint、Store、SDK 与部署边界\n\n## 源码阅读路径\n\n1. 先读 `libs/langgraph/langgraph/types.py` 中的 `Command, interrupt`，只标记输入参数、返回值和它读写的状态。\n2. 再读本课 evidence 中的测试文件，观察测试如何构造图、输入和断言。\n3. 最后回到源码，把测试中的断言映射到具体分支：错误处理、状态合并、路由、持久化或事件输出。\n\n## 核心 entities 与 relations\n\n- entity: `lesson:07-agent-loop`，课程单元。\n- entity: `concept:07-agent-loop`，源码概念 `add_conditional_edges, Command, interrupt, create_react_agent`。\n- relation: 本课概念与前后课程的依赖关系见 `graph/relations.json`。\n\n## 关键 claims 与 evidence\n\n- claim: `claim-07-agent-loop`，LangGraph 用条件边和 Command 表达 agent 的循环、跳转、暂停和恢复，而不是把控制流藏在 while 循环里。\n\n- `ev-command-code`: `libs/langgraph/langgraph/types.py:664`，Send/Command 表达动态分发、状态更新、图跳转和恢复参数。\n- `ev-interrupt-code`: `libs/langgraph/langgraph/types.py:811`，interrupt 会抛出 GraphInterrupt 并把中断值暴露给调用端等待恢复。\n- `ev-react-loop-code`: `libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py:860`，ReAct agent 将模型节点、工具节点和条件路由组装成循环图。\n- `ev-test-interrupt-loop`: `libs/langgraph/tests/test_pregel.py:4922`，中断循环测试验证 interrupt 在循环中的暂停与恢复。\n- `ev-test-parent-command`: `libs/langgraph/tests/test_parent_command.py:1`，父图 Command 测试覆盖跨图/子图跳转和状态更新。\n\n## 相关测试证据\n\n- `ev-test-interrupt-loop`: `libs/langgraph/tests/test_pregel.py:4922`，中断循环测试验证 interrupt 在循环中的暂停与恢复。\n- `ev-test-parent-command`: `libs/langgraph/tests/test_parent_command.py:1`，父图 Command 测试覆盖跨图/子图跳转和状态更新。\n\n阅读测试时不要只看 test name。建议记录三件事：输入状态是什么、预期输出是什么、测试是否覆盖失败/边界路径。\n\n## 真实源码解释\n\n条件边表达从模型到工具或结束的分支，工具节点执行后再回到模型节点。Command 可以同时携带 update、goto、resume 等控制信息；interrupt 则通过 GraphInterrupt 暂停并把待处理值暴露给调用端。这样循环和人工介入都成为图协议的一部分。\n\n## 设计取舍\n\n- 显式图结构让流程更可审查，但需要学习节点、边、状态和运行时的词汇。\n- 类型 schema 能提前暴露状态合并错误，但动态消息和工具调用仍需要运行时测试兜底。\n- 运行时事件和 checkpoint 增加复杂度，但换来可恢复、可观测和可回放的生产能力。\n\n## Java/backend 类比\n\n可以把 LangGraph 想成 Temporal/Cadence 风格的工作流内核加上 LLM 节点：节点像 activity，状态像 workflow state，checkpoint 像 event history，ToolNode 像受控外部副作用适配器，Command/interrupt 像工作流信号和人工审批。\n\n## 常见误解\n\n- 误解：LangGraph 是“画图工具”。更准确地说，它是可执行状态图运行时。\n- 误解：Agent loop 必须手写 while。LangGraph 倾向用条件边、Command 和节点返回值表达循环。\n- 误解：测试只需要 mock 模型输出。实际还要测试状态合并、工具注入、checkpoint、stream 事件和恢复路径。\n\n## 自测题\n\n见 `../quizzes/07-agent-loop.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/07-agent-loop.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/07-mini-agent-loop/README.md`。\n\n## 学完标准\n\n- 能不看答案说出 `add_conditional_edges, Command, interrupt, create_react_agent` 解决什么工程问题。\n- 能在源码中定位本课 primary symbol，并说明至少两个测试如何证明行为。\n- 能完成实验，并把自己的实现与 LangGraph 源码设计差异写成 5 条以内的笔记。\n\n"},"quiz":{"label":"测试","path":"quizzes/07-agent-loop.quiz.md","markdown":"# Agent Loop：条件边、Command、interrupt 与 ReAct 循环 - Quiz\n\n## 选择题\n\n1. 本课核心抽象主要解决什么问题？\n   - A. 让 LLM 自动变聪明\n   - B. 把 Agent 行为放进可测试、可恢复、可观测的软件结构\n   - C. 替代所有业务代码\n   - D. 只用于画流程图\n\n2. 阅读 evidence 时最应该优先确认什么？\n   - A. README 是否写得漂亮\n   - B. claim 是否能被源码路径和测试断言支撑\n   - C. 文件名是否足够短\n   - D. 是否没有任何抽象\n\n## 简答题\n\n1. 用 5 句话以内解释 `add_conditional_edges, Command, interrupt, create_react_agent` 与本课 claim 的关系。\n2. 从 `ev-test-interrupt-loop` 和 `ev-test-parent-command` 各选一个测试，说明它们分别证明了什么。\n3. 如果你要把本课能力用于公司内部客服 Agent，你会新增哪两个失败路径测试？\n\n## 参考答案\n\n- 选择题：1-B，2-B。\n- 简答题没有唯一答案，但必须引用本课源码路径、测试 evidence id，并能区分“源码证明”和“课程推断”。\n"},"mastery":{"label":"掌握度","path":"mastery/07-agent-loop.mastery.md","markdown":"# Agent Loop：条件边、Command、interrupt 与 ReAct 循环 - 掌握度验证\n\n## 口头讲解\n\n不用看课程，向同事讲清楚：\n\n- `add_conditional_edges, Command, interrupt, create_react_agent` 的输入、输出和边界。\n- 为什么 LangGraph 需要这个抽象。\n- 哪两个测试最能证明本课 claim。\n\n## 代码阅读检查\n\n- 在源码中定位 `Command, interrupt`。\n- 找到本课至少一个错误处理或边界条件。\n- 把测试断言与源码分支画成一条因果链。\n\n## 通过标准\n\n- 能解释 claim: `claim-07-agent-loop`。\n- 能引用至少 1 个 code evidence 和 2 个 test evidence。\n- 能完成实验并写出“我的最小实现缺少 LangGraph 哪些生产能力”。\n"},"lab":{"label":"实验","path":"labs/07-mini-agent-loop/README.md","markdown":"# Agent Loop：条件边、Command、interrupt 与 ReAct 循环 - 最小实验\n\n## 目标\n\n实现一个不依赖 LangGraph 的最小版本，复刻本课概念：`add_conditional_edges, Command, interrupt, create_react_agent`。\n\n## 任务\n\n1. 写一个 50-120 行的小程序，输入一个初始 state。\n2. 至少包含两个节点、一个状态合并函数和一个可观察的中间事件。\n3. 加两个测试：正常路径一个，失败或边界路径一个。\n4. 在 README 末尾写 5 条对比：你的实现缺少 LangGraph 的哪些能力。\n\n## 建议接口\n\n```python\nclass MiniGraph:\n    def add_node(self, name, fn): ...\n    def add_edge(self, start, end): ...\n    def invoke(self, state): ...\n    def stream(self, state): ...\n```\n\n## 验收\n\n- 能跑通输入到输出。\n- 能解释状态如何合并。\n- 能说明本课 evidence 中的测试为什么比你的实验更完整。\n"}}},{"id":"08-provider-integration","title":"持久化与远程集成：Checkpoint、Store、SDK 与部署边界","status":"complete","depends_on":["07-agent-loop"],"lesson":"lessons/08-provider-integration.md","quiz":"quizzes/08-provider-integration.quiz.md","mastery":"mastery/08-provider-integration.mastery.md","lab":"labs/08-mini-provider-adapter/README.md","evidence_ids":["ev-checkpoint-code","ev-sdk-client-code","ev-test-checkpoint","ev-test-sdk-stream"],"sections":{"lesson":{"label":"课程","path":"lessons/08-provider-integration.md","markdown":"# 持久化与远程集成：Checkpoint、Store、SDK 与部署边界\n\n## 你会学到什么\n\n- 用工程视角解释 LangGraph 的核心抽象：BaseCheckpointSaver, InMemorySaver, client.stream。\n- 从源码入口 `libs/checkpoint/langgraph/checkpoint/base/__init__.py` 追踪到测试证据，理解它解决的真实问题。\n- 把本课概念复刻成一个最小实验，并能说明它在生产 Agent 中的边界。\n\n## AI 概念从零解释\n\nCheckpoint 保存线程的执行状态，Store 保存跨线程记忆，SDK 负责与远程 LangGraph 服务交互。\n\n如果把一次 LLM 调用看成普通 RPC，Agent 就会显得神秘；但 LangGraph 的观点更像“长期运行的工作流”。LLM 只是节点之一，状态、边、工具、恢复点和事件流共同决定系统行为。本课的核心是：BaseCheckpointSaver, InMemorySaver, client.stream 如何把不稳定的模型行为包进稳定的软件结构。\n\n## 为什么工程上需要这个抽象\n\n生产系统需要重试、回放、时间旅行、跨请求记忆、远程运行和并发订阅；这些都要求执行状态与 API 边界可序列化。\n\n对后端工程师可以类比为：普通函数像同步 controller；LangGraph 图像可恢复 saga/workflow；checkpoint 像持久化执行日志；stream/debug 像领域事件与 tracing。\n\n## 最小心智模型\n\n```python\n# 伪代码：不是逐字源码，而是本课抽象的最小模型\nstate = initial_input\nwhile current_node != END:\n    update = current_node.run(state, runtime)\n    state = merge_by_schema(state, update)\n    current_node = route_by_edges(state)\nreturn project_output(state)\n```\n\n本课在这个循环中关注：`thread_id + checkpoint_ns -> checkpoint tuple；SDK thread/run stream -> server graph`。\n\n## Source entry points\n\n- repo: `langchain-ai/langgraph`\n- commit: `83dd61feaca993d2ee428706ad04c869895ce400`\n- scope: `libs/langgraph, libs/prebuilt, libs/checkpoint, libs/sdk-py`\n- primary path: `libs/checkpoint/langgraph/checkpoint/base/__init__.py`\n- primary symbol: `BaseCheckpointSaver`\n- related symbols: `BaseCheckpointSaver, InMemorySaver, client.stream`\n- previous lesson: Agent Loop：条件边、Command、interrupt 与 ReAct 循环\n- next lesson: Capstone\n\n## 源码阅读路径\n\n1. 先读 `libs/checkpoint/langgraph/checkpoint/base/__init__.py` 中的 `BaseCheckpointSaver`，只标记输入参数、返回值和它读写的状态。\n2. 再读本课 evidence 中的测试文件，观察测试如何构造图、输入和断言。\n3. 最后回到源码，把测试中的断言映射到具体分支：错误处理、状态合并、路由、持久化或事件输出。\n\n## 核心 entities 与 relations\n\n- entity: `lesson:08-provider-integration`，课程单元。\n- entity: `concept:08-provider-integration`，源码概念 `BaseCheckpointSaver, InMemorySaver, client.stream`。\n- relation: 本课概念与前后课程的依赖关系见 `graph/relations.json`。\n\n## 关键 claims 与 evidence\n\n- claim: `claim-08-provider-integration`，LangGraph 把本地运行时的 checkpoint/store 契约与远程 SDK 契约分离，使同一图可以本地执行或通过服务端线程/运行接口执行。\n\n- `ev-checkpoint-code`: `libs/checkpoint/langgraph/checkpoint/base/__init__.py:1`，checkpoint base 定义保存、读取、列举 checkpoint 的抽象契约。\n- `ev-sdk-client-code`: `libs/sdk-py/langgraph_sdk/client.py:1`，Python SDK 提供与远程 LangGraph 服务交互的客户端入口。\n- `ev-test-checkpoint`: `libs/langgraph/tests/test_pregel.py:805`，Pregel checkpoint 测试覆盖保存、错误、pending writes 和多线程隔离。\n- `ev-test-sdk-stream`: `libs/sdk-py/tests/streaming/test_thread_stream.py:1`，SDK streaming 测试覆盖线程流订阅和远程事件投影。\n\n## 相关测试证据\n\n- `ev-test-checkpoint`: `libs/langgraph/tests/test_pregel.py:805`，Pregel checkpoint 测试覆盖保存、错误、pending writes 和多线程隔离。\n- `ev-test-sdk-stream`: `libs/sdk-py/tests/streaming/test_thread_stream.py:1`，SDK streaming 测试覆盖线程流订阅和远程事件投影。\n\n阅读测试时不要只看 test name。建议记录三件事：输入状态是什么、预期输出是什么、测试是否覆盖失败/边界路径。\n\n## 真实源码解释\n\ncheckpoint base 定义本地持久化契约，Pregel 测试验证 thread_id、checkpoint_id、pending writes 和错误恢复。SDK 客户端位于独立包，面向远程线程、runs 和 streaming；这说明本地图运行与服务端 API 被清晰分层。\n\n## 设计取舍\n\n- 显式图结构让流程更可审查，但需要学习节点、边、状态和运行时的词汇。\n- 类型 schema 能提前暴露状态合并错误，但动态消息和工具调用仍需要运行时测试兜底。\n- 运行时事件和 checkpoint 增加复杂度，但换来可恢复、可观测和可回放的生产能力。\n\n## Java/backend 类比\n\n可以把 LangGraph 想成 Temporal/Cadence 风格的工作流内核加上 LLM 节点：节点像 activity，状态像 workflow state，checkpoint 像 event history，ToolNode 像受控外部副作用适配器，Command/interrupt 像工作流信号和人工审批。\n\n## 常见误解\n\n- 误解：LangGraph 是“画图工具”。更准确地说，它是可执行状态图运行时。\n- 误解：Agent loop 必须手写 while。LangGraph 倾向用条件边、Command 和节点返回值表达循环。\n- 误解：测试只需要 mock 模型输出。实际还要测试状态合并、工具注入、checkpoint、stream 事件和恢复路径。\n\n## 自测题\n\n见 `../quizzes/08-provider-integration.quiz.md`。\n\n## 掌握度验证\n\n见 `../mastery/08-provider-integration.mastery.md`。\n\n## 最小复刻任务\n\n见 `../labs/08-mini-provider-adapter/README.md`。\n\n## 学完标准\n\n- 能不看答案说出 `BaseCheckpointSaver, InMemorySaver, client.stream` 解决什么工程问题。\n- 能在源码中定位本课 primary symbol，并说明至少两个测试如何证明行为。\n- 能完成实验，并把自己的实现与 LangGraph 源码设计差异写成 5 条以内的笔记。\n\n"},"quiz":{"label":"测试","path":"quizzes/08-provider-integration.quiz.md","markdown":"# 持久化与远程集成：Checkpoint、Store、SDK 与部署边界 - Quiz\n\n## 选择题\n\n1. 本课核心抽象主要解决什么问题？\n   - A. 让 LLM 自动变聪明\n   - B. 把 Agent 行为放进可测试、可恢复、可观测的软件结构\n   - C. 替代所有业务代码\n   - D. 只用于画流程图\n\n2. 阅读 evidence 时最应该优先确认什么？\n   - A. README 是否写得漂亮\n   - B. claim 是否能被源码路径和测试断言支撑\n   - C. 文件名是否足够短\n   - D. 是否没有任何抽象\n\n## 简答题\n\n1. 用 5 句话以内解释 `BaseCheckpointSaver, InMemorySaver, client.stream` 与本课 claim 的关系。\n2. 从 `ev-test-checkpoint` 和 `ev-test-sdk-stream` 各选一个测试，说明它们分别证明了什么。\n3. 如果你要把本课能力用于公司内部客服 Agent，你会新增哪两个失败路径测试？\n\n## 参考答案\n\n- 选择题：1-B，2-B。\n- 简答题没有唯一答案，但必须引用本课源码路径、测试 evidence id，并能区分“源码证明”和“课程推断”。\n"},"mastery":{"label":"掌握度","path":"mastery/08-provider-integration.mastery.md","markdown":"# 持久化与远程集成：Checkpoint、Store、SDK 与部署边界 - 掌握度验证\n\n## 口头讲解\n\n不用看课程，向同事讲清楚：\n\n- `BaseCheckpointSaver, InMemorySaver, client.stream` 的输入、输出和边界。\n- 为什么 LangGraph 需要这个抽象。\n- 哪两个测试最能证明本课 claim。\n\n## 代码阅读检查\n\n- 在源码中定位 `BaseCheckpointSaver`。\n- 找到本课至少一个错误处理或边界条件。\n- 把测试断言与源码分支画成一条因果链。\n\n## 通过标准\n\n- 能解释 claim: `claim-08-provider-integration`。\n- 能引用至少 1 个 code evidence 和 2 个 test evidence。\n- 能完成实验并写出“我的最小实现缺少 LangGraph 哪些生产能力”。\n"},"lab":{"label":"实验","path":"labs/08-mini-provider-adapter/README.md","markdown":"# 持久化与远程集成：Checkpoint、Store、SDK 与部署边界 - 最小实验\n\n## 目标\n\n实现一个不依赖 LangGraph 的最小版本，复刻本课概念：`BaseCheckpointSaver, InMemorySaver, client.stream`。\n\n## 任务\n\n1. 写一个 50-120 行的小程序，输入一个初始 state。\n2. 至少包含两个节点、一个状态合并函数和一个可观察的中间事件。\n3. 加两个测试：正常路径一个，失败或边界路径一个。\n4. 在 README 末尾写 5 条对比：你的实现缺少 LangGraph 的哪些能力。\n\n## 建议接口\n\n```python\nclass MiniGraph:\n    def add_node(self, name, fn): ...\n    def add_edge(self, start, end): ...\n    def invoke(self, state): ...\n    def stream(self, state): ...\n```\n\n## 验收\n\n- 能跑通输入到输出。\n- 能解释状态如何合并。\n- 能说明本课 evidence 中的测试为什么比你的实验更完整。\n"}}}],"extras":{"readme":{"label":"入口说明","path":"README.md","markdown":"# LangGraph 源码学校课程\n\n本学习包基于开源仓库 `langchain-ai/langgraph` 生成。\n\n- commit: `83dd61feaca993d2ee428706ad04c869895ce400`\n- commit date: `2026-06-01T14:51:31-04:00`\n- source scope: `libs/langgraph, libs/prebuilt, libs/checkpoint, libs/sdk-py`\n- reader: 有经验的后端工程师，正在系统学习 LLM/Agent 工程\n- course units: 8\n\n## 如何学习\n\n1. 从 `learning.html` 打开静态课程页。\n2. 每节课按“课程 -> 测试 -> 掌握度 -> 实验”的顺序学习。\n3. 每节至少读 1 个源码入口和 2 个测试 evidence。\n4. 完成 capstone 后，用 `review/test-evidence-matrix.md` 复核 claim 与 evidence。\n\n## 产物\n\n- `lessons/`: 完整课程。\n- `quizzes/`: 每课测验和总复盘。\n- `mastery/`: 掌握度检查。\n- `labs/`: 最小复刻实验。\n- `graph/`: entities、relations、claims、evidence 和 learning map。\n- `raw/code-graph/`: Understand Anything scan/batches 与学习图。\n- `review/`: 弱证据、验证报告、开放问题和测试证据矩阵。\n- `wiki/`: llm-wiki 风格的简化知识图谱页面数据。\n"},"path":{"label":"学习路线","path":"learning-path.md","markdown":"# LangGraph 学习路线\n\n## 路线总览\n\n1. LangGraph 的可执行图：从 Runnable 到 CompiledStateGraph\n2. 状态与消息：TypedDict、Reducer 与 MessagesState\n3. 节点函数即提示装配层：把业务上下文变成模型输入\n4. 模型适配：把 ChatModel 当成图节点的一部分\n5. 工具接口：ToolNode、InjectedState 与 ToolMessage\n6. 流式输出、调试事件与追踪\n7. Agent Loop：条件边、Command、interrupt 与 ReAct 循环\n8. 持久化与远程集成：Checkpoint、Store、SDK 与部署边界\n\n## 推荐节奏\n\n- 第 1 天：01-02，建立图执行和状态合并心智模型。\n- 第 2 天：03-05，理解模型、prompt 和工具如何嵌入图。\n- 第 3 天：06-08，学习可观测性、agent loop、checkpoint 和 SDK 边界。\n- 第 4 天：完成 capstone，并回看弱证据报告。\n\n## 毕业要求\n\n- 能从源码解释一个 ReAct agent 的一次执行路径。\n- 能说明 checkpoint、interrupt、Command、ToolNode 的职责边界。\n- 能独立设计一个有工具、有人工确认、有恢复能力的小型 Agent。\n"},"finalQuiz":{"label":"总复盘测试","path":"quizzes/99-final-review.quiz.md","markdown":"# LangGraph 总复盘 Quiz\n\n1. 为什么 LangGraph 把 Agent 建模为状态图，而不是单个 while loop？\n2. reducer 在并发节点写入时解决什么问题？\n3. ToolNode 如何区分 LLM 可控参数和系统注入参数？\n4. interrupt 与 Command(resume=...) 如何共同支持人工介入？\n5. checkpoint 对 time travel、错误恢复和远程运行有什么价值？\n\n参考答案必须引用至少 6 个 evidence id，其中测试 evidence 不少于 4 个。\n"},"capstoneMastery":{"label":"Capstone 掌握度","path":"mastery/99-capstone.mastery.md","markdown":"# Capstone 掌握度验证\n\n## 任务\n\n设计并实现一个小型研究助理 Agent：\n\n- 模型节点决定是否调用 search/summarize 工具。\n- ToolNode 风格执行工具。\n- 支持人工确认 interrupt。\n- 保存 thread_id 对应 checkpoint。\n- 提供 stream 事件用于调试。\n\n## 通过标准\n\n- 至少 5 个测试：正常 loop、工具错误、人工恢复、checkpoint 恢复、stream 事件。\n- 设计文档引用本包至少 8 个 evidence id。\n- 能说明你的实现与 LangGraph 源码相比少了哪些生产能力。\n"},"capstoneLab":{"label":"Capstone 实验","path":"labs/99-capstone-mini-langchain-agent/README.md","markdown":"# Capstone Lab: Mini LangGraph Agent\n\n## 目标\n\n用 200-400 行代码实现一个迷你 LangGraph 风格 Agent，不要求接真实 LLM，可以用 fake model。\n\n## 功能\n\n- StateGraph 风格 builder。\n- messages reducer。\n- fake chat model adapter。\n- ToolNode 风格工具执行。\n- interrupt/resume。\n- in-memory checkpoint。\n- stream debug events。\n\n## 验收\n\n运行测试并提交一页说明：每个功能对应 LangGraph 哪个源码 symbol 和 evidence id。\n"},"weakEvidence":{"label":"弱证据报告","path":"review/weak-evidence.md","markdown":"# 弱证据报告\n\n## 已解决\n\n- 每个核心 claim 都绑定了源码 evidence。\n- 除第 1 课外，每个 claim 都至少绑定 2 个 test evidence；第 1 课也绑定了 2 个 test evidence。\n- UA scan 成功运行在 `repos/langgraph/libs/langgraph`，扫描 158 个文件并生成 8 个 batch。\n\n## 仍需诚实标注\n\n- 本包没有运行 LangGraph 完整测试套件；验证侧重文件生成、JSON 校验、源码路径存在和课程结构校验。\n- 课程主要聚焦 Python 核心、prebuilt、checkpoint、Python SDK；JS SDK 与 CLI 只作为背景，没有完整展开。\n- 真实 LLM/provider 调用没有执行，agent loop transcript 来自源码和测试证据归纳，不是在线模型运行日志。\n"},"progress":{"label":"学习进度","path":"progress/learning-progress.md","markdown":"# 学习进度\n\n| Unit | Lesson | Quiz | Mastery | Lab | Notes |\n|---|---:|---:|---:|---:|---|\n| 01-runnable | [ ] | [ ] | [ ] | [ ] | LangGraph 的可执行图：从 Runnable 到 CompiledStateGraph |\n| 02-message-schema | [ ] | [ ] | [ ] | [ ] | 状态与消息：TypedDict、Reducer 与 MessagesState |\n| 03-prompt-template | [ ] | [ ] | [ ] | [ ] | 节点函数即提示装配层：把业务上下文变成模型输入 |\n| 04-chat-model-adapter | [ ] | [ ] | [ ] | [ ] | 模型适配：把 ChatModel 当成图节点的一部分 |\n| 05-tool-interface | [ ] | [ ] | [ ] | [ ] | 工具接口：ToolNode、InjectedState 与 ToolMessage |\n| 06-callback-tracing | [ ] | [ ] | [ ] | [ ] | 流式输出、调试事件与追踪 |\n| 07-agent-loop | [ ] | [ ] | [ ] | [ ] | Agent Loop：条件边、Command、interrupt 与 ReAct 循环 |\n| 08-provider-integration | [ ] | [ ] | [ ] | [ ] | 持久化与远程集成：Checkpoint、Store、SDK 与部署边界 |\n| 99-capstone | [ ] | [ ] | [ ] | [ ] | 综合项目 |\n"},"testEvidence":{"label":"测试证据矩阵","path":"review/test-evidence-matrix.md","markdown":"# 测试证据矩阵\n\n| Lesson | Claim | Code evidence | Test evidence |\n|---|---|---|---|\n| 01-runnable | claim-01-runnable | ev-stategraph-code, ev-compiled-code | ev-test-state-basic, ev-test-runnable |\n| 02-message-schema | claim-02-message-schema | ev-messages-state-code, ev-add-messages-code | ev-test-messages-state, ev-test-channels-overwrite |\n| 03-prompt-template | claim-03-prompt-template | ev-runtime-code, ev-react-prompt-code | ev-test-react-prompt, ev-test-runtime-context |\n| 04-chat-model-adapter | claim-04-chat-model-adapter | ev-react-call-model-code, ev-tool-binding-code | ev-test-dynamic-model, ev-test-model-tool-mismatch |\n| 05-tool-interface | claim-05-tool-interface | ev-toolnode-code, ev-injected-state-code | ev-test-toolnode, ev-test-injected-state |\n| 06-callback-tracing | claim-06-callback-tracing | ev-pregel-stream-code, ev-debug-code | ev-test-stream-events, ev-test-debug-checkpoints |\n| 07-agent-loop | claim-07-agent-loop | ev-command-code, ev-interrupt-code, ev-react-loop-code | ev-test-interrupt-loop, ev-test-parent-command |\n| 08-provider-integration | claim-08-provider-integration | ev-checkpoint-code, ev-sdk-client-code | ev-test-checkpoint, ev-test-sdk-stream |\n\n"}}}</script>

    function md(x){return DOMPurify.sanitize(marked.parse(x||''));}
    function doc(){return state.kind==='extra'?DATA.extras[state.extra]:DATA.units.find(u=>u.id===state.unit).sections[state.section];}
    function renderNav(){const ul=document.getElementById('unitList');ul.innerHTML='';DATA.units.forEach(u=>{const b=document.createElement('button');b.className='unit '+(state.kind==='unit'&&state.unit===u.id?'active':'');b.onclick=()=>{state.kind='unit';state.unit=u.id;state.section='lesson';render();};b.innerHTML='<span class="kicker">'+u.id+'</span><span class="name">'+u.title+'</span><span class="deps">'+(u.depends_on?.length?'依赖 '+u.depends_on.join(', '):'起点课程')+'</span>';ul.appendChild(b);});const q=document.getElementById('quick');q.innerHTML='';Object.entries(DATA.extras).forEach(([k,v])=>{const b=document.createElement('button');b.className=state.kind==='extra'&&state.extra===k?'active':'';b.textContent=v.label;b.onclick=()=>{state.kind='extra';state.extra=k;render();};q.appendChild(b);});const mu=document.getElementById('mobileUnit');mu.innerHTML='';DATA.units.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=u.id+' '+u.title;mu.appendChild(o);});mu.value=state.unit;mu.onchange=e=>{state.kind='unit';state.unit=e.target.value;render();};}
    function renderTabs(){const tabs=document.getElementById('tabs');const ms=document.getElementById('mobileSection');tabs.innerHTML='';ms.innerHTML='';if(state.kind==='extra'){tabs.style.display='none';ms.style.display='none';return;}tabs.style.display='flex';ms.style.display='block';Object.entries(labels).forEach(([k,label])=>{const b=document.createElement('button');b.className='tab '+(state.section===k?'active':'');b.textContent=label;b.onclick=()=>{state.section=k;render();};tabs.appendChild(b);const o=document.createElement('option');o.value=k;o.textContent=label;ms.appendChild(o);});ms.value=state.section;ms.onchange=e=>{state.section=e.target.value;render();};}
    function toc(){const c=document.getElementById('content');const heads=[...c.querySelectorAll('h2,h3')];const t=document.getElementById('toc');t.innerHTML='';heads.forEach((h,i)=>{h.id=slug(h.textContent,i);const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.className=h.tagName.toLowerCase();t.appendChild(a);});if(!heads.length)t.innerHTML='<span class="meta">当前页没有二级目录。</span>';}
    function render(){renderNav();renderTabs();const d=doc();const u=DATA.units.find(x=>x.id===state.unit);document.getElementById('pageTitle').textContent=state.kind==='extra'?d.label:u.title+' · '+labels[state.section];document.getElementById('pageMeta').textContent=state.kind==='extra'?'学习包辅助页面':'课程 '+u.id+' · 状态 '+u.status+(u.depends_on?.length?' · 依赖 '+u.depends_on.join(', '):' · 起点课程');document.getElementById('sourcePath').textContent=d.path;document.getElementById('content').innerHTML=md(d.markdown);toc();document.title=document.getElementById('pageTitle').textContent+' | Learning Pack';}
    render();
  </script>
</body>
</html>
