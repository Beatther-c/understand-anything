name: Knowledge Base CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate knowledge pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          echo "Validating JSON files in graph/..."
          find knowledge -name '*.json' -not -path '*/node_modules/*' | while read -r f; do
            if ! python3 -c "import json, sys; json.load(open('$f'))" 2>/dev/null; then
              echo "::error file=$f::Invalid JSON"
              exit 1
            fi
          done
          echo "All JSON files valid."

      - name: Check Markdown frontmatter
        run: |
          echo "Checking lesson files have required sections..."
          errors=0
          for f in knowledge/ai-agents/*/lessons/*.md; do
            [ -f "$f" ] || continue
            for section in "你会学到什么" "源码入口" "自测题"; do
              if ! grep -q "$section" "$f"; then
                echo "::warning file=$f::Missing section: $section"
              fi
            done
          done

      - name: Validate knowledge graph structure
        run: |
          for project in knowledge/ai-agents/*/graph; do
            [ -d "$project" ] || continue
            echo "Checking $project..."
            for required in entities.json relations.json claims.json evidence.json learning-map.json; do
              if [ ! -f "$project/$required" ]; then
                echo "::error::$project/$required is missing"
                exit 1
              fi
            done
          done
          echo "All knowledge graph files present."

      - name: Check for broken internal links
        run: |
          echo "Checking internal Markdown links..."
          errors=0
          find knowledge -name '*.md' | while read -r f; do
            grep -oP '\[.*?\]\((?!https?://|#)(.*?)\)' "$f" | grep -oP '\((.*?)\)' | tr -d '()' | while read -r link; do
              target="$(dirname "$f")/$link"
              if [ ! -e "$target" ]; then
                echo "::warning file=$f::Broken link: $link"
              fi
            done
          done

  pages:
    name: Build and deploy Pages
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          # Copy all files and subdirectories needed for the learning page
          for project_dir in knowledge/ai-agents/*/; do
            project=$(basename "$project_dir")
            mkdir -p "_site/$project"
            # Copy all files and subdirectories needed for the learning page
            if [ -d "$project_dir" ]; then
              cp -r "$project_dir"* "_site/$project/" 2>/dev/null || true
            fi
            # Ensure learning.html becomes index.html
            if [ -f "$project_dir/learning.html" ]; then
              cp "$project_dir/learning.html" "_site/$project/index.html"
            fi
          done

          # Verify site structure
          echo "Verifying site structure..."
          for project in langchain langgraph openclaw; do
            if [ -f "_site/$project/index.html" ]; then
              echo "  ✓ _site/$project/index.html"
            else
              echo "  ✗ _site/$project/index.html MISSING" && exit 1
            fi
            if [ -f "_site/$project/wiki/wiki/marked.min.js" ]; then
              echo "  ✓ _site/$project/wiki/wiki/marked.min.js"
            else
              echo "  ⚠ _site/$project/wiki/wiki/marked.min.js not found (may not be needed)"
            fi
          done

          # Generate index page
          cat > _site/index.html << 'INDEXEOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>AI Agent 代码学习知识库</title>
            <style>
              :root { --bg: #0f0f0f; --surface: #1a1a1a; --text: #e0e0e0; --accent: #60a5fa; --muted: #888; }
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
              .container { max-width: 640px; padding: 2rem; }
              h1 { font-size: 2rem; margin-bottom: 0.5rem; }
              p.subtitle { color: var(--muted); margin-bottom: 2rem; }
              .cards { display: flex; flex-direction: column; gap: 1rem; }
              a.card { display: block; padding: 1.25rem 1.5rem; background: var(--surface); border: 1px solid #333; border-radius: 8px; color: var(--text); text-decoration: none; transition: border-color 0.2s, transform 0.2s; }
              a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
              a.card h2 { font-size: 1.1rem; margin-bottom: 0.25rem; }
              a.card p { color: var(--muted); font-size: 0.9rem; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>AI Agent 代码学习知识库</h1>
              <p class="subtitle">通过真实开源源码，系统学习 AI Agent 工程</p>
              <div class="cards" id="projects"></div>
            </div>
            <script>
              const projects = PROJECTS_PLACEHOLDER;
              const container = document.getElementById('projects');
              projects.forEach(p => {
                const a = document.createElement('a');
                a.className = 'card';
                a.href = p.dir + '/';
                a.innerHTML = '<h2>' + p.name + '</h2><p>' + p.desc + '</p>';
                container.appendChild(a);
              });
            </script>
          </body>
          </html>
          INDEXEOF

          # Build project list for index
          projects_json="["
          first=true
          for project_dir in knowledge/ai-agents/*/; do
            project=$(basename "$project_dir")
            desc=""
            if [ -f "$project_dir/README.md" ]; then
              desc=$(head -5 "$project_dir/README.md" | grep -v '^#' | grep -v '^$' | head -1)
            fi
            [ "$first" = true ] || projects_json+=","
            projects_json+="{\"dir\":\"$project\",\"name\":\"$project\",\"desc\":\"$desc\"}"
            first=false
          done
          projects_json+="]"

          sed -i.bak "s|PROJECTS_PLACEHOLDER|$projects_json|" _site/index.html
          rm -f _site/index.html.bak

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
